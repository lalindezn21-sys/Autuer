```html
<!DOCTYPE html>
<html>
<head>
    <title>Autuer</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
            color: white;
        }

        /* TOP AUTUER */

        .top-autuer {
            position: fixed;
            top: 25px;
            left: 0;
            right: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            color: black;

            font-size: 24px;
            line-height: 1;

            user-select: none;
        }

        /* LARGE CENTER AUTUER */

        .center-autuer {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: black;

            font-size: 80px;
            line-height: 0.85;

            user-select: none;
        }

        .letter {
            display: inline-block;
        }

        /* Individual fonts */

        .a {
            font-family: Georgia, serif;
            font-style: italic;
        }

        .u1 {
            font-family: "Courier New", monospace;
        }

        .t {
            font-family: "Times New Roman", serif;
            font-weight: bold;
        }

        .e {
            font-family: Arial, sans-serif;
            font-weight: 200;
        }

        .u2 {
            font-family: Garamond, Georgia, serif;
            font-style: italic;
        }

        .r {
            font-family: cursive;
        }
    </style>
</head>

<body>

    <!-- SMALL TOP AUTUER -->

    <div class="top-autuer">
        <span class="letter a">A</span>
        <span class="letter u1">u</span>
        <span class="letter t">t</span>
        <span class="letter e">e</span>
        <span class="letter u2">u</span>
        <span class="letter r">r</span>
    </div>


    <!-- LARGE CENTER AUTUER -->

    <div class="center-autuer">
        <div class="a">A</div>
        <div class="u1">u</div>
        <div class="t">t</div>
        <div class="e">e</div>
        <div class="u2">u</div>
        <div class="r">r</div>
    </div>

</body>
</html>
