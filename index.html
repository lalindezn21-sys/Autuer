<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamscape</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:'Space Grotesk',Arial,sans-serif}.screen{position:fixed;inset:0;height:100vh;width:100vw;display:flex;align-items:flex-start;justify-content:center}.red-screen{background:#F02D20;transform:translateY(100%);z-index:2}.dream{width:100vw;margin-top:18vh;padding:0;font-size:clamp(42px,12vw,180px);font-weight:700;line-height:.58;letter-spacing:-.018em;white-space:nowrap;text-align:center;transform:scaleX(1.3);transform-origin:center;z-index:1}.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font:600 11px monospace;letter-spacing:.08em;z-index:3;opacity:.55} </style></head><body><section class="screen"><main class="dream">DREAMSCAPE</main></section><section class="screen red-screen"></section><div class="hint">SCROLL TO ENTER</div><script>let locked=false;function wipe(){if(locked)return;locked=true;document.querySelector('.hint').style.display='none';document.querySelector('.red-screen').animate([{transform:'translateY(100%)'},{transform:'translateY(0)'}],{duration:850,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});}window.addEventListener('wheel',e=>{if(e.deltaY>5)wipe()},{passive:true});let sy=0;window.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});window.addEventListener('touchend',e=>{if(sy-e.changedTouches[0].clientY>20)wipe()},{passive:true});</script></body></html>
