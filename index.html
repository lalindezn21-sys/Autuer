</style></head><body><div class="app"><header class="top"><div class="logo">Auteur <span>Film Workspace</span></div><div class="grow"></div><span class="status" id="status">Ready</span><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button><div class="sidequote">Write what the camera cannot say.</div></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>
const KEY='auteur-aesthetic-v8',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-pro-v7')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};data.projects??=[];data.scripts??=[];data.storylines??=[];data.characters??=[];data.projects.forEach(x=>{x.synopsis??='';x.genre??='';x.runtime??='';x.logline??='';x.status??='Development'});data.scripts.forEach(x=>{x.scenes??=[{id:uid(),heading:'OPENING',location:'',content:''}];x.notes??=''});let state={view:'dashboard',project:null,tab:'overview',scene:0};function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#status').textContent='Ready',900)}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function p(){return data.projects.find(x=>x.id===state.project)}function s(){return data.scripts.find(x=>x.project===state.project)}function pById(id){return data.projects.find(x=>x.id===id)}function nav(view){state={view,project:null,tab:'overview',scene:0};render()}function modal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}function closeModal(){$('#modalbg').classList.remove('open')}$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));$('#create').onclick=newProject;
function dashboard(){let recent=data.projects.slice(-5).reverse();return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A quiet place for the loud part of filmmaking: ideas, characters, structure, and pages. Everything stays connected to the film it belongs to.</div><section class="hero"><div><h2>Start something worth finishing.</h2><p>Build a film from the first idea to the last page.</p></div><button class="primary" id="newProject">New project</button></section><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${recent.length} project${recent.length===1?'':'s'}</span></div><div class="grid">${recent.length?recent.map(x=>`<article class="film" data-open="${x.id}"><div class="tag">${esc(x.status||'Development')}</div><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No logline yet.')}</p></article>`).join(''):`<div class="empty">Your first film belongs here.</div>`}</div></section></div></div>`}
function projectCards(list){if(!list.length)return '<div class="empty">No films match that search.</div>';return list.map(x=>{let chars=data.characters.filter(c=>c.project===x.id).length,stories=data.storylines.filter(q=>q.project===x.id).length,sc=s();let has=data.scripts.some(q=>q.project===x.id);return `<article class="projectcard" data-open="${x.id}"><button class="delete" data-delete="${x.id}">Delete</button><div class="projecttop"><span class="tag">${esc(x.status||'Development')}</span><span class="tag">${has?'Draft':'Idea'}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No logline yet.')}</p><div class="metaRow"><span><strong>${stories}</strong> stories</span><span><strong>${chars}</strong> characters</span><span><strong>${has?'1':'0'}</strong> draft</span></div></article>`}).join('')}
function projectsPage(){return `<div class="scroll"><div class="page"><div class="eyebrow">Workspace</div><div class="headline">Projects</div><div class="intro">The complete shelf of films you're developing.</div><div class="toolbar"><input class="search" id="search" placeholder="Search films..."><select class="select" id="sort"><option value="recent">Recent</option><option value="name">Name</option></select><button class="primary" id="newProjectPage">New project</button></div><div class="projectgrid" id="projectgrid">${projectCards(data.projects.slice().reverse())}</div></div></div>`}
function projectView(){let x=p();if(!x){nav('dashboard');return ''}let tabs=['overview','story','characters','screenplay'];let body=state.tab==='overview'?`<div class="stats"><div class="stat"><b>${data.storylines.filter(q=>q.project===x.id).length}</b><span>Storylines</span></div><div class="stat"><b>${data.characters.filter(q=>q.project===x.id).length}</b><span>Characters</span></div><div class="stat"><b>${s()?'Draft':'—'}</b><span>Screenplay</span></div></div><div class="cols"><section class="panel"><h2>Film details</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Logline</label><input class="input" id="logline" value="${esc(x.logline)}" placeholder="One sentence that contains the film."><label class="field">Synopsis</label><textarea class="textarea" id="synopsis">${esc(x.synopsis)}</textarea></section><section class="panel"><h2>Production notes</h2><label class="field">Genre</label><input class="input" id="genre" value="${esc(x.genre)}" placeholder="Psychological thriller"><label class="field">Runtime</label><input class="input" id="runtime" value="${esc(x.runtime)}" placeholder="2h 20m"><label class="field">Status</label><select class="selectField" id="statusField"><option ${x.status==='Idea'?'selected':''}>Idea</option><option ${x.status==='Development'?'selected':''}>Development</option><option ${x.status==='Writing'?'selected':''}>Writing</option><option ${x.status==='Complete'?'selected':''}>Complete</option></select></section></div>`:state.tab==='story'?`<section class="panel"><div class="sectionhead"><h2>Storylines</h2><button class="primary" id="addStory">New storyline</button></div>${data.storylines.filter(q=>q.project===x.id).map(q=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(q.name)}</div><div class="itemsub">${esc(q.synopsis||'No synopsis')}</div></div><button class="textbtn" data-ds="${q.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</section>`:state.tab==='characters'?`<section><div class="sectionhead"><h2>Characters</h2><button class="primary" id="addChar">New character</button></div><div class="chargrid">${data.characters.filter(q=>q.project===x.id).map(q=>`<article class="char"><div class="charname"><span class="dot" style="background:${q.color||'#70404a'}"></span>${esc(q.name)}</div><div class="meta">${esc(q.gender||'Unspecified')}</div><div class="bio">${esc(q.bio||'No biography yet.')}</div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></section>`:screenplayEditor(x);return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projectname">${esc(x.name)}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="body">${body}</div></div>`}
function screenplayEditor(x){let sc=s();if(!sc){return `<section class="panel"><h2>Screenplay</h2><p style="font-size:11px;color:#777">Create the first draft for this film.</p><button class="primary" id="createScript">Start screenplay</button></section>`}let scenes=sc.scenes||[];let active=scenes[state.scene]||scenes[0];if(active)state.scene=Math.max(0,scenes.indexOf(active));return `<div class="scriptPage" style="height:calc(100vh - 140px);margin:-38px -48px -80px"><div class="scriptTop"><span class="scriptTitle">${esc(x.name)}</span><span class="scriptMeta">${scenes.length} scene${scenes.length===1?'':'s'}</span><div class="scriptTools"><button class="tool" data-format="INT.">INT.</button><button class="tool" data-format="EXT.">EXT.</button><button class="tool" data-format="ACTION">Action</button><button class="tool" data-format="CHARACTER">Character</button><button class="tool" data-format="DIALOGUE">Dialogue</button><button class="tool" data-format="PARENTHETICAL">Parenthetical</button></div></div><div class="scriptArea"><aside class="scenePanel"><div class="sceneHeader"><span>Scenes</span><button class="tool" id="addScene"><i data-lucide="plus"></i></button></div><div class="sceneList">${scenes.map((q,i)=>`<div class="scene ${i===state.scene?'active':''}" data-scene="${i}"><div class="sceneNum">${String(i+1).padStart(2,'0')}</div><div class="sceneName">${esc(q.heading||'Untitled scene')}</div><div class="sceneLoc">${esc(q.location||'No location')}</div></div>`).join('')}</div></aside><section class="writer"><div class="pageWrap"><div class="paper"><div class="paperTitle">${esc(x.name)}</div><div class="writing" id="writing" contenteditable="true" data-placeholder="Begin the scene...">${esc(active.content||'')}</div></div></div></section><aside class="scriptSide"><div class="sideBlock"><h4>Scene</h4><div class="sideStat"><span>Heading</span><b>${esc(active.heading||'Untitled')}</b></div><div class="sideStat"><span>Location</span><b>${esc(active.location||'—')}</b></div></div><div class="sideBlock"><h4>Draft</h4><div class="sideStat"><span>Words</span><b id="wordCount">${wordCount(active.content)}</b></div><div class="sideStat"><span>Pages</span><b id="pageCount">${pageCount(active.content)}</b></div></div><div class="sideBlock"><h4>Notes</h4><textarea class="notes" id="scriptNotes" placeholder="Notes for this draft...">${esc(sc.notes||'')}</textarea></div></aside></div></div>`}
function wordCount(t){return (String(t||'').trim().match(/\S+/g)||[]).length}function pageCount(t){return Math.max(1,Math.ceil(wordCount(t)/250))}
function screenplayPage(){let scripts=data.scripts.filter(x=>x.project);return `<div class="scroll"><div class="page"><div class="eyebrow">Writing</div><div class="headline">Screenplays</div><div class="intro">Open a draft and stay with the page.</div><section class="section">${scripts.length?scripts.map(x=>`<div class="item" data-open="${x.project}"><div class="itembody"><div class="itemtitle">${esc(pById(x.project)?.name||'Untitled')}</div><div class="itemsub">${x.scenes?.length||1} scenes · ${wordCount((x.scenes||[]).map(q=>q.content).join(' '))} words</div></div><span class="textbtn">Open</span></div>`).join(''):'<div class="empty">No screenplays yet. Open a project and start writing.</div>'}</section></div></div>`}
function listPage(type){let rows=type==='story'?data.storylines:data.characters;return `<div class="scroll"><div class="page"><div class="eyebrow">Development</div><div class="headline">${type==='story'?'Storylines':'Characters'}</div><div class="intro">${type==='story'?'Threads, conflicts, and arcs across your films.':'The people who carry the films.'}</div><section class="section">${rows.length?rows.map(r=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(r.name)}</div><div class="itemsub">${esc(pById(r.project)?.name||'Unassigned')}</div></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</section></div></div>`}
function newProject(){modal(`<h2>New film</h2><p>Start with a title. Everything else can grow from there.</p><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create film</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{let n=$('#mname').value.trim()||'Untitled film';let x={id:uid(),name:n,synopsis:'',logline:'',genre:'',runtime:'',status:'Development'};data.projects.push(x);save();closeModal();state={view:'dashboard',project:x.id,tab:'overview',scene:0};render()};$('#mname').focus()})}
function storyModal(){modal(`<h2>New storyline</h2><p>Give a story thread a name, then let it evolve.</p><input class="input" id="sn" placeholder="Untitled storyline"><label class="field">Synopsis</label><textarea class="textarea" id="ss" placeholder="What changes because this storyline exists?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sn').value.trim()||'Untitled storyline',synopsis:$('#ss').value,project:state.project});save();closeModal();render()};$('#sn').focus()})}
function charModal(){let color='#70404a';modal(`<h2>New character</h2><p>Build someone the story can put under pressure.</p><input class="input" id="cn" placeholder="Character name"><label class="field">Gender</label><select class="selectField" id="cg"><option value="">Unspecified</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="cb" placeholder="Who are they?"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-c="#70404a" style="background:#70404a"></button><button class="color" data-c="#2e4a43" style="background:#2e4a43"></button><button class="color" data-c="#8a6b43" style="background:#8a6b43"></button><button class="color" data-c="#454545" style="background:#454545"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(q=>q.classList.remove('selected'));b.classList.add('selected');color=b.dataset.c});$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cn').value.trim()||'Untitled character',gender:$('#cg').value,bio:$('#cb').value,color,project:state.project});save();closeModal();render()};$('#cn').focus()})}
function ensureScript(){let x=p();if(!data.scripts.some(q=>q.project===x.id))data.scripts.push({id:uid(),project:x.id,notes:'',scenes:[{id:uid(),heading:'OPENING',location:'',content:''}]});save()}
function bind(){icons();$$('[data-open]').forEach(e=>e.onclick=()=>{state.project=e.dataset.open;state.tab='overview';state.scene=0;render()});$$('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});$('#back')?.addEventListener('click',()=>nav('projects'));$('#newProject')?.addEventListener('click',newProject);$('#newProjectPage')?.addEventListener('click',newProject);$('#addStory')?.addEventListener('click',storyModal);$('#addChar')?.addEventListener('click',charModal);$('#createScript')?.addEventListener('click',()=>{ensureScript();state.tab='screenplay';render()});$('#pname')?.addEventListener('change',e=>{p().name=e.target.value;save()});$('#logline')?.addEventListener('change',e=>{p().logline=e.target.value;save()});$('#synopsis')?.addEventListener('change',e=>{p().synopsis=e.target.value;save()});$('#genre')?.addEventListener('change',e=>{p().genre=e.target.value;save()});$('#runtime')?.addEventListener('change',e=>{p().runtime=e.target.value;save()});$('#statusField')?.addEventListener('change',e=>{p().status=e.target.value;save()});$('#search')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();$('#projectgrid').innerHTML=projectCards(data.projects.slice().reverse().filter(x=>(x.name+' '+x.logline+' '+x.synopsis).toLowerCase().includes(q)));bind()});$('#sort')?.addEventListener('change',e=>{let arr=data.projects.slice();if(e.target.value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));else arr.reverse();$('#projectgrid').innerHTML=projectCards(arr);bind()});$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Delete this film and its connected development data?')){let id=b.dataset.delete;data.projects=data.projects.filter(x=>x.id!==id);data.scripts=data.scripts.filter(x=>x.project!==id);data.storylines=data.storylines.filter(x=>x.project!==id);data.characters=data.characters.filter(x=>x.project!==id);save();render()}});$$('[data-ds]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(x=>x.id!==b.dataset.ds);save();render()});$$('[data-scene]').forEach(e=>e.onclick=()=>{state.scene=Number(e.dataset.scene);render()});$('#addScene')?.addEventListener('click',()=>{let q=s();q.scenes.push({id:uid(),heading:'NEW SCENE',location:'',content:''});state.scene=q.scenes.length-1;save();render()});$('#writing')?.addEventListener('input',e=>{let q=s().scenes[state.scene];q.content=e.currentTarget.innerText;$('#wordCount').textContent=wordCount(q.content);$('#pageCount').textContent=pageCount(q.content);save()});$('#scriptNotes')?.addEventListener('input',e=>{s().notes=e.target.value;save()});$$('[data-format]').forEach(b=>b.onclick=()=>{let ed=$('#writing');if(!ed)return;ed.focus();let t=b.dataset.format;document.execCommand('insertText',false,(ed.innerText?'\n\n':'')+t+'\n');save()})}
function render(){let html=state.project?projectView():state.view==='dashboard'?dashboard():state.view==='projects'?projectsPage():state.view==='scripts'?screenplayPage():listPage(state.view);$('#main').innerHTML=html;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));bind()}render();
</script></body></html>
