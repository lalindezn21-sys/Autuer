<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auteur</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#363638;
  background:#fff;
  font-size:14px;
}
button,input{font:inherit}
button{border:0;background:none}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:54px;
  min-height:54px;
  border-bottom:1px solid #e7e8eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px 0 12px;
  background:#fff;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
}

.top-left{gap:3px}
.top-right{gap:8px}

.top-icon{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  color:#303136;
  cursor:pointer;
}

.top-icon:hover{background:#f3f3f5}

.top-icon svg{
  width:20px;
  height:20px;
  stroke-width:2.1;
}

.updated{
  color:#858895;
  font-size:13px;
  font-weight:600;
  margin-right:1px;
}

.refresh{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#969aa4;
  cursor:pointer;
  border-radius:50%;
}

.refresh:hover{background:#f3f3f5}

.refresh svg{
  width:16px;
  height:16px;
}

.create{
  height:36px;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:7px;
  background:#5620c9;
  color:#fff;
  border-radius:5px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
}

.create:hover{background:#4c1bb5}

.create svg{
  width:18px;
  height:18px;
  stroke-width:2;
}

/* BODY */
.body{
  flex:1;
  min-height:0;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:314px;
  min-width:314px;
  background:#f7f8fa;
  border-right:1px solid #e9eaed;
  display:flex;
  flex-direction:column;
}

.profile{
  height:68px;
  display:flex;
  align-items:center;
  padding:0 19px;
  gap:8px;
}

.avatar{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#1688f5;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
  position:relative;
}

.avatar:after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#32c96c;
  right:-1px;
  bottom:-1px;
  border:1px solid #f7f8fa;
}

.profile-name{
  font-size:16px;
  font-weight:500;
  white-space:nowrap;
}

.profile svg{
  width:14px;
  height:14px;
  color:#858992;
}

.nav{
  padding:0 10px;
}

.nav-item{
  width:100%;
  height:39px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  border-radius:5px;
  color:#3d3e42;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  text-align:left;
}

.nav-item:hover{
  background:#eef0f3;
}

.nav-item.active{
  color:#5120ce;
  background:#eef0f3;
}

.nav-item svg{
  width:17px;
  height:17px;
  stroke-width:2;
}

.nav-plus{
  margin-left:auto;
  color:#858991;
}

.secondary{
  margin-top:22px;
}

.upgrade{
  margin:auto 10px 13px;
  height:142px;
  background:#e8ebef;
  border-radius:5px;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.upgrade-title{
  font-size:16px;
  line-height:1.22;
  font-weight:700;
  color:#303136;
}

.upgrade-btn{
  margin-top:auto;
  align-self:flex-start;
  height:34px;
  padding:0 11px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:5px;
  background:#dce0e4;
  color:#38393d;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.upgrade-btn svg{
  width:14px;
  height:14px;
}

/* CONTENT */
.content{
  flex:1;
  min-width:0;
  position:relative;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.content-header{
  height:50px;
  min-height:50px;
  border-bottom:1px solid #ececef;
  display:flex;
  align-items:center;
  padding:0 38px;
}

.page-title{
  font-size:20px;
  font-weight:700;
  color:#353538;
}

.scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:29px 38px 68px;
}

/* SEARCH */
.search{
  height:57px;
  border-radius:30px;
  background:#f4f4f8;
  display:flex;
  align-items:center;
  padding:0 20px;
  margin-bottom:28px;
}

.search svg{
  width:23px;
  height:23px;
  color:#15161a;
  stroke-width:2.4;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  margin-left:13px;
  font-size:17px;
  color:#33343a;
}

.search input::placeholder{
  color:#c8cad1;
}

/* SECTIONS */
.section-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:11px;
  color:#303136;
}

.file-list{
  border-top:1px solid #ececef;
}

.file{
  height:56px;
  border-bottom:1px solid #ececef;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:15px;
  cursor:pointer;
}

.file:hover{
  background:#fafafd;
}

.file svg{
  width:27px;
  height:27px;
  color:#b8c0c9;
  stroke-width:2;
}

.file-name{
  font-size:16px;
  font-weight:650;
}

.recent{
  margin-bottom:49px;
}

/* FILE HEADER */
.file-header{
  height:47px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.tabs{
  height:100%;
  display:flex;
  align-items:center;
  gap:18px;
}

.tab{
  height:100%;
  display:flex;
  align-items:center;
  position:relative;
  color:#9297a0;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  color:#37373b;
  font-weight:700;
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:#5b21d1;
}

.controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.sort{
  display:flex;
  align-items:center;
  gap:3px;
  color:#858a94;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.sort svg{
  width:13px;
  height:13px;
}

.views{
  display:flex;
  align-items:center;
  gap:1px;
  margin-left:3px;
}

.view{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  color:#858991;
  cursor:pointer;
}

.view.active{
  background:#f2f2f5;
  color:#5b21d1;
}

.view svg{
  width:17px;
  height:17px;
}

/* BOTTOM BAR */
.feature{
  position:absolute;
  left:15px;
  right:15px;
  bottom:5px;
  height:45px;
  border:2px solid #5820d8;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  z-index:5;
}

.feature-left{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:17px;
  font-weight:700;
}

.feature-left svg{
  width:17px;
  height:17px;
}

.show{
  color:#858994;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(20,20,25,.2);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-bg.open{display:flex}

.modal{
  width:410px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  padding:24px;
}

.modal-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:18px;
}

.modal input{
  width:100%;
  height:42px;
  border:1px solid #d9dae0;
  border-radius:5px;
  outline:none;
  padding:0 11px;
}

.modal-actions{
  margin-top:18px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.modal-actions button{
  height:36px;
  padding:0 13px;
  border-radius:5px;
  cursor:pointer;
  font-weight:600;
}

.cancel{
  background:#f0f1f3;
}

.confirm{
  background:#5620c9;
  color:#fff;
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="top-left">
    <button class="top-icon"><i data-lucide="home"></i></button>
    <button class="top-icon"><i data-lucide="panel-top"></i></button>
    <button class="top-icon" id="searchTop"><i data-lucide="search"></i></button>
    <button class="top-icon"><i data-lucide="bell"></i></button>
  </div>

  <div class="top-right">
    <span class="updated">Updated just now</span>

    <button class="refresh">
      <i data-lucide="rotate-cw"></i>
    </button>

    <button class="create" id="create">
      <i data-lucide="plus"></i>
      <span>Create</span>
    </button>
  </div>

</header>

<div class="body">

<aside class="sidebar">

  <div class="profile">
    <div class="avatar">NL</div>
    <span class="profile-name">Noah LaLindez</span>
    <i data-lucide="chevron-down"></i>
  </div>

  <nav class="nav">

    <button class="nav-item active">
      <i data-lucide="gauge"></i>
      <span>Dashboard</span>
    </button>

    <button class="nav-item">
      <i data-lucide="file-text"></i>
      <span>Scripts</span>
      <i class="nav-plus" data-lucide="plus"></i>
    </button>

    <button class="nav-item">
      <i data-lucide="layout-grid"></i>
      <span>Projects</span>
    </button>

    <div class="secondary">

      <button class="nav-item">
        <i data-lucide="circle-help"></i>
        <span>Support</span>
      </button>

      <button class="nav-item">
        <i data-lucide="party-popper"></i>
        <span>What's new?</span>
      </button>

      <button class="nav-item">
        <i data-lucide="gift"></i>
        <span>Refer a friend</span>
      </button>

    </div>

  </nav>

  <div class="upgrade">

    <div class="upgrade-title">
      Upgrade Arc Studio to get<br>
      access to all features
    </div>

    <button class="upgrade-btn">
      <i data-lucide="rocket"></i>
      Upgrade now!
    </button>

  </div>

</aside>

<main class="content">

  <div class="content-header">
    <div class="page-title">Dashboard</div>
  </div>

  <div class="scroll">

    <div class="search">
      <i data-lucide="search"></i>
      <input id="search" placeholder="Search scripts..." autocomplete="off">
    </div>

    <section class="recent">

      <div class="section-title">
        Recently edited
      </div>

      <div class="file-list" id="recentFiles">

        <div class="file" data-name="Xenophon's Anabasis">
          <i data-lucide="cloud"></i>
          <span class="file-name">Xenophon's Anabasis</span>
        </div>

        <div class="file" data-name="Sentient Mass">
          <i data-lucide="cloud"></i>
          <span class="file-name">Sentient Mass</span>
        </div>

      </div>

    </section>

    <section>

      <div class="file-header">

        <div class="tabs">

          <button class="tab active">All Files</button>
          <button class="tab">My Files</button>
          <button class="tab">Shared With Me</button>
          <button class="tab">Archived</button>

        </div>

        <div class="controls">

          <button class="sort">
            by last edited
            <i data-lucide="chevron-down"></i>
          </button>

          <div class="views">

            <button class="view active">
              <i data-lucide="list"></i>
            </button>

            <button class="view">
              <i data-lucide="grid-2x2"></i>
            </button>

          </div>

        </div>

      </div>

      <div class="file-list" id="allFiles">

        <div class="file" data-name="Xenophon's Anabasis">
          <i data-lucide="cloud"></i>
          <span class="file-name">Xenophon's Anabasis</span>
        </div>

        <div class="file" data-name="Sentient Mass">
          <i data-lucide="cloud"></i>
          <span class="file-name">Sentient Mass</span>
        </div>

      </div>

    </section>

  </div>

  <div class="feature">

    <div class="feature-left">
      <i data-lucide="chevron-right"></i>
      <span>Featured Guides &amp; Events</span>
    </div>

    <button class="show">Show</button>

  </div>

</main>

</div>
</div>

<div class="modal-bg" id="modal">

  <div class="modal">

    <div class="modal-title">Create new script</div>

    <input id="newName" placeholder="Untitled screenplay">

    <div class="modal-actions">
      <button class="cancel" id="cancel">Cancel</button>
      <button class="confirm" id="confirm">Create script</button>
    </div>

  </div>

</div>

<script>
lucide.createIcons();

const modal=document.getElementById("modal");
const create=document.getElementById("create");
const cancel=document.getElementById("cancel");
const confirm=document.getElementById("confirm");
const newName=document.getElementById("newName");
const search=document.getElementById("search");
const searchTop=document.getElementById("searchTop");

create.onclick=()=>{
  modal.classList.add("open");
  setTimeout(()=>newName.focus(),50);
};

cancel.onclick=()=>{
  modal.classList.remove("open");
  newName.value="";
};

modal.onclick=e=>{
  if(e.target===modal){
    modal.classList.remove("open");
    newName.value="";
  }
};

confirm.onclick=createFile;

newName.onkeydown=e=>{
  if(e.key==="Enter")createFile();
  if(e.key==="Escape")cancel.click();
};

function createFile(){

  const name=newName.value.trim()||"Untitled screenplay";

  ["recentFiles","allFiles"].forEach(id=>{

    const container=document.getElementById(id);

    const file=document.createElement("div");
    file.className="file";
    file.dataset.name=name;

    file.innerHTML=`
      <i data-lucide="cloud"></i>
      <span class="file-name">${escapeHtml(name)}</span>
    `;

    container.prepend(file);
  });

  lucide.createIcons();

  modal.classList.remove("open");
  newName.value="";
}

search.oninput=()=>{

  const q=search.value.toLowerCase().trim();

  document.querySelectorAll(".file").forEach(file=>{

    file.style.display=
      file.dataset.name.toLowerCase().includes(q)
      ?"flex"
      :"none";

  });
};

searchTop.onclick=()=>{
  search.focus();
  search.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
};

document.querySelectorAll(".nav-item").forEach(item=>{

  item.onclick=()=>{

    document.querySelectorAll(".nav-item")
      .forEach(x=>x.classList.remove("active"));

    item.classList.add("active");

  };

});

document.querySelectorAll(".tab").forEach(tab=>{

  tab.onclick=()=>{

    document.querySelectorAll(".tab")
      .forEach(x=>x.classList.remove("active"));

    tab.classList.add("active");

  };

});

document.querySelectorAll(".view").forEach(view=>{

  view.onclick=()=>{

    document.querySelectorAll(".view")
      .forEach(x=>x.classList.remove("active"));

    view.classList.add("active");

  };

});

function escapeHtml(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
```
