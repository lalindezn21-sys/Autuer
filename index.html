<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auteur</title><script src="https://unpkg.com/lucide@latest"></script><style>:root{--ink:#111;--muted:#777;--line:#e4e4e4;--paper:#fff;--wash:#fafafa;--accent:#3b2a55}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:18px}.logo{font-family:Georgia,serif;font-size:21px;font-weight:700}.topspace{flex:1}.save{font-size:11px;color:#999}.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:#555}.icon:hover{background:#f2f2f2;color:#111}.create{height:34px;padding:0 15px;border:1px solid #111;border-radius:5px;background:#111;color:#fff;font-size:12px;font-weight:700}.shell{display:flex;flex:1;min-height:0}.side{width:214px;border-right:1px solid var(--line);padding:25px 14px;background:#fff}.label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#999;padding:0 10px 9px}.nav{width:100%;height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px;font-size:13px;color:#555;text-align:left}.nav svg{width:15px;height:15px}.nav:hover{background:#f5f5f5;color:#111}.nav.active{background:#111;color:#fff}.gap{height:27px}.sidebottom{position:absolute;bottom:18px;width:184px;border-top:1px solid var(--line);padding:13px 10px;color:#999;font-size:10px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.scroll{overflow:auto;flex:1}.inner{max-width:1120px;margin:auto;padding:58px 60px 90px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#888}.title{font-family:Georgia,serif;font-size:38px;line-height:1.05;margin:8px 0 10px;letter-spacing:-1px}.sub{font-size:13px;color:#777;line-height:1.6;max-width:620px}.dashboard{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;margin-top:42px}.start{border:1px solid var(--line);padding:30px;min-height:190px}.start h2{font-family:Georgia,serif;font-size:24px;margin:0 0 8px}.start p{font-size:12px;color:#777;line-height:1.6;max-width:520px}.dark{margin-top:15px;height:34px;padding:0 14px;background:#111;color:#fff;border-radius:5px;font-size:12px;font-weight:700}.stats{border-top:1px solid #111}.stat{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:12px}.stat b{font-size:19px}.section{margin-top:48px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.sectionhead h2{font-family:Georgia,serif;font-size:20px;margin:0}.sectionhead span{font-size:11px;color:#888}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{border:1px solid var(--line);padding:19px;min-height:145px;cursor:pointer}.card:hover{border-color:#999}.card small{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#999}.card h3{font-family:Georgia,serif;font-size:19px;margin:24px 0 7px}.card p{font-size:11px;color:#777;line-height:1.5}.empty{border:1px dashed #ccc;padding:28px;text-align:center;font-size:12px;color:#888}.projectbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px}.back{width:30px;height:30px;display:grid;place-items:center}.back:hover{background:#f4f4f4}.pname{font-family:Georgia,serif;font-size:18px}.tabs{margin-left:auto;height:100%;display:flex;gap:20px}.tab{font-size:11px;color:#888;border-bottom:2px solid transparent}.tab.active{color:#111;border-color:#111}.projectinner{max-width:1080px;margin:auto;padding:38px 48px}.columns{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.panel{border:1px solid var(--line);padding:22px}.panel h3{font-family:Georgia,serif;font-size:18px;margin:0 0 17px}.field{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#999;margin:15px 0 6px}.input,.textarea{width:100%;border:0;border-bottom:1px solid #ccc;padding:9px 2px;outline:0;background:#fff;font-size:13px}.textarea{min-height:130px;resize:vertical;line-height:1.6}.input:focus,.textarea:focus{border-color:#111}.listrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.rowmain{flex:1}.rowtitle{font-size:13px;font-weight:700}.rowsub{font-size:10px;color:#888;margin-top:3px}.rowbutton{font-size:11px;color:#777}.rowbutton:hover{color:#111}.characters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.character{border:1px solid var(--line);padding:17px}.character strong{font-family:Georgia,serif;font-size:17px}.character p{font-size:11px;color:#777;line-height:1.5}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.script{height:100%;display:flex}.scenes{width:205px;border-right:1px solid var(--line);padding:20px 12px;background:#fcfcfc}.scenes h4{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:0 9px 10px}.scene{padding:9px;border-radius:4px;font-size:11px;color:#666}.scene.active,.scene:hover{background:#eee;color:#111}.editor{flex:1;display:flex;flex-direction:column;min-width:0}.editbar{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:3px}.format{font-size:10px;padding:7px 8px;border-radius:4px;color:#666}.format:hover{background:#eee;color:#111}.paper{width:min(780px,calc(100% - 70px));margin:40px auto}.papertitle{text-align:center;font-family:Georgia,serif;font-size:21px;margin-bottom:38px}.editorarea{min-height:700px;outline:0;font-family:"Courier New",monospace;font-size:13px;line-height:1.75;white-space:pre-wrap}.editorarea:empty:before{content:attr(data-placeholder);color:#bbb}.modalbg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modalbg.open{display:flex}.modal{width:min(430px,calc(100% - 30px));background:#fff;padding:24px}.modal h2{font-family:Georgia,serif;font-size:22px;margin:0 0 5px}.modal p{font-size:11px;color:#777}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{height:34px;padding:0 13px;border-radius:5px;font-size:12px}.cancel{border:1px solid #ddd}.confirm{background:#111;color:#fff}.colors{display:flex;gap:8px}.color{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.selected{box-shadow:0 0 0 2px #111}@media(max-width:800px){.side{width:180px}.inner{padding:40px 25px}.dashboard,.columns{grid-template-columns:1fr}.projectinner{padding:25px}.tabs{gap:8px}.tab{font-size:10px}}@media(max-width:560px){.side{display:none}.paper{width:calc(100% - 30px)}.scenes{display:none}.tabs{display:none}}</style></head><body><div class="app"><header class="top"><button class="icon" id="home"><i data-lucide="house"></i></button><div class="logo">Auteur</div><div class="topspace"></div><span class="save" id="save">Ready</span><button class="icon" id="refresh"><i data-lucide="refresh-cw"></i></button><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button><div class="sidebottom" id="sideProject">No project open</div></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>const KEY='auteur-neutral-v3',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],scripts:[],storylines:[],characters:[]},state={view:'dashboard',project:null,tab:'overview'};function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#save').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#save').textContent='Ready',1200)}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function nav(v){state={view:v,project:null,tab:'overview'};render()}function p(){return data.projects.find(x=>x.id===state.project)}function openModal(html,fn){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');fn?.();icons()}function close(){ $('#modalbg').classList.remove('open')}$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')close()};$('#home').onclick=()=>nav('dashboard');$('#refresh').onclick=()=>render();$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));function dashboard(){let ps=data.projects.slice(-4).reverse();return `<div class="scroll"><div class="inner"><div class="kicker">Auteur</div><div class="title">Your films, in one place.</div><div class="sub">Develop the idea, shape the story, build the characters, and write the screenplay in one quiet workspace.</div><div class="dashboard"><section class="start"><h2>Start a new film</h2><p>Create a project and keep its synopsis, storylines, characters, and screenplay connected from the first sentence.</p><button class="dark" id="newProject">New project</button></section><section class="stats"><div class="stat"><span>Projects</span><b>${data.projects.length}</b></div><div class="stat"><span>Screenplays</span><b>${data.scripts.length}</b></div><div class="stat"><span>Characters</span><b>${data.characters.length}</b></div></section></div><section class="section"><div class="sectionhead"><div><h2>Recent projects</h2><span>Your latest films</span></div></div><div class="cards">${ps.length?ps.map(x=>`<article class="card" data-open="${x.id}"><small>Film project</small><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty">No projects yet. Create your first film.</div>`}</div></section></div></div>`}function projectView(){let x=p();if(!x){nav('dashboard');return ''}let tabs=['overview','story','characters','screenplay'];let body=state.tab==='overview'?`<div class="columns"><section class="panel"><h3>Project overview</h3><div class="field">Title</div><input class="input" id="pname" value="${esc(x.name)}"><div class="field">Synopsis</div><textarea class="textarea" id="psyn">${esc(x.synopsis||'')}</textarea></section><section class="panel"><h3>Development</h3><div class="listrow"><div class="rowmain"><div class="rowtitle">Storylines</div><div class="rowsub">${data.storylines.filter(s=>s.project===x.id).length} connected</div></div></div><div class="listrow"><div class="rowmain"><div class="rowtitle">Characters</div><div class="rowsub">${data.characters.filter(c=>c.project===x.id).length} connected</div></div></div><div class="listrow"><div class="rowmain"><div class="rowtitle">Screenplay</div><div class="rowsub">${data.scripts.find(s=>s.project===x.id)?'Draft exists':'No draft yet'}</div></div></div></section></div>`:state.tab==='story'?`<section class="panel"><div class="sectionhead"><div><h2>Storylines</h2><span>Build the spine of the film.</span></div><button class="create" id="addStory">New storyline</button></div>${data.storylines.filter(s=>s.project===x.id).map(s=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(s.name)}</div><div class="rowsub">${esc(s.synopsis||'No synopsis')}</div></div><button class="rowbutton" data-delstory="${s.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</section>`:state.tab==='characters'?`<section><div class="sectionhead"><div><h2>Characters</h2><span>People who inhabit the film.</span></div><button class="create" id="addChar">New character</button></div><div class="characters">${data.characters.filter(c=>c.project===x.id).map(c=>`<article class="character"><div><span class="dot" style="background:${c.color}"></span><strong>${esc(c.name)}</strong><div style="font-size:10px;color:#888;margin-top:3px">${esc(c.gender||'')}</div><p>${esc(c.bio||'No bio yet.')}</p></div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></section>`:`<div class="script"><aside class="scenes"><h4>Scenes</h4><div class="scene active">Opening</div><div class="scene">Scene 2</div><div class="scene">Scene 3</div></aside><section class="editor"><div class="editbar"><button class="format" data-f="INT.">INT.</button><button class="format" data-f="EXT.">EXT.</button><button class="format" data-f="ACTION">Action</button><button class="format" data-f="CHARACTER">Character</button><button class="format" data-f="DIALOGUE">Dialogue</button><span style="margin-left:auto;font-size:10px;color:#999">Autosaved</span></div><div class="paper"><div class="papertitle">${esc(x.name)}</div><div class="editorarea" id="editor" contenteditable="true" data-placeholder="Begin writing your screenplay..."></div></div></section></div>`;return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="pname">${esc(x.name)}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="projectinner">${body}</div></div>`}function listView(){let title=state.view==='projects'?'Projects':state.view==='scripts'?'Screenplays':state.view==='story'?'Storylines':'Characters';let rows=state.view==='projects'?data.projects.map(x=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="rowsub">${esc(x.synopsis||'No synopsis')}</div></div><button class="rowbutton" data-open="${x.id}">Open</button></div>`):state.view==='scripts'?data.scripts.map(x=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="rowsub">Screenplay</div></div></div>`):state.view==='story'?data.storylines.map(x=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="rowsub">${esc(x.synopsis||'No synopsis')}</div></div></div>`):data.characters.map(x=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="rowsub">${esc(x.gender||'')}</div></div></div>`);return `<div class="scroll"><div class="inner"><div class="kicker">Development</div><div class="title">${title}</div><div class="cards" style="display:block">${rows.join('')||'<div class="empty">Nothing here yet.</div>'}</div></div></div>`}function render(){if(state.project)$('#main').innerHTML=projectView();else $('#main').innerHTML=state.view==='dashboard'?dashboard():listView();$('#sideProject').textContent=p()?.name||'No project open';$$('[data-open]').forEach(e=>e.onclick=()=>{state.project=e.dataset.open;state.tab='overview';render()});$$('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});$('#back')?.addEventListener('click',()=>nav('dashboard'));$('#newProject')?.addEventListener('click',newProject);$('#create').onclick=newProject;$('#allProjects')?.addEventListener('click',()=>nav('projects'));$('#emptyCreate')?.addEventListener('click',newProject);$('#pname')?.addEventListener('change',e=>{p().name=e.target.value;save()});$('#psyn')?.addEventListener('change',e=>{p().synopsis=e.target.value;save()});$('#addStory')?.addEventListener('click',()=>storyModal());$('#addChar')?.addEventListener('click',()=>charModal());$$('[data-delstory]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(s=>s.id!==b.dataset.delstory);save();render()});$$('[data-f]').forEach(b=>b.onclick=()=>{let ed=$('#editor');if(ed){ed.focus();document.execCommand('insertText',false,b.dataset.f==='CHARACTER'?'\n\nCHARACTER\n':b.dataset.f==='DIALOGUE'?'\nDIALOGUE\n':b.dataset.f==='ACTION'?'\nACTION\n':b.dataset.f+'\n')}});icons()}function newProject(){openModal(`<h2>New film</h2><p>Give the project a name. You can build the rest inside it.</p><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="confirm" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#mname').value.trim()||'Untitled film';let x={id:uid(),name:n,synopsis:''};data.projects.push(x);save();close();state.project=x.id;state.tab='overview';render()};$('#mname').focus()})}function storyModal(){openModal(`<h2>New storyline</h2><p>Define a thread that carries through the film.</p><input class="input" id="sname" placeholder="Untitled storyline"><div class="field">Synopsis</div><textarea class="textarea" id="ssyn" placeholder="What is this storyline about?"></textarea><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="confirm" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#sname').value.trim()||'Untitled storyline';data.storylines.push({id:uid(),name:n,synopsis:$('#ssyn').value,project:state.project});save();close();render()};$('#sname').focus()})}function charModal(){openModal(`<h2>New character</h2><p>Create a character connected to this film.</p><input class="input" id="cname" placeholder="Character name"><div class="field">Gender</div><select class="input" id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><div class="field">Bio</div><textarea class="textarea" id="bio" placeholder="Character bio"></textarea><div class="field">Color</div><div class="colors"><button class="color selected" data-color="#111" style="background:#111"></button><button class="color" data-color="#555" style="background:#555"></button><button class="color" data-color="#8b6f47" style="background:#8b6f47"></button><button class="color" data-color="#777" style="background:#777"></button></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="confirm" id="confirm">Create</button></div>`,()=>{let color='#111';$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#cname').value.trim()||'Untitled character';data.characters.push({id:uid(),name:n,gender:$('#gender').value,bio:$('#bio').value,color,project:state.project});save();close();render()};$('#cname').focus()})}render();</script></body></html>
