</style></head><body><div class="app"><header class="top"><div class="logo">Auteur <small>Film Workspace</small></div><div class="grow"></div><span class="status" id="status">Ready</span><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button><div class="quote">Write what the camera cannot say.</div></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>const KEY='auteur-ultimate-v11',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-cinema-v10')||'null')||JSON.parse(localStorage.getItem('auteur-cinema-v9')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};data.projects??=[];data.scripts??=[];data.storylines??=[];data.characters??=[];data.projects.forEach(x=>{x.synopsis??='';x.logline??='';x.genre??='';x.runtime??='';x.status??='Development'});data.scripts.forEach(x=>{x.scenes??=[{id:uid(),heading:'FADE IN',location:'',content:''}];x.notes??=''});let state={view:'dashboard',project:null,tab:'overview',scene:0};function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#status').textContent='Ready',900)}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function p(){return data.projects.find(x=>x.id===state.project)}function scr(){return data.scripts.find(x=>x.project===state.project)}function nav(v){state={view:v,project:null,tab:'overview',scene:0};render()}function openModal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}function closeModal(){$('#modalbg').classList.remove('open')}$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};function dashboard(){let recent=data.projects.slice(-4).reverse();return `<div class="scroll"><div class="page"><div class="eyebrow">Auteur / Studio</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A focused home for the ideas behind a film, from the first image in your head to the final page of the screenplay.</div><div class="hero"><div><h2>${recent[0]?esc(recent[0].name):'Start with an empty page.'}</h2><p>${recent[0]?esc(recent[0].logline||recent[0].synopsis||'Your next film is taking shape.'):'Create a film project, then develop its story, characters, and screenplay without leaving the room.'}</p></div><button class="primary" id="heroAction">${recent[0]?'Open project':'Create a film'}</button></div><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${data.projects.length} project${data.projects.length===1?'':'s'}</span></div><div class="grid">${recent.length?recent.map((x,i)=>`<article class="card film" data-open="${x.id}" style="animation-delay:${i*45}ms"><div class="tag">${esc(x.genre||'Film project')}</div><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No logline yet.')}</p><div class="filmfoot"><span>${data.storylines.filter(s=>s.project===x.id).length} storylines</span><span>${data.characters.filter(c=>c.project===x.id).length} characters</span></div></article>`).join(''):'<div class="empty">Your first film is waiting for a title.</div>'}</div></section></div></div>`}function projectsPage(){return `<div class="scroll"><div class="page"><div class="eyebrow">Studio</div><div class="headline">Projects</div><div class="intro">Every film gets its own room. Keep the premise, development notes, people, and pages together.</div><div class="featuregrid"><div class="feature"><i data-lucide="film"></i><strong>One project, one world.</strong><span>Keep creative decisions attached to the film they belong to.</span></div><div class="feature"><i data-lucide="layers-3"></i><strong>Development at a glance.</strong><span>Story, cast, runtime and screenplay status without digging.</span></div><div class="feature"><i data-lucide="sparkles"></i><strong>Make room for ideas.</strong><span>Capture a premise before it becomes a hundred scattered notes.</span></div></div><div class="toolbar"><input class="search" id="projectSearch" placeholder="Search projects"><select class="select" id="projectSort"><option value="new">Newest</option><option value="name">Name</option><option value="status">Status</option></select><button class="create" id="newProject2">New project</button></div><div class="grid" id="projectGrid">${projectCards(data.projects)}</div></div></div>`}function projectCards(items){return items.length?items.map(x=>`<article class="card project" data-open="${x.id}"><button class="delete" data-delete="${x.id}">Delete</button><div class="projecttop"><span>${esc(x.status||'Development')}</span><span>${esc(x.genre||'Film')}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No logline yet.')}</p><div class="metaRow"><div><span>Story</span><strong>${data.storylines.filter(s=>s.project===x.id).length}</strong></div><div><span>Cast</span><strong>${data.characters.filter(c=>c.project===x.id).length}</strong></div><div><span>Runtime</span><strong>${esc(x.runtime||'—')}</strong></div></div></article>`).join(''):'<div class="empty">No projects yet.</div>'}function projectView(){let x=p();if(!x){nav('projects');return''}let tabs=['overview','story','characters','screenplay'];let body=state.tab==='overview'?overview(x):state.tab==='story'?storyTab(x):state.tab==='characters'?charsTab(x):scriptTab(x);return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projectname">${esc(x.name)}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="body">${body}</div></div>`}function overview(x){return `<div class="stats"><div class="stat"><b>${data.storylines.filter(s=>s.project===x.id).length}</b><span>Storylines</span></div><div class="stat"><b>${data.characters.filter(c=>c.project===x.id).length}</b><span>Characters</span></div><div class="stat"><b>${scr()?'Draft':'—'}</b><span>Screenplay</span></div><div class="stat"><b>${esc(x.status||'Idea')}</b><span>Status</span></div></div><div class="cols"><section class="panel"><h2>Film overview</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Logline</label><input class="input" id="plog" value="${esc(x.logline)}" placeholder="One sentence that contains the film."><label class="field">Synopsis</label><textarea class="textarea" id="psyn">${esc(x.synopsis)}</textarea></section><section class="panel"><h2>Production</h2><label class="field">Genre</label><input class="input" id="pgenre" value="${esc(x.genre)}" placeholder="Psychological thriller"><label class="field">Runtime</label><input class="input" id="pruntime" value="${esc(x.runtime)}" placeholder="2h 15m"><label class="field">Status</label><select class="selectField" id="pstatus"><option ${x.status==='Idea'?'selected':''}>Idea</option><option ${x.status==='Development'?'selected':''}>Development</option><option ${x.status==='Writing'?'selected':''}>Writing</option><option ${x.status==='Pre-production'?'selected':''}>Pre-production</option><option ${x.status==='Complete'?'selected':''}>Complete</option></select></section></div>`}function storyTab(x){let rows=data.storylines.filter(s=>s.project===x.id);return `<section class="panel"><div class="sectionhead"><h2>Storylines</h2><button class="create" id="addStory">New storyline</button></div>${rows.length?rows.map(s=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(s.name)}</div><div class="itemsub">${esc(s.synopsis||'No synopsis yet.')}</div></div><button class="textbtn" data-delstory="${s.id}">Delete</button></div>`).join(''):'<div class="empty">No storylines yet. Give the film a thread to follow.</div>'}</section>`}function charsTab(x){let rows=data.characters.filter(c=>c.project===x.id);return `<div class="sectionhead"><h2>Characters</h2><button class="create" id="addChar">New character</button></div><div class="grid">${rows.length?rows.map(c=>`<article class="card char"><div class="charname"><span class="dot" style="background:${c.color||'#181613'}"></span>${esc(c.name)}</div><div class="meta">${esc(c.gender||'Unspecified')}</div><div class="bio">${esc(c.bio||'No biography yet.')}</div></article>`).join(''):'<div class="empty">No characters yet. Put someone inside the frame.</div>'}</div>`}function scriptTab(x){let s=scr();return s?screenplayEditor(x,s):`<section class="panel"><h2>Screenplay</h2><p class="intro">The screenplay is where development becomes pages.</p><button class="primary" id="createScript">Begin screenplay</button></section>`}function screenplayPage(){return `<div class="scroll"><div class="page"><div class="eyebrow">Writing</div><div class="headline">Screenplays</div><div class="intro">A quieter room for the actual pages. Open a draft and stay with the story.</div><div class="featuregrid"><div class="feature"><i data-lucide="scroll-text"></i><strong>Write without clutter.</strong><span>Keep the page, scene list and essential details within reach.</span></div><div class="feature"><i data-lucide="list-video"></i><strong>Think in scenes.</strong><span>Move through the film one scene at a time.</span></div><div class="feature"><i data-lucide="clock-3"></i><strong>See the shape.</strong><span>Track words and estimated pages as the draft grows.</span></div></div><section class="section">${data.scripts.length?data.scripts.map(s=>{let x=data.projects.find(p=>p.id===s.project);return `<div class="item" data-script-open="${s.project}"><div class="itembody"><div class="itemtitle">${esc(x?.name||s.name||'Untitled')}</div><div class="itemsub">${s.scenes?.length||1} scenes · ${esc(x?.status||'Writing')}</div></div><button class="textbtn">Open draft</button></div>`}).join(''):'<div class="empty">No screenplay drafts yet. Open a film and begin.</div>'}</section></div></div>`}function screenplayEditor(x,s){let scenes=s.scenes||[];let sc=scenes[state.scene]||scenes[0];if(!sc){sc={id:uid(),heading:'FADE IN',location:'',content:''};scenes.push(sc);state.scene=scenes.length-1}let words=(sc.content||'').trim()?sc.content.trim().split(/\s+/).length:0;return `<div class="scriptPage"><div class="scriptTop"><span class="scriptTitle">${esc(x.name)}</span><span class="scriptMeta">Draft · ${words} words · ${Math.max(1,Math.ceil(words/250))} pages</span><div class="scriptTools"><button class="tool" id="addScene">New scene</button><button class="tool" id="saveScript">Save</button></div></div><div class="scriptArea"><aside class="scenePanel"><div class="sceneHeader"><span>Scenes · ${scenes.length}</span><button class="tool" id="addScene2">+</button></div><div class="sceneList">${scenes.map((a,i)=>`<div class="scene ${i===state.scene?'active':''}" data-scene="${i}"><div class="sceneNum">${String(i+1).padStart(2,'0')}</div><div class="sceneName">${esc(a.heading||'Untitled scene')}</div><div class="sceneLoc">${esc(a.location||'No location')}</div></div>`).join('')}</div></aside><section class="writer"><div class="formatbar"><button class="format" data-format="INT. ">Scene heading</button><button class="format" data-format="ACTION\n">Action</button><button class="format" data-format="\nCHARACTER\n">Character</button><button class="format" data-format="\nDIALOGUE\n">Dialogue</button><button class="format" data-format="\n(PARENTHETICAL)\n">Parenthetical</button><button class="format" data-format="\nCUT TO:\n">Transition</button></div><div class="pageWrap"><article class="paper"><div class="paperTitle">${esc(x.name)}</div><div class="writing" id="writing" contenteditable="true" data-placeholder="FADE IN:\n\nBegin your screenplay...">${esc(sc.content||'')}</div></article></div></section><aside class="scriptSide"><div class="sideBlock"><h4>Current scene</h4><div class="sideStat"><span>Words</span><strong id="wordCount">${words}</strong></div><div class="sideStat"><span>Pages</span><strong>${Math.max(1,Math.ceil(words/250))}</strong></div></div><div class="sideBlock"><h4>Scene details</h4><label class="field">Heading</label><input class="input" id="sceneHeading" value="${esc(sc.heading||'')}"><label class="field">Location</label><input class="input" id="sceneLocation" value="${esc(sc.location||'')}"></div><div class="sideBlock"><h4>Draft notes</h4><textarea class="notes" id="scriptNotes" placeholder="Notes for this draft...">${esc(s.notes||'')}</textarea></div></aside></div></div>`}function newProject(){openModal(`<h2>New film</h2><p>Start with a title. Everything else can evolve.</p><label class="field">Title</label><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="create" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{let x={id:uid(),name:$('#mname').value.trim()||'Untitled film',synopsis:'',logline:'',genre:'',runtime:'',status:'Idea'};data.projects.push(x);save();closeModal();state={view:'projects',project:x.id,tab:'overview',scene:0};render()};$('#mname').focus()})}function storyModal(){openModal(`<h2>New storyline</h2><p>Give a major thread of the film a name and purpose.</p><label class="field">Name</label><input class="input" id="sname" placeholder="The central conflict"><label class="field">Synopsis</label><textarea class="textarea" id="ssyn" placeholder="What does this storyline do?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="create" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sname').value.trim()||'Untitled storyline',synopsis:$('#ssyn').value,project:state.project});save();closeModal();render()};$('#sname').focus()})}function charModal(){openModal(`<h2>New character</h2><p>Build the person behind the performance.</p><label class="field">Name</label><input class="input" id="cname" placeholder="Character name"><label class="field">Gender</label><select class="selectField" id="gender"><option value="">Unspecified</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="bio" placeholder="Who are they?"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-color="#181613" style="background:#181613"></button><button class="color" data-color="#71434b" style="background:#71434b"></button><button class="color" data-color="#75654c" style="background:#75654c"></button><button class="color" data-color="#53605a" style="background:#53605a"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="create" id="confirm">Create</button></div>`,()=>{let color='#181613';$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cname').value.trim()||'Untitled character',gender:$('#gender').value,bio:$('#bio').value,color,project:state.project});save();closeModal();render()};$('#cname').focus()})}function bind(){if(!state.project){$$('[data-open]').forEach(e=>e.onclick=()=>{state={view:'projects',project:e.dataset.open,tab:'overview',scene:0};render()});$$('[data-script-open]').forEach(e=>e.onclick=()=>{state={view:'scripts',project:e.dataset.scriptOpen,tab:'screenplay',scene:0};render()});$('#heroAction')?.addEventListener('click',()=>{if(data.projects.length){state={view:'projects',project:data.projects[data.projects.length-1].id,tab:'overview',scene:0};render()}else newProject()});$('#newProject')?.addEventListener('click',newProject);$('#newProject2')?.addEventListener('click',newProject);$('#projectSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();$('#projectGrid').innerHTML=projectCards(data.projects.filter(x=>(x.name+' '+x.genre+' '+x.logline+' '+x.synopsis).toLowerCase().includes(q)));bind()});$('#projectSort')?.addEventListener('change',e=>{let a=[...data.projects];if(e.target.value==='name')a.sort((a,b)=>a.name.localeCompare(b.name));if(e.target.value==='status')a.sort((a,b)=>(a.status||'').localeCompare(b.status||''));$('#projectGrid').innerHTML=projectCards(a);bind()});$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Delete this project and its development data?')){let id=b.dataset.delete;data.projects=data.projects.filter(x=>x.id!==id);data.scripts=data.scripts.filter(x=>x.project!==id);data.storylines=data.storylines.filter(x=>x.project!==id);data.characters=data.characters.filter(x=>x.project!==id);save();render()}})}else{$$('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});$('#back')?.addEventListener('click',()=>nav('projects'));$('#pname')?.addEventListener('change',e=>{p().name=e.target.value.trim()||'Untitled film';save();render()});$('#plog')?.addEventListener('change',e=>{p().logline=e.target.value;save()});$('#psyn')?.addEventListener('change',e=>{p().synopsis=e.target.value;save()});$('#pgenre')?.addEventListener('change',e=>{p().genre=e.target.value;save();render()});$('#pruntime')?.addEventListener('change',e=>{p().runtime=e.target.value;save();render()});$('#pstatus')?.addEventListener('change',e=>{p().status=e.target.value;save();render()});$('#addStory')?.addEventListener('click',storyModal);$('#addChar')?.addEventListener('click',charModal);$$('[data-delstory]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(s=>s.id!==b.dataset.delstory);save();render()});if(state.tab==='screenplay'){if(!scr())$('#createScript')?.addEventListener('click',()=>{data.scripts.push({id:uid(),project:state.project,name:p().name,notes:'',scenes:[{id:uid(),heading:'FADE IN',location:'',content:''}]});p().status='Writing';save();render()});else bindEditor()}}function bindEditor(){let s=scr(),sc=s?.scenes?.[state.scene];if(!s||!sc)return;let ed=$('#writing');ed?.addEventListener('input',()=>{sc.content=ed.innerText;let w=sc.content.trim()?sc.content.trim().split(/\s+/).length:0;$('#wordCount').textContent=w;$('#status').textContent='Saving';save()});$('#sceneHeading')?.addEventListener('change',e=>{sc.heading=e.target.value;save();render()});$('#sceneLocation')?.addEventListener('change',e=>{sc.location=e.target.value;save();render()});$('#scriptNotes')?.addEventListener('change',e=>{s.notes=e.target.value;save()});$$('[data-scene]').forEach(e=>e.onclick=()=>{scenesSave();state.scene=+e.dataset.scene;render()});$$('[data-format]').forEach(b=>b.onclick=()=>{ed.focus();document.execCommand('insertText',false,b.dataset.format)});$('#addScene')?.addEventListener('click',addScene);$('#addScene2')?.addEventListener('click',addScene);$('#saveScript')?.addEventListener('click',()=>{scenesSave();save()})}function scenesSave(){let ed=$('#writing'),s=scr(),sc=s?.scenes?.[state.scene];if(ed&&sc)sc.content=ed.innerText}function addScene(){scenesSave();let s=scr();s.scenes.push({id:uid(),heading:'NEW SCENE',location:'',content:''});state.scene=s.scenes.length-1;save();render()}function render(){if(state.project)$('#main').innerHTML=projectView();else if(state.view==='dashboard')$('#main').innerHTML=dashboard();else if(state.view==='projects')$('#main').innerHTML=projectsPage();else if(state.view==='scripts')$('#main').innerHTML=screenplayPage();else $('#main').innerHTML=listPage(state.view);bind();icons();$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}function listPage(type){let rows=type==='story'?data.storylines:data.characters,title=type==='story'?'Storylines':'Characters';return `<div class="scroll"><div class="page"><div class="eyebrow">Development</div><div class="headline">${title}</div><div class="intro">${type==='story'?'Story threads across your films.':'Characters across your film projects.'}</div><section class="section"><div class="panel">${rows.length?rows.map(r=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(r.name)}</div><div class="itemsub">${esc(data.projects.find(p=>p.id===r.project)?.name||'Unassigned')}</div></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</div></section></div></div>`}render();</script></body></html>
