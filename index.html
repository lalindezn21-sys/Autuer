<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamscape</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:'Space Grotesk',Arial,sans-serif}.screen{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;will-change:transform}.white-screen{z-index:1;background:#fff}.red-screen{z-index:2;background:#F02D20;transform:translateY(100%)}.dream{width:100vw;margin-top:18vh;padding:0;font-size:clamp(42px,12vw,180px);font-weight:700;line-height:.58;letter-spacing:-.018em;white-space:nowrap;text-align:center;transform:scaleX(1.3);transform-origin:center}.dream .m{display:inline-block;transform:scaleY(.82);transform-origin:bottom center}.transitioning{pointer-events:none}</style></head><body><section class="screen white-screen"><main class="dream">DREA<span class="m">M</span>SCAPE</main></section><section class="screen red-screen"></section><script>const red=document.querySelector('.red-screen');let state='white',busy=false;const duration=900,ease='cubic-bezier(.16,1,.3,1)';function move(to){if(busy||to===state)return;busy=true;document.body.classList.add('transitioning');const from=state==='white'?100:0,target=to==='red'?0:100;const animation=red.animate([{transform:`translateY(${from}%)`},{transform:`translateY(${target}%)`}],{duration,easing:ease,fill:'forwards'});animation.onfinish=()=>{state=to;busy=false;document.body.classList.remove('transitioning')}}window.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<4)return;move(e.deltaY>0?'red':'white')},{passive:true});let startY=0;window.addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});window.addEventListener('touchend',e=>{const delta=startY-e.changedTouches[0].clientY;if(Math.abs(delta)>20)move(delta>0?'red':'white')},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown')move('red');if(e.key==='ArrowUp'||e.key==='PageUp')move('white')});</script></body></html>
