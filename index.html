<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Unified System - Professional Screenwriting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'page': 'var(--page)',
                        'surface': 'var(--surface)',
                        'elevated': 'var(--elevated)',
                        'border': 'var(--border)',
                        'ink': 'var(--ink)',
                        'gray': 'var(--gray)',
                        'accent': 'var(--accent)',
                    },
                    fontFamily: {
                        sans: ['SF Pro Display', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        script: ['Courier Prime', 'monospace'],
                    },
                    borderRadius: {
                        'jumbo': '3rem',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        pulseOpacity: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.4' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        marquee: 'marquee 30s linear infinite',
                        pulseDot: 'pulseOpacity 2s ease-in-out infinite',
                        fadeInUp: 'fadeInUp 0.5s ease-out forwards',
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --page: #fff5f5; /* Very light cherry tinted background */
            --surface: #ffe3e3;
            --elevated: #ffffff;
            --border: #ffd1d1;
            --ink: #1a0000;
            --gray: #8b4d4d;
            --accent: #ff0033; /* Cherry Bright Red */
            --glow: rgba(255,0,51,0.05);
        }
        .dark {
            --page: #0a0000; /* Deep black-red */
            --surface: #1a0000;
            --elevated: #240000;
            --border: #3d0000;
            --ink: #ffebeb;
            --gray: #a88a8a;
            --accent: #ff0033;
            --glow: rgba(255,0,51,0.1);
        }
        body { font-feature-settings: "cv11", "salt", "ss01"; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .command-palette {
            transform: scale(0.98) translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .command-palette.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .grid-pattern {
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow-border {
            position: relative;
        }
        .glow-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(45deg, transparent, var(--border), transparent);
            z-index: -1;
            border-radius: inherit;
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-page text-ink antialiased font-sans tracking-tight transition-colors duration-500 overflow-x-hidden">

    <!-- Ambient Background -->
    <div class="fixed inset-0 grid-pattern opacity-[0.4] pointer-events-none -z-10"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-accent/5 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <!-- Command Palette -->
    <div id="commandPalette" class="command-palette fixed inset-0 z-[10000] flex items-start justify-center pt-[15vh] px-4 bg-black/60 backdrop-blur-md">
        <div class="w-full max-w-2xl bg-elevated border border-border rounded-xl shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)] overflow-hidden">
            <div class="flex items-center px-6 py-5 border-b border-border">
                <i class="fa-solid fa-terminal text-gray mr-4 text-sm"></i>
                <input type="text" placeholder="Execute command..." class="flex-1 bg-transparent border-none outline-none text-ink text-xl placeholder:text-gray/30 font-mono tracking-tighter">

            </div>
            <div class="max-h-[60vh] overflow-y-auto p-3">
                <div class="text-[10px] font-bold text-gray/50 uppercase tracking-[0.2em] px-4 py-3">System Methods</div>
                <div class="space-y-1">
                    <button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-surface text-left transition-all group">
                        <div class="w-8 h-8 rounded bg-surface border border-border flex items-center justify-center group-hover:border-accent/30">
                            <i class="fa-solid fa-file-invoice w-4 text-gray group-hover:text-accent"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium">Draft.init()</div>
                            <div class="text-[10px] text-gray">Initialize new screenplay script</div>
                        </div>
                        <kbd class="text-[10px] text-gray/40 font-mono">⌘N</kbd>
                    </button>
                    <button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-surface text-left transition-all group">
                        <div class="w-8 h-8 rounded bg-surface border border-border flex items-center justify-center group-hover:border-accent/30">
                            <i class="fa-solid fa-microchip w-4 text-gray group-hover:text-accent"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium">Production.board()</div>
                            <div class="text-[10px] text-gray">Open interactive stripboard</div>
                        </div>
                        <kbd class="text-[10px] text-gray/40 font-mono">⌘B</kbd>
                    </button>
                    <button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-surface text-left transition-all group">
                        <div class="w-8 h-8 rounded bg-surface border border-border flex items-center justify-center group-hover:border-accent/30">
                            <i class="fa-solid fa-satellite-dish w-4 text-gray group-hover:text-accent"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium">Network.sync()</div>
                            <div class="text-[10px] text-gray">Manage real-time collaboration</div>
                        </div>
                        <kbd class="text-[10px] text-gray/40 font-mono">⌘T</kbd>
                    </button>
                </div>
            </div>
            <div class="p-4 border-t border-border bg-surface/30 flex justify-between items-center text-[10px] text-gray font-mono">
                <div>SYSTEM_VERSION: 1.0.4-STABLE</div>
                <div class="flex gap-4">
                    <span>INDEX: <span class="text-ink">0x4F</span></span>
                    <span>STATUS: <span class="text-accent uppercase">Online</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-[9999
