```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autuer</title>

    <style>
        :root {
            --background: #f2f1ed;
            --page: #ffffff;
            --text: #171717;
            --muted: #8a8a8a;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --background: #151515;
            --page: #1d1d1d;
            --text: #eeeeee;
            --muted: #888888;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        /* -------------------------
           THEME TOGGLE
        ------------------------- */

        .theme-toggle {
            position: fixed;
            top: 22px;
            right: 24px;

            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 50%;

            background: transparent;
            color: var(--muted);

            font-family: inherit;
            font-size: 15px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0.55;

            transition:
                opacity 0.2s ease,
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .theme-toggle:hover {
            opacity: 1;
            background: rgba(128, 128, 128, 0.1);
            color: var(--text);
        }

        /* -------------------------
           WRITING AREA
        ------------------------- */

        .workspace {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 70px 20px;
        }

        .page {
            width: min(816px, 100%);
            min-height: 1056px;

            background: var(--page);

            box-shadow:
                0 12px 40px var(--shadow);

            transition:
                background-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .editor {
            width: 100%;
            min-height: 1056px;

            padding:
                96px
                96px
                120px;

            outline: none;

            color: var(--text);

            font-family:
                "Courier Prime",
                "Courier New",
                Courier,
                monospace;

            font-size: 12px;
            line-height: 1.6;

            white-space: pre-wrap;
            overflow-wrap: break-word;

            caret-color: var(--text);
        }

        .editor:empty::before {
            content: "FADE IN:";
            color: var(--muted);
        }

        /* -------------------------
           AUTOSAVE INDICATOR
        ------------------------- */

        .save-status {
            position: fixed;
            left: 24px;
            bottom: 20px;

            color: var(--muted);

            font-family:
                "Courier Prime",
                "Courier New",
                Courier,
                monospace;

            font-size: 10px;

            opacity: 0;

            transition: opacity 0.25s ease;
        }

        .save-status.visible {
            opacity: 0.7;
        }

        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 700px) {

            .workspace {
                padding: 0;
            }

            .page {
                min-height: 100vh;
                box-shadow: none;
            }

            .editor {
                min-height: 100vh;

                padding:
                    70px
                    32px
                    100px;

                font-size: 12px;
            }

            .theme-toggle {
                top: 16px;
                right: 16px;
            }

            .save-status {
                left: 16px;
                bottom: 16px;
            }
        }

        /* -------------------------
           PRINT
        ------------------------- */

        @media print {

            body {
                background: white;
            }

            .workspace {
                padding: 0;
            }

            .page {
                width: 100%;
                min-height: auto;
                box-shadow: none;
            }

            .editor {
                min-height: auto;
                color: black;
            }

            .theme-toggle,
            .save-status {
                display: none;
            }
        }
    </style>
</head>

<body>

    <button
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        ☾
    </button>

    <main class="workspace">

        <section class="page">

            <div
                id="editor"
                class="editor"
                contenteditable="true"
                spellcheck="true"
                role="textbox"
                aria-label="Screenplay editor"
            ></div>

        </section>

    </main>

    <div
        id="saveStatus"
        class="save-status"
        aria-live="polite"
    >
        Saved
    </div>


    <script>
        const editor = document.getElementById("editor");
        const themeToggle = document.getElementById("themeToggle");
        const saveStatus = document.getElementById("saveStatus");

        const CONTENT_KEY = "autuer-screenplay-content";
        const THEME_KEY = "autuer-theme";


        /* =========================
           THEME
        ========================= */

        function loadTheme() {
            const savedTheme =
                localStorage.getItem(THEME_KEY);

            if (savedTheme === "dark") {
                document.documentElement.dataset.theme = "dark";
                themeToggle.textContent = "☀";
            } else {
                document.documentElement.dataset.theme = "light";
                themeToggle.textContent = "☾";
            }
        }


        function toggleTheme() {
            const isDark =
                document.documentElement.dataset.theme === "dark";

            const nextTheme =
                isDark ? "light" : "dark";

            document.documentElement.dataset.theme =
                nextTheme;

            localStorage.setItem(
                THEME_KEY,
                nextTheme
            );

            themeToggle.textContent =
                nextTheme === "dark" ? "☀" : "☾";
        }


        themeToggle.addEventListener(
            "click",
            toggleTheme
        );


        /* =========================
           SAVE
        ========================= */

        let saveTimer;

        function showSaved() {
            saveStatus.classList.add("visible");

            clearTimeout(saveTimer);

            saveTimer = setTimeout(() => {
                saveStatus.classList.remove("visible");
            }, 1200);
        }


        function saveContent() {
            localStorage.setItem(
                CONTENT_KEY,
                editor.innerHTML
            );

            showSaved();
        }


        /* =========================
           LOAD
        ========================= */

        function loadContent() {
            const savedContent =
                localStorage.getItem(CONTENT_KEY);

            if (savedContent !== null) {
                editor.innerHTML = savedContent;
            }
        }


        /* =========================
           AUTOSAVE
        ========================= */

        let autosaveTimer;

        editor.addEventListener(
            "input",
            () => {

                clearTimeout(autosaveTimer);

                autosaveTimer = setTimeout(
                    saveContent,
                    500
                );

            }
        );


        /* =========================
           KEYBOARD SHORTCUT
        ========================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    (event.metaKey || event.ctrlKey) &&
                    event.key.toLowerCase() === "s"
                ) {

                    event.preventDefault();

                    saveContent();
                }

            }
        );


        /* =========================
           INITIALIZE
        ========================= */

        loadTheme();
        loadContent();

        editor.focus();
    </script>

</body>
</html>
