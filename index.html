<body>
<div class="app" id="app">
<aside class="sidebar">
<div class="brand"><div class="brand-name">Auteur</div><div class="project-name">Draft</div></div>
<div class="side-tabs"><button class="side-tab active" data-tab="contents">CONTENTS</button><button class="side-tab" data-tab="comments">COMMENTS</button><button class="side-tab" data-tab="notes">NOTES</button></div>
<div class="sidebar-content">
<div id="contentsPanel"><div id="sceneList"><div class="empty-state contents-empty"><div class="empty-icon"><i data-lucide="file-text"></i></div><div class="empty-title">No scenes yet</div><div class="empty-text">Your screenplay scenes will appear here as you write.</div></div></div></div>
<div id="commentsPanel" class="hidden"><div class="sidebar-toolbar"><button class="sidebar-tool" id="addCommentButton"><i data-lucide="plus"></i></button><button class="sidebar-tool" id="commentSettingsButton"><i data-lucide="settings-2"></i></button><div class="sidebar-toolbar-spacer"></div><button class="sidebar-tool" id="clearCommentsButton"><i data-lucide="rotate-ccw"></i></button></div><div id="commentsList"></div></div>
<div id="notesPanel" class="hidden"><div class="sidebar-toolbar"><button class="sidebar-tool" id="addNoteButton"><i data-lucide="plus"></i></button><button class="sidebar-tool" id="noteSettingsButton"><i data-lucide="settings-2"></i></button><div class="sidebar-toolbar-spacer"></div><button class="sidebar-tool" id="clearNotesButton"><i data-lucide="rotate-ccw"></i></button></div><div id="notesList"></div></div>
</div><div class="sidebar-footer"><span id="pageCount">1 page</span><span>Draft 01</span></div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn"><i data-lucide="menu"></i></button><div class="script-title">Sentient Mass</div><div class="save-state"><span class="save-dot"></span>Saved</div><button class="icon-btn" id="rightBarToggle"><i data-lucide="panel-right"></i></button></div><div class="top-right"><button class="icon-btn" id="undoScriptButton" title="Undo script change"><i data-lucide="undo-2"></i></button><button class="icon-btn" id="documentButton"><i data-lucide="ellipsis"></i></button><button class="changes-button" id="changesButton">Changes <i data-lucide="chevron-down"></i></button><button class="toggle-pill" id="changesToggle" aria-label="Track script changes"><span></span></button><div class="avatar">B</div></div></header>
<div class="document-nav"><button class="doc-tab active" data-doc-view="script">SCRIPT</button><button class="doc-tab" data-doc-view="beats">BEATS</button><button class="doc-tab" data-doc-view="outline">OUTLINE</button></div><div class="film-title-peek" id="filmTitlePeek">Sentient Mass</div><section class="workspace"><div class="editor-scroll"><div class="page-title-bar"><div class="page-title">Sentient Mass</div></div><article class="page"><div id="scriptEditor" class="script" contenteditable="true" spellcheck="false"><div class="action"><br></div></div></article></div>
<div class="context-bar" id="formatBar"><button class="format-btn" data-format="scene">SCENE</button><button class="format-btn" data-format="action">ACTION</button><button class="format-btn" data-format="character">CHARACTER</button><button class="format-btn" data-format="parenthetical">( )</button><button class="format-btn" data-format="dialogue">DIALOGUE</button><button class="format-btn" data-format="transition">TRANSITION</button><div class="format-divider"></div><button class="format-btn" id="boldButton">B</button><button class="format-btn" id="italicButton"><i>I</i></button></div>
<aside class="context-panel" id="contextPanel"><div class="panel-header"><div class="panel-title">Menu</div><button class="panel-close" id="panelClose"><i data-lucide="x"></i></button></div><div class="panel-body"><button class="menu-action" id="formatCheckButton"><i data-lucide="check-check"></i><span>Format Check</span></button><button class="menu-action" id="startChatButton"><i data-lucide="message-circle"></i><span>Start a Chat</span></button><button class="menu-action" id="darkModeButton"><i data-lucide="moon"></i><span>Dark Mode</span></button></div></aside>>
<div class="modal-backdrop" id="annotationModal"><div class="modal"><div class="modal-header"><div class="modal-title" id="annotationModalTitle">New Comment</div><button class="modal-close" id="annotationModalClose"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="field-group"><label class="field-label" for="annotationTitle">Title</label><input id="annotationTitle" class="field-input" placeholder="What is this about?"></div><div class="field-group"><label class="field-label" for="annotationBody">Note</label><textarea id="annotationBody" class="field-textarea" placeholder="Write your thought..."></textarea></div><div class="field-group"><label class="field-label" for="annotationTag">Tag</label><select id="annotationTag" class="field-select"><option>Characters</option><option>Landscapes</option><option>Story</option><option>Dialogue</option><option>Visuals</option><option>Research</option><option>General</option></select></div></div><div class="modal-footer"><button class="modal-button" id="annotationCancel">Cancel</button><button class="modal-button primary" id="annotationSave">Create</button></div></div></div>
<div class="modal-backdrop" id="elementModal"><div class="modal"><div class="modal-header"><div class="modal-title" id="elementModalTitle">New Location</div><button class="modal-close" id="elementModalClose"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="field-group"><label class="field-label" for="elementName">Name</label><input id="elementName" class="field-input" placeholder="Enter a name..."></div><div class="field-group"><label class="field-label" for="elementDescription">Description</label><textarea id="elementDescription" class="field-textarea" placeholder="Describe this element..."></textarea></div></div><div class="modal-footer"><button class="modal-button" id="elementCancel">Cancel</button><button class="modal-button primary" id="elementSave">Create</button></div></div></div>
<div class="modal-backdrop" id="stashModal"><div class="modal"><div class="modal-header"><div class="modal-title">New Stash Item</div><button class="modal-close" id="stashModalClose"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="field-group"><label class="field-label" for="stashTitle">Title</label><input id="stashTitle" class="field-input" placeholder="Idea, fragment, reference..."></div><div class="field-group"><label class="field-label" for="stashBody">Content</label><textarea id="stashBody" class="field-textarea" placeholder="Put anything here..."></textarea></div></div><div class="modal-footer"><button class="modal-button" id="stashCancel">Cancel</button><button class="modal-button primary" id="stashSave">Add to Stash</button></div></div></div>
<div class="toast" id="toast">Saved</div></section>
<footer class="statusbar"><div><span id="pageStatus">Page 1</span><span style="margin-left:14px" id="wordStatus">0 words</span></div><div class="status-right"><span>100%</span><span>Courier Prime</span><span>US Letter</span></div></footer>
</main>
<aside class="right-sidebar"><div class="right-header"><div class="right-header-title">Creative Workspace</div></div><div class="right-tabs"><button class="right-tab active" data-right-tab="elements">ELEMENTS</button><button class="right-tab" data-right-tab="stash">STASH</button></div><div class="right-content"><div id="elementsPanel"><section class="element-section"><div class="element-section-header"><div class="element-section-title">STORYLINE</div><button class="element-add" data-element-type="storyline" title="Create storyline"><i data-lucide="plus"></i></button></div><div id="storylineList"></div></section><section class="element-section"><div class="element-section-header"><div class="element-section-title">CHARACTERS</div><button class="element-add" data-element-type="character" title="Create character"><i data-lucide="plus"></i></button></div><div id="characterList"></div></section><section class="element-section"><div class="element-section-header"><div class="element-section-title">LOCATIONS</div><button class="element-add" data-element-type="location" title="Create location"><i data-lucide="plus"></i></button></div><div id="locationList"></div></section></div><div id="stashPanel" class="hidden"><div class="sidebar-toolbar"><button class="sidebar-tool" id="addStashButton"><i data-lucide="plus"></i></button><div class="sidebar-toolbar-spacer"></div><button class="sidebar-tool" id="clearStashButton"><i data-lucide="rotate-ccw"></i></button></div><div id="stashList"></div></div></div></aside>
</div>
<script>
lucide.createIcons();
const app=document.getElementById('app'),editor=document.getElementById('scriptEditor'),formatBar=document.getElementById('formatBar'),toast=document.getElementById('toast');
const STORAGE_KEY='auteur-sentient-mass-v10',COMMENTS_KEY='auteur-comments-v2',NOTES_KEY='auteur-notes-v2',ELEMENTS_KEY='auteur-elements-v3',STASH_KEY='auteur-stash-v1';
let activeBlock=null,annotationMode='comment',elementMode='character';
let comments=JSON.parse(localStorage.getItem(COMMENTS_KEY)||'[]'),notes=JSON.parse(localStorage.getItem(NOTES_KEY)||'[]'),stash=JSON.parse(localStorage.getItem(STASH_KEY)||'[]');
let elements=JSON.parse(localStorage.getItem(ELEMENTS_KEY)||localStorage.getItem('auteur-elements-v2')||JSON.stringify({storyline:[],character:[],location:[]}));
elements.storyline??=[];elements.character??=[];elements.location??=[];
const COLORS=['#7c3aed','#2563eb','#059669','#dc2626','#d97706','#db2777','#0891b2','#64748b'];
const GENDERS={male:'♂',female:'♀',nonbinary:'⚧'};
function saveElements(){localStorage.setItem(ELEMENTS_KEY,JSON.stringify(elements))}
function escapeHTML(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showMessage(m){toast.textContent=m;toast.classList.add('show');clearTimeout(window.auteurToastTimer);window.auteurToastTimer=setTimeout(()=>toast.classList.remove('show'),1200)}
function getBlockFromNode(node){if(!node)return null;if(node.nodeType===Node.TEXT_NODE)node=node.parentElement;return node?.closest('.script>div')||null}
function getCurrentBlock(){const s=window.getSelection();return s&&s.rangeCount?(getBlockFromNode(s.anchorNode)||activeBlock):activeBlock}
function placeCaretAtEnd(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);editor.focus()}
function setActiveBlock(b){if(!b)return;activeBlock=b;document.querySelectorAll('.format-btn[data-format]').forEach(x=>x.classList.toggle('active',((x.dataset.format==='scene'&&b.classList.contains('scene-heading'))||(x.dataset.format==='action'&&b.classList.contains('action'))||(x.dataset.format==='character'&&b.classList.contains('character'))||(x.dataset.format==='parenthetical'&&b.classList.contains('parenthetical'))||(x.dataset.format==='dialogue'&&b.classList.contains('dialogue'))||(x.dataset.format==='transition'&&b.classList.contains('transition')))))}
function saveDocument(show=false){localStorage.setItem(STORAGE_KEY,editor.innerHTML);document.querySelector('.save-state').innerHTML='<span class="save-dot"></span>Saved';updateStats();updateScenes();if(show)showMessage('Saved')}
function scheduleSave(){document.querySelector('.save-state').innerHTML='<span class="save-dot"></span>Saving...';clearTimeout(window.auteurSaveTimer);window.auteurSaveTimer=setTimeout(()=>saveDocument(),650)}
const saved=localStorage.getItem(STORAGE_KEY);if(saved)editor.innerHTML=saved;
function updateStats(){const words=(editor.innerText.trim().match(/\S+/g)||[]).length,pages=Math.max(1,Math.ceil(words/250));document.getElementById('wordStatus').textContent=words+' words';document.getElementById('pageStatus').textContent='Page '+pages;document.getElementById('pageCount').textContent=pages+(pages===1?' page':' pages')}
editor.addEventListener('focus',()=>setActiveBlock(getCurrentBlock()));editor.addEventListener('click',()=>setActiveBlock(getCurrentBlock()));
const FORMAT_CLASSES=['scene-heading','action','character','parenthetical','dialogue','transition','blank'];
function formatBlock(b,f){if(!b)return;const text=b.innerText.trim();b.classList.remove(...FORMAT_CLASSES);b.style.textAlign='';if(f==='scene'){b.classList.add('scene-heading');b.textContent=text.toUpperCase()}else if(f==='action'){b.classList.add('action')}else if(f==='character'){b.classList.add('character');b.textContent=text.toUpperCase()}else if(f==='parenthetical'){b.classList.add('parenthetical');if(text&&!text.startsWith('('))b.textContent='('+text+')'}else if(f==='dialogue'){b.classList.add('dialogue')}else if(f==='transition'){b.classList.add('transition');b.textContent=text.toUpperCase()}setActiveBlock(b);placeCaretAtEnd(b);scheduleSave()}
document.querySelectorAll('.format-btn[data-format]').forEach(btn=>{btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>formatBlock(activeBlock||getCurrentBlock(),btn.dataset.format))});document.getElementById('boldButton').onclick=()=>{document.execCommand('bold');editor.focus();scheduleSave()};document.getElementById('italicButton').onclick=()=>{document.execCommand('italic');editor.focus();scheduleSave()};
editor.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const b=getCurrentBlock();if(!b)return;let f='action';if(b.classList.contains('character')||b.classList.contains('parenthetical'))f='dialogue';else if(b.classList.contains('dialogue'))f='action';else if(b.classList.contains('transition'))f='scene-heading';const n=document.createElement('div');n.className=f;n.innerHTML='<br>';b.insertAdjacentElement('afterend',n);setActiveBlock(n);placeCaretAtEnd(n);scheduleSave()});editor.addEventListener('input',()=>{setActiveBlock(getCurrentBlock());scheduleSave();updateStats();updateScenes()});
function updateScenes(){const list=document.getElementById('sceneList'),heads=[...editor.querySelectorAll('.scene-heading')];list.innerHTML='';if(!heads.length){list.innerHTML='<div class="empty-state contents-empty"><div class="empty-icon"><i data-lucide="file-text"></i></div><div class="empty-title">No scenes yet</div><div class="empty-text">Format a line as SCENE to build your screenplay structure.</div></div>';lucide.createIcons();return}heads.forEach((h,i)=>{const x=document.createElement('div');x.className='scene-item'+(h===activeBlock?' active':'');x.innerHTML='<div class="scene-number">'+String(i+1).padStart(2,'0')+'</div><div><div class="scene-title">'+escapeHTML(h.innerText.trim()||'UNTITLED SCENE')+'</div><div class="scene-meta">SCENE '+(i+1)+'</div></div>';x.onclick=()=>{h.scrollIntoView({behavior:'smooth',block:'center'});setActiveBlock(h);placeCaretAtEnd(h)};list.appendChild(x)})}
function renderEmpty(type){return '<div class="empty-state"><div class="empty-icon"><i data-lucide="'+(type==='comment'?'message-square':'sticky-note')+'"></i></div><div class="empty-title">No '+(type==='comment'?'comments':'notes')+'</div><div class="empty-text">Add a '+type+' to keep your ideas close.</div></div>'}
function saveAnnotations(){localStorage.setItem(COMMENTS_KEY,JSON.stringify(comments));localStorage.setItem(NOTES_KEY,JSON.stringify(notes))}
function renderAnnotations(){const c=document.getElementById('commentsList'),n=document.getElementById('notesList');c.innerHTML=comments.length?'':renderEmpty('comment');n.innerHTML=notes.length?'':renderEmpty('note');[...comments.map(x=>[x,'comment']),...notes.map(x=>[x,'note'])].forEach(([item,type])=>{const target=type==='comment'?c:n,el=document.createElement('div');el.className='annotation';el.innerHTML='<div class="annotation-top"><div class="annotation-title">'+escapeHTML(item.title||'Untitled')+'</div><div class="annotation-tag">'+escapeHTML(item.tag||'General')+'</div></div><div class="annotation-body">'+escapeHTML(item.body||'')+'</div><div class="annotation-meta">'+(type==='comment'?'Comment':'Note')+' · '+new Date(item.created).toLocaleDateString()+'</div>';el.ondblclick=()=>{if(!confirm('Delete "'+item.title+'"?'))return;if(type==='comment')comments=comments.filter(x=>x.id!==item.id);else notes=notes.filter(x=>x.id!==item.id);saveAnnotations();renderAnnotations()};target.appendChild(el)});lucide.createIcons()}
function openAnnotation(type){annotationMode=type;document.getElementById('annotationModalTitle').textContent=type==='comment'?'New Comment':'New Note';document.getElementById('annotationTitle').value='';document.getElementById('annotationBody').value='';document.getElementById('annotationModal').classList.add('open');setTimeout(()=>document.getElementById('annotationTitle').focus(),60)}
function closeAnnotation(){document.getElementById('annotationModal').classList.remove('open')}
document.getElementById('addCommentButton').onclick=()=>openAnnotation('comment');document.getElementById('commentSettingsButton').onclick=()=>openAnnotation('comment');document.getElementById('addNoteButton').onclick=()=>openAnnotation('note');document.getElementById('noteSettingsButton').onclick=()=>openAnnotation('note');document.getElementById('annotationSave').onclick=()=>{const title=document.getElementById('annotationTitle').value.trim(),body=document.getElementById('annotationBody').value.trim(),tag=document.getElementById('annotationTag').value;if(!title&&!body)return;const a={id:Date.now().toString(),title:title||'Untitled',body,tag,created:Date.now()};(annotationMode==='comment'?comments:notes).unshift(a);saveAnnotations();renderAnnotations();closeAnnotation();showMessage('Created')};document.getElementById('annotationCancel').onclick=closeAnnotation;document.getElementById('annotationModalClose').onclick=closeAnnotation;
document.getElementById('clearCommentsButton').onclick=()=>{if(comments.length&&confirm('Delete all comments? This cannot be undone.')){comments=[];saveAnnotations();renderAnnotations();showMessage('All comments deleted')}};document.getElementById('clearNotesButton').onclick=()=>{if(notes.length&&confirm('Delete all notes? This cannot be undone.')){notes=[];saveAnnotations();renderAnnotations();showMessage('All notes deleted')}};
const elementConfig={character:{title:'New Character',icon:'user'},location:{title:'New Location',icon:'map-pin'}};
function openElementModal(type){elementMode=type;document.getElementById('elementModalTitle').textContent=elementConfig[type].title;document.getElementById('elementName').value='';document.getElementById('elementDescription').value='';document.getElementById('elementModal').classList.add('open');setTimeout(()=>document.getElementById('elementName').focus(),60)}
document.querySelectorAll('.element-add[data-element-type="character"],.element-add[data-element-type="location"]').forEach(b=>b.onclick=()=>openElementModal(b.dataset.elementType));document.getElementById('elementCancel').onclick=()=>document.getElementById('elementModal').classList.remove('open');document.getElementById('elementModalClose').onclick=()=>document.getElementById('elementModal').classList.remove('open');
document.getElementById('elementSave').onclick=()=>{const name=document.getElementById('elementName').value.trim(),description=document.getElementById('elementDescription').value.trim();if(!name)return;elements[elementMode].push({id:Date.now().toString(),name,description,gender:elementMode==='character'?'nonbinary':null,color:elementMode==='character'?COLORS[elements.character.length%COLORS.length]:null,open:true,created:Date.now()});saveElements();renderElements();document.getElementById('elementModal').classList.remove('open');showMessage('Created')};
function createStoryline(){elements.storyline.unshift({id:Date.now().toString(),name:'Untitled Storyline',synopsis:'',open:true,created:Date.now()});saveElements();renderElements();showMessage('Storyline created')}
document.querySelector('.element-add[data-element-type="storyline"]').onclick=createStoryline;
function renderStorylines(){const c=document.getElementById('storylineList');c.innerHTML='';if(!elements.storyline.length){c.innerHTML='<div class="storyline-empty">None created yet.</div>';return}elements.storyline.forEach(item=>{const card=document.createElement('div');card.className='storyline-card'+(item.open?' open':'');card.innerHTML='<div class="storyline-header"><div class="storyline-icon"><i data-lucide="git-branch"></i></div><div class="storyline-header-copy"><div class="storyline-title">'+escapeHTML(item.name||'Untitled Storyline')+'</div><div class="storyline-meta">STORYLINE</div></div><div class="storyline-chevron"><i data-lucide="chevron-down"></i></div></div><div class="storyline-body"><label class="field-label">NAME</label><input class="inline-title" value="'+escapeHTML(item.name||'Untitled Storyline')+'"><label class="field-label">SYNOPSIS</label><textarea class="card-textarea" placeholder="Write your storyline synopsis...">'+escapeHTML(item.synopsis||'')+'</textarea><div class="card-actions"><button class="card-delete" title="Delete"><i data-lucide="trash-2"></i></button></div></div>';card.dataset.id=item.id;const header=card.querySelector('.storyline-header'),name=card.querySelector('.inline-title'),syn=card.querySelector('.card-textarea');header.onclick=()=>{item.open=!item.open;saveElements();renderElements()};name.onclick=e=>e.stopPropagation();name.oninput=e=>{item.name=e.target.value||'Untitled Storyline';card.querySelector('.storyline-title').textContent=item.name;saveElements()};syn.oninput=e=>{item.synopsis=e.target.value;autoSize(e.target)};card.querySelector('.card-delete').onclick=e=>{e.stopPropagation();if(confirm('Delete "'+item.name+'"?')){elements.storyline=elements.storyline.filter(x=>x.id!==item.id);saveElements();renderElements();showMessage('Storyline deleted')}};c.appendChild(card);autoSize(syn)});lucide.createIcons()}
function autoSize(t){t.style.height='auto';t.style.height=Math.max(105,t.scrollHeight)+'px'}
function renderCharacters(){const c=document.getElementById('characterList');c.innerHTML='';if(!elements.character.length){c.innerHTML='<div class="element-empty">None created yet.</div>';return}elements.character.forEach(item=>{item.gender??='nonbinary';item.color??=COLORS[0];item.open??=false;const card=document.createElement('div');card.className='character-card'+(item.open?' open':'');card.style.setProperty('--card-color',item.color);card.innerHTML='<div class="character-header"><div class="character-icon"><span class="gender-glyph">'+GENDERS[item.gender]+'</span></div><div class="character-header-copy"><div class="character-title">'+escapeHTML(item.name)+'</div><div class="character-meta">CHARACTER</div></div><div class="character-chevron"><i data-lucide="chevron-down"></i></div></div><div class="character-body"><label class="field-label">NAME</label><input class="inline-title" value="'+escapeHTML(item.name)+'"><label class="field-label">BIO</label><textarea class="card-textarea" placeholder="Write this character bio...">'+escapeHTML(item.description||'')+'</textarea><div class="card-actions"><button class="gender-button" title="Change gender">'+GENDERS[item.gender]+'</button><button class="color-button" title="Color code"><span class="color-dot"></span></button><button class="card-delete" title="Delete"><i data-lucide="trash-2"></i></button></div><div class="gender-menu"><button class="gender-option" data-g="male">♂</button><button class="gender-option" data-g="female">♀</button><button class="gender-option" data-g="nonbinary">⚧</button></div><div class="color-palette">'+COLORS.map(col=>'<button class="palette-dot" data-color="'+col+'" style="background:'+col+'"></button>').join('')+'</div></div>';const header=card.querySelector('.character-header'),name=card.querySelector('.inline-title'),bio=card.querySelector('.card-textarea');header.onclick=()=>{item.open=!item.open;saveElements();renderCharacters()};name.onclick=e=>e.stopPropagation();name.oninput=e=>{item.name=e.target.value||'Untitled Character';card.querySelector('.character-title').textContent=item.name;saveElements()};bio.oninput=e=>{item.description=e.target.value;autoSize(e.target);saveElements()};card.querySelector('.gender-button').onclick=e=>{e.stopPropagation();card.classList.toggle('gender-open')};card.querySelectorAll('.gender-option').forEach(b=>b.onclick=e=>{e.stopPropagation();item.gender=b.dataset.g;saveElements();renderCharacters()});card.querySelector('.color-button').onclick=e=>{e.stopPropagation();card.classList.toggle('palette-open')};card.querySelectorAll('.palette-dot').forEach(b=>b.onclick=e=>{e.stopPropagation();item.color=b.dataset.color;saveElements();renderCharacters()});card.querySelector('.card-delete').onclick=e=>{e.stopPropagation();if(confirm('Delete "'+item.name+'"?')){elements.character=elements.character.filter(x=>x.id!==item.id);saveElements();renderElements();showMessage('Character deleted')}};c.appendChild(card);autoSize(bio)});lucide.createIcons()}
function renderLocations(){const c=document.getElementById('locationList');c.innerHTML='';if(!elements.location.length){c.innerHTML='<div class="element-empty">None created yet.</div>';return}elements.location.forEach(item=>{const el=document.createElement('div');el.className='element-item';el.innerHTML='<div class="element-icon"><i data-lucide="map-pin"></i></div><div class="element-copy"><div class="element-name">'+escapeHTML(item.name)+'</div>'+(item.description?'<div class="element-description">'+escapeHTML(item.description)+'</div>':'')+'</div><button class="element-delete"><i data-lucide="trash-2"></i></button>';el.querySelector('.element-delete').onclick=()=>{if(confirm('Delete "'+item.name+'"?')){elements.location=elements.location.filter(x=>x.id!==item.id);saveElements();renderLocations();showMessage('Location deleted')}};c.appendChild(el)});lucide.createIcons()}
function renderElements(){renderStorylines();renderCharacters();renderLocations();lucide.createIcons()}
const rightTabs=document.querySelectorAll('.right-tab');rightTabs.forEach(t=>t.onclick=()=>{rightTabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('elementsPanel').classList.toggle('hidden',t.dataset.rightTab!=='elements');document.getElementById('stashPanel').classList.toggle('hidden',t.dataset.rightTab!=='stash')});document.getElementById('rightBarToggle').onclick=()=>{const collapsed=app.classList.toggle('right-collapsed');document.getElementById('rightBarToggle').classList.toggle('active',!collapsed)};
function saveStash(){localStorage.setItem(STASH_KEY,JSON.stringify(stash))}function renderStash(){const l=document.getElementById('stashList');l.innerHTML='';if(!stash.length){l.innerHTML='<div class="empty-state"><div class="empty-icon"><i data-lucide="archive"></i></div><div class="empty-title">Stash is empty</div><div class="empty-text">Keep ideas and fragments here until they are ready.</div></div>';lucide.createIcons();return}stash.forEach(item=>{const e=document.createElement('div');e.className='stash-entry';e.innerHTML='<div class="stash-entry-icon"><i data-lucide="archive"></i></div><div class="stash-entry-copy"><div class="stash-entry-title">'+escapeHTML(item.title)+'</div><div class="stash-entry-body">'+escapeHTML(item.body)+'</div></div><button class="stash-delete"><i data-lucide="trash-2"></i></button>';e.querySelector('.stash-delete').onclick=()=>{stash=stash.filter(x=>x.id!==item.id);saveStash();renderStash()};l.appendChild(e)});lucide.createIcons()}
function openStash(){document.getElementById('stashTitle').value='';document.getElementById('stashBody').value='';document.getElementById('stashModal').classList.add('open')}document.getElementById('addStashButton').onclick=openStash;document.getElementById('stashSave').onclick=()=>{const title=document.getElementById('stashTitle').value.trim(),body=document.getElementById('stashBody').value.trim();if(!title&&!body)return;stash.unshift({id:Date.now().toString(),title:title||'Untitled',body,created:Date.now()});saveStash();renderStash();document.getElementById('stashModal').classList.remove('open')};document.getElementById('stashCancel').onclick=()=>document.getElementById('stashModal').classList.remove('open');document.getElementById('stashModalClose').onclick=()=>document.getElementById('stashModal').classList.remove('open');document.getElementById('clearStashButton').onclick=()=>{if(stash.length&&confirm('Delete everything in the stash?')){stash=[];saveStash();renderStash()}};
const leftTabs=document.querySelectorAll('.side-tab'),leftPanels={contents:document.getElementById('contentsPanel'),comments:document.getElementById('commentsPanel'),notes:document.getElementById('notesPanel')};leftTabs.forEach(t=>t.onclick=()=>{leftTabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');Object.values(leftPanels).forEach(p=>p.classList.add('hidden'));leftPanels[t.dataset.tab].classList.remove('hidden')});
document.getElementById('documentButton').onclick=()=>document.getElementById('contextPanel').classList.add('open');document.getElementById('panelClose').onclick=()=>document.getElementById('contextPanel').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-backdrop').forEach(x=>x.classList.remove('open'));document.getElementById('contextPanel').classList.remove('open')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveDocument(true)}});
const scriptHistory=[];let trackingChanges=false;let darkMode=false;function snapshotScript(){scriptHistory.push(editor.innerHTML);if(scriptHistory.length>80)scriptHistory.shift()}editor.addEventListener('beforeinput',()=>snapshotScript());document.getElementById('undoScriptButton').onclick=()=>{const previous=scriptHistory.pop();if(previous!==undefined){editor.innerHTML=previous;saveDocument();setTimeout(()=>{const last=editor.lastElementChild;if(last)placeCaretAtEnd(last)},0)}};document.getElementById('changesToggle').onclick=()=>{trackingChanges=!trackingChanges;document.getElementById('changesToggle').classList.toggle('on',trackingChanges);showMessage(trackingChanges?'Change tracking on':'Change tracking off')};document.getElementById('changesButton').onclick=()=>showMessage(trackingChanges?'Tracking script changes':'Change tracking is off');document.querySelectorAll('.doc-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.doc-tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');if(tab.dataset.docView==='script'){document.querySelector('.editor-scroll').style.display='block'}else{document.querySelector('.editor-scroll').style.display='block';showMessage(tab.dataset.docView==='beats'?'Beats view ready':'Outline view ready')}});document.getElementById('formatCheckButton').onclick=()=>{document.getElementById('contextPanel').classList.remove('open');showMessage('Format check complete')};document.getElementById('startChatButton').onclick=()=>{document.getElementById('contextPanel').classList.remove('open');showMessage('Chat ready')};document.getElementById('darkModeButton').onclick=()=>{darkMode=!darkMode;document.body.classList.toggle('dark-mode',darkMode);showMessage(darkMode?'Dark mode on':'Dark mode off')};updateStats();updateScenes();renderAnnotations();renderElements();renderStash();
</script>
</body>
</html>
