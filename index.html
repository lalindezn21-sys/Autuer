<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auteur</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.hero{font-size:112px;font-weight:525;letter-spacing:-5px;line-height:1.02;color:#181613;text-align:center;transform:translateY(-145px);white-space:nowrap}
.hero .top,.hero .bottom{display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:.035em .22em .065em;border-radius:999px;background:rgba(24,22,19,.18);color:#fff;min-width:2.75em;will-change:transform,background-color,opacity}
</style>
</head>
<body>
<div class="hero">
  <span class="top">Where idealists and</span>
  <span class="bottom"><span class="pill" id="animatedWord">create</span> with auteur.</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const word = document.getElementById('animatedWord');
const words = [
  {text:'create', color:'#7C3AED'},
  {text:'scale', color:'#2563EB'},
  {text:'jam', color:'#F97316'}
];
let index = 0;
word.textContent = words[0].text;
word.style.backgroundColor = words[0].color;

function cycleWord(){
  const next = words[index = (index + 1) % words.length];
  const tl = gsap.timeline();

  tl.to(word, {
    duration:.45,
    opacity:0,
    scale:.97,
    ease:'power1.inOut'
  })
  .call(() => {
    word.textContent = next.text;
  })
  .to(word, {
    duration:.75,
    opacity:1,
    scale:1,
    backgroundColor:next.color,
    ease:'power1.inOut'
  });
}

gsap.delayedCall(3, function repeat(){
  cycleWord();
  gsap.delayedCall(3, repeat);
});
</script>
</body>
</html>
