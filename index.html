<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Screenwriter</title>

  <style>
    :root {
      /* 60% Neutral */
      --neutral-white: #ffffff;
      --neutral-light: #f4f7fa;
      --neutral-gray: #dfe5eb;

      /* 30% Structural / Brand */
      --blue-primary: #1769aa;
      --blue-deep: #0d3b66;
      --blue-dark: #092a47;
      --blue-gray: #536b80;

      /* 10% High-Contrast Accents */
      --accent-cyan: #00b8d9;
      --accent-orange: #ff8a00;
      --accent-yellow: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--neutral-white);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Structural header */
    .header {
      height: 64px;
      width: 100%;
      background: var(--blue-deep);
      border-bottom: 3px solid var(--blue-primary);
    }

    /* Main neutral workspace */
    .workspace {
      flex: 1;
      width: 100%;
      background: var(--neutral-white);
      position: relative;
    }

    /* Small structural accent */
    .accent-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent-cyan);
    }

    /* Bottom structural area */
    .footer {
      height: 32px;
      width: 100%;
      background: var(--neutral-light);
      border-top: 1px solid var(--neutral-gray);
    }
  </style>
</head>

<body>

  <header class="header"></header>

  <main class="workspace">
    <div class="accent-line"></div>
  </main>

  <footer class="footer"></footer>

</body>
</html>
