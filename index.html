<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTEUR — Film Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@500;600&display=swap');
:root{--black:#080808;--white:#f4f3ed;--lime:#d8ff32;--gray:#a1a19a;--line:#292a27;--red:#ff3148}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--white);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;background:var(--black)}
.nav{position:fixed;z-index:20;top:0;left:0;right:0;height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14;background:linear-gradient(#080808ee,#08080800);backdrop-filter:blur(8px)}.logo{font-size:18px;font-weight:900;letter-spacing:-.06em}.logo i{font-style:normal;color:var(--lime)}.navlinks{display:flex;gap:28px;font:10px 'DM Mono',monospace;text-transform:uppercase}.navlinks a{opacity:.65;transition:.2s}.navlinks a:hover{opacity:1;color:var(--lime)}.nav-action{border:1px solid #ffffff44;background:#ffffff0a;color:#fff;padding:10px 15px;font:9px 'DM Mono',monospace;text-transform:uppercase}.nav-action:hover{background:var(--lime);border-color:var(--lime);color:#080808}
.hero{height:100vh;min-height:680px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:0 5vw 6vh;background:radial-gradient(circle at 78% 42%,#26320d 0,#101309 18%,transparent 43%),linear-gradient(120deg,#080808 0%,#10110d 55%,#080808 100%)}.hero:before{content:'AUTEUR';position:absolute;right:-4vw;top:14vh;font-size:clamp(130px,24vw,390px);line-height:.75;font-weight:900;letter-spacing:-.12em;color:#ffffff05;white-space:nowrap;transform:rotate(-4deg)}.hero-grid{position:absolute;inset:72px 5vw 0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}.hero-grid div{border-left:1px solid #ffffff08}.hero-content{position:relative;z-index:2;max-width:1100px}.kicker{font:10px 'DM Mono',monospace;color:var(--lime);letter-spacing:.16em;text-transform:uppercase;margin-bottom:25px}.hero h1{margin:0;font-size:clamp(90px,17vw,260px);line-height:.72;letter-spacing:-.11em;font-weight:900;text-transform:uppercase}.hero h1 span{display:block;color:var(--lime);margin-left:8vw}.hero-meta{margin-top:45px;display:flex;justify-content:space-between;align-items:end;gap:40px;max-width:850px}.hero-copy{max-width:420px;color:#aaa;font-size:13px;line-height:1.7}.scroll{font:9px 'DM Mono',monospace;color:#777;text-transform:uppercase;writing-mode:vertical-rl}.scroll b{color:var(--lime)}
.section{padding:120px 5vw;border-top:1px solid var(--line);position:relative}.section-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:65px}.section-index{font:10px 'DM Mono',monospace;color:var(--lime)}.section h2{font-size:clamp(64px,10vw,150px);line-height:.78;letter-spacing:-.09em;margin:0;font-weight:900;text-transform:uppercase}.section h2 span{display:block;color:#555}.section-note{max-width:260px;color:#777;font-size:11px;line-height:1.7}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}.project{min-height:420px;background:#0c0c0b;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:.35s}.project:hover{background:#12130f}.project:after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;right:-110px;bottom:-120px;background:var(--lime);opacity:.035;filter:blur(20px);transition:.35s}.project:hover:after{opacity:.12}.project-top{display:flex;justify-content:space-between;font:9px 'DM Mono',monospace;color:#6c6c66}.project-title{font:500 clamp(42px,6vw,90px)/.82 'Playfair Display',Georgia,serif;letter-spacing:-.06em;max-width:800px;position:relative;z-index:1}.project-bottom{display:flex;justify-content:space-between;align-items:end;font:9px 'DM Mono',monospace;color:#777}.project-bottom b{color:var(--lime);font-weight:500}.open{font-size:16px;color:#fff}
.empty{padding:80px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:30px;align-items:center}.empty h3{font-size:clamp(35px,5vw,70px);line-height:.85;letter-spacing:-.07em;margin:0;text-transform:uppercase}.empty p{color:#777;font-size:11px;line-height:1.6;margin:12px 0 0}.lime-btn{background:var(--lime);color:#080808;border:0;padding:14px 18px;font:800 9px 'DM Mono',monospace;text-transform:uppercase}.lime-btn:hover{transform:translateY(-2px)}
.manifesto{min-height:75vh;display:flex;align-items:center}.manifesto-inner{max-width:1250px}.manifesto p{font:500 clamp(38px,6.8vw,105px)/.9 'Playfair Display',Georgia,serif;letter-spacing:-.055em;margin:0}.manifesto p em{font-style:normal;color:var(--lime)}
.footer{padding:55px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#666;font:9px 'DM Mono',monospace;text-transform:uppercase}.footer strong{color:#fff}
.editor{min-height:100vh;padding-top:72px;background:#d3d3ce;color:#111;display:grid;grid-template-columns:230px 1fr}.editor-side{background:#090909;color:#fff;padding:30px 20px}.editor-side button{display:block;width:100%;border:0;background:none;color:#777;text-align:left;padding:11px 8px;font:10px 'DM Mono',monospace}.editor-side button:hover,.editor-side button.active{background:#181818;color:#fff}.editor-side button.active:before{content:'•';color:var(--lime);margin-right:8px}.editor-project{font:500 29px/1 'Playfair Display',serif;margin:15px 8px 30px}.paper-wrap{padding:40px 20px 80px;overflow:auto}.paper{max-width:820px;min-height:1000px;margin:auto;background:#fff;padding:85px 90px;box-shadow:0 20px 70px #0002}.script-title{display:block;width:100%;border:0;background:none;text-align:center;font:700 12px 'DM Mono',monospace;text-transform:uppercase;outline:0;margin-bottom:50px}.script{width:100%;min-height:900px;border:0;outline:0;resize:none;background:none;color:#111;font:12px/1.8 'DM Mono',monospace}.back{margin-bottom:20px!important;color:#999!important}.back:hover{color:#fff!important}
.modal{position:fixed;z-index:50;inset:0;background:#000c;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(500px,100%);background:#111;color:#fff;border:1px solid #333;padding:32px}.dialog small{font:9px 'DM Mono',monospace;color:var(--lime)}.dialog h3{font:500 52px/.85 'Playfair Display',serif;margin:15px 0 28px}.dialog h3 span{color:var(--lime)}.dialog input{width:100%;background:#080808;color:#fff;border:1px solid #444;padding:15px;outline:0}.dialog input:focus{border-color:var(--lime)}.dialog-actions{display:flex;justify-content:end;gap:8px;margin-top:12px}.cancel{background:#222;color:#aaa;border:0;padding:11px 15px;font:9px 'DM Mono',monospace}.toast{position:fixed;z-index:100;right:22px;bottom:22px;background:var(--lime);color:#080808;padding:12px 16px;font:800 9px 'DM Mono',monospace;transform:translateY(20px);opacity:0;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:800px){.nav{padding:0 18px}.navlinks{display:none}.nav-action{padding:9px}.hero{padding:0 20px 40px}.hero-grid{inset-left:20px;inset-right:20px}.hero h1{font-size:25vw}.hero h1 span{margin-left:10vw}.hero-meta{display:block}.scroll{display:none}.section{padding:80px 20px}.section-head{display:block;margin-bottom:40px}.section-note{margin-top:25px}.projects{grid-template-columns:1fr}.project{min-height:330px}.empty{display:block}.empty .lime-btn{margin-top:25px}.manifesto{min-height:65vh}.footer{padding:40px 20px;display:block}.footer span{display:block;margin-top:10px}.editor{grid-template-columns:1fr}.editor-side{display:none}.paper-wrap{padding:12px 8px 50px}.paper{padding:55px 28px;min-height:900px}.script{font-size:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="dialog"><small>NEW PROJECT</small><h3>Start with <span>the title.</span></h3><input id="titleInput" placeholder="Project title" autocomplete="off"><div class="dialog-actions"><button class="cancel" id="cancel">CANCEL</button><button class="lime-btn" id="create">CREATE PROJECT</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='auteur.projects.simple';let projects=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null;const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(projects))}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function modal(open){$('#modal').classList.toggle('show',open);if(open)setTimeout(()=>$('#titleInput').focus(),40);else $('#titleInput').value=''}function shell(){return `<header class="nav"><a class="logo" href="#top">AUTEUR<i>.</i></a><nav class="navlinks"><a href="#work">Work</a><a href="#manifesto">Method</a><a href="#footer">Studio</a></nav><button class="nav-action" onclick="modal(true)">+ New project</button></header>`}function home(){current=null;document.body.innerHTML=shell()+`<main><section class="hero" id="top"><div class="hero-grid"><div><div></div></div></div><div class="hero-content"><div class="kicker">Private film studio / 2026</div><h1>Make the<span>film.</span></h1><div class="hero-meta"><p class="hero-copy">AUTEUR is a private space for developing films from the first spark to the final page. Start with the title. Find the movie inside it. Then write.</p><div class="scroll">scroll / <b>01</b></div></div></div></section><section class="section" id="work"><div class="section-head"><div><div class="section-index">01 / PROJECTS</div><h2>The<br><span>work.</span></h2></div><p class="section-note">Every project lives here. Nothing preloaded. Nothing pretending to be finished. Just the films you actually make.</p></div>${projects.length?`<div class="projects">${projects.map((p,i)=>`<article class="project" onclick="openProject('${p.id}')"><div class="project-top"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(p.status||'DEVELOPMENT')}</span></div><div class="project-title">${esc(p.title)}</div><div class="project-bottom"><span><b>${p.screenplay?Math.ceil(p.screenplay.length/1800):0}</b> pages</span><span class="open">↗</span></div></article>`).join('')}</div>`:`<div class="empty"><div><h3>No film<br>yet.</h3><p>Your workspace is empty. That's fine. Start with a title.</p></div><button class="lime-btn" onclick="modal(true)">Create your first project</button></div>`}</section><section class="section manifesto" id="manifesto"><div class="manifesto-inner"><div class="section-index">02 / METHOD</div><p>Don't start with a plot.<br><em>Start with the feeling.</em><br>Then build the movie.</p></div></section><footer class="footer" id="footer"><strong>AUTEUR.</strong><span>PRIVATE FILM WORKSPACE / LOCAL DATA</span><span>© 2026</span></footer></main>`}function openProject(id){current=id;const p=projects.find(x=>x.id===id);if(!p)return;document.body.innerHTML=shell()+`<main class="editor"><aside class="editor-side"><button class="back" onclick="home()">← BACK TO WORK</button><div class="editor-project">${esc(p.title)}</div><button class="active">Screenplay</button><button onclick="toast('Development is next')">Development</button><button onclick="toast('Characters is next')">Characters</button><button onclick="toast('Research is next')">Research</button></aside><section class="paper-wrap"><div class="paper"><input class="script-title" id="scriptTitle" value="${esc(p.title)}"><textarea class="script" id="script" placeholder="FADE IN:\n\nStart writing."></textarea></div></section></main>`;$('#script').value=p.screenplay||'';$('#script').oninput=e=>{p.screenplay=e.target.value;p.updated=Date.now();save()};$('#scriptTitle').oninput=e=>{p.title=e.target.value||'Untitled';save()}}$('#create').onclick=()=>{const t=$('#titleInput').value.trim();if(!t)return;const p={id:crypto.randomUUID(),title:t,status:'DEVELOPMENT',screenplay:'',created:Date.now(),updated:Date.now()};projects.unshift(p);save();modal(false);openProject(p.id);toast('PROJECT CREATED')};$('#cancel').onclick=()=>modal(false);document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();modal(true)}if(e.key==='Escape')modal(false)});home();
</script>
</body>
</html>
