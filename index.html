<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auteur</title>
<style>
:root{--accent:#7357d9;--accent-2:#6047c5;--accent-soft:#f1effb;--bg:#fff;--panel:#f7f7f9;--line:#e5e5e8;--text:#17181b;--muted:#777a82;--danger:#c94c5c;--shadow:0 14px 45px #17181b12}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column}.top{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:7px}.brand{font-weight:800;font-size:16px;letter-spacing:-.3px;margin:0 8px}.brand small{font-size:10px;color:var(--muted);font-weight:600;margin-left:5px}.top-spacer{flex:1}.save-state{font-size:12px;color:var(--muted);margin-right:5px}.top-btn,.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:17px}.top-btn:hover,.icon-btn:hover{background:#f0f0f2}.primary{height:34px;padding:0 13px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700}.primary:hover{background:var(--accent-2)}
.body{display:flex;min-height:0;flex:1}.sidebar{width:260px;flex:none;background:#fafafa;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:13px 9px}.workspace{display:flex;align-items:center;gap:9px;padding:8px 10px 18px;font-weight:750}.avatar{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:12px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#999ca3;font-weight:750;padding:10px 11px 5px}.nav-item{width:100%;height:39px;border-radius:8px;padding:0 11px;display:flex;align-items:center;gap:10px;text-align:left;color:#45474d;font-size:14px;font-weight:600}.nav-item:hover{background:#f0f0f2}.nav-item.active{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 0 0 1px #ded8f6}.nav-icon{width:18px;text-align:center;color:#777b83}.nav-item.active .nav-icon{color:var(--accent)}.side-bottom{margin-top:auto;padding:9px 4px}.side-project{font-size:12px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.view{min-height:0;flex:1;overflow:auto}.view-inner{max-width:1200px;margin:0 auto;padding:32px 42px 70px}.view-title{font-size:27px;font-weight:780;letter-spacing:-.7px;margin-bottom:5px}.view-sub{font-size:14px;color:var(--muted);margin-bottom:26px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:18px}.search{height:40px;display:flex;align-items:center;gap:8px;background:#f4f4f6;border:1px solid #ededf0;border-radius:8px;padding:0 12px;flex:1;max-width:500px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}.select{height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;color:#555}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;min-height:126px;padding:16px;transition:.15s;cursor:pointer}.card:hover{border-color:#c9c3e9;box-shadow:0 6px 24px #17181b0b;transform:translateY(-1px)}.card-kicker{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}.card-title{font-size:16px;font-weight:720;margin-bottom:7px}.card-text{font-size:12px;line-height:1.5;color:var(--muted)}.empty-card{border:1px dashed #d8d9de;border-radius:10px;padding:26px;color:var(--muted);text-align:center}.empty-card button{color:var(--accent);font-weight:700;margin-top:9px}
.project-head{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px;flex:none}.back{font-size:20px;color:#65686f}.project-title{font-weight:760;font-size:17px}.project-type{font-size:11px;color:var(--muted);padding:4px 7px;border:1px solid var(--line);border-radius:5px}.project-tabs{display:flex;gap:20px;margin-left:auto}.project-tab{font-size:13px;color:#777a82;height:66px;display:flex;align-items:center;border-bottom:2px solid transparent}.project-tab.active{color:var(--text);border-color:var(--accent);font-weight:700}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:18px}.panel{border:1px solid var(--line);border-radius:10px;background:#fff;padding:20px}.panel h3{margin:0 0 14px;font-size:14px}.field-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a8d95;font-weight:750;margin:15px 0 7px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:#fff;color:var(--text);outline:0}.textarea{resize:vertical;min-height:115px;line-height:1.5}.input:focus,.textarea:focus{border-color:#b9b0e7;box-shadow:0 0 0 3px #7357d911}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border-radius:8px;background:#f7f7f9}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-head h2{font-size:18px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.small-btn{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:700}.small-btn:hover{background:#f6f6f8}.small-btn.primary-lite{border-color:#ddd8f4;background:var(--accent-soft);color:var(--accent-2)}.list{display:flex;flex-direction:column;gap:8px}.list-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:13px 14px;min-height:62px}.list-row:hover{border-color:#cfc9eb}.row-icon{width:30px;height:30px;border-radius:7px;background:#f1effb;color:var(--accent);display:grid;place-items:center;font-size:13px}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:700}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}.row-actions{display:flex;gap:3px}.row-actions button{width:29px;height:29px;border-radius:6px;color:#777}.row-actions button:hover{background:#f1f1f3}.danger:hover{color:var(--danger)!important;background:#fff0f2!important}
.character-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}.character{border:1px solid var(--line);border-radius:9px;padding:15px;display:flex;gap:12px;cursor:pointer}.character:hover{border-color:#cfc9eb}.char-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}.char-info{min-width:0}.char-name{font-weight:720}.char-meta{font-size:11px;color:var(--muted);margin-top:3px}.char-bio{font-size:12px;color:#60636a;line-height:1.45;margin-top:8px}
.script-wrap{height:100%;display:flex;min-height:0}.script-side{width:225px;border-right:1px solid var(--line);background:#fafafa;padding:13px;overflow:auto}.scene-label{font-size:10px;text-transform:uppercase;color:#9699a0;font-weight:750;letter-spacing:.08em;padding:7px}.scene{padding:9px 10px;border-radius:7px;font-size:12px;color:#5e6168;cursor:pointer;display:flex;gap:7px}.scene:hover{background:#f0f0f2}.scene.active{background:var(--accent-soft);color:var(--accent-2);font-weight:700}.script-main{flex:1;min-width:0;display:flex;flex-direction:column}.script-toolbar{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 12px;flex:none}.format-btn{height:29px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;color:#686b72}.format-btn:hover,.format-btn.active{background:#f0eff4;color:var(--accent-2)}.script-status{margin-left:auto;font-size:11px;color:var(--muted)}.page{width:min(820px,calc(100% - 80px));margin:34px auto 80px}.screen-title{font-family:Georgia,serif;text-align:center;font-size:22px;font-weight:700;margin-bottom:35px}.script-editor{min-height:700px;outline:0;font-family:"Courier New",monospace;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;padding-bottom:80px}.script-editor:empty:before{content:attr(data-placeholder);color:#b0b2b7}.script-editor:focus{outline:0}.format-hint{font-size:10px;color:#aaa;text-align:center;margin-top:12px}
.modal-bg{display:none;position:fixed;inset:0;background:#17181b55;align-items:center;justify-content:center;z-index:50}.modal-bg.open{display:flex}.modal{width:min(460px,calc(100% - 28px));background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:22px}.modal h2{font-size:19px;margin:0 0 4px}.modal p{font-size:12px;color:var(--muted);margin:0 0 17px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{height:34px;padding:0 12px;border-radius:7px;font-weight:700}.modal-cancel{border:1px solid var(--line)}.modal-confirm{background:var(--accent);color:#fff}.color-row{display:flex;gap:8px}.color-choice{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}.color-choice.active{box-shadow:0 0 0 2px var(--accent)}.toast{position:fixed;right:18px;bottom:18px;background:#24252a;color:#fff;padding:9px 13px;border-radius:7px;font-size:12px;z-index:100;opacity:0;transform:translateY(6px);transition:.18s}.toast.show{opacity:1;transform:none}
@media(max-width:800px){.sidebar{width:210px}.view-inner{padding:26px 20px}.overview-grid{grid-template-columns:1fr}.project-tabs{gap:10px}.project-tab{font-size:11px}.page{width:calc(100% - 30px)}.script-side{width:180px}}@media(max-width:580px){.sidebar{display:none}.project-head{padding:0 14px}.project-tabs{display:none}.page{margin-top:20px}.script-side{display:none}.meta-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="top-btn" id="homeBtn" title="Dashboard">⌂</button><div class="brand">Autuer <small>FILMMAKING WORKSPACE</small></div><div class="top-spacer"></div><span class="save-state" id="saveState">Ready</span><button class="top-btn" id="refreshBtn" title="Refresh">↻</button><button class="primary" id="globalCreate">＋ Create</button>
</header>
<div class="body">
<aside class="sidebar">
<div class="workspace"><span class="avatar">A</span><span>Autuer</span></div>
<div class="nav-label">Workspace</div>
<button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
<button class="nav-item" data-view="projects"><span class="nav-icon">▦</span>Projects</button>
<button class="nav-item" data-view="scripts"><span class="nav-icon">▤</span>Screenplays</button>
<div class="nav-label">Development</div>
<button class="nav-item" data-view="story"><span class="nav-icon">◈</span>Storylines</button>
<button class="nav-item" data-view="characters"><span class="nav-icon">◎</span>Characters</button>
<div class="side-bottom"><div class="side-project" id="sideProject">No project open</div></div>
</aside>
<main class="main" id="main"></main>
</div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='autuer-studio-v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>crypto.randomUUID();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const base=()=>({projects:[],scripts:[],storylines:[],characters:[],activeProject:null});
let data=JSON.parse(localStorage.getItem(KEY)||'null')||base();
let state={view:'dashboard',project:null,tab:'overview'};
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#saveState').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#saveState').textContent='Ready',1300)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}
function activeProject(){return data.projects.find(p=>p.id===state.project)||null}
function openModal(html,bind){$('#modal').innerHTML=html;$('#modalBg').classList.add('open');bind&&bind()}
function closeModal(){$('#modalBg').classList.remove('open')}
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
function nav(view){state.view=view;state.project=null;state.tab='overview';render();}
$$('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));
$('#homeBtn').onclick=()=>nav('dashboard');$('#refreshBtn').onclick=()=>{render();toast('Workspace refreshed')};
$('#globalCreate').onclick=()=>openCreateProject();
function openCreateProject(){openModal(`<h2>New Project</h2><p>Start a film project. You can build the story, characters, and screenplay from here.</p><label class="field-label">Project title</label><input class="input" id="mTitle" placeholder="Untitled Film" autofocus><label class="field-label">Logline</label><textarea class="textarea" id="mLogline" placeholder="One sentence that captures the film."></textarea><div class="modal-actions"><button class="modal-cancel" id="mCancel">Cancel</button><button class="modal-confirm" id="mConfirm">Create Project</button></div>`,()=>{$('#mCancel').onclick=closeModal;$('#mConfirm').onclick=()=>{const title=$('#mTitle').value.trim()||'Untitled Film';const p={id:uid(),title,logline:$('#mLogline').value.trim(),synopsis:'',genre:'',runtime:'',created:now(),updated:now()};data.projects.push(p);data.activeProject=p.id;save();closeModal();openProject(p.id);toast('Project created')}})}
function projectCard(p){return `<div class="card" data-open="${p.id}"><div class="card-kicker">Film Project</div><div class="card-title">${esc(p.title)}</div><div class="card-text">${esc(p.logline||'No logline yet.')}</div></div>`}
function render(){const p=activeProject();$('#sideProject').textContent=p?p.title:'No project open';$$('[data-view]').forEach(b=>b.classList.toggle('active',!state.project&&b.dataset.view===state.view));if(state.project&&p){renderProject(p);return}if(state.view==='dashboard')renderDashboard();if(state.view==='projects')renderProjects();if(state.view==='scripts')renderScripts();if(state.view==='story')renderStorylines();if(state.view==='characters')renderCharacters();bindGlobal()}
function renderDashboard(){const recent=[...data.projects].sort((a,b)=>b.updated-a.updated).slice(0,4);$('#main').innerHTML=`<div class="view"><div class="view-inner"><div class="view-title">Dashboard</div><div class="view-sub">Your filmmaking workspace. Ideas become structure, structure becomes scenes.</div><div class="toolbar"><div class="search"><span>⌕</span><input id="dashSearch" placeholder="Search projects, scripts, characters..."></div><button class="small-btn primary-lite" id="dashCreate">＋ New Project</button></div><div class="section-head"><div><h2>Projects</h2><p>${data.projects.length} project${data.projects.length===1?'':'s'} in your workspace</p></div></div><div class="cards" id="dashCards">${recent.length?recent.map(projectCard).join(''):`<div class="empty-card">No films yet.<br><button id="emptyCreate">Create your first project</button></div>`}</div></div></div>`;$('#dashCreate').onclick=openCreateProject;$('#emptyCreate')?.addEventListener('click',openCreateProject);$('#dashSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#dashCards').innerHTML=data.projects.filter(p=>(p.title+' '+p.logline).toLowerCase().includes(q)).map(projectCard).join('')||'<div class="empty-card">Nothing found.</div>';bindOpenCards()};bindOpenCards()}
function bindOpenCards(){$$('[data-open]').forEach(c=>c.onclick=()=>openProject(c.dataset.open))}
function renderProjects(){$('#main').innerHTML=`<div class="view"><div class="view-inner"><div class="view-title">Projects</div><div class="view-sub">Every film, contained in one place.</div><div class="toolbar"><div class="search"><span>⌕</span><input id="projectSearch" placeholder="Search projects..."></div><button class="small-btn primary-lite" id="projectCreate">＋ New Project</button></div><div class="cards" id="projectCards">${data.projects.map(projectCard).join('')||'<div class="empty-card">No projects yet.<br><button id="pEmpty">Create a project</button></div>'}</div></div></div>`;$('#projectCreate').onclick=openCreateProject;$('#pEmpty')?.addEventListener('click',openCreateProject);$('#projectSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#projectCards').innerHTML=data.projects.filter(p=>p.title.toLowerCase().includes(q)).map(projectCard).join('')||'<div class="empty-card">Nothing found.</div>';bindOpenCards()};bindOpenCards()}
function renderScripts(){$('#main').innerHTML=`<div class="view"><div class="view-inner"><div class="view-title">Screenplays</div><div class="view-sub">Drafts connected to your film projects.</div><div class="list">${data.projects.map(p=>`<div class="list-row"><div class="row-icon">▤</div><div class="row-main"><div class="row-title">${esc(p.title)}</div><div class="row-sub">Screenplay draft · ${new Date(p.updated).toLocaleDateString()}</div></div><div class="row-actions"><button data-script="${p.id}">Open</button></div></div>`).join('')||'<div class="empty-card">Create a project to start a screenplay.</div>'}</div></div></div>`;$$('[data-script]').forEach(b=>b.onclick=()=>openProject(b.dataset.script,'screenplay'))}
function renderStorylines(){const rows=data.storylines.filter(x=>!state.project||x.projectId===state.project);$('#main').innerHTML=`<div class="view"><div class="view-inner"><div class="section-head"><div><div class="view-title">Storylines</div><div class="view-sub">Parallel threads, arcs, conflicts, and ideas.</div></div><button class="small-btn primary-lite" id="newStory">＋ Storyline</button></div><div class="list">${rows.map(x=>`<div class="list-row"><div class="row-icon">◈</div><div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-sub">${esc(x.projectTitle||'Unassigned')}</div><div class="row-sub">${esc(x.synopsis||'No synopsis yet.')}</div></div><div class="row-actions"><button class="danger" data-del-story="${x.id}">×</button></div></div>`).join('')||'<div class="empty-card">No storylines yet.</div>'}</div></div></div>`;$('#newStory').onclick=()=>openStoryModal();$$('[data-del-story]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(x=>x.id!==b.dataset.delStory);save();render();toast('Storyline deleted')})}
function openStoryModal(id=null){const x=id?data.storylines.find(a=>a.id===id):null;openModal(`<h2>${x?'Edit':'New'} Storyline</h2><p>Keep the title and synopsis together. The card expands into the actual writing space in the project.</p><label class="field-label">Title</label><input class="input" id="mTitle" value="${esc(x?.title||'Untitled Storyline')}" autofocus><label class="field-label">Synopsis</label><textarea class="textarea" id="mSynopsis" placeholder="What is this storyline about?">${esc(x?.synopsis||'')}</textarea><label class="field-label">Project</label><select class="input" id="mProject"><option value="">Unassigned</option>${data.projects.map(p=>`<option value="${p.id}" ${p.id===(x?.projectId||state.project)?'selected':''}>${esc(p.title)}</option>`).join('')}</select><div class="modal-actions"><button class="modal-cancel" id="mCancel">Cancel</button><button class="modal-confirm" id="mConfirm">Save Storyline</button></div>`,()=>{$('#mCancel').onclick=closeModal;$('#mConfirm').onclick=()=>{const title=$('#mTitle').value.trim()||'Untitled Storyline';const pid=$('#mProject').value;const p=data.projects.find(a=>a.id===pid);if(x){Object.assign(x,{title,synopsis:$('#mSynopsis').value.trim(),projectId:pid,projectTitle:p?.title||''})}else data.storylines.push({id:uid(),title,synopsis:$('#mSynopsis').value.trim(),projectId:pid,projectTitle:p?.title||''});save();closeModal();render();toast('Storyline saved')}})}
function renderCharacters(){const rows=data.characters.filter(x=>!state.project||x.projectId===state.project);$('#main').innerHTML=`<div class="view"><div class="view-inner"><div class="section-head"><div><div class="view-title">Characters</div><div class="view-sub">People first. Plot second. Humanity, inconveniently, remains important.</div></div><button class="small-btn primary-lite" id="newChar">＋ Character</button></div><div class="character-grid">${rows.map(x=>`<div class="character" data-edit-char="${x.id}"><span class="char-dot" style="background:${x.color}"></span><div class="char-info"><div class="char-name">${esc(x.name)}</div><div class="char-meta">${esc(x.gender||'Gender not set')} · ${esc(x.projectTitle||'Unassigned')}</div><div class="char-bio">${esc(x.bio||'No bio yet.')}</div></div></div>`).join('')||'<div class="empty-card">No characters yet.</div>'}</div></div></div>`;$('#newChar').onclick=()=>openCharacterModal();$$('[data-edit-char]').forEach(b=>b.onclick=()=>openCharacterModal(b.dataset.editChar))}
function openCharacterModal(id=null){const x=id?data.characters.find(a=>a.id===id):null;const colors=['#7357d9','#3d79d8','#3f9a70','#d98a35','#c4546a','#777b83'];openModal(`<h2>${x?'Edit':'New'} Character</h2><p>Characters use the same card system as storylines, with a quick gender selector and color identity.</p><label class="field-label">Name</label><input class="input" id="mName" value="${esc(x?.name||'Untitled Character')}" autofocus><label class="field-label">Gender</label><select class="input" id="mGender"><option value="">Select</option><option ${x?.gender==='Female'?'selected':''}>Female</option><option ${x?.gender==='Male'?'selected':''}>Male</option><option ${x?.gender==='Non-binary'?'selected':''}>Non-binary</option><option ${x?.gender==='Other'?'selected':''}>Other</option></select><label class="field-label">Bio</label><textarea class="textarea" id="mBio" placeholder="Who are they? What do they want?">${esc(x?.bio||'')}</textarea><label class="field-label">Project</label><select class="input" id="mProject"><option value="">Unassigned</option>${data.projects.map(p=>`<option value="${p.id}" ${p.id===(x?.projectId||state.project)?'selected':''}>${esc(p.title)}</option>`).join('')}</select><label class="field-label">Color</label><div class="color-row">${colors.map(c=>`<button class="color-choice ${(x?.color||colors[0])===c?'active':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><div class="modal-actions"><button class="modal-cancel" id="mCancel">Cancel</button>${x?'<button class="modal-cancel danger" id="mDelete">Delete</button>':''}<button class="modal-confirm" id="mConfirm">Save Character</button></div>`,()=>{let color=x?.color||colors[0];$$('[data-color]').forEach(b=>b.onclick=()=>{$$('[data-color]').forEach(q=>q.classList.remove('active'));b.classList.add('active');color=b.dataset.color});$('#mCancel').onclick=closeModal;$('#mDelete')?.addEventListener('click',()=>{data.characters=data.characters.filter(a=>a.id!==id);save();closeModal();render();toast('Character deleted')});$('#mConfirm').onclick=()=>{const name=$('#mName').value.trim()||'Untitled Character';const pid=$('#mProject').value;const p=data.projects.find(a=>a.id===pid);if(x)Object.assign(x,{name,gender:$('#mGender').value,bio:$('#mBio').value.trim(),projectId:pid,projectTitle:p?.title||'',color});else data.characters.push({id:uid(),name,gender:$('#mGender').value,bio:$('#mBio').value.trim(),projectId:pid,projectTitle:p?.title||'',color});save();closeModal();render();toast('Character saved')}})}
function openProject(id,tab='overview'){state.project=id;state.tab=tab;data.activeProject=id;save();render()}
function projectTabs(p){return `<div class="project-head"><button class="back" id="backProject">‹</button><div class="project-title">${esc(p.title)}</div><span class="project-type">FILM</span><div class="project-tabs">${[['overview','Overview'],['story','Story'],['characters','Characters'],['screenplay','Screenplay']].map(([a,b])=>`<button class="project-tab ${state.tab===a?'active':''}" data-ptab="${a}">${b}</button>`).join('')}</div></div>`}
function renderProject(p){$('#main').innerHTML=projectTabs(p)+(state.tab==='screenplay'?screenplayView(p):`<div class="view"><div class="view-inner">${state.tab==='overview'?overviewView(p):state.tab==='story'?storyProjectView(p):characterProjectView(p)}</div></div>`);$('#backProject').onclick=()=>{state.project=null;state.view='projects';render()};$$('[data-ptab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.ptab;render()});if(state.tab==='overview')bindOverview(p);if(state.tab==='story')bindStoryProject(p);if(state.tab==='characters')bindCharacterProject(p);if(state.tab==='screenplay')bindScreenplay(p)}
function overviewView(p){const sl=data.storylines.filter(x=>x.projectId===p.id).length,ch=data.characters.filter(x=>x.projectId===p.id).length;return `<div class="view-title">${esc(p.title)}</div><div class="view-sub">Project overview</div><div class="overview-grid"><div class="panel"><h3>Film Overview</h3><label class="field-label">Logline</label><textarea class="textarea" id="pLogline">${esc(p.logline)}</textarea><label class="field-label">Synopsis</label><textarea class="textarea" id="pSynopsis" placeholder="Write the full synopsis here...">${esc(p.synopsis)}</textarea><div class="meta-grid"><div><label class="field-label">Genre</label><input class="input" id="pGenre" value="${esc(p.genre)}" placeholder="Psychological thriller"></div><div><label class="field-label">Runtime</label><input class="input" id="pRuntime" value="${esc(p.runtime)}" placeholder="2h 15m"></div></div></div><div class="panel"><h3>Development</h3><div class="meta-grid"><div class="stat"><b>${sl}</b><span>Storylines</span></div><div class="stat"><b>${ch}</b><span>Characters</span></div><div class="stat"><b>${p.synopsis?1:0}</b><span>Synopsis</span></div><div class="stat"><b>1</b><span>Draft</span></div></div><label class="field-label">Quick actions</label><button class="small-btn primary-lite" id="quickStory">＋ Add Storyline</button> <button class="small-btn" id="quickChar">＋ Add Character</button><label class="field-label">Project ID</label><div style="font-size:11px;color:var(--muted);word-break:break-all">${p.id}</div></div></div>`}
function bindOverview(p){['pLogline','pSynopsis','pGenre','pRuntime'].forEach(id=>$('#'+id).oninput=e=>{p[id.replace('p','').toLowerCase()]=e.target.value;p.updated=now();save()});$('#quickStory').onclick=()=>openStoryModal();$('#quickChar').onclick=()=>openCharacterModal()}
function storyProjectView(p){const rows=data.storylines.filter(x=>x.projectId===p.id);return `<div class="section-head"><div><div class="view-title">Story</div><div class="view-sub">Build the film's moving parts before the screenplay becomes a battlefield.</div></div><button class="small-btn primary-lite" id="addStory">＋ Storyline</button></div><div class="list">${rows.map(x=>`<div class="list-row"><div class="row-icon">◈</div><div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-sub">${esc(x.synopsis||'No synopsis yet.')}</div></div><div class="row-actions"><button data-edit-story="${x.id}">Edit</button><button class="danger" data-delete-story="${x.id}">×</button></div></div>`).join('')||'<div class="empty-card">No storylines. Start with the thread that moves the movie.</div>'}</div>`}
function bindStoryProject(){ $('#addStory').onclick=()=>openStoryModal();$$('[data-edit-story]').forEach(b=>b.onclick=()=>openStoryModal(b.dataset.editStory));$$('[data-delete-story]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(x=>x.id!==b.dataset.deleteStory);save();render();toast('Storyline deleted')})}
function characterProjectView(p){const rows=data.characters.filter(x=>x.projectId===p.id);return `<div class="section-head"><div><div class="view-title">Characters</div><div class="view-sub">Build people with enough weight to survive the plot.</div></div><button class="small-btn primary-lite" id="addChar">＋ Character</button></div><div class="character-grid">${rows.map(x=>`<div class="character" data-edit-char="${x.id}"><span class="char-dot" style="background:${x.color}"></span><div class="char-info"><div class="char-name">${esc(x.name)}</div><div class="char-meta">${esc(x.gender||'Gender not set')}</div><div class="char-bio">${esc(x.bio||'No bio yet.')}</div></div></div>`).join('')||'<div class="empty-card">No characters yet.</div>'}</div>`}
function bindCharacterProject(){$('#addChar').onclick=()=>openCharacterModal();$$('[data-edit-char]').forEach(b=>b.onclick=()=>openCharacterModal(b.dataset.editChar))}
function screenplayView(p){const key='script-'+p.id;let script=localStorage.getItem(key)||'';return `<div class="script-wrap"><aside class="script-side"><div class="scene-label">Draft</div><div class="scene active">1. Opening</div><div class="scene">2. Scene 2</div><div class="scene">3. Scene 3</div><div class="scene-label" style="margin-top:14px">Characters</div>${data.characters.filter(x=>x.projectId===p.id).map(x=>`<div class="scene">● ${esc(x.name)}</div>`).join('')}</aside><section class="script-main"><div class="script-toolbar"><button class="format-btn" data-format="slug">SCENE</button><button class="format-btn" data-format="action">ACTION</button><button class="format-btn" data-format="character">CHARACTER</button><button class="format-btn" data-format="dialogue">DIALOGUE</button><button class="format-btn" data-format="parenthetical">PARENTHETICAL</button><span class="script-status" id="scriptStatus">Auto-saved</span></div><div class="page"><div class="screen-title">${esc(p.title)}</div><div id="editor" class="script-editor" contenteditable="true" spellcheck="false" data-placeholder="FADE IN:\n\nINT. SOMEWHERE - NIGHT\n\nBegin writing your screenplay here...">${esc(script)}</div><div class="format-hint">Scene headings, action, character, dialogue, and parentheticals are available above.</div></div></section></div>`}
function bindScreenplay(p){const ed=$('#editor');let timer;ed.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem('script-'+p.id,ed.innerText);p.updated=now();save();$('#scriptStatus').textContent='Saved';},250)};$$('[data-format]').forEach(b=>b.onclick=()=>formatScript(ed,b.dataset.format));}
function formatScript(ed,type){const sel=window.getSelection();const text=sel&&sel.rangeCount?sel.getRangeAt(0).startContainer:'';const line=(text?.parentElement||ed).innerText?.split('\n').length||1;const labels={slug:'INT. / EXT. LOCATION - DAY',action:'Describe what we see.',character:'CHARACTER',dialogue:'Dialogue goes here.',parenthetical:'(quietly)'};document.execCommand('insertText',false,(ed.innerText?'\n\n':'')+labels[type]+'\n');ed.focus();$('#scriptStatus').textContent='Editing';}
function bindGlobal(){}
render();
</script>
</body>
