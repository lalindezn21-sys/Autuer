<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auteur Workspace</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:#202020;background:#fff;font-size:14px}button,input,textarea{font:inherit}.app{height:100vh;display:flex;overflow:hidden}.sidebar{width:260px;flex:0 0 260px;background:#f7f7f5;border-right:1px solid #e8e8e6;display:flex;flex-direction:column;padding:10px 8px;transition:.2s}.sidebar.collapsed{width:0;flex-basis:0;padding:0;overflow:hidden}.workspace{height:40px;display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:700}.workspace .logo{width:25px;height:25px;border-radius:6px;background:#111;color:#fff;display:grid;place-items:center;font-size:13px}.chev{margin-left:auto;color:#888}.side-tools{display:grid;gap:2px;margin:8px 0 14px}.side-btn,.page-btn{border:0;background:transparent;text-align:left;border-radius:6px;padding:7px 9px;color:#555;display:flex;align-items:center;gap:9px;cursor:pointer}.side-btn:hover,.page-btn:hover,.page-btn.active{background:#e9e9e6;color:#111}.side-btn .ico{width:18px;text-align:center;color:#777}.section-title{display:flex;align-items:center;padding:6px 9px 4px;color:#888;font-size:11px;font-weight:700}.section-title button{margin-left:auto;border:0;background:transparent;color:#777;font-size:18px;line-height:1}.pages{overflow:auto;flex:1}.page-btn{font-size:13px;width:100%;position:relative}.page-btn .page-icon{width:18px;text-align:center}.page-btn .dots{margin-left:auto;opacity:0}.page-btn:hover .dots{opacity:1}.subpage{padding-left:30px}.bottom{border-top:1px solid #e4e4e2;padding-top:8px}.main{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}.topbar{height:46px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #f0f0ee;color:#777;gap:10px}.topbar button{border:0;background:transparent;color:#777;border-radius:6px;padding:6px 8px}.topbar button:hover{background:#f1f1ef;color:#111}.crumb{display:flex;gap:6px;align-items:center;min-width:0}.crumb span:last-child{color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.editor{width:min(100%,1100px);margin:0 auto;padding:70px 80px 120px;overflow:auto}.page-cover{font-size:54px;margin-bottom:20px}.page-title{font-size:40px;font-weight:700;letter-spacing:-1.8px;outline:none;margin:0 0 14px}.page-sub{color:#888;margin-bottom:35px}.blocks{display:grid;gap:6px}.block{min-height:28px;line-height:1.65;padding:3px 4px;border-radius:4px;outline:none}.block:hover{background:#fafafa}.callout{background:#f6f6f3;border-radius:6px;padding:16px 18px;margin:8px 0}.heading{font-weight:700;font-size:20px;margin-top:22px}.database{border:1px solid #e5e5e2;border-radius:7px;overflow:hidden;margin-top:10px}.db-toolbar{height:42px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #e8e8e5;gap:6px}.db-toolbar button{border:0;background:transparent;border-radius:5px;padding:6px 9px;color:#555}.db-toolbar button:hover{background:#f1f1ef}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-right:1px solid #e8e8e5;border-bottom:1px solid #e8e8e5;padding:9px 11px;font-size:13px}.table th{font-size:11px;color:#777;font-weight:600;background:#fbfbfa}.table tr:last-child td{border-bottom:0}.table td:last-child,.table th:last-child{border-right:0}.tag{display:inline-block;padding:3px 7px;background:#f0f0ed;border-radius:5px;font-size:11px}.empty{color:#aaa;text-align:center;padding:35px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center;z-index:20}.modal{width:520px;max-width:calc(100% - 30px);background:#fff;border-radius:10px;box-shadow:0 20px 70px #0002;padding:22px}.modal h2{margin:0 0 18px}.modal input,.modal textarea{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px;outline:none}.modal textarea{height:100px;resize:vertical}.modal label{display:block;font-size:11px;font-weight:700;color:#777;margin:12px 0 5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{border:0;border-radius:6px;padding:8px 13px}.primary{background:#111;color:#fff}.hidden{display:none}.searchbox{position:absolute;top:55px;left:270px;width:360px;background:#fff;border:1px solid #ddd;border-radius:9px;box-shadow:0 15px 45px #0002;padding:12px;z-index:15}.searchbox input{width:100%;border:0;outline:0;padding:8px}.search-result{padding:9px;border-radius:6px;cursor:pointer}.search-result:hover{background:#f1f1ef}@media(max-width:750px){.sidebar{width:230px;flex-basis:230px}.editor{padding:45px 25px}.page-title{font-size:34px}.searchbox{left:15px;width:calc(100% - 30px)}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="workspace"><span class="logo">A</span><span>Auteur</span><span class="chev">⌄</span></div><div class="side-tools"><button class="side-btn" id="searchBtn"><span class="ico">⌕</span>Search</button><button class="side-btn" onclick="showPage('home')"><span class="ico">⌂</span>Home</button><button class="side-btn" onclick="showPage('projects')"><span class="ico">▦</span>Projects</button></div><div class="section-title">Private <button id="addPage">+</button></div><div class="pages" id="pages"></div><div class="bottom"><button class="side-btn"><span class="ico">⚙</span>Settings</button><button class="side-btn"><span class="ico">▢</span>Trash</button></div></aside><main class="main"><header class="topbar"><button id="toggle" title="Toggle sidebar">☰</button><div class="crumb"><span>Auteur</span><span>›</span><span id="crumbTitle">Home</span></div><div class="spacer"></div><button id="newTop">+ New</button><button id="more">•••</button></header><div class="searchbox hidden" id="searchbox"><input id="searchInput" placeholder="Search your workspace..."><div id="results"></div></div><section class="editor" id="editor"></section></main></div><div class="modal-bg hidden" id="modal"><div class="modal"><h2>New page</h2><label>Page title</label><input id="newTitle" placeholder="Untitled"><label>Icon</label><input id="newIcon" value="📄" maxlength="2"><div class="modal-actions"><button id="cancel">Cancel</button><button class="primary" id="create">Create page</button></div></div></div><script>
const defaultPages=[{id:'timeless',title:'Timeless Rangers',icon:'🎬',type:'film',stage:'Concept',genre:'Adventure',progress:72,idea:'A film concept in development.',storylines:['Core story','Character conflict','The larger world'],characters:['Main Character','Rival','Supporting Cast'],notes:'Develop the title, visual language, and central conflict.'},{id:'engineered',title:'Engineered Fear',icon:'🎞️',type:'film',stage:'Concept',genre:'Thriller',progress:35,idea:'Two criminals discover that their robberies are being used to manufacture fear.',storylines:['The jobs','The organization','The political truth'],characters:['The Robber','The Partner','The Architect'],notes:''},{id:'notes',title:'Film Notes',icon:'📝',type:'notes',stage:'',genre:'',progress:0,idea:'A place for loose ideas, titles, images, and fragments.',storylines:[],characters:[],notes:''}];let pages=JSON.parse(localStorage.getItem('auteur-pages')||'null')||defaultPages;let current='home';const $=id=>document.getElementById(id);function save(){localStorage.setItem('auteur-pages',JSON.stringify(pages))}function page(id){return pages.find(p=>p.id===id)}function showPage(id){current=id;render()}function render(){let p=page(current);$('crumbTitle').textContent=current==='home'?'Home':current==='projects'?'Projects':p?.title||'Home';$('pages').innerHTML=pages.map(x=>`<button class="page-btn ${x.id===current?'active':''}" onclick="showPage('${x.id}')"><span class="page-icon">${x.icon}</span>${esc(x.title)}<span class="dots">•••</span></button>`).join('');if(current==='home')home();else if(current==='projects')projects();else film(p)}function home(){$('editor').innerHTML=`<div class="page-cover">🏠</div><h1 class="page-title">Home</h1><div class="page-sub">Your creative workspace.</div><div class="callout"><b>Welcome to Auteur.</b><br>Develop films, characters, storylines, scenes, notes, and production in one place.</div><div class="heading">Your workspace</div><div class="database"><table class="table"><thead><tr><th>Project</th><th>Stage</th><th>Genre</th><th>Progress</th></tr></thead><tbody>${pages.filter(p=>p.type==='film').map(p=>`<tr onclick="showPage('${p.id}')" style="cursor:pointer"><td>${p.icon} ${esc(p.title)}</td><td><span class="tag">${esc(p.stage)}</span></td><td>${esc(p.genre)}</td><td>${p.progress}%</td></tr>`).join('')}</tbody></table></div>`}function projects(){$('editor').innerHTML=`<div class="page-cover">🎬</div><h1 class="page-title">Projects</h1><div class="page-sub">Every film is a page. Every page can grow with the film.</div><div class="database"><div class="db-toolbar"><button onclick="openModal()">+ New</button><button>Filter</button><button>Sort</button><button>•••</button></div><table class="table"><thead><tr><th>Name</th><th>Stage</th><th>Genre</th><th>Progress</th></tr></thead><tbody>${pages.filter(p=>p.type==='film').map(p=>`<tr onclick="showPage('${p.id}')" style="cursor:pointer"><td>${p.icon} ${esc(p.title)}</td><td><span class="tag">${esc(p.stage)}</span></td><td>${esc(p.genre)}</td><td>${p.progress}%</td></tr>`).join('')}</tbody></table></div>`}function film(p){if(!p)return home();$('editor').innerHTML=`<div class="page-cover">${p.icon}</div><h1 class="page-title" contenteditable="true" onblur="rename('${p.id}',this.innerText)">${esc(p.title)}</h1><div class="page-sub">${esc(p.genre||'Creative page')} ${p.stage?'· '+esc(p.stage):''}</div><div class="blocks"><div class="heading">Core idea</div><div class="block" contenteditable="true" onblur="update('${p.id}','idea',this.innerText)">${esc(p.idea||'Start writing...')}</div><div class="heading">Storylines</div>${p.storylines?.length?`<ul>${p.storylines.map(x=>`<li contenteditable="true">${esc(x)}</li>`).join('')}</ul>`:'<div class="block">Add your main storylines.</div>'}<div class="heading">Characters</div>${p.characters?.length?`<ul>${p.characters.map(x=>`<li contenteditable="true">${esc(x)}</li>`).join('')}</ul>`:'<div class="block">Add your characters.</div>'}<div class="heading">Notes</div><div class="block" contenteditable="true" onblur="update('${p.id}','notes',this.innerText)">${esc(p.notes||'Start writing notes...')}</div></div>`}function rename(id,v){let p=page(id);if(p){p.title=v.trim()||'Untitled';save();render()}}function update(id,k,v){let p=page(id);if(p){p[k]=v;save()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openModal(){$('modal').classList.remove('hidden');$('newTitle').focus()}function closeModal(){$('modal').classList.add('hidden')}function createPage(){let title=$('newTitle').value.trim()||'Untitled',icon=$('newIcon').value||'📄',id='p'+Date.now();pages.push({id,title,icon,type:'notes',stage:'',genre:'',progress:0,idea:'',storylines:[],characters:[],notes:''});save();closeModal();$('newTitle').value='';showPage(id)}$('toggle').onclick=()=>$('sidebar').classList.toggle('collapsed');$('addPage').onclick=openModal;$('newTop').onclick=openModal;$('cancel').onclick=closeModal;$('create').onclick=createPage;$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('searchBtn').onclick=()=>{$('searchbox').classList.toggle('hidden');$('searchInput').focus()};$('searchInput').oninput=e=>{let q=e.target.value.toLowerCase();$('results').innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q)).map(p=>`<div class="search-result" onclick="showPage('${p.id}');$('searchbox').classList.add('hidden')">${p.icon} ${esc(p.title)}</div>`).join('')};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('searchbox').classList.remove('hidden');$('searchInput').focus()}if(e.key==='Escape'){$('searchbox').classList.add('hidden');closeModal()}});render();
</script></body></html>
