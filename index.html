<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title><style>:root{--a:#d45b4f;--bg:#f5f7f9;--line:#dfe4e9;--text:#20262d;--muted:#7b8590}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#fff}button,input{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:4px}.ico{width:34px;height:34px;border-radius:8px;font-size:20px}.ico:hover{background:#eef1f4}.sp{flex:1}.updated{font-size:12px;color:#8b949d;margin-right:8px}.create{height:34px;padding:0 15px;background:var(--a);color:#fff;border-radius:7px;font-size:14px;font-weight:700}.body{height:calc(100% - 54px);display:flex}.side{width:315px;background:#f7f8fa;border-right:1px solid var(--line);display:flex;flex-direction:column}.profile{height:64px;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:600}.avatar{width:25px;height:25px;border-radius:50%;background:#3e7680;color:#fff;display:grid;place-items:center;font-size:11px}.nav{padding:0 6px}.nav button,.link{width:100%;height:43px;border-radius:9px;text-align:left;padding:0 13px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}.nav button:hover,.link:hover{background:#edf0f3}.nav .active{border:1px solid var(--a);background:#fff;color:#a53f35}.plus{margin-left:auto;font-size:21px;color:#818b94}.links{margin-top:28px;padding:0 6px}.link{height:38px;padding-left:13px}.upgrade{margin:auto 10px 10px;background:#e9edf0;border-radius:6px;padding:18px}.upgrade h3{font-size:16px;line-height:1.15;margin:0 0 17px;max-width:220px}.upgrade button{background:#fff;border:1px solid #d6dce1;border-radius:5px;padding:7px 10px;font-size:12px;font-weight:600}.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:70px;border-bottom:1px solid #edf0f2;padding:0 37px;display:flex;align-items:center;font-size:20px;font-weight:700}.dash{padding:28px 37px;overflow:auto}.search{height:57px;border-radius:30px;background:#f2f4f7;display:flex;align-items:center;padding:0 20px;gap:12px}.search b{font-size:25px}.search input{flex:1;border:0;outline:0;background:transparent;font-size:17px}.search input::placeholder{color:#b6bdc4}.recent{margin-top:30px}.st{font-size:16px;font-weight:700;margin-bottom:12px}.list{border-top:1px solid #e7eaed}.empty{height:65px;display:flex;align-items:center;color:#a1a9b0;font-size:13px;padding-left:13px}.tabs{margin-top:28px;height:43px;border-bottom:1px solid #e8ebee;display:flex;align-items:flex-end;gap:12px}.tab{padding:0 0 12px;font-size:16px;font-weight:600;color:#879099}.tab.active{color:#2b3137;border-bottom:2px solid var(--a)}.controls{margin-left:auto;display:flex;gap:8px;padding-bottom:7px}.controls button{color:#7f8992;padding:6px 8px;border-radius:6px;font-size:13px}.controls .active{background:#f0f2f4;color:var(--a)}.files{min-height:360px}.bottom{height:49px;border-top:1px solid #edf0f2;background:#f8fafb;display:flex;align-items:center;padding:0 30px;font-size:15px;font-weight:600}.bottom button{margin-left:auto;color:#7c8790;font-size:13px}.menu,.modalbg{display:none}.menu.open{display:block;position:fixed;right:12px;top:61px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #17202a15;padding:6px;z-index:5}.menu button{display:block;width:190px;text-align:left;padding:9px;border-radius:6px;font-size:13px}.menu button:hover{background:#f1f4f6}.modalbg.open{display:flex;position:fixed;inset:0;background:#1f252b55;align-items:center;justify-content:center;z-index:10}.modal{width:400px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0003}.modal h2{margin:0 0 16px}.modal input{width:100%;padding:11px;border:1px solid #d5dbe0;border-radius:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{padding:9px 14px;border-radius:7px;font-weight:700}.ok{background:var(--a);color:#fff}.toast{position:fixed;right:20px;bottom:20px;background:#283038;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.side{width:230px}.dash,.head{padding-left:20px;padding-right:20px}}@media(max-width:540px){.side{display:none}}</style></head><body><header class="top"><button class="ico">⌂</button><button class="ico">▣</button><button class="ico" id="searchBtn">⌕</button><button class="ico">♧</button><span class="sp"></span><span class="updated" id="updated">Updated just now</span><button class="ico" id="refresh">↻</button><button class="create" id="create">＋ Create</button></header><div class="body"><aside class="side"><div class="profile"><span class="avatar">A</span>Autuer <span style="color:#8a939c">⌄</span></div><nav class="nav"><button class="active" data-page="Dashboard">⌂ Dashboard</button><button data-page="Scripts">▤ Scripts <span class="plus" id="plus">＋</span></button><button data-page="Projects">⊞ Projects</button></nav><div class="links"><button class="link" id="support">? Support</button><button class="link" id="news">✣ What's new?</button><button class="link" id="refer">♧ Refer a friend</button></div><div class="upgrade"><h3>Upgrade Autuer Studio to get access to all features</h3><button id="upgrade">↗ Upgrade now!</button></div></aside><main class="main"><div class="head" id="head">Dashboard</div><div class="dash"><label class="search"><b>⌕</b><input id="q" placeholder="Search scripts..."></label><section class="recent"><div class="st">Recently edited</div><div class="list" id="recent"><div class="empty">No scripts yet</div></div></section><div class="tabs"><button class="tab active">All Files</button><button class="tab">My Files</button><button class="tab">Shared With Me</button><button class="tab">Archived</button><div class="controls"><button id="sort">by last edited⌄</button><button class="active" id="listView">▤</button><button id="gridView">▦</button></div></div><div class="files" id="files"><div class="empty" style="justify-content:center">Your workspace is empty</div></div></div><div class="bottom">› &nbsp; Featured Guides &amp; Events <button id="show">Show</button></div></main></div><div class="menu" id="menu"><button data-type="script">New Script</button><button data-type="project">New Project</button><button data-type="folder">New Folder</button></div><div class="modalbg" id="modalbg"><div class="modal"><h2 id="mt">New Script</h2><input id="name" placeholder="Screenplay title"><div class="actions"><button id="cancel">Cancel</button><button class="ok" id="ok">Create</button></div></div></div><div class="toast" id="toast"></div><script>const K='autuer-dashboard-v2',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let d=JSON.parse(localStorage.getItem(K)||'{"scripts":[],"projects":[],"folders":[]}'),type='script';function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(K,JSON.stringify(d));$('#updated').textContent='Updated just now'}function render(){let q=$('#q').value.toLowerCase(),all=[...d.scripts.map(x=>({...x,t:'script'})),...d.projects.map(x=>({...x,t:'project'}))].filter(x=>x.name.toLowerCase().includes(q));let r=[...d.scripts].sort((a,b)=>b.updated-a.updated);$('#recent').innerHTML=r.length?r.slice(0,5).map(x=>`<div class="empty" style="border-bottom:1px solid #edf0f2;gap:13px"><span style="width:26px;height:26px;border:2px solid #aab3ba;border-radius:4px;display:grid;place-items:center">▤</span><b style="font-size:14px">${esc(x.name)}</b></div>`).join(''):'<div class="empty">No scripts yet</div>';$('#files').innerHTML=all.length?all.map(x=>`<div class="empty" style="border-bottom:1px solid #edf0f2;gap:13px"><span style="width:26px;height:26px;border:2px solid #aab3ba;border-radius:4px;display:grid;place-items:center">${x.t==='script'?'▤':'⊞'}</span><b style="font-size:14px">${esc(x.name)}</b></div>`).join(''):'<div class="empty" style="justify-content:center">Your workspace is empty</div>'}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function open(t){type=t;$('#mt').textContent=t==='script'?'New Script':t==='project'?'New Project':'New Folder';$('#name').value='';$('#name').placeholder=t==='script'?'Screenplay title':t+' name';$('#modalbg').classList.add('open');$('#name').focus()}$('#create').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};$$('[data-type]').forEach(b=>b.onclick=()=>{$('#menu').classList.remove('open');open(b.dataset.type)});$('#plus').onclick=e=>{e.stopPropagation();open('script')};$('#cancel').onclick=()=>$('#modalbg').classList.remove('open');$('#ok').onclick=()=>{let n=$('#name').value.trim();if(!n)return;let x={id:crypto.randomUUID(),name:n,updated:Date.now()};d[type+'s'].push(x);save();render();$('#modalbg').classList.remove('open');toast('Created '+n)};$('#name').onkeydown=e=>{if(e.key==='Enter')$('#ok').click();if(e.key==='Escape')$('#cancel').click()};$('#q').oninput=render;$('#searchBtn').onclick=()=>$('#q').focus();$('#refresh').onclick=()=>{render();toast('Workspace refreshed')};$$('[data-page]').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#head').textContent=b.dataset.page;render()});$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(b.textContent)});$('#sort').onclick=()=>toast('Sorted by last edited');$('#listView').onclick=()=>toast('List view');$('#gridView').onclick=()=>toast('Grid view');['support','news','refer','upgrade','show'].forEach(id=>$('#'+id).onclick=()=>toast($('#'+id).textContent.trim()));document.addEventListener('click',e=>{if(!e.target.closest('#create')&&!e.target.closest('#menu'))$('#menu').classList.remove('open')});render();</script></body></html>
