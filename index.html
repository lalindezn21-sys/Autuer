<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#171717;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr) 235px}.side,.inspector{background:#fff}.side{border-right:1px solid #ddd;display:flex;flex-direction:column}.brand{height:54px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #e5e5e5;font:21px Georgia,serif}.brand small{margin-left:auto;font:9px Inter;color:#999}.tabs,.inspect-tabs{display:flex;border-bottom:1px solid #eee}.tabs button,.inspect-tabs button{flex:1;height:38px;font-size:9px;font-weight:800;color:#888}.tabs .on,.inspect-tabs .on{color:#111;border-bottom:2px solid #111}.list{padding:12px;overflow:auto}.label{font-size:9px;color:#888;letter-spacing:.12em;text-transform:uppercase;margin:8px 5px}.scene{display:flex;gap:9px;padding:8px;border-radius:5px;font-size:11px}.scene:hover,.scene.on{background:#f1f1ee}.scene b{color:#999;font-weight:500}.foot{margin-top:auto;border-top:1px solid #eee;padding:10px;color:#999;font-size:9px}.main{min-width:0;display:flex;flex-direction:column}.top{height:54px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px}.top button{width:29px;height:29px;border-radius:5px}.top button:hover{background:#eee}.name{font-size:12px;font-weight:700;margin-left:6px}.saved{font-size:9px;color:#999;margin-left:9px}.tools{margin-left:auto;display:flex;gap:2px}.nav{height:40px;border-bottom:1px solid #eee;display:flex;justify-content:center;gap:34px}.nav button{font-size:9px;font-weight:800;color:#888}.nav .on{color:#111;border-bottom:2px solid #111}.peek{height:58px;width:min(820px,calc(100% - 32px));margin:auto;border:1px solid #ddd;border-top:0;text-align:center;padding-top:17px;font:14px Georgia,serif}.workspace{flex:1;overflow:auto;background:#fafaf9;padding:18px 18px 60px}.page{width:min(820px,100%);min-height:1040px;margin:auto;background:#fff;border:1px solid #ddd;box-shadow:0 7px 25px #0000000b;padding:88px 105px}.script{min-height:750px;outline:0;font:12px/1.55 "Courier New",monospace}.line{min-height:18px;outline:0;white-space:pre-wrap}.scene-heading{margin-top:12px;text-transform:uppercase;font-weight:700}.character{width:54%;margin:12px auto 0;text-transform:uppercase;font-weight:700}.parenthetical{width:48%;margin:auto}.dialogue{width:64%;margin:auto}.transition{text-align:right;text-transform:uppercase;font-weight:700;margin-top:12px}.formatbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border:1px solid #ddd;background:#fff;box-shadow:0 5px 18px #0001}.formatbar button{padding:6px 8px;border-radius:4px;font-size:9px;color:#666}.formatbar button:hover{background:#eee;color:#111}.inspector{border-left:1px solid #ddd;display:flex;flex-direction:column}.inspect-head{height:54px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eee;font-size:12px;font-weight:700}.cards{padding:12px;overflow:auto}.card{border:1px solid #ddd;padding:10px;margin-bottom:8px}.card h4{font-size:10px;margin:0 0 7px}.field{width:100%;border:1px solid #ddd;padding:7px;outline:0;font-size:10px;resize:vertical}.field:focus{border-color:#999}.status{height:28px;border-top:1px solid #ddd;display:flex;align-items:center;padding:0 12px;color:#888;font-size:9px}.status span:last-child{margin-left:auto}</style></head><body><div class="app"><aside class="side"><div class="brand">Autuer<small>DRAFT</small></div><div class="tabs"><button class="on">OUTLINE</button><button>NOTES</button></div><div class="list"><div class="label">Scenes</div><div class="scene on"><b>1</b><span>Opening</span></div><div class="scene"><b>2</b><span>The Arrival</span></div><div class="scene"><b>3</b><span>Unknown Territory</span></div><div class="label">Characters</div><div class="scene"><b>+</b><span>Add character</span></div><div class="label">Storylines</div><div class="scene"><b>+</b><span>Add storyline</span></div></div><div class="foot">Draft 1 · Autosaved</div></aside><main class="main"><header class="top"><button>☰</button><span class="name">Untitled Screenplay</span><span class="saved" id="saved">Saved</span><div class="tools"><button id="undo">↶</button><button id="redo">↷</button><button id="find">⌕</button><button id="full">⛶</button></div></header><div class="nav"><button class="on">SCRIPT</button><button>OUTLINE</button><button>CARDS</button></div><div class="peek">Untitled Screenplay</div><section class="workspace"><article class="page"><div id="script" class="script" contenteditable="true" spellcheck="false"><div class="line"></div></div></article></section><div class="status"><span id="mode">Action</span><span id="stats">0 words · 0 pages</span></div></main><aside class="inspector"><div class="inspect-head">Inspector</div><div class="inspect-tabs"><button class="on">SCENE</button><button>CHARACTER</button><button>NOTES</button></div><div class="cards"><div class="card"><h4>SCENE TITLE</h4><input class="field" placeholder="Untitled scene"></div><div class="card"><h4>SLUGLINE</h4><input class="field" value="INT. / EXT."></div><div class="card"><h4>SYNOPSIS</h4><textarea class="field" rows="7" placeholder="What happens in this scene?"></textarea></div><div class="card"><h4>NOTES</h4><textarea class="field" rows="8" placeholder="Scene notes..."></textarea></div></div></aside></div><div class="formatbar"><button data-t="scene-heading">Scene</button><button data-t="action">Action</button><button data-t="character">Character</button><button data-t="dialogue">Dialogue</button><button data-t="parenthetical">Parenthetical</button><button data-t="transition">Transition</button></div><script>const s=document.querySelector('#script'),stats=document.querySelector('#stats'),saved=document.querySelector('#saved'),mode=document.querySelector('#mode'),types=['scene-heading','action','character','parenthetical','dialogue','transition'];function cur(){return getSelection().anchorNode?.parentElement?.closest('.line')}function focus(e){e.focus();let r=document.createRange();r.selectNodeContents(e);r.collapse(false);let q=getSelection();q.removeAllRanges();q.addRange(r)}function setType(t){let e=cur()||s.lastElementChild;e.className='line '+t;mode.textContent=t.replace('-',' ');focus(e)}document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setType(b.dataset.t));s.addEventListener('keydown',e=>{let el=e.target.closest('.line');if(!el)return;if(e.key==='Enter'){e.preventDefault();let t=el.className.split(' ')[1]||'action',next=t==='scene-heading'||t==='action'?'action':t==='character'||t==='parenthetical'?'dialogue':t==='dialogue'?'character':'scene-heading',n=document.createElement('div');n.className='line '+next;el.after(n);focus(n);mode.textContent=next.replace('-',' ')}if(e.key==='Tab'){e.preventDefault();let i=types.indexOf(el.className.split(' ')[1]);setType(types[(i+1)%types.length])}});function update(){let w=s.innerText.trim(),n=w?w.split(/\s+/).length:0;stats.textContent=`${n} words · ${Math.ceil(n/250)} pages`}s.addEventListener('input',()=>{update();saved.textContent='Saving…';clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>{localStorage.autuerDraft=s.innerHTML;saved.textContent='Saved'},250)});document.querySelector('#undo').onclick=()=>document.execCommand('undo');document.querySelector('#redo').onclick=()=>document.execCommand('redo');document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.querySelector('#find').onclick=()=>{let q=prompt('Find');if(q)window.find(q)};if(localStorage.autuerDraft)s.innerHTML=localStorage.autuerDraft;update();focus(s.lastElementChild);</script></body></html>
