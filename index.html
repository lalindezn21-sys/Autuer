<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTEUR</title><style>:root{--bg:#f4f3ef;--ink:#111;--muted:#777;--red:#e21d2e;--line:#d9d7d1;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:72px 1fr}.rail{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:28px}.mark{font-weight:900;font-size:14px;letter-spacing:-.08em}.mark i{color:var(--red);font-style:normal}.rail button{border:0;background:none;color:#777;font-size:17px;width:40px;height:40px;border-radius:50%}.rail button:hover,.rail button.active{background:#242424;color:#fff}.rail .plus{margin-top:auto;background:var(--red);color:#fff}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.wordmark{font-size:12px;font-weight:900;letter-spacing:.25em}.wordmark span{color:var(--red)}.top small{font:9px monospace;color:#888;letter-spacing:.12em}.home{max-width:1200px;margin:auto;padding:8vw 6vw}.eyebrow{font:9px monospace;color:#888;letter-spacing:.16em;text-transform:uppercase}.hero{display:flex;justify-content:space-between;align-items:end;gap:40px}.hero h1{font:400 clamp(90px,16vw,220px)/.72 Georgia,serif;letter-spacing:-.1em;margin:30px 0 35px}.hero h1 span{color:var(--red)}.intro{max-width:310px;font-size:14px;line-height:1.65;color:#666;margin-bottom:35px}.line{border-top:1px solid #111}.empty{display:flex;justify-content:space-between;align-items:center;padding:28px 0;gap:30px}.empty h2{font:400 28px Georgia;margin:0}.empty p{font-size:11px;color:#777;margin:7px 0 0}.new{border:0;background:#111;color:#fff;padding:13px 16px;font-size:9px;font-weight:bold;letter-spacing:.08em}.new:hover{background:var(--red)}.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#111;margin-top:45px}.card{background:var(--bg);padding:25px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.card:hover{background:#fff}.card-top{display:flex;justify-content:space-between;font:8px monospace;color:#888}.card h3{font:400 clamp(32px,4vw,62px)/.86 Georgia;margin:25px 0;letter-spacing:-.06em}.card-foot{display:flex;justify-content:space-between;font:8px monospace;color:#888}.card-foot b{color:var(--red);font-weight:normal}.editor{height:calc(100vh - 72px);display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);padding:25px 18px}.back{border:0;background:none;padding:0;font:9px monospace;color:#777;margin-bottom:35px}.side h2{font:400 27px Georgia;margin:0 0 20px}.side button{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 8px;font-size:11px;color:#666}.side button.active{color:#111;background:#fff}.write{overflow:auto;background:#d8d7d2;padding:50px 20px}.paper{background:#fff;max-width:800px;min-height:calc(100vh - 170px);margin:auto;padding:75px 90px;box-shadow:0 15px 50px #0001}.title{border:0;outline:0;background:none;text-align:center;width:100%;font:700 13px monospace;text-transform:uppercase;margin-bottom:45px}.script{width:100%;min-height:900px;border:0;outline:0;resize:none;background:none;font:12px/1.8 "Courier New",monospace;color:#111}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{background:#fff;width:min(460px,100%);padding:32px}.dialog h2{font:400 44px Georgia;margin:5px 0 25px}.dialog h2 span{color:var(--red)}.dialog input{width:100%;padding:14px;border:1px solid #bbb;outline:0}.dialog input:focus{border-color:#111}.dialog-actions{display:flex;justify-content:end;gap:8px;margin-top:12px}.dialog-actions button{border:0;padding:11px 14px;font-size:9px}.cancel{background:#eee}.create{background:var(--red);color:#fff}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 15px;font:9px monospace;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:760px){.app{grid-template-columns:1fr}.rail{display:none}.top{height:62px}.home{padding:50px 22px}.hero{display:block}.hero h1{font-size:27vw}.intro{margin-bottom:30px}.projects{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.side{display:none}.write{padding:15px 8px}.paper{padding:50px 28px}.script{font-size:11px}}</style></head><body><div class="app"><aside class="rail"><div class="mark">A<i>.</i></div><button class="active" title="Home">⌂</button><button id="projectsBtn" title="Projects">□</button><button id="editorBtn" title="Editor">✎</button><button class="plus" id="railNew">+</button></aside><main class="main"><header class="top"><div class="wordmark">AUTEUR<span>.</span></div><small>PRIVATE FILM WORKSPACE</small></header><div id="root"></div></main></div><div class="modal" id="modal"><div class="dialog"><div class="eyebrow">NEW PROJECT</div><h2>Start with <span>the title.</span></h2><input id="title" placeholder="Project title" autocomplete="off"><div class="dialog-actions"><button class="cancel" id="cancel">Cancel</button><button class="create" id="create">Create project</button></div></div></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s);let projects=JSON.parse(localStorage.getItem('auteur.projects.simple')||'[]'),current=null;const save=()=>localStorage.setItem('auteur.projects.simple',JSON.stringify(projects));function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function openModal(){$('#modal').classList.add('show');setTimeout(()=>$('#title').focus(),50)}function closeModal(){$('#modal').classList.remove('show');$('#title').value=''}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){current=null;$('#root').innerHTML=`<section class="home"><div class="eyebrow">SCREENWRITING / STUDIO</div><div class="hero"><div><h1>Write the<br><span>film.</span></h1></div><p class="intro">A quiet place to build a movie. Start with a title. Develop the idea. Write the screenplay.</p></div><div class="line"></div><div class="empty"><div><h2>${projects.length?'Your projects.':'Nothing here yet.'}</h2><p>${projects.length?'Open a project and keep building.':'No templates. No clutter. Just your work.'}</p></div><button class="new" onclick="openModal()">+ NEW PROJECT</button></div><div class="projects">${projects.map((p,i)=>`<article class="card" onclick="openProject('${p.id}')"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><span>${p.status||'DEVELOPMENT'}</span></div><h3>${esc(p.title)}</h3><div class="card-foot"><span><b>${p.screenplay?.length?Math.ceil(p.screenplay.length/1800):0}</b> PAGES</span><span>OPEN ↗</span></div></article>`).join('')}</div></section>`}function openProject(id){current=id;let p=projects.find(x=>x.id===id);if(p)editor(p)}function editor(p){$('#root').innerHTML=`<section class="editor"><aside class="side"><button class="back" onclick="home()">← ALL PROJECTS</button><h2>${esc(p.title)}</h2><button class="active">Screenplay</button><button onclick="toast('Development / coming next')">Development</button><button onclick="toast('Characters / coming next')">Characters</button><button onclick="toast('Research / coming next')">Research</button></aside><div class="write"><div class="paper"><input class="title" id="scriptTitle" value="${esc(p.title)}"><textarea class="script" id="script" placeholder="FADE IN:\n\nStart writing..."></textarea></div></div></section>`;$('#script').value=p.screenplay||'';$('#scriptTitle').oninput=e=>{p.title=e.target.value||'Untitled';commit()};$('#script').oninput=e=>{p.screenplay=e.target.value;commit()}}function commit(){save()}$('#create').onclick=()=>{let t=$('#title').value.trim();if(!t)return;let p={id:crypto.randomUUID(),title:t,status:'DEVELOPMENT',screenplay:'',created:Date.now(),updated:Date.now()};projects.unshift(p);save();closeModal();openProject(p.id);toast('PROJECT CREATED')};$('#cancel').onclick=closeModal;$('#railNew').onclick=openModal;$('#projectsBtn').onclick=home;$('#editorBtn').onclick=()=>current?editor(projects.find(p=>p.id===current)):toast('OPEN A PROJECT FIRST');document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal()}if(e.key==='Escape')closeModal()});home();</script></body></html>
