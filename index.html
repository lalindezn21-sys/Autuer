<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30302e;background:#f7f7f5}button,input{font:inherit}button{border:0;background:none;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:56px 238px 1fr}.rail{background:#fff;border-right:1px solid #e5e5e1;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}.logo{width:34px;height:34px;border-radius:9px;background:#252525;color:#fff;display:grid;place-items:center;font:700 18px Georgia;margin-bottom:18px;cursor:pointer}.rail button{width:38px;height:38px;border-radius:8px;color:#999;font-size:17px}.rail button:hover,.rail button.active{background:#f0f0ed;color:#222}.rail-bottom{margin-top:auto}.side{background:#fbfbf9;border-right:1px solid #e5e5e1;overflow:auto}.side-head{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e7e7e3;font-weight:650}.side-head button{margin-left:auto;color:#777;font-size:21px}.search{margin:12px}.search input{width:100%;height:34px;border:1px solid #deded9;border-radius:7px;background:#fff;padding:0 10px;outline:0}.search input:focus{border-color:#aaa}.section{padding:12px 10px 5px;color:#a0a09b;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.board{margin:2px 7px;padding:8px 9px;border-radius:7px;display:flex;align-items:center;gap:8px;color:#4b4b48;font-size:12px}.board:hover,.board.active{background:#ededE9}.board-icon{width:8px;height:8px;border-radius:2px;background:#bbb}.workspace{position:relative;overflow:hidden;background:#f7f7f5}.top{height:58px;background:#fff;border-bottom:1px solid #e5e5e1;display:flex;align-items:center;padding:0 17px;position:relative;z-index:10}.title{font-weight:650}.actions{margin-left:auto;display:flex;gap:2px}.actions button{padding:7px 10px;border-radius:7px;color:#777;font-size:11px}.actions button:hover{background:#f1f1ee;color:#222}.share{background:#292929!important;color:#fff!important;padding-left:14px!important;padding-right:14px!important}.canvas{position:absolute;inset:58px 0 0;overflow:auto;background:#f7f7f5}.world{position:relative;width:5000px;height:3500px;background-image:radial-gradient(#d7d7d2 1px,transparent 1px);background-size:24px 24px}.card{position:absolute;background:#fff;border:1px solid #deded9;border-radius:8px;box-shadow:0 2px 12px #0000000b;min-width:180px}.card.selected{outline:2px solid #cfcfca}.note{width:280px;padding:14px}.note-title{font-size:15px;font-weight:650;outline:0;min-height:20px}.note-body{margin-top:7px;min-height:38px;outline:0;color:#555;line-height:1.5}.column{width:300px;padding:13px;background:#f0f0ed}.column-title{font-size:12px;font-weight:650;outline:0;min-height:18px}.column .note{position:relative!important;left:auto!important;top:auto!important;width:100%;margin-top:10px;box-shadow:none}.todo{width:280px;padding:14px}.todo-title{font-size:14px;font-weight:650;outline:0}.task{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px}.task span{outline:0;flex:1}.task input{accent-color:#333}.image{width:300px;overflow:hidden}.image-area{height:180px;background:#ededE9;display:grid;place-items:center;color:#aaa}.image-caption{padding:11px;outline:0;min-height:35px}.link{width:280px;padding:14px}.link-title{font-weight:650;outline:0}.link-url{margin-top:8px;color:#888;outline:0;min-height:20px}.empty-menu{position:fixed;left:70px;bottom:16px;width:180px;background:#fff;border:1px solid #ddd;border-radius:9px;box-shadow:0 12px 35px #0002;padding:6px;display:none;z-index:30}.empty-menu.open{display:block}.empty-menu button{width:100%;text-align:left;padding:9px;border-radius:6px;color:#444;font-size:12px}.empty-menu button:hover{background:#f0f0ed}.zoom{position:fixed;right:18px;bottom:17px;display:flex;align-items:center;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 10px #0001}.zoom button{width:32px;height:31px;color:#777}.zoom span{width:45px;text-align:center;color:#888;font-size:10px}.modal{position:fixed;inset:0;background:#0003;display:none;place-items:center;z-index:100}.modal.open{display:grid}.modal-box{width:360px;background:#fff;border-radius:10px;padding:20px;box-shadow:0 20px 60px #0003}.modal-box h2{margin:0 0 14px;font-size:18px}.modal-box input{width:100%;height:38px;border:1px solid #ddd;border-radius:7px;padding:0 10px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.modal-actions button{padding:8px 13px;border-radius:7px;font-size:11px}.create{background:#292929;color:#fff}.toast{position:fixed;right:20px;top:70px;background:#292929;color:#fff;padding:8px 11px;border-radius:7px;font-size:10px;opacity:0;transition:.18s;z-index:110}.toast.show{opacity:1}@media(max-width:750px){.app{grid-template-columns:56px 1fr}.side{display:none}}</style></head><body><div class="app"><aside class="rail"><div class="logo" id="logo">A</div><button class="active">▦</button><button id="focusSearch">⌕</button><button>◇</button><div class="rail-bottom"><button>⚙</button></div></aside><aside class="side"><div class="side-head">My boards<button id="newBoard">＋</button></div><div class="search"><input id="search" placeholder="Search boards"></div><div class="section">Boards</div><div id="boards"></div></aside><main class="workspace"><header class="top"><div class="title" id="title"></div><div class="actions"><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit">Fit</button><button id="export">Export</button><button class="share">Share</button></div></header><section class="canvas" id="canvas"><div class="world" id="world"></div></section><div class="zoom"><button id="minus">−</button><span id="pct">100%</span><button id="plus">＋</button></div><div class="empty-menu" id="menu"><button data-add="note">Note</button><button data-add="todo">To-do list</button><button data-add="column">Column</button><button data-add="image">Image</button><button data-add="link">Link</button></div></main></div><div class="modal" id="modal"><div class="modal-box"><h2>New board</h2><input id="boardName" autofocus><div class="modal-actions"><button id="cancel">Cancel</button><button class="create" id="create">Create</button></div></div></div><div class="toast" id="toast"></div><script>const KEY='autuer-milanote-v2',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{boards:[],active:null,items:[]},scale=1,history=[],future=[];function save(){state.items=[...document.querySelectorAll('#world>.card')].map(card=>({type:card.dataset.type,html:card.innerHTML,left:card.style.left,top:card.style.top}));localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900)}function renderBoards(){let q=$('#search').value.toLowerCase();let list=state.boards.filter(x=>x.toLowerCase().includes(q));$('#boards').innerHTML=list.map(x=>`<div class="board ${x===state.active?'active':''}" data-board="${x.replace(/"/g,'&quot;')}"><i class="board-icon"></i>${x}</div>`).join('');$$('[data-board]').forEach(e=>e.onclick=()=>{state.active=e.dataset.board;$('#title').textContent=state.active;renderBoards();save()})}function loadItems(){let w=$('#world');w.innerHTML='';(state.items||[]).forEach(x=>{let e=document.createElement('div');e.className='card '+x.type;e.dataset.type=x.type;e.innerHTML=x.html;e.style.left=x.left;e.style.top=x.top;w.append(e)});bindCards()}function snapshot(){history.push(JSON.stringify([...document.querySelectorAll('#world>.card')].map(c=>({type:c.dataset.type,html:c.innerHTML,left:c.style.left,top:c.style.top}))));if(history.length>30)history.shift();future=[]}function restore(arr){let w=$('#world');w.innerHTML='';arr.forEach(x=>{let e=document.createElement('div');e.className='card '+x.type;e.dataset.type=x.type;e.innerHTML=x.html;e.style.left=x.left;e.style.top=x.top;w.append(e)});bindCards();save()}function bindCards(){ $$('#world>.card').forEach(card=>{card.onpointerdown=e=>{if(e.target.closest('[contenteditable],input'))return;let startX=e.clientX,startY=e.clientY,left=parseFloat(card.style.left)||0,top=parseFloat(card.style.top)||0,moved=false;card.setPointerCapture(e.pointerId);let move=x=>{let dx=(x.clientX-startX)/scale,dy=(x.clientY-startY)/scale;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;card.style.left=left+dx+'px';card.style.top=top+dy+'px'};let up=()=>{card.removeEventListener('pointermove',move);card.removeEventListener('pointerup',up);if(moved){save();toast('Saved')}};card.addEventListener('pointermove',move);card.addEventListener('pointerup',up)};card.oncontextmenu=e=>{e.preventDefault();snapshot();card.remove();save();toast('Deleted')}})}function add(type,x=200,y=160){snapshot();let e=document.createElement('div');e.className='card '+type;e.dataset.type=type;e.style.left=x+'px';e.style.top=y+'px';if(type==='note')e.innerHTML='<div class="note-title" contenteditable="true"></div><div class="note-body" contenteditable="true"></div>';if(type==='todo')e.innerHTML='<div class="todo-title" contenteditable="true"></div><label class="task"><input type="checkbox"><span contenteditable="true"></span></label>';if(type==='column')e.innerHTML='<div class="column-title" contenteditable="true"></div>';if(type==='image')e.innerHTML='<div class="image-area">+</div><div class="image-caption" contenteditable="true"></div>';if(type==='link')e.innerHTML='<div class="link-title" contenteditable="true"></div><div class="link-url" contenteditable="true"></div>';$('#world').append(e);bindCards();save();let target=e.querySelector('[contenteditable]');if(target)target.focus()}$('#newBoard').onclick=()=>{$('#modal').classList.add('open');$('#boardName').value='';$('#boardName').focus()};$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#create').onclick=()=>{let n=$('#boardName').value.trim();if(!n)return;if(!state.boards.includes(n))state.boards.push(n);state.active=n;$('#modal').classList.remove('open');$('#title').textContent=n;renderBoards();save();toast('Board created')};$('#search').oninput=renderBoards;$('#focusSearch').onclick=()=>$('#search').focus();$('#logo').onclick=()=>$('#menu').classList.toggle('open');$$('[data-add]').forEach(b=>b.onclick=()=>{let x=($('#canvas').scrollLeft+180)/scale,y=($('#canvas').scrollTop+130)/scale;add(b.dataset.add,x,y);$('#menu').classList.remove('open')});$('#world').ondblclick=e=>{if(e.target!==$('#world'))return;add('note',e.offsetX/scale,e.offsetY/scale)};function zoom(v){scale=Math.max(.5,Math.min(1.5,v));$('#world').style.transform=`scale(${scale})`;$('#world').style.transformOrigin='0 0';$('#pct').textContent=Math.round(scale*100)+'%'}$('#plus').onclick=()=>zoom(scale+.1);$('#minus').onclick=()=>zoom(scale-.1);$('#fit').onclick=()=>zoom(1);$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state.items));restore(JSON.parse(history.pop()));toast('Undo')};$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state.items));restore(JSON.parse(future.pop()));toast('Redo')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.body.innerText],{type:'text/plain'}));a.download=(state.active||'autuer-board')+'.txt';a.click()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();toast('Saved')}if(e.key==='Escape')$('#menu').classList.remove('open')});if(!state.active&&state.boards.length)state.active=state.boards[0];$('#title').textContent=state.active||'';renderBoards();loadItems();</script></body></html>
