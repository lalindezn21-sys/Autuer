<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified System</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:'DM Serif Display',Georgia,serif}.screen{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;will-change:transform}.white-screen{z-index:1;background-color:#fff;background-image:radial-gradient(circle,#e3e3e3 1px,transparent 1px);background-size:24px 24px}.red-screen{z-index:2;background:#F02D20;transform:translateY(100%)}.dream-wrap{position:absolute;left:5vw;bottom:14vh;width:90vw;display:block}.dream{width:auto;padding:0;color:#111;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(72px,13vw,210px);font-weight:400;line-height:.72;letter-spacing:-.02em;white-space:nowrap;text-align:left;transform:scaleX(1.08);transform-origin:left center}.dream span{display:block}.meta{margin-top:6.5vh;display:flex;align-items:baseline;gap:1.4rem;font-family:'Inter',Arial,sans-serif;font-size:clamp(12px,1.05vw,16px);line-height:1.2;letter-spacing:.015em}.status{font-weight:500;color:#111;text-transform:uppercase;font-size:.82em;letter-spacing:.12em}.project{font-weight:400;color:#888;position:relative;padding-left:1.2rem}.project:before{content:"";position:absolute;left:0;top:50%;width:3px;height:3px;border-radius:50%;background:#aaa;transform:translateY(-50%)}.transitioning{pointer-events:none}</style></head><body><section class="screen white-screen"><main class="dream-wrap"><div class="dream"><span>UNIFIED</span><span>SYSTEM</span></div><div class="meta"><div class="status">Currently</div><div class="project">Drown and Thirst It Is</div></div></main></section><section class="screen red-screen"></section><script>const red=document.querySelector('.red-screen');let progress=0,raf=0;const wheelScale=.11;function render(){red.style.transform=`translateY(${100-progress}%)`;raf=0}function apply(delta){progress=Math.max(0,Math.min(100,progress+delta));if(!raf)raf=requestAnimationFrame(render)}window.addEventListener('wheel',e=>apply(e.deltaY*wheelScale),{passive:true});let sy=0;window.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});window.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;apply((sy-y)*.35);sy=y},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown')apply(8);if(e.key==='ArrowUp')apply(-8);if(e.key==='PageDown')apply(100);if(e.key==='PageUp')apply(-100)});</script></body></html>
