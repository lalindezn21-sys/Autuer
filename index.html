<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auteur</title><script src="https://unpkg.com/lucide@latest"></script><style>:root{--black:#111;--gray:#686868;--light:#f6f6f4;--line:#dededb;--white:#fff;--accent:#4b365f}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:var(--black);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}.brand{font:700 22px Georgia,serif;letter-spacing:-.5px}.brandmark{font-size:9px;font-family:Inter,sans-serif;letter-spacing:.18em;color:#999;margin-left:8px}.grow{flex:1}.status{font-size:10px;color:#999}.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;color:#555}.icon:hover{background:#f1f1ef;color:#111}.primary{height:34px;padding:0 15px;border-radius:5px;background:#111;color:#fff;font-size:12px;font-weight:700}.primary:hover{background:#292929}.shell{display:flex;min-height:0;flex:1}.sidebar{width:220px;border-right:1px solid var(--line);padding:25px 13px;position:relative;background:#fff;flex:none}.navlabel{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#999;padding:0 10px 9px}.nav{width:100%;height:37px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px;text-align:left;color:#626262;font-size:12px}.nav svg{width:15px;height:15px}.nav:hover{background:#f3f3f1;color:#111}.nav.active{background:#111;color:#fff}.space{height:28px}.current{position:absolute;left:13px;right:13px;bottom:18px;border-top:1px solid var(--line);padding:13px 10px;color:#999;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;flex:1;display:flex;flex-direction:column}.scroll{flex:1;overflow:auto}.home{max-width:1160px;margin:auto;padding:64px 62px 90px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#888}.headline{font:400 42px/1.02 Georgia,serif;letter-spacing:-1.3px;margin:9px 0 12px}.intro{font-size:13px;line-height:1.65;color:#707070;max-width:640px}.launch{display:grid;grid-template-columns:1.45fr .55fr;gap:34px;margin-top:50px;align-items:start}.startbox{border-top:1px solid #111;padding-top:20px}.startbox h2{font:400 26px Georgia,serif;margin:0 0 8px}.startbox p{font-size:12px;color:#777;line-height:1.6;max-width:560px;margin:0}.statblock{border-top:1px solid #111}.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:15px 0;font-size:11px}.stat b{font-size:18px}.section{margin-top:58px}.sectionhead{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:10px;margin-bottom:14px}.sectionhead h2{font:400 22px Georgia,serif;margin:0}.sectionhead span{font-size:10px;color:#888}.filmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.film{min-height:170px;border:1px solid var(--line);padding:20px;cursor:pointer;transition:border-color .15s,transform .15s}.film:hover{border-color:#999;transform:translateY(-2px)}.filmtype{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999}.film h3{font:400 21px Georgia,serif;margin:28px 0 8px}.film p{font-size:11px;line-height:1.55;color:#777;margin:0}.empty{border:1px dashed #c9c9c6;padding:30px;text-align:center;color:#888;font-size:12px}.projecthead{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:11px;flex:none}.back{width:31px;height:31px;display:grid;place-items:center;border-radius:5px}.back:hover{background:#f2f2f0}.projecttitle{font:400 19px Georgia,serif}.tabs{height:100%;display:flex;gap:23px;margin-left:auto}.tab{height:100%;font-size:10px;color:#888;border-bottom:2px solid transparent}.tab.active{color:#111;border-color:#111;font-weight:700}.projectbody{max-width:1100px;margin:auto;padding:38px 48px 80px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.panel{border:1px solid var(--line);padding:23px}.panel h2{font:400 21px Georgia,serif;margin:0 0 20px}.field{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:17px 0 7px}.input,.textarea,.select{width:100%;border:0;border-bottom:1px solid #c8c8c5;padding:9px 2px;background:#fff;outline:none;font-size:13px}.textarea{min-height:150px;resize:vertical;line-height:1.6}.input:focus,.textarea:focus,.select:focus{border-color:#111}.lineitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.lineitem:last-child{border-bottom:0}.linebody{flex:1}.linetitle{font-size:12px;font-weight:700}.linesub{font-size:10px;color:#888;margin-top:3px}.linkbutton{font-size:10px;color:#777}.linkbutton:hover{color:#111}.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}.char{border:1px solid var(--line);padding:18px}.charname{font:400 19px Georgia,serif}.charmeta{font-size:10px;color:#888;margin-top:4px}.charbio{font-size:11px;line-height:1.55;color:#777;margin-top:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.scriptwrap{height:100%;display:flex}.sceneList{width:205px;border-right:1px solid var(--line);background:#fafaf8;padding:20px 12px;overflow:auto}.sceneList h4{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:0 9px 11px}.scene{padding:9px;border-radius:4px;font-size:10px;color:#666}.scene:hover,.scene.active{background:#ededeb;color:#111}.editor{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:3px}.format{padding:7px 8px;border-radius:4px;font-size:10px;color:#666}.format:hover{background:#eee;color:#111}.paper{width:min(800px,calc(100% - 70px));margin:42px auto 80px}.paperTitle{text-align:center;font:400 22px Georgia,serif;margin-bottom:42px}.writing{min-height:720px;outline:none;white-space:pre-wrap;font:13px/1.8 "Courier New",monospace}.writing:empty:before{content:attr(data-placeholder);color:#bbb}.modalbg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}.modalbg.open{display:flex}.modal{width:min(450px,calc(100% - 30px));background:#fff;padding:25px}.modal h2{font:400 23px Georgia,serif;margin:0 0 5px}.modal p{font-size:11px;color:#777;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:5px;font-size:11px}.colors{display:flex;gap:8px}.color{width:22px;height:22px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #bbb}.color.selected{box-shadow:0 0 0 2px #111}@media(max-width:850px){.sidebar{width:185px}.home{padding:45px 28px}.launch,.two{grid-template-columns:1fr}.projectbody{padding:28px 25px}.tabs{gap:10px}}@media(max-width:600px){.sidebar{display:none}.brandmark{display:none}.projecthead{padding:0 14px}.tabs{display:none}.sceneList{display:none}.paper{width:calc(100% - 30px)}}
</style></head><body>
<div class="app"><header class="top"><button class="icon" id="home" aria-label="Home"><i data-lucide="house"></i></button><div class="brand">Auteur<span class="brandmark">FILMMAKING WORKSPACE</span></div><div class="grow"></div><span class="status" id="status">Ready</span><button class="icon" id="refresh" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button><button class="primary" id="create">Create</button></header><div class="shell"><aside class="sidebar"><div class="navlabel">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="space"></div><div class="navlabel">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button><div class="current" id="current">No project open</div></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
const KEY='auteur-final-v4', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-neutral-v3')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};
let state={view:'dashboard',project:null,tab:'overview'};
function persist(){localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='Saved';clearTimeout(persist.t);persist.t=setTimeout(()=>$('#status').textContent='Ready',1000)}
function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}
function project(){return data.projects.find(x=>x.id===state.project)}
function navigate(view){state={view,project:null,tab:'overview'};render()}
function openModal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}
function closeModal(){$('#modalbg').classList.remove('open')}
$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};$('#home').onclick=()=>navigate('dashboard');$('#refresh').onclick=render;$$('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
function dashboard(){const recent=data.projects.slice(-5).reverse();return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A focused workspace for developing stories, characters, worlds, and screenplays without burying the work under interface.</div><div class="launch"><section class="startbox"><h2>Begin a new film</h2><p>Start with a title. Build the synopsis, storylines, characters, and screenplay around it as the project grows.</p><button class="primary" style="margin-top:18px" id="newProject">New project</button></section><section class="statblock"><div class="stat"><span>Projects</span><b>${data.projects.length}</b></div><div class="stat"><span>Screenplays</span><b>${data.scripts.length}</b></div><div class="stat"><span>Characters</span><b>${data.characters.length}</b></div></section></div><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${recent.length} project${recent.length===1?'':'s'}</span></div><div class="filmgrid">${recent.length?recent.map(x=>`<article class="film" data-open="${x.id}"><div class="filmtype">Film project</div><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty">Your projects will appear here.</div>`}</div></section></div></div>`}
function projectView(){const x=project();if(!x){navigate('dashboard');return ''}let body='';
if(state.tab==='overview')body=`<div class="two"><section class="panel"><h2>Project overview</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Synopsis</label><textarea class="textarea" id="psyn" placeholder="What is this film about?">${esc(x.synopsis||'')}</textarea></section><section class="panel"><h2>Development</h2><div class="lineitem"><div class="linebody"><div class="linetitle">Storylines</div><div class="linesub">${data.storylines.filter(s=>s.project===x.id).length} connected</div></div></div><div class="lineitem"><div class="linebody"><div class="linetitle">Characters</div><div class="linesub">${data.characters.filter(c=>c.project===x.id).length} connected</div></div></div><div class="lineitem"><div class="linebody"><div class="linetitle">Screenplay</div><div class="linesub">${data.scripts.some(s=>s.project===x.id)?'Draft exists':'No draft yet'}</div></div></div></section></div>`;
if(state.tab==='story')body=`<section class="panel"><div class="sectionhead"><div><h2>Storylines</h2><span>Threads that carry through the film.</span></div><button class="primary" id="addStory">New storyline</button></div>${data.storylines.filter(s=>s.project===x.id).map(s=>`<div class="lineitem"><div class="linebody"><div class="linetitle">${esc(s.name)}</div><div class="linesub">${esc(s.synopsis||'No synopsis')}</div></div><button class="linkbutton" data-delstory="${s.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</section>`;
if(state.tab==='characters')body=`<section><div class="sectionhead"><div><h2>Characters</h2><span>People who inhabit the film.</span></div><button class="primary" id="addChar">New character</button></div><div class="chargrid">${data.characters.filter(c=>c.project===x.id).map(c=>`<article class="char"><div><div class="charname"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</div><div class="charmeta">${esc(c.gender||'')}</div><div class="charbio">${esc(c.bio||'No bio yet.')}</div></div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></section>`;
if(state.tab==='screenplay')body=`<div class="scriptwrap"><aside class="sceneList"><h4>Scenes</h4><div class="scene active">Opening</div><div class="scene">Scene 2</div><div class="scene">Scene 3</div></aside><section class="editor"><div class="toolbar"><button class="format" data-format="INT. ">INT.</button><button class="format" data-format="EXT. ">EXT.</button><button class="format" data-format="ACTION\n">Action</button><button class="format" data-format="CHARACTER\n">Character</button><button class="format" data-format="DIALOGUE\n">Dialogue</button><span class="grow"></span><span class="status">Autosaved locally</span></div><div class="paper"><div class="paperTitle">${esc(x.name)}</div><div class="writing" id="writing" contenteditable="true" data-placeholder="Begin writing your screenplay..."></div></div></section></div>`;
return `<div class="projecthead"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projecttitle">${esc(x.name)}</div><div class="tabs">${['overview','story','characters','screenplay'].map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="projectbody">${body}</div></div>`}
function collection(){const labels={projects:'Projects',scripts:'Screenplays',story:'Storylines',characters:'Characters'};let rows='';if(state.view==='projects')rows=data.projects.map(x=>`<div class="lineitem"><div class="linebody"><div class="linetitle">${esc(x.name)}</div><div class="linesub">${esc(x.synopsis||'No synopsis')}</div></div><button class="linkbutton" data-open="${x.id}">Open</button></div>`);if(state.view==='scripts')rows=data.scripts.map(x=>`<div class="lineitem"><div class="linebody"><div class="linetitle">${esc(x.name)}</div><div class="linesub">Screenplay draft</div></div></div>`);if(state.view==='story')rows=data.storylines.map(x=>`<div class="lineitem"><div class="linebody"><div class="linetitle">${esc(x.name)}</div><div class="linesub">${esc(x.synopsis||'No synopsis')}</div></div></div>`);if(state.view==='characters')rows=data.characters.map(x=>`<div class="lineitem"><div class="linebody"><div class="linetitle">${esc(x.name)}</div><div class="linesub">${esc(x.gender||'')}</div></div></div>`);return `<div class="scroll"><div class="home"><div class="eyebrow">Development</div><div class="headline">${labels[state.view]}</div><div style="max-width:780px">${rows||'<div class="empty">Nothing here yet.</div>'}</div></div></div>`}
function render(){if(state.project)$('#main').innerHTML=projectView();else $('#main').innerHTML=state.view==='dashboard'?dashboard():collection();$('#current').textContent=project()?.name||'No project open';$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$$('[data-open]').forEach(el=>el.onclick=()=>{state.project=el.dataset.open;state.tab='overview';render()});$$('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render()});$('#back')?.addEventListener('click',()=>navigate('dashboard'));$('#newProject')?.addEventListener('click',newProject);$('#create').onclick=newProject;$('#pname')?.addEventListener('change',e=>{project().name=e.target.value.trim()||'Untitled film';persist();render()});$('#psyn')?.addEventListener('change',e=>{project().synopsis=e.target.value;persist()});$('#addStory')?.addEventListener('click',newStory);$('#addChar')?.addEventListener('click',newCharacter);$$('[data-delstory]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(s=>s.id!==b.dataset.delstory);persist();render()});$$('[data-format]').forEach(b=>b.onclick=()=>insertFormat(b.dataset.format));const w=$('#writing');if(w){const draft=data.scripts.find(s=>s.project===state.project);w.innerText=draft?.body||'';w.oninput=()=>{let s=data.scripts.find(s=>s.project===state.project);if(!s){s={id:uid(),project:state.project,name:project().name,body:''};data.scripts.push(s)}s.body=w.innerText;persist()}}icons()}
function newProject(){openModal(`<h2>New film</h2><p>Start with the title. Everything else can grow inside the project.</p><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{let x={id:uid(),name:$('#mname').value.trim()||'Untitled film',synopsis:''};data.projects.push(x);persist();closeModal();state.project=x.id;state.tab='overview';render()};$('#mname').focus()})}
function newStory(){openModal(`<h2>New storyline</h2><p>Create a narrative thread for this film.</p><input class="input" id="sname" placeholder="Untitled storyline"><label class="field">Synopsis</label><textarea class="textarea" id="ssyn" placeholder="What is this storyline about?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sname').value.trim()||'Untitled storyline',synopsis:$('#ssyn').value,project:state.project});persist();closeModal();render()};$('#sname').focus()})}
function newCharacter(){let chosen='#111';openModal(`<h2>New character</h2><p>Create a person who belongs to this film.</p><input class="input" id="cname" placeholder="Character name"><label class="field">Gender</label><select class="select" id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="bio" placeholder="Character bio"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-color="#111" style="background:#111"></button><button class="color" data-color="#555" style="background:#555"></button><button class="color" data-color="#765c42" style="background:#765c42"></button><button class="color" data-color="#4b365f" style="background:#4b365f"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');chosen=b.dataset.color});$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cname').value.trim()||'Untitled character',gender:$('#gender').value,bio:$('#bio').value,color:chosen,project:state.project});persist();closeModal();render()};$('#cname').focus()})}
function insertFormat(text){const w=$('#writing');if(!w)return;w.focus();document.execCommand('insertText',false,text)}
render();
</script></body></html>
