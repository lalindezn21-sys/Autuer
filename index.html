<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XXI New York Motion Picture CO.">
  <title>XXI New York Motion Picture CO.</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #131207;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    .brand {
      max-width: 620px;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(30px, 3.5vw, 54px);
      font-weight: 900;
      line-height: .88;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .brand span { display: block; }

    .brand .small {
      margin-top: 9px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .18em;
    }

    nav {
      display: flex;
      gap: 28px;
      padding-top: 3px;
    }

    nav a {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .78;
      transition: opacity .2s ease;
    }

    nav a:hover { opacity: 1; }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: min(46vw, 700px);
      line-height: .7;
      letter-spacing: -.08em;
      opacity: .055;
      user-select: none;
    }

    .hero-copy {
      width: min(1050px, 90%);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .hero-copy .overline {
      margin-bottom: 24px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .hero-copy h1 {
      margin: 0;
      font-size: clamp(52px, 9vw, 145px);
      line-height: .82;
      letter-spacing: -.075em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .hero-copy p {
      width: min(470px, 100%);
      margin: 30px auto 0;
      color: rgba(255,255,255,.62);
      font-size: 13px;
      line-height: 1.5;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid rgba(255,255,255,.18);
      padding-top: 16px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
    }

    .bottom .status { color: #fff; }

    @media (max-width: 700px) {
      .page { padding: 20px; }
      header { flex-direction: column; gap: 25px; }
      nav { gap: 18px; }
      .hero { min-height: 65vh; }
      .hero-copy h1 { font-size: 17vw; }
      .bottom { gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="#">
        <span>XXI</span>
        <span class="small">New York Motion Picture CO.</span>
      </a>

      <nav>
        <a href="#pictures">Pictures</a>
        <a href="#bureau">Bureau</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-mark">XXI</div>
      <div class="hero-copy">
        <div class="overline">Independent Motion Pictures · New York</div>
        <h1>We make<br>pictures.</h1>
        <p>
          Original cinema, developed independently and built to leave a mark.
        </p>
      </div>
    </main>

    <footer class="bottom">
      <span>XXI New York Motion Picture CO.</span>
      <span class="status">Currently Developing</span>
      <span>© 2026</span>
    </footer>
  </div>
</body>
</html>
