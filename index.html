ground:#eee;color:#111}.scriptArea{flex:1;display:flex;min-height:0}.scenePanel{width:230px;border-right:1px solid var(--line);background:#fafaf8;display:flex;flex-direction:column}.sceneHeader{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.sceneHeader span{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999}.sceneList{padding:9px;overflow:auto}.scene{padding:11px 10px;border-radius:4px;margin-bottom:3px;color:#666;cursor:pointer}.scene:hover,.scene.active{background:#ececea;color:#111}.sceneNum{font-size:9px;color:#999;margin-bottom:4px}.sceneName{font-size:11px}.sceneLoc{font-size:9px;color:#999;margin-top:3px}.writer{flex:1;min-width:0;display:flex;flex-direction:column}.formatbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:3px}.format{padding:6px 8px;border-radius:4px;font-size:10px;color:#666}.format:hover,.format.active{background:#eee;color:#111}.pageWrap{flex:1;overflow:auto;background:#f7f7f5;padding:35px 20px 70px}.paper{width:min(760px,100%);min-height:980px;background:#fff;margin:auto;padding:72px 90px;box-shadow:0 0 0 1px #e5e5e2}.paperTitle{text-align:center;font:400 22px Georgia,serif;margin-bottom:50px}.writing{min-height:820px;outline:none;white-space:pre-wrap;font:13px/1.8 "Courier New",monospace}.writing:empty:before{content:attr(data-placeholder);color:#bbb}.scriptSide{width:220px;border-left:1px solid var(--line);padding:18px;background:#fff;overflow:auto}.scriptSide h4{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:0 0 12px}.sideBlock{border-bottom:1px solid var(--line);padding:0 0 15px;margin-bottom:17px}.sideStat{display:flex;justify-content:space-between;font-size:10px;padding:7px 0}.notes{width:100%;min-height:120px;border:1px solid var(--line);resize:vertical;padding:9px;font-size:10px;outline:none}.modalbg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}.modalbg.open{display:flex}.modal{width:min(450px,calc(100% - 30px));background:#fff;padding:24px}.modal h2{font:400 22px Georgia,serif;margin:0 0 5px}.modal p{font-size:11px;color:#777;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.colors{display:flex;gap:8px}.color{width:21px;height:21px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.color.selected{box-shadow:0 0 0 2px #111}@media(max-width:1000px){.scriptSide{display:none}}@media(max-width:800px){.side{width:170px}.home{padding:42px 25px}.start,.cols{display:block}.start .primary{margin-top:16px}.panel{margin-bottom:14px}.body,.page{padding:25px}.tabs{gap:10px}.scenePanel{width:190px}}@media(max-width:560px){.side{display:none}.tabs{display:none}.scenePanel{display:none}.paper{padding:45px 25px}.home,.page{padding:35px 18px}}</style></head><body><div class="app"><header class="top"><div class="logo">Auteur</div><div class="grow"></div><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>const KEY='auteur-pro-v6',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-clean-v5')||'null')||JSON.parse(localStorage.getItem('auteur-final-v4')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};data.projects=data.projects||[];data.scripts=data.scripts||[];data.storylines=data.storylines||[];data.characters=data.characters||[];let state={view:'dashboard',project:null,tab:'overview',scene:0};function save(){localStorage.setItem(KEY,JSON.stringify(data))}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function p(){return data.projects.find(x=>x.id===state.project)}function nav(view){state={view,project:null,tab:'overview',scene:0};render()}function openModal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}function closeModal(){$('#modalbg').classList.remove('open')}$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));$('#create').onclick=newProject;function dashboard(){let recent=data.projects.slice(-5).reverse();return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A focused workspace for developing stories, characters, worlds, and screenplays without burying the work under interface.</div><section class="start"><div><h2>Begin a new film</h2><p>Start with a title and build the project around it.</p></div><button class="primary" id="newProject">New project</button></section><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${recent.length}</span></div><div class="grid">${recent.length?recent.map(x=>`<article class="film" data-open="${x.id}"><small>Film project</small><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty">Your projects will appear here.</div>`}</div></section></div></div>`}function projectsPage(){return `<div class="scroll"><div class="page"><div class="eyebrow">Workspace</div><div class="headline">Projects</div><div class="intro">Every film in development, with its story, people, and screenplay connected.</div><div class="toolbarline" style="margin-top:30px"><input class="search" id="projectSearch" placeholder="Search projects..."><select class="select" id="projectSort"><option value="recent">Recently created</option><option value="name">Name</option></select><button class="primary" id="newProjectPage">New project</button></div><div class="projectgrid" id="projectGrid">${projectCards(data.projects)}</div></div></div>`}function projectCards(list){if(!list.length)return '<div class="empty">No projects found.</div>';return list.slice().reverse().map(x=>{let chars=data.characters.filter(c=>c.project===x.id).length,stories=data.storylines.filter(s=>s.project===x.id).length,script=data.scripts.find(s=>s.project===x.id);return `<article class="projectcard" data-open="${x.id}"><button class="cardmenu" data-deleteproject="${x.id}">Delete</button><div class="projecttop"><span class="tag">Film</span><span class="tag">${script?'Draft':'Development'}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p><div class="metaRow"><span><strong>${stories}</strong> storylines</span><span><strong>${chars}</strong> characters</span><span><strong>${script?'1':'0'}</strong> draft</span></div></article>`}).join('')}function scriptsPage(){let scripts=data.scripts;let projects=data.projects;return `<div class="scroll"><div class="page"><div class="eyebrow">Workspace</div><div class="headline">Screenplays</div><div class="intro">Your drafts, organized by film. Open a screenplay to write, navigate scenes, and track the draft.</div><div class="toolbarline" style="margin-top:30px"><input class="search" id="scriptSearch" placeholder="Search screenplays..."><button class="primary" id="newScript">New screenplay</button></div><div class="projectgrid" id="scriptGrid">${scripts.length?scripts.map(s=>{let pr=projects.find(x=>x.id===s.project);return `<article class="projectcard" data-script="${s.id}"><div class="projecttop"><span class="tag">Screenplay</span><span class="tag">${esc(s.status||'Draft')}</span></div><h3>${esc(s.name)}</h3><p>${esc(pr?.name||'Unassigned project')}</p><div class="metaRow"><span><strong>${s.pages||1}</strong> pages</span><span><strong>${s.scenes?.length||1}</strong> scenes</span><span>Updated</span></div></article>`}).join(''):`<div class="empty">No screenplays yet. Open a project and start a draft.</div>`}</div></div></div>`}function projectView(){let x=p();if(!x){nav('dashboard');return ''}let body='';if(state.tab==='overview')body=`<div class="cols"><section class="panel"><h2>Overview</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Logline</label><textarea class="textarea" id="plog" placeholder="The film in one sentence...">${esc(x.logline||'')}</textarea><label class="field">Synopsis</label><textarea class="textarea" id="psyn" placeholder="What is this film about?">${esc(x.synopsis||'')}</textarea><label class="field">Genre</label><input class="input" id="pgenre" value="${esc(x.genre||'')}" placeholder="Psychological thriller, drama..."></section><section class="panel"><h2>Project details</h2><div class="item"><div class="itembody"><div class="itemtitle">Storylines</div><div class="itemsub">${data.storylines.filter(s=>s.project===x.id).length} connected</div></div></div><div class="item"><div class="itembody"><div class="itemtitle">Characters</div><div class="itemsub">${data.characters.filter(c=>c.project===x.id).length} connected</div></div></div><div class="item"><div class="itembody"><div class="itemtitle">Screenplay</div><div class="itemsub">${data.scripts.some(s=>s.project===x.id)?'Draft in progress':'Not started'}</div></div></div><label class="field">Target runtime</label><input class="input" id="pruntime" value="${esc(x.runtime||'')}" placeholder="2h 20m"><label class="field">Status</label><select class="selectField" id="pstatus"><option ${x.status==='Idea'?'selected':''}>Idea</option><option ${x.status==='Development'?'selected':''}>Development</option><option ${x.status==='Writing'?'selected':''}>Writing</option><option ${x.status==='Complete'?'selected':''}>Complete</option></select></section></div>`;if(state.tab==='story')body=`<section class="panel"><div class="sectionhead"><div><h2>Storylines</h2><span>Threads through the film.</span></div><button class="primary" id="addStory">New storyline</button></div>${data.storylines.filter(s=>s.project===x.id).map(s=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(s.name)}</div><div class="itemsub">${esc(s.synopsis||'No synopsis')}</div></div><button class="textbtn" data-delstory="${s.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</section>`;if(state.tab==='characters')body=`<section><div class="sectionhead"><div><h2>Characters</h2><span>People in the film.</span></div><button class="primary" id="addChar">New character</button></div><div class="chargrid">${data.characters.filter(c=>c.project===x.id).map(c=>`<article class="char"><div class="charname"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</div><div class="meta">${esc(c.gender||'')}</div><div class="bio">${esc(c.bio||'No bio yet.')}</div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></section>`;if(state.tab==='screenplay')return screenplayView(x);return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projectname">${esc(x.name)}</div><div class="tabs">${['overview','story','characters','screenplay'].map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="body">${body}</div></div>`}function screenplayView(x){let s=data.scripts.find(z=>z.project===x.id);if(!s){s={id:uid(),name:x.name+' — Screenplay',project:x.id,status:'Draft',pages:1,scenes:[{id:uid(),name:'Opening',location:'INT. / EXT.',text:''}],active:0,notes:''};data.scripts.push(s);save()}let scene=s.scenes[s.active||0]||s.scenes[0];return `<div class="scriptPage"><div class="scriptTop"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="scriptTitle">${esc(s.name)}</div><span class="scriptMeta">${esc(s.status)} · ${s.pages||1} page${(s.pages||1)===1?'':'s'}</span><div class="scriptTools"><button class="tool" id="scriptSettings">Details</button><button class="tool" id="addSceneTop">New scene</button></div></div><div class="scriptArea"><aside class="scenePanel"><div class="sceneHeader"><span>Scenes</span><button class="tool" id="addScene"><i data-lucide="plus"></i></button></div><div class="sceneList">${s.scenes.map((q,i)=>`<div class="scene ${i===s.active?'active':''}" data-scene="${i}"><div class="sceneNum">${String(i+1).padStart(2,'0')}</div><div class="sceneName">${esc(q.name||'Untitled scene')}</div><div class="sceneLoc">${esc(q.location||'')}</div></div>`).join('')}</div></aside><section class="writer"><div class="formatbar"><button class="format active" data-f="SCENE">Scene Heading</button><button class="format" data-f="ACTION">Action</button><button class="format" data-f="CHARACTER">Character</button><button class="format" data-f="DIALOGUE">Dialogue</button><button class="format" data-f="PARENTHETICAL">Parenthetical</button><button class="format" data-f="TRANSITION">Transition</button></div><div class="pageWrap"><div class="paper"><div class="paperTitle">${esc(x.name)}</div><div class="writing" id="editor" contenteditable="true" data-placeholder="Begin writing this scene..."></div></div></div></section><aside class="scriptSide"><div class="sideBlock"><h4>Draft</h4><div class="sideStat"><span>Scenes</span><strong>${s.scenes.length}</strong></div><div class="sideStat"><span>Pages</span><strong id="pageCount">${s.pages||1}</strong></div><div class="sideStat"><span>Status</span><strong>${esc(s.status)}</strong></div></div><div class="sideBlock"><h4>Scene</h4><div class="sideStat"><span>Location</span><strong>${esc(scene.location||'Unset')}</strong></div><div class="sideStat"><span>Words</span><strong id="wordCount">0</strong></div></div><div class="sideBlock"><h4>Notes</h4><textarea class="notes" id="scriptNotes" placeholder="Notes for this draft...">${esc(s.notes||'')}</textarea></div></aside></div></div>`}function listView(){let title=state.view==='story'?'Storylines':'Characters';let rows=state.view==='story'?data.storylines:data.characters;return `<div class="scroll"><div class="page"><div class="eyebrow">Development</div><div class="headline">${title}</div><div class="grid">${rows.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemsub">${esc(x.synopsis||x.bio||'')}</div></div></div>`).join('')||'<div class="empty">Nothing here yet.</div>'}</div></div>`}function newProject(){openModal(`<h2>New film</h2><p>Give the project a name. You can build everything else inside it.</p><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{let x={id:uid(),name:$('#mname').value.trim()||'Untitled film',synopsis:'',logline:'',genre:'',runtime:'',status:'Idea'};data.projects.push(x);save();closeModal();state.project=x.id;state.tab='overview';render()};$('#mname').focus()})}function storyModal(){openModal(`<h2>New storyline</h2><p>Define a thread that carries through the film.</p><input class="input" id="sname" placeholder="Untitled storyline"><label class="field">Synopsis</label><textarea class="textarea" id="ssyn" placeholder="What is this storyline about?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sname').value.trim()||'Untitled storyline',synopsis:$('#ssyn').value,project:state.project});save();closeModal();render()};$('#sname').focus()})}function charModal(){openModal(`<h2>New character</h2><p>Create a character connected to this film.</p><input class="input" id="cname" placeholder="Character name"><label class="field">Gender</label><select class="selectField" id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="bio" placeholder="Character bio"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-color="#111" style="background:#111"></button><button class="color" data-color="#555" style="background:#555"></button><button class="color" data-color="#8b6f47" style="background:#8b6f47"></button><button class="color" data-color="#777" style="background:#777"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{let color='#111';$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(q=>q.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cname').value.trim()||'Untitled character',gender:$('#gender').value,bio:$('#bio').value,color,project:state.project});save();closeModal();render()};$('#cname').focus()})}function render(){if(state.project)$('#main').innerHTML=projectView();else if(state.view==='dashboard')$('#main').innerHTML=dashboard();else if(state.view==='projects')$(' aset.open;state.tab='overview';render()})});$('#projectSort')?.addEventListener('change',e=>{let a=[...data.projects];if(e.target.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name));$('#projectGrid').innerHTML=projectCards(a);$$('[data-open]').forEach(x=>x.onclick=()=>{state.project=x.dataset.open;state.tab='overview';render()})});$('#scriptSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();$$('[data-script]').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none')});$$('[data-script]').forEach(e=>e.onclick=()=>{let s=data.scripts.find(x=>x.id===e.dataset.script);state.project=s.project;state.tab='screenplay';render()});if(state.tab==='screenplay'&&state.project){bindEditor()}icons()}function bindEditor(){let s=data.scripts.find(z=>z.project===state.project);if(!s)return;let scene=s.scenes[s.active||0]||s.scenes[0],ed=$('#editor');if(!ed)return;ed.innerText=scene.text||'';$('#wordCount').textContent=(scene.text||'').trim().split(/\s+/).filter(Boolean).length;ed.oninput=()=>{scene.text=ed.innerText;s.pages=Math.max(1,Math.ceil(scene.text.length/1800));$('#wordCount').textContent=scene.text.trim().split(/\s+/).filter(Boolean).length;$('#pageCount').textContent=s.pages;save()};$('#scriptNotes').oninput=e=>{s.notes=e.target.value;save()};$$('[data-scene]').forEach(e=>e.onclick=()=>{s.active=Number(e.dataset.scene);state.scene=s.active;render()});$$('[data-f]').forEach(b=>b.onclick=()=>{ed.focus();let f=b.dataset.f;let text=f==='SCENE'?'INT. LOCATION - DAY':f==='CHARACTER'?'CHARACTER NAME':f==='DIALOGUE'?'Dialogue goes here.':f==='PARENTHETICAL'?'(quietly)':f==='TRANSITION'?'CUT TO:':'Action goes here.';document.execCommand('insertText',false,'\n'+text+'\n');scene.text=ed.innerText;save()});$('#addScene')?.addEventListener('click',addScene);$('#addSceneTop')?.addEventListener('click',addScene);$('#scriptSettings')?.addEventListener('click',()=>scriptDetails(s));}function addScene(){let s=data.scripts.find(z=>z.project===s
