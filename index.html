       RESET

    * {
      box-sizing: border-box;

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* prevent natural scroll – gestures only drive the transition */
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* =========================================================
       LANDING PAGE
    ========================================================= */
    .landing {
      height: 100vh;
      width: 100%;
      position: relative;
      z-index: 20;
      background: #ffffff;
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }

    body.dashboard-active .landing {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
