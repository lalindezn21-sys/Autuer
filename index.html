<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title><style>:root{--accent:#6d4aff;--accent-soft:#f1edff;--bg:#fff;--side:#f7f8fa;--line:#e6e8ec;--text:#24272c;--muted:#858b95}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:4px}.icon{width:34px;height:34px;border-radius:8px;font-size:19px}.icon:hover{background:#f0f1f4}.spacer{flex:1}.status{font-size:12px;color:var(--muted);margin-right:8px}.create{height:34px;padding:0 15px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700}.layout{height:calc(100% - 54px);display:flex}.sidebar{width:315px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}.profile{height:64px;padding:0 18px;display:flex;align-items:center;gap:10px;font-weight:650}.avatar{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#dfe4ff;color:#4f3bc7;font-size:11px}.nav{padding:0 6px}.nav button{width:100%;height:43px;padding:0 13px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}.nav button:hover{background:#eef0f3}.nav button.active{background:var(--accent-soft);color:#5134d0;box-shadow:inset 0 0 0 1px var(--accent)}.plus{margin-left:auto;color:var(--muted);font-size:20px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.heading{height:70px;border-bottom:1px solid #eef0f2;padding:0 37px;display:flex;align-items:center;font-size:20px;font-weight:700}.content{padding:28px 37px;overflow:auto}.search{height:57px;border-radius:30px;background:#f2f3f6;display:flex;align-items:center;padding:0 20px;gap:12px}.search span{font-size:25px}.search input{flex:1;border:0;outline:0;background:transparent;font-size:17px;color:var(--text)}.search input::placeholder{color:#b4bac2}.section{margin-top:30px}.section-title{font-size:16px;font-weight:700;margin-bottom:12px}.recent,.files{border-top:1px solid var(--line)}.empty,.file{min-height:64px;display:flex;align-items:center;padding:0 13px;color:#a0a7af;font-size:13px}.file{gap:13px;border-bottom:1px solid #eef0f2;color:var(--text)}.file-icon{width:27px;height:27px;border:2px solid #b1b8bf;border-radius:5px;display:grid;place-items:center;color:#9098a1;font-size:12px;flex:none}.file-name{font-size:14px;font-weight:600}.tabs{margin-top:28px;height:44px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:14px}.tab{padding:0 0 12px;color:#858d96;font-size:15px;font-weight:600}.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}.controls{margin-left:auto;display:flex;gap:5px;padding-bottom:7px}.control{padding:6px 8px;border-radius:6px;color:#7f8790;font-size:13px}.control:hover,.control.active{background:#f0f1f4;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding-top:15px}.grid .file{border:1px solid var(--line);border-radius:9px;min-height:90px;background:#fff}.modal-bg{display:none;position:fixed;inset:0;background:#20242b55;align-items:center;justify-content:center;z-index:10}.modal-bg.open{display:flex}.modal{width:min(400px,calc(100% - 30px));background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0003}.modal h2{margin:0 0 16px;font-size:20px}.modal input{width:100%;padding:11px;border:1px solid #d6dbe0;border-radius:7px;outline:0}.modal input:focus{border-color:var(--accent)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{padding:9px 14px;border-radius:7px;font-weight:700}.confirm{background:var(--accent);color:#fff}.toast{position:fixed;right:20px;bottom:20px;background:#282c33;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;opacity:0;transform:translateY(6px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:650px){.sidebar{width:230px}.content,.heading{padding-left:20px;padding-right:20px}}@media(max-width:500px){.sidebar{display:none}.content{padding:20px 15px}.heading{padding:0 15px}}</style></head><body><header class="top"><button class="icon" id="home" title="Dashboard">⌂</button><button class="icon" id="searchBtn" title="Search">⌕</button><span class="spacer"></span><span class="status" id="status">Ready</span><button class="icon" id="refresh" title="Refresh">↻</button><button class="create" id="create">＋ Create</button></header><div class="layout"><aside class="sidebar"><div class="profile"><span class="avatar">A</span>Autuer <span style="color:#9298a0">⌄</span></div><nav class="nav"><button class="active" data-page="Dashboard">⌂ Dashboard</button><button data-page="Scripts">▤ Scripts <span class="plus" id="scriptPlus">＋</span></button><button data-page="Projects">⊞ Projects</button></nav></aside><main class="main"><div class="heading" id="heading">Dashboard</div><div class="content"><label class="search"><span>⌕</span><input id="search" placeholder="Search scripts..."></label><section class="section"><div class="section-title">Recently edited</div><div class="recent" id="recent"><div class="empty">No scripts yet</div></div></section><div class="tabs"><button class="tab active" data-filter="all">All Files</button><button class="tab" data-filter="scripts">My Files</button><button class="tab" data-filter="shared">Shared With Me</button><button class="tab" data-filter="archived">Archived</button><div class="controls"><button class="control" id="sort">by last edited⌄</button><button class="control active" id="list">▤</button><button class="control" id="grid">▦</button></div></div><div id="files" class="files"><div class="empty">Your workspace is empty</div></div></div></main></div><div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle">New Script</h2><input id="name" autocomplete="off"><div class="actions"><button id="cancel">Cancel</button><button class="confirm" id="confirm">Create</button></div></div></div><div class="toast" id="toast"></div><script>const KEY='autuer-dashboard-v3',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data=JSON.parse(localStorage.getItem(KEY)||'{"scripts":[],"projects":[]}'),createType='script',filter='all',gridMode=false;function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='Saved'}function toast(v){let t=$('#toast');t.textContent=v;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}function openCreate(type){createType=type;$('#modalTitle').textContent=type==='script'?'New Script':'New Project';$('#name').placeholder=type==='script'?'Screenplay title':'Project name';$('#name').value='';$('#modalBg').classList.add('open');$('#name').focus()}function items(){let a=filter==='scripts'?data.scripts:filter==='shared'||filter==='archived'?[]:[...data.scripts,...data.projects];let q=$('#search').value.trim().toLowerCase();return a.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated)}function fileHtml(x){let icon=x.kind==='project'?'⊞':'▤';return `<div class="file"><span class="file-icon">${icon}</span><span class="file-name">${esc(x.name)}</span></div>`}function render(){let scripts=[...data.scripts].sort((a,b)=>b.updated-a.updated).slice(0,5);$('#recent').innerHTML=scripts.length?scripts.map(fileHtml).join(''):'<div class="empty">No scripts yet</div>';let all=items();$('#files').className=gridMode?'grid':'files';$('#files').innerHTML=all.length?all.map(fileHtml).join(''):'<div class="empty">Your workspace is empty</div>'}$('#create').onclick=()=>openCreate('script');$('#scriptPlus').onclick=e=>{e.stopPropagation();openCreate('script')};$('#confirm').onclick=()=>{let name=$('#name').value.trim();if(!name)return;let key=createType==='script'?'scripts':'projects';data[key].push({id:crypto.randomUUID(),name,kind:createType,updated:Date.now()});save();render();$('#modalBg').classList.remove('open');toast(createType==='script'?'Script created':'Project created')};$('#cancel').onclick=()=>$('#modalBg').classList.remove('open');$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')$('#modalBg').classList.remove('open')};$('#name').onkeydown=e=>{if(e.key==='Enter')$('#confirm').click();if(e.key==='Escape')$('#cancel').click()};$('#search').oninput=render;$('#searchBtn').onclick=()=>$('#search').focus();$('#home').onclick=()=>{$$('.nav button').forEach(b=>b.classList.remove('active'));$('[data-page="Dashboard"]').classList.add('active');$('#heading').textContent='Dashboard';filter='all';render()};$('#refresh').onclick=()=>{render();toast('Refreshed')};$$('[data-page]').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#heading').textContent=b.dataset.page;filter=b.dataset.page==='Scripts'?'scripts':'all';render()});$$('[data-filter]').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter==='scripts'?'scripts':b.dataset.filter;render()});$('#sort').onclick=()=>{data.scripts.sort((a,b)=>b.updated-a.updated);data.projects.sort((a,b)=>b.updated-a.updated);render();toast('Sorted by last edited')};$('#list').onclick=()=>{gridMode=false;$('#list').classList.add('active');$('#grid').classList.remove('active');render()};$('#grid').onclick=()=>{gridMode=true;$('#grid').classList.add('active');$('#list').classList.remove('active');render()};render();</script></body></html>
