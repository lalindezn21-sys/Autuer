<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether — Film Development</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f6f3ef;--surface:#fff;--panel:#efece7;--hover:#e9e5df;--border:#e0dbd3;--text:#1c1917;--text2:#57534e;--muted:#a8a29e;--accent:#4f46e5;--accent-soft:#eef2ff;--danger:#b91c1c;--danger-soft:#fee2e2;--success:#15803d;--warn:#b45309;--warn-soft:#fef3c7;--serif:'EB Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--sw:232px;--swc:56px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,textarea,select{font-family:inherit}
.serif{font-family:var(--serif)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#4338ca}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--hover)}
.btn-ghost{background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger)}.btn-danger:hover{background:var(--danger-soft)}
.btn-icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.btn-icon:hover{background:var(--hover);color:var(--text)}
.field{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;color:var(--text)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--muted)}
.tarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;color:var(--text);resize:vertical;min-height:64px;line-height:1.5}
.tarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sidebar{width:var(--sw);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
.sidebar.collapsed{width:var(--swc)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:6px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;position:relative;white-space:nowrap}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-group{display:none}
.sidebar.collapsed .nav-item.active::before{display:none}
.tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--text);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;z-index:50}
.sidebar.collapsed .nav-item:hover .tip{opacity:1}
.nav-group{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:.12s}
.card:hover{border-color:#d0c9be;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card:hover .card-actions{opacity:1!important}
.badge{display:inline-flex;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.badge-1{background:#f5f5f4;color:#78716c}.badge-2{background:#ccfbf1;color:#0d9488}.badge-3{background:#dbeafe;color:#2563eb}
.badge-4{background:#ede9fe;color:#7c3aed}.badge-5{background:#ffedd5;color:#c2410c}.badge-6{background:#dcfce7;color:#15803d}
.modal-bg{position:fixed;inset:0;background:rgba(28,25,23,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:400px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.12)}
.cmd-bg{position:fixed;inset:0;background:rgba(28,25,23,.35);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:110}
.cmd-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:500px;box-shadow:0 24px 48px rgba(0,0,0,.14);overflow:hidden}
.cmd-item:hover{background:var(--hover)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.row:hover{background:var(--hover)}.row.active{background:var(--accent-soft)}.row:last-child{border-bottom:none}
.entity{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer}
.entity:hover{border-color:#d0c9be}.entity.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sp{font-family:'Courier New',Courier,monospace;font-size:13.5px;line-height:1.4;background:#faf9f7;border:1px solid var(--border);border-radius:8px;padding:40px 48px;min-height:480px;max-width:660px;margin:0 auto;white-space:pre-wrap;outline:none;color:#1a1a1a}
.sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
</style>
</head>
<body>
<div id="app" style="height:100%;display:flex;flex-direction:column"></div>
<script>
(function(){
"use strict";
var STAGES=[{id:1,name:"Concept"},{id:2,name:"Foundation"},{id:3,name:"Development"},{id:4,name:"Screenplay"},{id:5,name:"Revision"},{id:6,name:"Production Ready"}];
var NAV=[{id:"overview",label:"Overview",icon:"layout-dashboard"},{id:"characters",label:"Characters",icon:"users"},{id:"story",label:"Story",icon:"book-open"},{id:"structure",label:"Structure",icon:"git-branch"},{id:"world",label:"World",icon:"globe"},{id:"scenes",label:"Scenes",icon:"clapperboard"},{id:"screenplay",label:"Screenplay",icon:"file-text"},{id:"notes",label:"Notes",icon:"sticky-note"}];
var KEY="aether_v2",UIKEY="aether_ui_v2";
var S={projects:[],pid:null,view:"library",section:"overview",q:"",collapsed:false,modal:null,cmd:false,cmdQ:"",selChar:null,selScene:null,selNote:null,selSL:null,selLoc:null,worldTab:"locations",charQ:"",noteQ:"",spHist:[],spIdx:-1};

function uid(p){return (p||"x")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toISOString()}
function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(iso){if(!iso)return"—";var d=new Date(iso),t=new Date(),y=new Date(t);y.setDate(y.getDate()-1);if(d.toDateString()===t.toDateString())return"Today, "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});if(d.toDateString()===y.toDateString())return"Yesterday";return d.toLocaleDateString([],{month:"short",day:"numeric"})}
function stage(id){for(var i=0;i<STAGES.length;i++)if(STAGES[i].id===id)return STAGES[i];return STAGES[0]}
function proj(){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===S.pid)return S.projects[i];return null}

function emptyProject(o){var p={id:uid("p"),title:"Untitled Project",genre:"",stage:1,description:"",logline:"",tone:"",themes:"",centralQuestion:"",premise:"",synopsis:"",priorities:"",centralConflict:"",stakes:"",protagonist:"",antagonisticForce:"",endingConcept:"",overviewComplete:false,createdAt:now(),updatedAt:now(),characters:[],storylines:[],acts:[{id:uid("act"),name:"Act I",order:0},{id:uid("act"),name:"Act II",order:1},{id:uid("act"),name:"Act III",order:2}],beats:[],locations:[],worldRules:[],research:[],scenes:[],screenplay:{content:"",updatedAt:now()},notes:[]};if(o)for(var k in o)if(o.hasOwnProperty(k))p[k]=o[k];return p}
function emptyChar(o){var c={id:uid("ch"),name:"New Character",role:"",age:"",description:"",personality:"",goals:"",wants:"",needs:"",fears:"",flaws:"",strengths:"",motivation:"",internalConflict:"",externalConflict:"",backstory:"",arc:"",beginning:"",midpoint:"",ending:"",notes:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))c[k]=o[k];return c}
function emptySL(o){var s={id:uid("sl"),title:"Storyline",description:"",theme:"",characters:"",beginning:"",development:"",majorEvents:"",resolution:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))s[k]=o[k];return s}
function emptyBeat(o){var b={id:uid("bt"),actId:"",title:"New Beat",description:"",order:0,createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))b[k]=o[k];return b}
function emptyLoc(o){var l={id:uid("loc"),name:"New Location",description:"",atmosphere:"",visualIdentity:"",details:"",characters:"",scenes:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))l[k]=o[k];return l}
function emptyRule(o){var r={id:uid("rule"),rule:"",explanation:"",consequences:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))r[k]=o[k];return r}
function emptyRes(o){var r={id:uid("res"),title:"",notes:"",source:"",tags:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))r[k]=o[k];return r}
function emptyScene(o){var s={id:uid("sc"),number:0,title:"New Scene",location:"",time:"",characters:"",storyline:"",theme:"",purpose:"",conflict:"",emotionalChange:"",summary:"",notes:"",order:0,createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))s[k]=o[k];return s}
function emptyNote(o){var n={id:uid("note"),title:"Untitled Note",body:"",tags:"",createdAt:now(),updatedAt:now()};if(o)for(var k in o)if(o.hasOwnProperty(k))n[k]=o[k];return n}

function migrate(p){var b=emptyProject(),m={},k;for(k in b)if(b.hasOwnProperty(k))m[k]=b[k];for(k in p)if(p.hasOwnProperty(k))m[k]=p[k];if(!Array.isArray(m.characters))m.characters=[];if(!Array.isArray(m.storylines))m.storylines=[];if(!Array.isArray(m.acts)||!m.acts.length)m.acts=b.acts;if(!Array.isArray(m.beats))m.beats=[];if(!Array.isArray(m.locations))m.locations=[];if(!Array.isArray(m.worldRules))m.worldRules=[];if(!Array.isArray(m.research))m.research=[];if(!Array.isArray(m.scenes))m.scenes=[];if(!Array.isArray(m.notes))m.notes=[];if(!m.screenplay||typeof m.screenplay!=="object")m.screenplay={content:"",updatedAt:now()};if(typeof m.overviewComplete!=="boolean")m.overviewComplete=!!(m.logline||m.synopsis||m.premise||m.stage>1);return m}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var parsed=JSON.parse(raw),list=parsed.projects||[];S.projects=[];for(var i=0;i<list.length;i++)S.projects.push(migrate(list[i]))}if(!S.projects.length){var old=localStorage.getItem("aether_projects_v1");if(old){var op=JSON.parse(old),ol=op.projects||[];for(var j=0;j<ol.length;j++)S.projects.push(migrate(ol[j]));if(S.projects.length)save()}}var ui=localStorage.getItem(UIKEY);if(ui){var u=JSON.parse(ui);S.collapsed=!!u.collapsed}}catch(e){console.warn(e);S.projects=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({projects:S.projects,version:2}))}catch(e){console.warn(e)}}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify({collapsed:S.collapsed}))}catch(e){}}
function flash(){var el=document.querySelector(".save-ind");if(!el)return;el.textContent="Saving…";el.style.color="var(--accent)";setTimeout(function(){el.textContent="Saved";el.style.color="var(--success)";setTimeout(function(){var p=proj();el.textContent="Last saved "+fmt(p?p.updatedAt:null);el.style.color=""},1400)},250)}
function upd(id,fields){for(var i=0;i<S.projects.length;i++){if(S.projects[i].id===id){for(var k in fields)if(fields.hasOwnProperty(k))S.projects[i][k]=fields[k];S.projects[i].updatedAt=now();save();flash();return S.projects[i]}}return null}
function updEnt(pid,col,eid,fields){var p=null;for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===pid){p=S.projects[i];break}if(!p||!Array.isArray(p[col]))return null;for(var j=0;j<p[col].length;j++){if(p[col][j].id===eid){for(var k in fields)if(fields.hasOwnProperty(k))p[col][j][k]=fields[k];p[col][j].updatedAt=now();p.updatedAt=now();save();flash();return p[col][j]}}return null}
function addEnt(pid,col,ent){var p=null;for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===pid){p=S.projects[i];break}if(!p)return null;if(!Array.isArray(p[col]))p[col]=[];p[col].push(ent);p.updatedAt=now();save();flash();return ent}
function delEnt(pid,col,eid){var p=null;for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===pid){p=S.projects[i];break}if(!p||!Array.isArray(p[col]))return;var next=[];for(var j=0;j<p[col].length;j++)if(p[col][j].id!==eid)next.push(p[col][j]);p[col]=next;p.updatedAt=now();save();flash()}
function createProj(data){var p=emptyProject(data||{});S.projects.unshift(p);save();return p}
function deleteProj(id){var next=[];for(var i=0;i<S.projects.length;i++)if(S.projects[i].id!==id)next.push(S.projects[i]);S.projects=next;if(S.pid===id){S.pid=null;S.view="library"}save()}
function dupProj(id){var orig=null;for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id){orig=S.projects[i];break}if(!orig)return null;var copy=emptyProject(JSON.parse(JSON.stringify(orig)));copy.id=uid("p");copy.title=orig.title+" (Copy)";copy.createdAt=now();copy.updatedAt=now();S.projects.unshift(copy);save();return copy}
function openProj(id){S.pid=id;S.view="workspace";S.section="overview";S.selChar=null;S.selScene=null;S.selNote=null;S.selSL=null;S.selLoc=null;render()}
function toLib(){S.pid=null;S.view="library";S.q="";render()}
function setSec(sec){S.section=sec;S.selChar=null;S.selScene=null;S.selNote=null;S.selSL=null;S.selLoc=null;render()}
function toggleSide(){S.collapsed=!S.collapsed;saveUI();render()}
function openModal(type,data){S.modal={type:type,data:data||{}};render()}
function closeModal(){S.modal=null;render()}
function openCmd(){S.cmd=true;S.cmdQ="";render()}
function closeCmd(){S.cmd=false;S.cmdQ="";render()}

function render(){var app=document.getElementById("app");if(!app)return;try{if(S.view==="library")app.innerHTML=rLibrary();else app.innerHTML=rWorkspace();if(S.modal)app.insertAdjacentHTML("beforeend",rModal());if(S.cmd)app.insertAdjacentHTML("beforeend",rCmd());if(window.lucide)lucide.createIcons();bind()}catch(err){console.error(err);app.innerHTML='<div style="padding:48px;text-align:center"><p style="font-size:18px;margin-bottom:8px">Error</p><p style="color:#78716c;margin-bottom:16px">'+esc(String(err.message||err))+'</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>'}}

function rLibrary(){var q=S.q.toLowerCase().trim(),list=[];for(var i=0;i<S.projects.length;i++){var p=S.projects[i];if(!q||(p.title||"").toLowerCase().indexOf(q)>=0||(p.genre||"").toLowerCase().indexOf(q)>=0||(p.description||"").toLowerCase().indexOf(q)>=0)list.push(p)}var body="";if(list.length===0){if(q)body='<div class="empty"><p style="color:var(--text2)">No matches for "'+esc(q)+'"</p></div>';else body='<div class="empty"><div style="width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px"><i data-lucide="film" style="width:24px;height:24px;color:var(--accent)"></i></div><p class="serif" style="font-size:20px;font-weight:600;margin-bottom:6px">Start your first project</p><p style="font-size:14px;color:var(--muted);margin-bottom:24px;max-width:320px">Create a project, set the foundation, then develop characters, structure, and screenplay.</p><button class="btn btn-primary" id="btn-new">+ Create Project</button></div>'}else{body='<p style="font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:500">'+list.length+' project'+(list.length!==1?"s":"")+'</p><div style="display:grid;gap:10px">';for(var j=0;j<list.length;j++)body+=rCard(list[j]);body+="</div>"}return '<div style="height:100%;display:flex;flex-direction:column"><header style="flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px"><div style="max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px"><div style="display:flex;align-items:center;gap:12px"><div style="width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div><div><div class="serif" style="font-size:17px;font-weight:600;line-height:1.2">Aether</div><div style="font-size:11px;color:var(--muted);font-weight:500">Film Development</div></div></div><div style="display:flex;align-items:center;gap:8px;flex:1;max-width:400px;justify-content:flex-end"><input class="field" id="lib-search" placeholder="Search projects…" value="'+esc(S.q)+'" style="max-width:220px;padding:7px 12px;font-size:13px" /><button class="btn btn-primary" id="btn-new">+ New Project</button></div></div></header><main style="flex:1;overflow-y:auto;padding:32px"><div style="max-width:960px;margin:0 auto">'+body+'</div></main></div>'}

function rCard(p){var st=stage(p.stage);return '<div class="card" data-pid="'+p.id+'"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px"><span class="serif" style="font-size:16px;font-weight:600">'+esc(p.title)+'</span><span class="badge badge-'+p.stage+'">Stage '+p.stage+' · '+st.name+'</span></div><div style="font-size:13px;color:var(--text2);margin-bottom:4px">'+(p.genre?esc(p.genre):'<span style="color:var(--muted)">No genre</span>')+'</div>'+(p.description?'<div style="font-size:13px;color:var(--muted);margin-bottom:6px">'+esc(p.description.slice(0,120))+(p.description.length>120?"…":"")+'</div>':'')+'<div style="font-size:12px;color:var(--muted)">Updated '+fmt(p.updatedAt)+'</div></div><div class="card-actions" style="display:flex;gap:2px;opacity:0" onclick="event.stopPropagation()"><button class="btn-icon" data-act="rename" data-id="'+p.id+'"><i data-lucide="pencil" style="width:14px;height:14px"></i></button><button class="btn-icon" data-act="dup" data-id="'+p.id+'"><i data-lucide="copy" style="width:14px;height:14px"></i></button><button class="btn-icon" data-act="del" data-id="'+p.id+'"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button></div></div></div>'}
