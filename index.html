```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autuer</title>

    <style>
        :root {
            --background: #e9e9e9;
            --page: #ffffff;
            --text: #111111;
        }

        [data-theme="dark"] {
            --background: #111111;
            --page: #1d1d1d;
            --text: #eeeeee;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--background);
            transition: background 0.25s ease;
        }

        /* Dark mode button stays outside the page */

        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 20px;

            width: 30px;
            height: 30px;

            border: none;
            background: transparent;

            color: #777;
            font-size: 14px;

            cursor: pointer;
            opacity: 0.5;

            z-index: 100;
        }

        .theme-toggle:hover {
            opacity: 1;
        }

        /* The page */

        .workspace {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 60px 20px;
        }

        .page {
            width: 816px;
            min-height: 1056px;

            background: var(--page);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

            transition:
                background 0.25s ease;
        }

        /* Invisible writing surface */

        .editor {
            width: 100%;
            min-height: 1056px;

            padding: 96px;

            outline: none;
            border: none;

            background: transparent;
            color: var(--text);

            font-family:
                "Courier Prime",
                "Courier New",
                Courier,
                monospace;

            font-size: 12px;
            line-height: 1.6;

            white-space: pre-wrap;
            overflow-wrap: break-word;

            caret-color: var(--text);
        }

        /* Mobile */

        @media (max-width: 700px) {

            .workspace {
                padding: 0;
            }

            .page {
                width: 100%;
                min-height: 100vh;

                box-shadow: none;
            }

            .editor {
                min-height: 100vh;
                padding: 70px 35px;
            }

            .theme-toggle {
                top: 12px;
                right: 12px;
            }
        }

        /* Printing */

        @media print {

            body {
                background: white;
            }

            .workspace {
                padding: 0;
            }

            .page {
                width: 100%;
                min-height: auto;
                box-shadow: none;
            }

            .editor {
                min-height: auto;
                color: black;
            }

            .theme-toggle {
                display: none;
            }
        }
    </style>
</head>

<body>

    <button
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
    >
        ☾
    </button>

    <main class="workspace">

        <div class="page">

            <div
                id="editor"
                class="editor"
                contenteditable="true"
                spellcheck="true"
                aria-label="Screenplay page"
            ></div>

        </div>

    </main>

    <script>
        const editor = document.getElementById("editor");
        const themeToggle = document.getElementById("themeToggle");

        const CONTENT_KEY = "autuer-content";
        const THEME_KEY = "autuer-theme";

        /* Load saved screenplay */

        const savedContent =
            localStorage.getItem(CONTENT_KEY);

        if (savedContent) {
            editor.innerHTML = savedContent;
        }

        /* Autosave */

        let saveTimer;

        editor.addEventListener("input", () => {

            clearTimeout(saveTimer);

            saveTimer = setTimeout(() => {

                localStorage.setItem(
                    CONTENT_KEY,
                    editor.innerHTML
                );

            }, 500);

        });

        /* Dark mode */

        const savedTheme =
            localStorage.getItem(THEME_KEY);

        if (savedTheme === "dark") {
            document.documentElement.dataset.theme = "dark";
            themeToggle.textContent = "☀";
        }

        themeToggle.addEventListener("click", () => {

            const dark =
                document.documentElement.dataset.theme === "dark";

            if (dark) {

                document.documentElement.dataset.theme = "light";
                themeToggle.textContent = "☾";

                localStorage.setItem(
                    THEME_KEY,
                    "light"
                );

            } else {

                document.documentElement.dataset.theme = "dark";
                themeToggle.textContent = "☀";

                localStorage.setItem(
                    THEME_KEY,
                    "dark"
                );

            }

        });
    </script>

</body>
</html>
```
