<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auteur</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--purple:#7357d9;--purple2:#5e45c5;--ink:#151519;--muted:#777781;--line:#e8e7eb;--soft:#f7f6f9;--soft2:#f1eff8;--white:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9c8ce4;outline-offset:2px}.app{height:100%;display:flex;flex-direction:column}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;flex:none}.logo{font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:-.5px}.logo span{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.14em;color:#99969f;margin-left:8px;vertical-align:middle}.top-spacer{flex:1}.save{font-size:11px;color:#99969f}.top-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#67656d}.top-icon:hover{background:var(--soft);color:var(--ink)}.create{height:35px;padding:0 14px;border-radius:8px;background:var(--purple);color:#fff;font-weight:700;font-size:13px}.create:hover{background:var(--purple2)}.shell{display:flex;min-height:0;flex:1}.side{width:230px;background:#fbfafc;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;flex:none}.side-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#a09da6;font-weight:800;padding:0 11px 8px}.nav{height:38px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 11px;font-size:13px;color:#68666e;margin:2px 0}.nav svg{width:16px;height:16px}.nav:hover{background:#f2f1f4;color:var(--ink)}.nav.active{background:var(--soft2);color:var(--purple2);font-weight:700}.side-gap{height:25px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0}.side-project{font-size:11px;color:#96939b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden}.content{overflow:auto;flex:1}.inner{max-width:1160px;margin:auto;padding:48px 52px 80px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--purple);font-weight:800}.title{font-family:Georgia,serif;font-size:34px;line-height:1.05;margin:7px 0 9px;letter-spacing:-1px}.subtitle{font-size:13px;color:var(--muted);max-width:610px;line-height:1.55}.dash-grid{display:grid;grid-template-columns:1.45fr .75fr;gap:18px;margin-top:35px}.hero{border:1px solid var(--line);border-radius:14px;padding:28px;background:linear-gradient(135deg,#fff,#faf9fd)}.hero h2{font-family:Georgia,serif;font-size:23px;margin:0 0 7px}.hero p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 20px}.btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:700}.btn:hover{background:var(--soft)}.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}.stat-panel{border:1px solid var(--line);border-radius:14px;padding:22px}.stat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.stat:last-child{border:0}.stat b{font-size:18px}.section{margin-top:34px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:11px;padding:17px;background:#fff;min-height:130px;transition:.15s}.card:hover{border-color:#cbc4e8;box-shadow:0 8px 28px #1715190a;transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;align-items:center}.card-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--purple);font-weight:800}.card h3{font-size:15px;margin:13px 0 6px}.card p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.project-head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px;flex:none}.back{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:#77747d}.back:hover{background:var(--soft)}.project-name{font-family:Georgia,serif;font-size:18px}.project-tabs{display:flex;gap:22px;margin-left:auto;height:100%}.project-tab{height:100%;font-size:11px;color:#88858e;border-bottom:2px solid transparent}.project-tab.active{color:var(--ink);border-color:var(--purple);font-weight:700}.project-inner{max-width:1100px;margin:auto;padding:34px 42px 70px}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.panel{border:1px solid var(--line);border-radius:11px;padding:20px}.panel h3{font-size:14px;margin:0 0 15px}.label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#99969e;font-weight:800;margin:15px 0 7px;display:block}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;outline:0;background:#fff;font-size:12px}.textarea{min-height:125px;resize:vertical;line-height:1.55}.input:focus,.textarea:focus{border-color:#b9afe4;box-shadow:0 0 0 3px #7357d910}.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:8px}.row:hover{border-color:#cfc7e8}.row-main{flex:1;min-width:0}.row-title{font-size:13px;font-weight:700}.row-sub{font-size:10px;color:var(--muted);margin-top:3px}.row-icon{width:29px;height:29px;border-radius:7px;background:var(--soft2);color:var(--purple);display:grid;place-items:center}.row-actions{display:flex;gap:2px}.row-actions button{width:28px;height:28px;border-radius:6px;color:#8b8890}.row-actions button:hover{background:var(--soft);color:var(--ink)}.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.char{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:10px}.dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}.char-name{font-weight:700;font-size:13px}.char-meta{font-size:10px;color:var(--muted);margin-top:2px}.char-bio{font-size:11px;color:#66636b;line-height:1.45;margin-top:7px}.script{height:100%;display:flex;min-height:0}.script-list{width:210px;background:#fbfafc;border-right:1px solid var(--line);padding:18px 11px;overflow:auto}.script-list h4{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#99969e;margin:0 9px 9px}.scene{padding:9px;border-radius:7px;font-size:11px;color:#66636c;margin-bottom:2px}.scene:hover{background:#f1f0f3}.scene.active{background:var(--soft2);color:var(--purple2);font-weight:700}.editor{flex:1;min-width:0;display:flex;flex-direction:column}.editor-bar{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 12px}.format{height:29px;padding:0 8px;border-radius:6px;font-size:10px;font-weight:700;color:#706d75}.format:hover,.format.active{background:var(--soft2);color:var(--purple2)}.editor-status{margin-left:auto;font-size:10px;color:#aaa6ae}.paper{width:min(800px,calc(100% - 60px));margin:30px auto 70px}.paper-title{text-align:center;font-family:Georgia,serif;font-size:21px;font-weight:700;margin-bottom:35px}.script-editor{min-height:700px;outline:0;white-space:pre-wrap;font-family:"Courier New",monospace;font-size:13px;line-height:1.7}.script-editor:empty:before{content:attr(data-placeholder);color:#b4b1b8}.modal-bg{position:fixed;inset:0;background:#15151955;display:none;align-items:center;justify-content:center;z-index:20}.modal-bg.open{display:flex}.modal{width:min(450px,calc(100% - 30px));background:#fff;border-radius:12px;padding:22px;box-shadow:0 25px 80px #15151925}.modal h2{font-family:Georgia,serif;font-size:21px;margin:0 0 4px}.modal p{font-size:11px;color:var(--muted);margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.colors{display:flex;gap:7px}.color{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d0ced4}.color.selected{box-shadow:0 0 0 2px var(--purple)}
@media(max-width:820px){.side{width:190px}.inner{padding:35px 24px}.dash-grid,.two{grid-template-columns:1fr}.project-tabs{gap:8px}.project-tab{font-size:10px}.project-inner{padding:25px 20px}.paper{width:calc(100% - 30px)}}@media(max-width:560px){.side{display:none}.top{padding:0 12px}.logo span{display:none}.project-tabs{display:none}.script-list{display:none}}
</style></head>
<body>
<div class="app"><header class="top"><button class="top-icon" id="home" title="Dashboard"><i data-lucide="house"></i></button><div class="logo">Auteur<span>FILMMAKING WORKSPACE</span></div><div class="top-spacer"></div><span class="save" id="save">Ready</span><button class="top-icon" id="refresh" title="Refresh"><i data-lucide="refresh-cw"></i></button><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="side-title">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="side-gap"></div><div class="side-title">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button><div class="side-bottom"><div class="side-project" id="sideProject">No project open</div></div></aside><main class="main" id="main"></main></div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><script>
const KEY='autuer-clean-v2',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],scripts:[],storylines:[],characters:[]};let state={view:'dashboard',project:null,tab:'overview'};
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#save').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#save').textContent='Ready',1200)}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function nav(v){state={view:v,project:null,tab:'overview'};render()}function project(){return data.projects.find(x=>x.id===state.project)}function modal(html,fn){$('#modal').innerHTML=html;$('#modalBg').classList.add('open');fn&&fn();icons()}function close(){ $('#modalBg').classList.remove('open') }$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')close()};$('#home').onclick=()=>nav('dashboard');$('#refresh').onclick=()=>render();$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function dashboard(){let p=data.projects.slice(-4).reverse();return `<div class="content"><div class="inner"><div class="eyebrow">Auteur</div><div class="title">Your films, in one place.</div><div class="subtitle">Develop the idea, shape the story, build the characters, and write the screenplay without turning your workspace into a cockpit.</div><div class="dash-grid"><section class="hero"><h2>Start a new film</h2><p>Create a project and keep its synopsis, storylines, characters, and screenplay connected from the first sentence.</p><button class="btn purple" id="newProject">New project</button></section><section class="stat-panel"><div class="stat"><span>Projects</span><b>${data.projects.length}</b></div><div class="stat"><span>Screenplays</span><b>${data.scripts.length}</b></div><div class="stat"><span>Characters</span><b>${data.characters.length}</b></div></section></div><section class="section"><div class="section-head"><div><h2>Recent projects</h2><p>Your latest worlds.</p></div><button class="btn" id="allProjects">View all</button></div><div class="cards">${p.length?p.map(x=>`<article class="card" data-open="${x.id}"><div class="card-top"><span class="card-label">Film project</span><i data-lucide="arrow-up-right"></i></div><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty-card">No projects yet.<br><button id="emptyCreate">Create your first film</button></div>`}</div></section></div></div>`}
function projectView(){let p=project();if(!p){nav('dashboard');return ''}let tabs=['overview','story','characters','screenplay'];return `<div class="project-head"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="project-name">${esc(p.name)}</div><div class="project-tabs">${tabs.map(t=>`<button class="project-tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>${state.tab==='overview'?overview(p):state.tab==='story'?story(p):state.tab==='characters'?chars(p):screenplay(p)}`}
function overview(p){let sc=data.scripts.filter(x=>x.project===p.id),st=data.storylines.filter(x=>x.project===p.id),ch=data.characters.filter(x=>x.project===p.id);return `<div class="content"><div class="project-inner"><div class="two"><section class="panel"><h3>Project overview</h3><label class="label">Title</label><input class="input" id="pname" value="${esc(p.name)}"><label class="label">Synopsis</label><textarea class="textarea" id="psyn">${esc(p.synopsis||'')}</textarea><div style="margin-top:14px"><button class="btn purple" id="saveProject">Save overview</button></div></section><section class="panel"><h3>Development</h3><div class="stat"><span>Storylines</span><b>${st.length}</b></div><div class="stat"><span>Characters</span><b>${ch.length}</b></div><div class="stat"><span>Screenplays</span><b>${sc.length}</b></div></section></div></div></div>`}
function story(p){let a=data.storylines.filter(x=>x.project===p.id);return `<div class="content"><div class="project-inner"><div class="section-head"><div><h2>Storylines</h2><p>Organize the threads that make the film move.</p></div><button class="btn purple" id="addStory">New storyline</button></div><div>${a.length?a.map(x=>`<div class="row"><div class="row-icon"><i data-lucide="git-branch"></i></div><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(x.synopsis||'No synopsis yet.')}</div></div><div class="row-actions"><button data-edit-story="${x.id}"><i data-lucide="pencil"></i></button><button data-del-story="${x.id}"><i data-lucide="trash-2"></i></button></div></div>`).join(''):`<div class="empty-card">No storylines yet. Add the first thread to your film.</div>`}</div></div></div>`}
function chars(p){let a=data.characters.filter(x=>x.project===p.id);return `<div class="content"><div class="project-inner"><div class="section-head"><div><h2>Characters</h2><p>Build people with motives, contradictions, and arcs.</p></div><button class="btn purple" id="addChar">New character</button></div><div class="chars">${a.length?a.map(x=>`<article class="char"><span class="dot" style="background:${x.color}"></span><div><div class="char-name">${esc(x.name)}</div><div class="char-meta">${esc(x.gender||'Unspecified')}</div><div class="char-bio">${esc(x.bio||'No bio yet.')}</div><div class="row-actions" style="margin-top:9px"><button data-edit-char="${x.id}"><i data-lucide="pencil"></i></button><button data-del-char="${x.id}"><i data-lucide="trash-2"></i></button></div></div></article>`).join(''):`<div class="empty-card">No characters yet. Give the story some humans to argue with.</div>`}</div></div></div>`}
function screenplay(p){let s=data.scripts.find(x=>x.project===p.id);if(!s){return `<div class="content"><div class="project-inner"><div class="empty-card">This project has no screenplay yet.<br><button id="newScript">Create screenplay</button></div></div></div>`}return `<div class="script"><aside class="script-list"><h4>Scenes</h4><div class="scene active">Opening</div><div class="scene">Scene 2</div><div class="scene">Scene 3</div></aside><section class="editor"><div class="editor-bar"><button class="format active" data-format="scene">Scene</button><button class="format" data-format="action">Action</button><button class="format" data-format="character">Character</button><button class="format" data-format="dialogue">Dialogue</button><span class="editor-status">Autosaved</span></div><div class="paper"><div class="paper-title">${esc(p.name)}</div><div class="script-editor" id="editor" contenteditable="true" data-placeholder="Begin your screenplay..."></div></div></section></div>`}
function listView(type){let title=type==='projects'?'Projects':type==='scripts'?'Screenplays':type==='story'?'Storylines':'Characters';let items=type==='projects'?data.projects:type==='scripts'?data.scripts:type==='story'?data.storylines:data.characters;return `<div class="content"><div class="inner"><div class="eyebrow">Library</div><div class="title">${title}</div><div class="subtitle">${type==='projects'?'Your films and developing ideas.':type==='scripts'?'Drafts connected to your film projects.':type==='story'?'Every narrative thread across your projects.':'Every character you have created.'}</div><div class="section"><div class="cards">${items.length?items.map(x=>`<article class="card" ${type==='projects'?`data-open="${x.id}"`:''}><span class="card-label">${type.slice(0,-1)||type}</span><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||x.bio||'')}</p></article>`).join(''):`<div class="empty-card">Nothing here yet.</div>`}</div></div></div></div>`}
function render(){let m=$('#main');if(state.project)m.innerHTML=projectView();else if(state.view==='dashboard')m.innerHTML=dashboard();else m.innerHTML=listView(state.view);$('#sideProject').textContent=project()?project().name:'No project open';$$('.nav').forEach(b=>b.classList.toggle('active',!state.project&&b.dataset.view===state.view));bind();icons()}
function bind(){if($('#newProject'))$('#newProject').onclick=()=>projectModal();if($('#emptyCreate'))$('#emptyCreate').onclick=()=>projectModal();if($('#allProjects'))$('#allProjects').onclick=()=>nav('projects');$$('[data-open]').forEach(c=>c.onclick=()=>{state.project=c.dataset.open;state.tab='overview';render()});if($('#back'))$('#back').onclick=()=>{state.project=null;render()};$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if($('#saveProject'))$('#saveProject').onclick=()=>{let p=project();p.name=$('#pname').value.trim()||'Untitled Film';p.synopsis=$('#psyn').value.trim();save();render()};if($('#addStory'))$('#addStory').onclick=()=>storyModal();if($('#addChar'))$('#addChar').onclick=()=>charModal();$$('[data-del-story]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(x=>x.id!==b.dataset.delStory);save();render()});$$('[data-del-char]').forEach(b=>b.onclick=()=>{data.characters=data.characters.filter(x=>x.id!==b.dataset.delChar);save();render()});$$('[data-edit-story]').forEach(b=>b.onclick=()=>storyModal(data.storylines.find(x=>x.id===b.dataset.editStory)));$$('[data-edit-char]').forEach(b=>b.onclick=()=>charModal(data.characters.find(x=>x.id===b.dataset.editChar)));if($('#newScript'))$('#newScript').onclick=()=>{data.scripts.push({id:uid(),name:project().name+' Draft',project:project().id,content:''});save();render()};if($('#editor')){let s=data.scripts.find(x=>x.project===project().id);$('#editor').innerText=s.content||'';$('#editor').oninput=()=>{s.content=$('#editor').innerText;save()};$$('[data-format]').forEach(b=>b.onclick=()=>{$$('.format').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}}
function projectModal(existing){modal(`<h2>${existing?'Edit':'New'} film</h2><p>Keep the project simple. The complexity belongs in the story.</p><label class="label">Title</label><input class="input" id="mName" value="${esc(existing?.name||'Untitled Film')}"><label class="label">Synopsis</label><textarea class="textarea" id="mSyn">${esc(existing?.synopsis||'')}</textarea><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn purple" id="confirm">${existing?'Save':'Create'}</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#mName').value.trim()||'Untitled Film';if(existing){existing.name=n;existing.synopsis=$('#mSyn').value.trim();state.project=existing.id}else{let p={id:uid(),name:n,synopsis:$('#mSyn').value.trim()};data.projects.push(p);state.project=p.id;state.tab='overview'}save();close();render()}})}
function storyModal(existing){modal(`<h2>${existing?'Edit':'New'} storyline</h2><p>Give the narrative thread a name, then define what it is carrying.</p><label class="label">Name</label><input class="input" id="mName" value="${esc(existing?.name||'Untitled Storyline')}"><label class="label">Synopsis</label><textarea class="textarea" id="mSyn">${esc(existing?.synopsis||'')}</textarea><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn purple" id="confirm">Save</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#mName').value.trim()||'Untitled Storyline';if(existing){existing.name=n;existing.synopsis=$('#mSyn').value.trim()}else data.storylines.push({id:uid(),project:project().id,name:n,synopsis:$('#mSyn').value.trim()});save();close();render()}})}
function charModal(existing){modal(`<h2>${existing?'Edit':'New'} character</h2><p>Build a person, not a database entry.</p><label class="label">Name</label><input class="input" id="mName" value="${esc(existing?.name||'Untitled Character')}"><label class="label">Gender</label><select class="input" id="mGender"><option>Unspecified</option><option ${existing?.gender==='Female'?'selected':''}>Female</option><option ${existing?.gender==='Male'?'selected':''}>Male</option><option ${existing?.gender==='Non-binary'?'selected':''}>Non-binary</option></select><label class="label">Bio</label><textarea class="textarea" id="mBio">${esc(existing?.bio||'')}</textarea><label class="label">Color</label><div class="colors">${['#7357d9','#3d78c8','#d15b67','#4d9a72','#d18a3b'].map(c=>`<button class="color ${existing?.color===c||(!existing&&c==='#7357d9')?'selected':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn purple" id="confirm">Save</button></div>`,()=>{let color=existing?.color||'#7357d9';$$('[data-color]').forEach(b=>b.onclick=()=>{$$('[data-color]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=close;$('#confirm').onclick=()=>{let n=$('#mName').value.trim()||'Untitled Character';if(existing){Object.assign(existing,{name:n,gender:$('#mGender').value,bio:$('#mBio').value,color})}else data.characters.push({id:uid(),project:project().id,name:n,gender:$('#mGender').value,bio:$('#mBio').value,color});save();close();render()}})}
$('#create').onclick=()=>projectModal();render();
</script></body></html>
