<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>AUTEUR — Screenwriting Studio</title>
<style>
:root{--bg:#0b0b0c;--panel:#111113;--panel2:#171719;--line:#29292d;--text:#f4f4f1;--muted:#85858b;--red:#e21b2d;--red2:#ff3346;--paper:#f7f7f4;--ink:#161618;--shadow:0 20px 60px #0008}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;height:100vh}.sidebar{background:#0a0a0b;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:68px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-weight:900;letter-spacing:.28em;font-size:12px}.brand i{color:var(--red);font-style:normal}.workspace{padding:18px 12px}.label{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#66666c;letter-spacing:.14em;text-transform:uppercase;padding:0 10px 10px}.nav{display:grid;gap:3px}.nav button,.project-link{border:0;background:transparent;color:#a4a4aa;text-align:left;border-radius:7px;padding:11px 10px;font-size:12px}.nav button:hover,.project-link:hover{background:#161618;color:#fff}.nav button.active{background:#19191c;color:#fff}.nav button.active:before{content:"";display:inline-block;width:3px;height:13px;background:var(--red);margin-right:9px;vertical-align:-2px;border-radius:2px}.project-list{margin-top:20px;display:grid;gap:2px;overflow:auto}.project-link{display:flex;align-items:center;gap:9px}.project-link .dot{width:6px;height:6px;border-radius:50%;background:#424247}.project-link.active .dot{background:var(--red)}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 16px;color:#55555b;font:8px/1.8 ui-monospace,monospace}.main{min-width:0;display:flex;flex-direction:column;background:#0d0d0f}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0e0e10}.top-left,.top-right{display:flex;align-items:center;gap:10px;min-width:0}.crumb{font:10px ui-monospace,monospace;color:#707076;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb strong{color:#ddd;font-weight:500}.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#141416;color:#aaa;border-radius:6px}.icon-btn:hover{color:#fff;border-color:#555}.primary{border:0;background:var(--red);color:#fff;padding:10px 13px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.02em}.primary:hover{background:var(--red2)}.save-state{font:9px ui-monospace,monospace;color:#666;white-space:nowrap}.view{flex:1;min-height:0;overflow:hidden}.dashboard{height:100%;overflow:auto;padding:52px clamp(24px,5vw,72px) 70px}.eyebrow{font:9px ui-monospace,monospace;color:#68686e;letter-spacing:.16em;text-transform:uppercase}.dashboard h1{font:500 clamp(54px,8vw,118px)/.86 Georgia,serif;letter-spacing:-.07em;margin:22px 0 16px}.dashboard h1 span{color:var(--red)}.dash-copy{max-width:520px;color:#88888e;font-size:13px;line-height:1.7;margin:0 0 45px}.empty{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:55px 0;display:flex;align-items:center;justify-content:space-between;gap:30px}.empty-title{font:34px Georgia,serif;letter-spacing:-.03em}.empty-sub{font:11px;color:#777;max-width:420px;line-height:1.7;margin-top:9px}.empty-create{flex:none;border:1px solid #3b3b40;background:#151517;color:#fff;padding:15px 18px;border-radius:6px;font-size:10px}.empty-create:hover{border-color:var(--red);background:#1a1012}.dashboard-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:45px}.stat{background:#0d0d0f;padding:20px}.stat b{font:28px Georgia;color:#ddd}.stat span{display:block;color:#5f5f65;font:8px ui-monospace,monospace;margin-top:8px}.editor{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr) 270px;background:#101012}.outline{border-right:1px solid var(--line);background:#0c0c0e;overflow:auto}.outline-head,.inspector-head{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font:9px ui-monospace,monospace;color:#777;letter-spacing:.12em;text-transform:uppercase}.outline-empty{padding:25px 14px;color:#555;font:10px/1.7 ui-monospace,monospace}.script-shell{min-width:0;overflow:auto;background:#d9d9d6}.paper{width:min(820px,calc(100% - 70px));min-height:100%;margin:34px auto 80px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);padding:85px 100px 120px}.script-title{font:500 18px ui-monospace,monospace;letter-spacing:.02em;border:0;background:transparent;width:100%;outline:0;text-align:center;margin-bottom:35px}.screenplay{width:100%;min-height:900px;outline:0;border:0;background:transparent;resize:none;color:var(--ink);font:12px/1.75 "Courier Prime",Courier,monospace;white-space:pre-wrap}.screenplay:empty:before{content:attr(data-placeholder);color:#999}.inspector{border-left:1px solid var(--line);background:#0c0c0e;overflow:auto}.inspector-body{padding:15px}.field{margin-bottom:18px}.field label{display:block;color:#666;font:8px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#121214;color:#ddd;border-radius:5px;padding:9px;font-size:11px;outline:0}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#555}.editor-empty{height:100%;display:grid;place-items:center;background:#d9d9d6;color:#777}.editor-empty .empty-card{text-align:center}.editor-empty h2{font:42px Georgia;color:#222;margin:0 0 10px}.editor-empty p{font:11px ui-monospace,monospace;color:#666}.modal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;place-items:center;z-index:50}.modal-back.open{display:grid}.modal{width:min(520px,calc(100% - 30px));background:#151517;border:1px solid #333338;box-shadow:var(--shadow);border-radius:10px;padding:25px}.modal h2{font:42px Georgia;margin:5px 0 25px;letter-spacing:-.05em}.modal h2 span{color:var(--red)}.modal input{width:100%;background:#0d0d0f;border:1px solid #36363b;color:#fff;padding:13px;border-radius:6px;outline:0}.modal input:focus{border-color:var(--red)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.secondary{background:#202024;border:1px solid #36363b;color:#ccc;padding:10px 13px;border-radius:6px;font-size:10px}.toast{position:fixed;right:18px;bottom:18px;background:#f4f4f1;color:#111;padding:11px 14px;border-radius:5px;font:9px ui-monospace,monospace;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;z-index:100}.toast.show{animation:toast .2s ease forwards}.kbd{border:1px solid #343438;background:#18181b;border-radius:3px;padding:2px 5px;color:#777;font:8px ui-monospace,monospace}@keyframes toast{to{opacity:1;transform:none}}@media(max-width:900px){.app{grid-template-columns:64px 1fr}.brand{padding:0;justify-content:center;font-size:0}.brand:before{content:"A";font:900 15px Arial}.brand i{font-size:12px}.workspace{padding:15px 8px}.label,.nav button span,.project-list,.sidebar-foot{display:none}.nav button{height:40px;text-align:center;font-size:0}.nav button:before{margin:0!important}.editor{grid-template-columns:1fr}.outline,.inspector{display:none}.paper{width:calc(100% - 28px);padding:55px 35px 90px;margin:15px auto 50px}.empty{align-items:flex-start;flex-direction:column}.dashboard-foot{grid-template-columns:1fr}.save-state{display:none}}@media(max-width:600px){.topbar{padding:0 12px}.crumb{max-width:180px}.dashboard{padding:35px 20px}.dashboard h1{font-size:19vw}.empty-title{font-size:27px}.paper{padding:45px 24px 80px}.screenplay{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">AUTEUR<i>.</i></div>
  <div class="workspace">
    <div class="label">Workspace</div>
    <div class="nav">
      <button class="active" data-view="dashboard">⌂ <span>Home</span></button>
      <button data-view="projects">▦ <span>Projects</span></button>
      <button data-view="editor">✎ <span>Editor</span></button>
    </div>
    <div class="label" style="margin-top:22px">Projects</div>
    <div class="project-list" id="projectList"></div>
  </div>
  <div class="sidebar-foot">AUTEUR / LOCAL WORKSPACE<br>NO SAMPLE PROJECTS / READY</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="top-left"><button class="icon-btn" id="backBtn" title="Back">←</button><div class="crumb" id="crumb">Workspace / <strong>Home</strong></div></div>
    <div class="top-right"><span class="save-state" id="saveState">READY</span><button class="primary" id="newBtn">NEW PROJECT</button></div>
  </header>
  <div class="view" id="view"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="eyebrow">New project</div><h2>Start with <span>the title.</span></h2><input id="projectTitle" placeholder="Project title" autocomplete="off" spellcheck="false"><div class="modal-actions"><button class="secondary" id="cancelBtn">Cancel</button><button class="primary" id="createBtn">Create project</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const KEY='auteur.projects.v2';
let projects=JSON.parse(localStorage.getItem(KEY)||'[]');
let current=null;
let currentView='dashboard';
const blankProject=title=>({id:crypto.randomUUID(),title,screenplay:'',notes:'',status:'Development',created:Date.now(),updated:Date.now()});
function save(){localStorage.setItem(KEY,JSON.stringify(projects));}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function renderList(){const el=$('#projectList');el.innerHTML='';projects.forEach(p=>{const b=document.createElement('button');b.className='project-link'+(current===p.id?' active':'');b.innerHTML='<span class="dot"></span><span></span>';b.querySelector('span:last-child').textContent=p.title;b.onclick=()=>openProject(p.id);el.appendChild(b)})}
function setCrumb(){const p=projects.find(x=>x.id===current);$('#crumb').innerHTML='Workspace / <strong>'+((currentView==='editor'&&p)?escapeHtml(p.title):currentView[0].toUpperCase()+currentView.slice(1))+'</strong>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dashboard(){currentView='dashboard';current=null;renderList();setCrumb();$('#view').innerHTML=`<section class="dashboard"><div class="eyebrow">AUTEUR / SCREENWRITING SYSTEM</div><h1>Write the<br><span>film.</span></h1><p class="dash-copy">A private workspace for building a film from its title through development and onto the page. No filler projects. No decorative fake data. Just your work.</p><div class="empty"><div><div class="empty-title">Your workspace is empty.</div><div class="empty-sub">Create a project and AUTEUR will build the workspace around it. The title is the first object in the system.</div></div><button class="empty-create" id="emptyCreate">CREATE YOUR FIRST PROJECT ↗</button></div><div class="dashboard-foot"><div class="stat"><b>${projects.length}</b><span>PROJECTS</span></div><div class="stat"><b>LOCAL</b><span>STORAGE MODE</span></div><div class="stat"><b>∞</b><span>ROOM TO BUILD</span></div></div></section>`;$('#emptyCreate').onclick=openModal}
function projectsView(){currentView='projects';current=null;renderList();setCrumb();$('#view').innerHTML=`<section class="dashboard"><div class="eyebrow">PROJECT INDEX</div><h1>Your<br><span>work.</span></h1><p class="dash-copy">Every project you create appears here. Open one to enter the studio.</p><div id="projectGrid" style="display:grid;gap:1px;background:var(--line)"></div></section>`;const grid=$('#projectGrid');if(!projects.length){grid.innerHTML='<div style="background:#0d0d0f;padding:50px;color:#666;font:10px ui-monospace,monospace">NO PROJECTS / CREATE ONE TO BEGIN</div>';return}projects.forEach((p,i)=>{const row=document.createElement('button');row.style='border:0;background:#111113;color:#fff;text-align:left;padding:24px;display:grid;grid-template-columns:55px 1fr auto;gap:18px;align-items:center';row.innerHTML=`<span style="font:9px ui-monospace,monospace;color:var(--red)">${String(i+1).padStart(2,'0')}</span><span><strong style="font:25px Georgia;font-weight:500">${escapeHtml(p.title)}</strong><small style="display:block;color:#666;font:8px ui-monospace,monospace;margin-top:7px">${p.status.toUpperCase()} / ${p.screenplay.length?Math.ceil(p.screenplay.length/1800):0} PAGES</small></span><span style="color:#555">↗</span>`;row.onclick=()=>openProject(p.id);grid.appendChild(row)})}
function editor(){const p=projects.find(x=>x.id===current);if(!p){dashboard();return}currentView='editor';renderList();setCrumb();$('#view').innerHTML=`<section class="editor"><aside class="outline"><div class="outline-head">Outline</div><div class="outline-empty">SCENES WILL APPEAR HERE AS YOU WRITE.</div></aside><div class="script-shell"><div class="paper"><input class="script-title" id="scriptTitle" value="${escapeHtml(p.title)}" aria-label="Project title"><textarea class="screenplay" id="screenplay" data-placeholder="Begin writing here...">${escapeHtml(p.screenplay)}</textarea></div></div><aside class="inspector"><div class="inspector-head">Project</div><div class="inspector-body"><div class="field"><label>Status</label><select id="status"><option>Development</option><option>Writing</option><option>Revision</option><option>Complete</option></select></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Private project notes">${escapeHtml(p.notes)}</textarea></div><div class="field"><label>Shortcuts</label><div style="font:9px/2 ui-monospace,monospace;color:#666">NEW PROJECT <span class="kbd">⌘ N</span><br>SAVE <span class="kbd">⌘ S</span><br>ESCAPE <span class="kbd">ESC</span></div></div></div></aside></section>`;$('#status').value=p.status;$('#scriptTitle').oninput=()=>{p.title=$('#scriptTitle').value;touch()};$('#screenplay').oninput=()=>{p.screenplay=$('#screenplay').value;touch()};$('#notes').oninput=()=>{p.notes=$('#notes').value;touch()};$('#status').onchange=()=>{p.status=$('#status').value;touch()};}
let saveTimer;function touch(){const p=projects.find(x=>x.id===current);if(!p)return;p.updated=Date.now();$('#saveState').textContent='SAVING...';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{save();renderList();setCrumb();$('#saveState').textContent='SAVED';},350)}
function openProject(id){current=id;editor()}
function openModal(){$('#modalBack').classList.add('open');$('#projectTitle').value='';setTimeout(()=>$('#projectTitle').focus(),40)}
function closeModal(){$('#modalBack').classList.remove('open')}
function createProject(){const title=$('#projectTitle').value.trim();if(!title){toast('TITLE REQUIRED');return}const p=blankProject(title);projects.unshift(p);save();closeModal();openProject(p.id);toast('PROJECT CREATED')}
$('#newBtn').onclick=openModal;$('#cancelBtn').onclick=closeModal;$('#createBtn').onclick=createProject;$('#backBtn').onclick=()=>{if(current)dashboard();else dashboard()};
$$('.nav button').forEach(b=>b.onclick=()=>{ $$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='dashboard')dashboard();if(b.dataset.view==='projects')projectsView();if(b.dataset.view==='editor'){if(current)editor();else if(projects[0])openProject(projects[0].id);else dashboard()}});
$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();$('#saveState').textContent='SAVED';toast('SAVED')}if(e.key==='Escape')closeModal()});
dashboard();
</script>
</body>
</html>
