<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamscape</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:'Space Grotesk',Arial,sans-serif}.screen{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;will-change:transform}.white-screen{z-index:1;background:#fff}.red-screen{z-index:2;background:#F02D20;transform:translateY(100%)}.dream{width:100vw;margin-top:18vh;padding:0;font-size:clamp(42px,12vw,180px);font-weight:700;line-height:.58;letter-spacing:-.018em;white-space:nowrap;text-align:center;transform:scaleX(1.3);transform-origin:center}.dream .m{display:inline-block;transform:scaleX(.88);transform-origin:center}.transitioning{pointer-events:none}</style></head><body><section class="screen white-screen"><main class="dream">DREA<span class="m">M</span>SCAPE</main></section><section class="screen red-screen"></section><script>const red=document.querySelector('.red-screen');let progress=0,target=0,raf=0,lastWheel=0;function render(){progress+=(target-progress)*.12;red.style.transform=`translateY(${100-progress}%)`;if(Math.abs(target-progress)>.01){raf=requestAnimationFrame(render)}else{progress=target;red.style.transform=`translateY(${100-progress}%)`;raf=0}}function setTarget(delta){target=Math.max(0,Math.min(100,target+delta));if(!raf)raf=requestAnimationFrame(render)}window.addEventListener('wheel',e=>{setTarget(e.deltaY*.16)},{passive:true});let sy=0;window.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});window.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;setTarget((sy-y)*.35);sy=y},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown')setTarget(12);if(e.key==='ArrowUp')setTarget(-12);if(e.key==='PageDown')setTarget(100);if(e.key==='PageUp')setTarget(-100)});</script></body></html>
