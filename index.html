<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auteur</title><script src="https://unpkg.com/lucide@latest"></script><style>:root{--ink:#111;--muted:#777;--line:#e3e3e0;--soft:#f7f7f5}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:flex;flex-direction:column}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px}.logo{font:700 21px Georgia,serif}.grow{flex:1}.create,.primary{height:33px;padding:0 13px;background:#111;color:#fff;border-radius:4px;font-size:11px;font-weight:700}.shell{flex:1;display:flex;min-height:0}.side{width:185px;border-right:1px solid var(--line);padding:24px 12px}.label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#999;padding:0 9px 8px}.nav{width:100%;height:35px;display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:4px;text-align:left;color:#666;font-size:12px}.nav svg{width:14px;height:14px}.nav:hover{background:#f1f1ef;color:#111}.nav.active{background:#111;color:#fff}.gap{height:24px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.scroll{flex:1;overflow:auto}.home{max-width:1080px;margin:auto;padding:58px 55px 80px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#999}.headline{font:400 40px/1.05 Georgia,serif;letter-spacing:-1.2px;margin:8px 0 12px}.intro{max-width:610px;color:#707070;font-size:12px;line-height:1.65}.start{margin-top:42px;border-top:1px solid #111;padding-top:18px;display:flex;align-items:end;justify-content:space-between;gap:25px}.start h2{font:400 24px Georgia,serif;margin:0 0 6px}.start p{font-size:11px;color:#777;line-height:1.55;margin:0;max-width:550px}.section{margin-top:52px}.sectionhead{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #111;padding-bottom:9px;margin-bottom:13px}.sectionhead h2{font:400 21px Georgia,serif;margin:0}.sectionhead span{font-size:10px;color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.film{border:1px solid var(--line);padding:18px;min-height:145px;cursor:pointer}.film:hover{border-color:#999}.film small{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#999}.film h3{font:400 20px Georgia,serif;margin:25px 0 7px}.film p{font-size:11px;line-height:1.5;color:#777;margin:0}.empty{border:1px dashed #c9c9c6;padding:26px;text-align:center;color:#888;font-size:11px}.projectbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:10px}.back{width:28px;height:28px;border-radius:4px;display:grid;place-items:center}.back:hover{background:#f1f1ef}.projectname{font:400 18px Georgia,serif}.tabs{margin-left:auto;height:100%;display:flex;gap:20px}.tab{height:100%;font-size:10px;color:#888;border-bottom:2px solid transparent}.tab.active{color:#111;border-color:#111;font-weight:700}.body{max-width:1050px;margin:auto;padding:35px 45px 70px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.panel{border:1px solid var(--line);padding:22px}.panel h2{font:400 20px Georgia,serif;margin:0 0 18px}.field{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:16px 0 6px}.input,.textarea,.select{width:100%;border:0;border-bottom:1px solid #c9c9c6;background:#fff;outline:0;padding:8px 2px;font-size:12px}.textarea{min-height:145px;resize:vertical;line-height:1.6}.input:focus,.textarea:focus,.select:focus{border-color:#111}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itembody{flex:1}.itemtitle{font-size:12px;font-weight:700}.itemsub{font-size:10px;color:#888;margin-top:3px}.textbtn{font-size:10px;color:#777}.textbtn:hover{color:#111}.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.char{border:1px solid var(--line);padding:17px}.charname{font:400 18px Georgia,serif}.meta{font-size:10px;color:#888;margin-top:4px}.bio{font-size:11px;line-height:1.55;color:#777;margin-top:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.script{height:100%;display:flex}.scenes{width:185px;border-right:1px solid var(--line);background:#fafaf8;padding:18px 11px}.scenes h4{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:0 8px 10px}.scene{padding:8px;border-radius:4px;font-size:10px;color:#666}.scene.active,.scene:hover{background:#ececea;color:#111}.editor{flex:1;display:flex;flex-direction:column;min-width:0}.toolbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:3px}.format{padding:6px 8px;border-radius:4px;font-size:10px;color:#666}.format:hover{background:#eee;color:#111}.paper{width:min(780px,calc(100% - 60px));margin:38px auto}.papertitle{text-align:center;font:400 21px Georgia,serif;margin-bottom:38px}.writing{min-height:720px;outline:0;white-space:pre-wrap;font:13px/1.8 "Courier New",monospace}.writing:empty:before{content:attr(data-placeholder);color:#bbb}.modalbg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10}.modalbg.open{display:flex}.modal{width:min(430px,calc(100% - 30px));background:#fff;padding:24px}.modal h2{font:400 22px Georgia,serif;margin:0 0 5px}.modal p{font-size:11px;color:#777;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{height:33px;padding:0 12px;border:1px solid var(--line);border-radius:4px;font-size:11px}.colors{display:flex;gap:8px}.color{width:21px;height:21px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.color.selected{box-shadow:0 0 0 2px #111}@media(max-width:800px){.side{width:170px}.home{padding:42px 25px}.start,.cols{display:block}.start .primary{margin-top:16px}.panel{margin-bottom:14px}.body{padding:25px}.tabs{gap:10px}}@media(max-width:560px){.side{display:none}.tabs{display:none}.paper{width:calc(100% - 28px)}.scenes{display:none}.home{padding:35px 18px}}</style></head><body><div class="app"><header class="top"><div class="logo">Auteur</div><div class="grow"></div><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button></aside><main class="main" id="main"></main></div></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>const KEY='auteur-clean-v5',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-final-v4')||'null')||JSON.parse(localStorage.getItem('auteur-neutral-v3')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};let state={view:'dashboard',project:null,tab:'overview'};function save(){localStorage.setItem(KEY,JSON.stringify(data))}function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function p(){return data.projects.find(x=>x.id===state.project)}function nav(view){state={view,project:null,tab:'overview'};render()}function modal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}function close(){ $('#modalbg').classList.remove('open')}$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')close()};$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));$('#create').onclick=newProject;function dashboard(){let recent=data.projects.slice(-5).reverse();return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A focused workspace for developing stories, characters, and screenplays without burying the work under interface.</div><section class="start"><div><h2>Begin a new film</h2><p>Start with a title and build the project around it.</p></div><button class="primary" id="newProject">New project</button></section><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${recent.length}</span></div><div class="grid">${recent.length?recent.map(x=>`<article class="film" data-open="${x.id}"><small>Film project</small><h3>${esc(x.name)}</h3><p>${esc(x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty">Your projects will appear here.</div>`}</div></section></div></div>`}function projectView(){let x=p();if(!x){nav('dashboard');return ''}let body='';if(state.tab==='overview')body=`<div class="cols"><section class="panel"><h2>Overview</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Synopsis</label><textarea class="textarea" id="psyn" placeholder="What is this film about?">${esc(x.synopsis||'')}</textarea></section><section class="panel"><h2>Development</h2><div class="item"><div class="itembody"><div class="itemtitle">Storylines</div><div class="itemsub">${data.storylines.filter(s=>s.project===x.id).length}</div></div></div><div class="item"><div class="itembody"><div class="itemtitle">Characters</div><div class="itemsub">${data.characters.filter(c=>c.project===x.id).length}</div></div></div><div class="item"><div class="itembody"><div class="itemtitle">Screenplay</div><div class="itemsub">${data.scripts.some(s=>s.project===x.id)?'Draft exists':'No draft'}</div></div></div></section></div>`;if(state.tab==='story')body=`<section class="panel"><div class="sectionhead"><div><h2>Storylines</h2><span>Threads through the film.</span></div><button class="primary" id="addStory">New storyline</button></div>${data.storylines.filter(s=>s.project===x.id).map(s=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(s.name)}</div><div class="itemsub">${esc(s.synopsis||'No synopsis')}</div></div><button class="textbtn" data-delstory="${s.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</section>`;if(state.tab==='characters')body=`<section><div class="sectionhead"><div><h2>Characters</h2><span>People in the film.</span></div><button class="primary" id="addChar">New character</button></div><div class="chargrid">${data.characters.filter(c=>c.project===x.id).map(c=>`<article class="char"><div class="charname"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</div><div class="meta">${esc(c.gender||'')}</div><div class="bio">${esc(c.bio||'No bio yet.')}</div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></section>`;if(state.tab==='screenplay')body=`<div class="script"><aside class="scenes"><h4>Scenes</h4><div class="scene active">Opening</div><div class="scene">Scene 2</div><div class="scene">Scene 3</div></aside><section class="editor"><div class="toolbar"><button class="format" data-f="INT.">INT.</button><button class="format" data-f="EXT.">EXT.</button><button class="format" data-f="ACTION">Action</button><button class="format" data-f="CHARACTER">Character</button><button class="format" data-f="DIALOGUE">Dialogue</button></div><div class="paper"><div class="papertitle">${esc(x.name)}</div><div class="writing" id="editor" contenteditable="true" data-placeholder="Begin writing your screenplay..."></div></div></section></div>`;return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projectname">${esc(x.name)}</div><div class="tabs">${['overview','story','characters','screenplay'].map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="scroll"><div class="body">${body}</div></div>`}function listView(){let title=state.view==='projects'?'Projects':state.view==='scripts'?'Screenplays':state.view==='story'?'Storylines':'Characters';let rows=state.view==='projects'?data.projects.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemsub">${esc(x.synopsis||'No synopsis')}</div></div><button class="textbtn" data-open="${x.id}">Open</button></div>`):state.view==='scripts'?data.scripts.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemsub">Screenplay</div></div></div>`):state.view==='story'?data.storylines.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemsub">${esc(x.synopsis||'No synopsis')}</div></div></div>`):data.characters.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemsub">${esc(x.gender||'')}</div></div></div>`);return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">${title}</div><div style="max-width:760px">${rows||'<div class="empty">Nothing here yet.</div>'}</div></div></div>`}function render(){if(state.project)$('#main').innerHTML=projectView();else $('#main').innerHTML=state.view==='dashboard'?dashboard():listView();$$('[data-open]').forEach(e=>e.onclick=()=>{state.project=e.dataset.open;state.tab='overview';render()});$$('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});$('#back')?.addEventListener('click',()=>nav('dashboard'));$('#newProject')?.addEventListener('click',newProject);$('#pname')?.addEventListener('change',e=>{p().name=e.target.value;save()});$('#psyn')?.addEventListener('change',e=>{p().synopsis=e.target.value;save()});$('#addStory')?.addEventListener('click',storyModal);$('#addChar')?.addEventListener('click',charModal);$$('[data-delstory]').forEach(b=>b.onclick=()=>{data.storylines=data.storylines.filter(s=>s.id!==b.dataset.delstory);save();render()});$$('[data-f]').forEach(b=>b.onclick=()=>{let e=$('#editor');if(!e)return;e.focus();document.execCommand('insertText',false,(b.dataset.f==='CHARACTER'?'\n\nCHARACTER\n':b.dataset.f==='DIALOGUE'?'\nDIALOGUE\n':b.dataset.f==='ACTION'?'\nACTION\n':b.dataset.f+'\n'))});icons()}function newProject(){modal(`<h2>New film</h2><p>Give the project a name.</p><input class="input" id="mname" placeholder="Untitled film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{let x={id:uid(),name:$('#mname').value.trim()||'Untitled film',synopsis:''};data.projects.push(x);save();close();state.project=x.id;state.tab='overview';render()};$('#mname').focus()})}function storyModal(){modal(`<h2>New storyline</h2><p>Define a thread that carries through the film.</p><input class="input" id="sname" placeholder="Untitled storyline"><label class="field">Synopsis</label><textarea class="textarea" id="ssyn" placeholder="What is this storyline about?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=close;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sname').value.trim()||'Untitled storyline',synopsis:$('#ssyn').value,project:state.project});save();close();render()};$('#sname').focus()})}function charModal(){modal(`<h2>New character</h2><p>Create a character connected to this film.</p><input class="input" id="cname" placeholder="Character name"><label class="field">Gender</label><select class="select" id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="bio" placeholder="Character bio"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-color="#111" style="background:#111"></button><button class="color" data-color="#555" style="background:#555"></button><button class="color" data-color="#8b6f47" style="background:#8b6f47"></button><button class="color" data-color="#777" style="background:#777"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{let color='#111';$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=close;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cname').value.trim()||'Untitled character',gender:$('#gender').value,bio:$('#bio').value,color,project:state.project});save();close();render()};$('#cname').focus()})}render();</script></body></html>
