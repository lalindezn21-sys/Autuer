<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auteur Workspace</title>
<style>
:root{--bg:#f2f2f0;--sidebar:#e9e9e7;--paper:#fff;--text:#191919;--muted:#787875;--line:#dededb;--hover:#dededb;--accent:#111;--blue:#3478f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button,a{color:inherit}.app{height:100vh;display:flex;overflow:hidden}.sidebar{width:275px;flex:0 0 275px;background:var(--sidebar);border-right:1px solid #d4d4d1;display:flex;flex-direction:column;padding:8px;transition:.2s}.sidebar.collapsed{width:0;flex-basis:0;padding:0;overflow:hidden}.workspace{height:42px;display:flex;align-items:center;gap:9px;padding:0 9px;font-weight:700}.logo{width:27px;height:27px;background:#111;color:#fff;border-radius:6px;display:grid;place-items:center;font-weight:800}.workspace .arrow{margin-left:auto;color:#777}.side-tools{display:grid;gap:1px;margin:7px 0 12px}.side-btn,.page-btn{width:100%;border:0;background:transparent;border-radius:6px;text-align:left;padding:8px 9px;display:flex;align-items:center;gap:10px;color:#555}.side-btn:hover,.page-btn:hover,.page-btn.active{background:var(--hover);color:#111}.ico,.page-icon{width:20px;text-align:center;color:#70706d}.section-title{display:flex;align-items:center;padding:7px 9px 5px;color:#777;font-size:11px;font-weight:700}.section-title button{margin-left:auto;border:0;background:transparent;font-size:20px;color:#666}.pages{overflow:auto;flex:1}.page-btn{font-size:13px}.page-btn .dots{margin-left:auto;opacity:0}.page-btn:hover .dots{opacity:1}.bottom{border-top:1px solid #d6d6d3;padding-top:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}.topbar{height:48px;flex:0 0 48px;border-bottom:1px solid #ededeb;display:flex;align-items:center;padding:0 17px;gap:7px;color:#777}.topbar button{border:0;background:transparent;padding:6px 8px;border-radius:6px;color:#666}.topbar button:hover{background:#f0f0ee;color:#111}.crumb{display:flex;gap:6px;align-items:center;min-width:0}.crumb span:last-child{color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.search-shortcut{font-size:11px;color:#aaa;border:1px solid #ddd!important;padding:3px 6px!important}.editor{width:min(1100px,100%);margin:auto;flex:1;overflow:auto;padding:76px 82px 140px}.cover{font-size:58px;line-height:1;margin-bottom:20px}.title{font-size:43px;line-height:1.15;font-weight:700;letter-spacing:-2px;margin:0 0 10px;outline:none}.subtitle{color:#8a8a87;margin-bottom:34px}.callout{background:#f1f1ee;border-radius:7px;padding:17px 19px;margin:10px 0 24px;line-height:1.55}.section{font-size:19px;font-weight:700;margin:29px 0 8px}.block{min-height:30px;padding:4px;border-radius:5px;line-height:1.65;outline:none}.block:hover{background:#fafaf8}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:8px;padding:15px;background:#fff}.panel-title{font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}.database{border:1px solid #dededb;border-radius:8px;overflow:hidden;background:#fff;margin-top:10px}.dbbar{height:43px;border-bottom:1px solid #e5e5e2;display:flex;align-items:center;gap:3px;padding:0 8px}.dbbar button{border:0;background:transparent;border-radius:5px;padding:6px 9px;color:#555}.dbbar button:hover{background:#f0f0ee}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 12px;text-align:left;border-right:1px solid #e5e5e2;border-bottom:1px solid #e5e5e2}.table th{font-size:11px;font-weight:600;color:#777;background:#fafaf8}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.table td:last-child,.table th:last-child{border-right:0}.table tbody tr:hover{background:#fafaf8}.tag{display:inline-block;background:#eee;padding:3px 7px;border-radius:5px;font-size:11px}.progress{height:6px;background:#e7e7e4;border-radius:99px;overflow:hidden;width:100px}.progress span{height:100%;display:block;background:#222}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.feature{border:1px solid var(--line);border-radius:9px;padding:18px;min-height:150px;background:#fff;cursor:pointer}.feature:hover{background:#fafaf8}.feature .big{font-size:25px;margin-bottom:13px}.feature strong{font-size:15px}.feature p{font-size:12px;color:#777;line-height:1.5}.searchbox{position:fixed;top:58px;left:286px;width:390px;background:#fff;border:1px solid #d9d9d6;border-radius:9px;box-shadow:0 18px 60px #0002;padding:10px;z-index:50}.searchbox input{width:100%;border:0;outline:0;padding:9px}.result{padding:9px;border-radius:6px;cursor:pointer}.result:hover{background:#f0f0ee}.modal-bg{position:fixed;inset:0;background:#0004;display:grid;place-items:center;z-index:100}.modal{width:550px;max-width:calc(100% - 30px);background:#fff;border-radius:11px;padding:23px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 18px}.modal label{font-size:11px;font-weight:700;color:#777;display:block;margin:11px 0 5px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid #d9d9d6;border-radius:6px;padding:10px;outline:none;background:#fff}.modal textarea{height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.actions button{border:0;border-radius:6px;padding:8px 14px}.primary{background:#111;color:#fff}.hidden{display:none!important}.mobile-overlay{display:none}@media(max-width:800px){.sidebar{position:fixed;z-index:80;height:100vh}.editor{padding:45px 25px}.feature-grid,.columns{grid-template-columns:1fr}.searchbox{left:15px;width:calc(100% - 30px)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="workspace"><span class="logo">A</span><span>Auteur</span><span class="arrow">⌄</span></div>
<div class="side-tools">
<button class="side-btn" id="searchBtn"><span class="ico">⌕</span><span>Search</span><span class="spacer"></span><small>⌘K</small></button>
<button class="side-btn" onclick="show('home')"><span class="ico">⌂</span>Home</button>
<button class="side-btn" onclick="show('projects')"><span class="ico">▦</span>Projects</button>
</div>
<div class="section-title">PRIVATE <button id="addPage">+</button></div>
<div class="pages" id="pages"></div>
<div class="bottom"><button class="side-btn"><span class="ico">⚙</span>Settings</button><button class="side-btn"><span class="ico">▢</span>Trash</button></div>
</aside>
<main class="main">
<header class="topbar"><button id="toggle">☰</button><div class="crumb"><span>Auteur</span><span>›</span><span id="crumb">Home</span></div><div class="spacer"></div><button id="newTop">+ New</button><button id="more">•••</button></header>
<div class="searchbox hidden" id="searchbox"><input id="searchInput" placeholder="Search your workspace..."><div id="results"></div></div>
<section class="editor" id="editor"></section>
</main></div>
<div class="modal-bg hidden" id="modal"><div class="modal"><h2>New page</h2><label>Page title</label><input id="newTitle" placeholder="Untitled"><label>Icon</label><input id="newIcon" value="📄" maxlength="2"><label>Page type</label><select id="newType"><option value="notes">Page</option><option value="film">Film project</option></select><label>Description</label><textarea id="newDescription" placeholder="What is this page about?"></textarea><div class="actions"><button id="cancel">Cancel</button><button class="primary" id="create">Create</button></div></div></div>
<script>
const seed=[{id:'timeless',title:'Timeless Rangers',icon:'🎬',type:'film',stage:'Concept',genre:'Adventure',progress:72,idea:'A film concept in development.',storylines:['Core story','Character conflict','The larger world'],characters:['Main Character','Rival','Supporting Cast'],notes:'Develop the title, visual language, and central conflict.'},{id:'engineered',title:'Engineered Fear',icon:'🎞️',type:'film',stage:'Concept',genre:'Thriller',progress:35,idea:'Two criminals discover that their robberies are being used to manufacture fear.',storylines:['The jobs','The organization','The political truth'],characters:['The Robber','The Partner','The Architect'],notes:''},{id:'notes',title:'Film Notes',icon:'📝',type:'notes',stage:'',genre:'',progress:0,idea:'Loose ideas, titles, images, and fragments.',storylines:[],characters:[],notes:''}];
let pages=JSON.parse(localStorage.getItem('auteur-pages-v2')||'null')||seed,current='home';const $=x=>document.getElementById(x);function save(){localStorage.setItem('auteur-pages-v2',JSON.stringify(pages))}function get(id){return pages.find(p=>p.id===id)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(id){current=id;render()}function render(){let p=get(current);$('crumb').textContent=current==='home'?'Home':current==='projects'?'Projects':p?.title||'Home';$('pages').innerHTML=pages.map(x=>`<button class="page-btn ${x.id===current?'active':''}" onclick="show('${x.id}')"><span class="page-icon">${x.icon}</span>${esc(x.title)}<span class="dots">•••</span></button>`).join('');current==='home'?home():current==='projects'?projects():film(p)}
function home(){$('editor').innerHTML=`<div class="cover">🏠</div><h1 class="title">Home</h1><div class="subtitle">Your film workspace.</div><div class="callout"><b>Welcome to Auteur.</b><br>Build films from the first title to the finished production. Everything lives in pages, databases, and notes.</div><div class="section">Workspace</div><div class="feature-grid"><div class="feature" onclick="show('projects')"><div class="big">▦</div><strong>Projects</strong><p>Your complete film slate, stages, genres, and progress.</p></div><div class="feature" onclick="newProject()"><div class="big">≡</div><strong>Storylines</strong><p>Develop the major story threads inside each film.</p></div><div class="feature" onclick="newProject()"><div class="big">◉</div><strong>Characters</strong><p>Build characters, relationships, motivations, and arcs.</p></div><div class="feature" onclick="newProject()"><div class="big">◇</div><strong>Scenes</strong><p>Organize the actual sequence of the movie.</p></div><div class="feature" onclick="show('notes')"><div class="big">✎</div><strong>Notes</strong><p>Capture fragments, ideas, references, and discoveries.</p></div><div class="feature" onclick="newProject()"><div class="big">▤</div><strong>Production</strong><p>Track the path from development into filmmaking.</p></div></div><div class="section">Recent projects</div><div class="database"><table class="table"><thead><tr><th>Project</th><th>Stage</th><th>Genre</th><th>Progress</th></tr></thead><tbody>${pages.filter(p=>p.type==='film').map(p=>row(p)).join('')}</tbody></table></div>`}
function row(p){return `<tr onclick="show('${p.id}')"><td>${p.icon} ${esc(p.title)}</td><td><span class="tag">${esc(p.stage)}</span></td><td>${esc(p.genre)}</td><td><div class="progress"><span style="width:${p.progress}%"></span></div></td></tr>`}
function projects(){$('editor').innerHTML=`<div class="cover">🎬</div><h1 class="title">Projects</h1><div class="subtitle">Every film is a page. Every page grows with the film.</div><div class="database"><div class="dbbar"><button onclick="newProject()">+ New</button><button>Filter</button><button>Sort</button><button>Properties</button></div><table class="table"><thead><tr><th>Name</th><th>Stage</th><th>Genre</th><th>Progress</th></tr></thead><tbody>${pages.filter(p=>p.type==='film').map(row).join('')}</tbody></table></div>`}
function film(p){if(!p)return home();$('editor').innerHTML=`<div class="cover">${p.icon}</div><h1 class="title" contenteditable="true" onblur="rename('${p.id}',this.innerText)">${esc(p.title)}</h1><div class="subtitle">${esc(p.genre||'Creative page')}${p.stage?' · '+esc(p.stage):''}</div><div class="callout"><b>Core idea</b><br><div class="block" contenteditable="true" onblur="update('${p.id}','idea',this.innerText)">${esc(p.idea||'Start writing...')}</div></div><div class="columns"><div class="panel"><div class="panel-title">Storylines</div>${(p.storylines||[]).map(x=>`<div class="block">• ${esc(x)}</div>`).join('')||'<div class="block">Add storylines.</div>'}</div><div class="panel"><div class="panel-title">Characters</div>${(p.characters||[]).map(x=>`<div class="block">• ${esc(x)}</div>`).join('')||'<div class="block">Add characters.</div>'}</div></div><div class="section">Scenes</div><div class="block">+ Add a scene...</div><div class="section">Notes</div><div class="block" contenteditable="true" onblur="update('${p.id}','notes',this.innerText)">${esc(p.notes||'Start writing notes...')}</div>`}
function rename(id,v){let p=get(id);if(p){p.title=v.trim()||'Untitled';save();render()}}function update(id,k,v){let p=get(id);if(p){p[k]=v;save()}}function openModal(){$('modal').classList.remove('hidden');$('newTitle').focus()}function closeModal(){$('modal').classList.add('hidden')}function newProject(){openModal()}function create(){let title=$('newTitle').value.trim()||'Untitled',icon=$('newIcon').value||'📄',type=$('newType').value;let id='p'+Date.now();pages.push({id,title,icon,type,stage:type==='film'?'Concept':'',genre:'',progress:0,idea:$('newDescription').value.trim(),storylines:[],characters:[],notes:''});save();closeModal();$('newTitle').value='';$('newDescription').value='';show(id)}
$('toggle').onclick=()=>$('sidebar').classList.toggle('collapsed');$('addPage').onclick=openModal;$('newTop').onclick=openModal;$('cancel').onclick=closeModal;$('create').onclick=create;$('modal').onclick=e=>{if(e.target===e.currentTarget)closeModal()};$('searchBtn').onclick=()=>{$('searchbox').classList.toggle('hidden');$('searchInput').focus()};$('searchInput').oninput=e=>{let q=e.target.value.toLowerCase();$('results').innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q)||p.idea.toLowerCase().includes(q)).map(p=>`<div class="result" onclick="show('${p.id}');$('searchbox').classList.add('hidden')">${p.icon} ${esc(p.title)}</div>`).join('')};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('searchbox').classList.remove('hidden');$('searchInput').focus()}if(e.key==='Escape'){$('searchbox').classList.add('hidden');closeModal()}});render();
</script>
</body></html>
