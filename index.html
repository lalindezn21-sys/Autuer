<style>

-size:10px}.metaRow strong{color:#111}.cardmenu{position:absolute;right:13px;top:12px;color:#aaa;font-size:10px}.cardmenu:hover{color:#111}.projectbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:10px;background:#fff}.back{width:29px;height:29px;border-radius:5px;display:grid;place-items:center}.back:hover{background:#f1f1ef}.projectname{font:400 18px Georgia,serif}.tabs{margin-left:auto;height:100%;display:flex;gap:22px}.tab{height:100%;font-size:10px;color:#888;border-bottom:2px solid transparent}.tab.active{color:#111;border-color:#111;font-weight:700}.body{max-width:1100px;margin:auto;padding:37px 47px 80px}.cols{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.panel{border:1px solid var(--line);padding:22px;background:#fff}.panel h2{font:400 20px Georgia,serif;margin:0 0 18px}.field{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:16px 0 6px}.input,.textarea,.selectField{width:100%;border:0;border-bottom:1px solid #c9c9c6;background:#fff;outline:0;padding:8px 2px;font-size:12px}.textarea{min-height:145px;resize:vertical;line-height:1.6}.input:focus,.textarea:focus,.selectField:focus{border-color:#111}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itembody{flex:1}.itemtitle{font-size:12px;font-weight:700}.itemsub{font-size:10px;color:#888;margin-top:3px}.textbtn{font-size:10px;color:#777}.textbtn:hover{color:#111}.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.char{border:1px solid var(--line);padding:18px;transition:.18s}.char:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.charname{font:400 18px Georgia,serif}.meta{font-size:10px;color:#888;margin-top:4px}.bio{font-size:11px;line-height:1.55;color:#777;margin-top:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #111;border-bottom:1px solid var(--line);margin-bottom:18px}.stat{padding:15px 0}.stat:not(:last-child){border-right:1px solid var(--line);padding-right:18px}.stat:not(:first-child){padding-left:18px}.stat b{display:block;font:400 22px Georgia,serif}.stat span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#999}.scriptPage{height:100%;display:flex;flex-direction:column}.scriptTop{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:10px}.scriptTop .scriptTitle{font:400 16px Georgia,serif}.scriptMeta{font-size:10px;color:#999}.scriptTools{margin-left:auto;display:flex;gap:5px}.tool{height:30px;padding:0 9px;border-radius:4px;font-size:10px;color:#666}.tool:hover,.tool.active{background:#eee;color:#111}.scriptArea{flex:1;display:flex;min-height:0}.scenePanel{width:235px;border-right:1px solid var(--line);background:#fafaf8;display:flex;flex-direction:column}.sceneHeader{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.sceneHeader span{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999}.sceneList{padding:9px;overflow:auto}.scene{padding:11px 10px;border-radius:4px;margin-bottom:3px;color:#666;cursor:pointer;transition:.15s}.scene:hover,.scene.active{background:#ececea;color:#111}.sceneNum{font-size:9px;color:#999;margin-bottom:4px}.sceneName{font-size:11px}.sceneLoc{font-size:9px;color:#999;margin-top:3px}.writer{flex:1;min-width:0;display:flex;flex-direction:column}.formatbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:3px}.format{padding:6px 8px;border-radius:4px;font-size:10px;color:#666}.format:hover,.format.active{background:#eee;color:#111}.pageWrap{flex:1;overflow:auto;background:#f5f5f2;padding:35px 20px 70px}.paper{width:min(760px,100%);min-height:980px;background:#fff;margin:auto;padding:72px 90px;box-shadow:0 0 0 1px #e4e4e1,0 12px 35px #00000008}.paperTitle{text-align:center;font:400 22px Georgia,serif;margin-bottom:50px}.writing{min-height:820px;outline:none;white-space:pre-wrap;font:13px/1.8 "Courier New",monospace}.writing:empty:before{content:attr(data-placeholder);color:#bbb}.scriptSide{width:220px;border-left:1px solid var(--line);padding:18px;background:#fff;overflow:auto}.scriptSide h4{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin:0 0 12px}.sideBlock{border-bottom:1px solid var(--line);padding:0 0 15px;margin-bottom:17px}.sideStat{display:flex;justify-content:space-between;font-size:10px;padding:7px 0}.notes{width:100%;min-height:120px;border:1px solid var(--line);resize:vertical;padding:9px;font-size:10px;outline:none}.modalbg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}.modalbg.open{display:flex}.modal{width:min(470px,calc(100% - 30px));background:#fff;padding:25px;box-shadow:0 22px 60px #0002}.modal h2{font:400 23px Georgia,serif;margin:0 0 5px}.modal p{font-size:11px;color:#777;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.colors{display:flex;gap:8px}.color{width:21px;height:21px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.color.selected{box-shadow:0 0 0 2px #111}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:1000px){.scriptSide{display:none}}@media(max-width:800px){.side{width:170px}.home{padding:42px 25px}.start,.cols{display:block}.start .primary{margin-top:16px}.panel{margin-bottom:14px}.body,.page{padding:25px}.tabs{gap:10px}.scenePanel{width:190px}}@media(max-width:560px){.side{display:none}.tabs{display:none}.scenePanel{display:none}.paper{padding:45px 25px}.home,.page{padding:35px 18px}.toolbar{flex-wrap:wrap}.search{max-width:none;width:100%}}
</style></head>
<body>
<div class="app"><header class="top"><div class="logo">Auteur</div><div class="grow"></div><span class="topstatus" id="status">Ready</span><button class="create" id="create">Create</button></header><div class="shell"><aside class="side"><div class="label">Workspace</div><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav" data-view="projects"><i data-lucide="clapperboard"></i>Projects</button><button class="nav" data-view="scripts"><i data-lucide="file-text"></i>Screenplays</button><div class="gap"></div><div class="label">Development</div><button class="nav" data-view="story"><i data-lucide="git-branch"></i>Storylines</button><button class="nav" data-view="characters"><i data-lucide="users"></i>Characters</button></aside><main class="main" id="main"></main></div></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
const KEY='auteur-pro-v7', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('auteur-pro-v6')||'null')||JSON.parse(localStorage.getItem('auteur-clean-v5')||'null')||{projects:[],scripts:[],storylines:[],characters:[]};
data.projects??=[];data.scripts??=[];data.storylines??=[];data.characters??=[];
data.projects.forEach(x=>{x.synopsis??='';x.genre??='';x.runtime??='';x.logline??='';x.notes??='';x.status??='Development'});
data.scripts.forEach(x=>{x.scenes??=[{id:uid(),heading:'OPENING',location:'',content:''}];x.notes??='';x.content??=''});
let state={view:'dashboard',project:null,tab:'overview',scene:0};
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#status').textContent='Ready',1000)}
function icons(){lucide.createIcons({attrs:{'stroke-width':1.7}})}function p(){return data.projects.find(x=>x.id===state.project)}function script(){return data.scripts.find(x=>x.project===state.project)}
function nav(view){state={view,project:null,tab:'overview',scene:0};render()}
function modal(html,setup){$('#modal').innerHTML=html;$('#modalbg').classList.add('open');setup?.();icons()}function closeModal(){$('#modalbg').classList.remove('open')}
$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};$('#create').onclick=newProject;$$('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function dashboard(){let recent=data.projects.slice(-5).reverse();return `<div class="scroll"><div class="home"><div class="eyebrow">Auteur</div><div class="headline">Make the film. Keep the thinking.</div><div class="intro">A focused workspace for developing stories, characters, worlds, and screenplays without burying the work under interface.</div><section class="start"><div><h2>Begin a new film</h2><p>Start with a title and build the project around it.</p></div><button class="primary" id="newProject">New project</button></section><section class="section"><div class="sectionhead"><h2>Recent films</h2><span>${recent.length}</span></div><div class="grid">${recent.length?recent.map(x=>`<article class="film" data-open="${x.id}"><small>${esc(x.status||'Film project')}</small><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No synopsis yet.')}</p></article>`).join(''):`<div class="empty">Your projects will appear here.</div>`}</div></section></div></div>`}
function projectsPage(){return `<div class="scroll"><div class="page"><div class="eyebrow">Workspace</div><div class="headline">Projects</div><div class="intro">Every film in development, with its story, people, and screenplay connected.</div><div class="toolbar"><input class="search" id="projectSearch" placeholder="Search projects..."><select class="select" id="projectSort"><option value="recent">Recently created</option><option value="name">Name</option><option value="status">Status</option></select><button class="primary" id="newProjectPage">New project</button></div><div class="projectgrid" id="projectGrid">${projectCards(data.projects)}</div></div></div>`}
function projectCards(list){if(!list.length)return '<div class="empty">No projects found.</div>';let sorted=[...list];return sorted.reverse().map(x=>{let chars=data.characters.filter(c=>c.project===x.id).length,stories=data.storylines.filter(s=>s.project===x.id).length,s=scriptFor(x.id);return `<article class="projectcard" data-open="${x.id}"><button class="cardmenu" data-delete-project="${x.id}">Delete</button><div class="projecttop"><span class="tag">${esc(x.status||'Development')}</span><span class="tag">${s?'Draft':'No draft'}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.logline||x.synopsis||'No logline yet.')}</p><div class="metaRow"><span><strong>${stories}</strong> storylines</span><span><strong>${chars}</strong> characters</span><span><strong>${s?s.wordCount||0:0}</strong> words</span></div></article>`}).join('')}
function scriptFor(id){return data.scripts.find(x=>x.project===id)}
function projectView(){let x=p();if(!x){nav('dashboard');return ''}let tabs=['overview','story','characters','screenplay'];let body=state.tab==='overview'?overview(x):state.tab==='story'?storyView(x):state.tab==='characters'?charactersView(x):screenplayView(x);return `<div class="projectbar"><button class="back" id="back"><i data-lucide="chevron-left"></i></button><div class="projectname">${esc(x.name)}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>${body}`}
function overview(x){let chars=data.characters.filter(c=>c.project===x.id).length,stories=data.storylines.filter(s=>s.project===x.id).length,s=scriptFor(x.id);return `<div class="scroll"><div class="body"><div class="stats"><div class="stat"><b>${stories}</b><span>Storylines</span></div><div class="stat"><b>${chars}</b><span>Characters</span></div><div class="stat"><b>${s?.wordCount||0}</b><span>Words</span></div></div><div class="cols"><section class="panel"><h2>Project overview</h2><label class="field">Title</label><input class="input" id="pname" value="${esc(x.name)}"><label class="field">Logline</label><input class="input" id="plogline" value="${esc(x.logline)}" placeholder="One sentence that captures the film."><label class="field">Synopsis</label><textarea class="textarea" id="psyn">${esc(x.synopsis)}</textarea><label class="field">Notes</label><textarea class="textarea" id="pnotes" placeholder="Ideas, questions, visual thoughts...">${esc(x.notes)}</textarea></section><section class="panel"><h2>Film details</h2><label class="field">Status</label><select class="selectField" id="pstatus"><option ${x.status==='Development'?'selected':''}>Development</option><option ${x.status==='Drafting'?'selected':''}>Drafting</option><option ${x.status==='Revising'?'selected':''}>Revising</option><option ${x.status==='Complete'?'selected':''}>Complete</option></select><label class="field">Genre</label><input class="input" id="pgenre" value="${esc(x.genre)}" placeholder="Psychological thriller"><label class="field">Runtime</label><input class="input" id="pruntime" value="${esc(x.runtime)}" placeholder="2h 20m"><div class="section" style="margin-top:28px"><div class="item"><div class="itembody"><div class="itemtitle">Screenplay</div><div class="itemsub">${s?`${s.wordCount||0} words · ${s.scenes?.length||0} scenes`:'No draft started'}</div></div><button class="textbtn" id="openScript">${s?'Open':'Start'}</button></div></div></section></div></div></div>`}
function storyView(x){let rows=data.storylines.filter(s=>s.project===x.id);return `<div class="scroll"><div class="body"><div class="sectionhead"><div><h2>Storylines</h2><span>Threads that carry through the film.</span></div><button class="primary" id="addStory">New storyline</button></div>${rows.map(s=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(s.name)}</div><div class="itemsub">${esc(s.synopsis||'No synopsis yet.')}</div></div><button class="textbtn" data-del-story="${s.id}">Delete</button></div>`).join('')||'<div class="empty">No storylines yet.</div>'}</div></div>`}
function charactersView(x){let rows=data.characters.filter(c=>c.project===x.id);return `<div class="scroll"><div class="body"><div class="sectionhead"><div><h2>Characters</h2><span>People who inhabit the film.</span></div><button class="primary" id="addChar">New character</button></div><div class="chargrid">${rows.map(c=>`<article class="char"><div class="charname"><span class="dot" style="background:${esc(c.color||'#111')}"></span>${esc(c.name)}</div><div class="meta">${esc(c.gender||'')}</div><div class="bio">${esc(c.bio||'No bio yet.')}</div><div style="margin-top:13px"><button class="textbtn" data-del-char="${c.id}">Delete</button></div></article>`).join('')||'<div class="empty">No characters yet.</div>'}</div></div></div>`}
function screenplayView(x){let s=scriptFor(x.id);if(!s){s={id:uid(),project:x.id,name:x.name,scenes:[{id:uid(),heading:'OPENING',location:'',content:''}],notes:'',wordCount:0};data.scripts.push(s);save()}let sc=s.scenes[state.scene]||s.scenes[0];state.scene=Math.max(0,s.scenes.indexOf(sc));return `<div class="scriptPage"><div class="scriptTop"><div class="scriptTitle">${esc(x.name)}</div><span class="scriptMeta" id="scriptSave">Draft · ${s.wordCount||0} words</span><div class="scriptTools"><button class="tool" id="renameScript">Details</button><button class="tool" id="addSceneTop">New scene</button></div></div><div class="scriptArea"><aside class="scenePanel"><div class="sceneHeader"><span>Scenes</span><button class="tool" id="addScene"><i data-lucide="plus"></i></button></div><div class="sceneList">${s.scenes.map((a,i)=>`<div class="scene ${i===state.scene?'active':''}" data-scene="${i}"><div class="sceneNum">${String(i+1).padStart(2,'0')}</div><div class="sceneName">${esc(a.heading||'Untitled scene')}</div><div class="sceneLoc">${esc(a.location||'')}</div></div>`).join('')}</div></aside><section class="writer"><div class="formatbar">${['SCENE HEADING','ACTION','CHARACTER','DIALOGUE','PARENTHETICAL','TRANSITION'].map(f=>`<button class="format" data-format="${f}">${f}</button>`).join('')}<span style="margin-left:auto;font-size:9px;color:#999">${esc(x.runtime||'')}</span></div><div class="pageWrap"><div class="paper"><div class="paperTitle">${esc(x.name)}</div><div class="writing" id="writing" contenteditable="true" spellcheck="true" data-placeholder="Begin writing this scene...">${esc(sc.content||'')}</div></div></div></section><aside class="scriptSide"><div class="sideBlock"><h4>Scene</h4><div class="sideStat"><span>Heading</span><b>${esc(sc.heading||'Untitled')}</b></div><div class="sideStat"><span>Words</span><b id="sceneWords">${countWords(sc.content||'')}</b></div></div><div class="sideBlock"><h4>Draft</h4><div class="sideStat"><span>Scenes</span><b>${s.scenes.length}</b></div><div class="sideStat"><span>Words</span><b>${s.wordCount||0}</b></div><div class="sideStat"><span>Pages</span><b>${Math.max(1,Math.ceil((s.wordCount||0)/250))}</b></div></div><div class="sideBlock"><h4>Notes</h4><textarea class="notes" id="scriptNotes" placeholder="Draft notes...">${esc(s.notes||'')}</textarea></div></aside></div></div>`}
function countWords(t){return String(t||'').trim()?String(t).trim().split(/\s+/).length:0}
function bind(){icons();$$('[data-open]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-delete-project]'))return;state.project=e.dataset.open;state.tab='overview';state.scene=0;render()});$$('.nav').forEach(b=>b.classList.toggle('active',!state.project&&b.dataset.view===state.view));$$('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});$('#back')?.addEventListener('click',()=>nav('dashboard'));$('#newProject')?.addEventListener('click',newProject);$('#newProjectPage')?.addEventListener('click',newProject);$('#addStory')?.addEventListener('click',storyModal);$('#addChar')?.addEventListener('click',charModal);$('#openScript')?.addEventListener('click',()=>{state.tab='screenplay';render()});
$$('[data-del-story]').forEach(b=>b.onclick=()=>{if(confirm('Delete this storyline?')){data.storylines=data.storylines.filter(s=>s.id!==b.dataset.delStory);save();render()}});$$('[data-del-char]').forEach(b=>b.onclick=()=>{if(confirm('Delete this character?')){data.characters=data.characters.filter(c=>c.id!==b.dataset.delChar);save();render()}});$$('[data-delete-project]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Delete this project and its connected storylines, characters, and screenplay?')){let id=b.dataset.deleteProject;data.projects=data.projects.filter(x=>x.id!==id);data.storylines=data.storylines.filter(x=>x.project!==id);data.characters=data.characters.filter(x=>x.project!==id);data.scripts=data.scripts.filter(x=>x.project!==id);save();render()}});
['pname','plogline','psyn','pnotes','pstatus','pgenre','pruntime'].forEach(id=>$('#'+id)?.addEventListener('change',e=>{let x=p();let key={pname:'name',plogline:'logline',psyn:'synopsis',pnotes:'notes',pstatus:'status',pgenre:'genre',pruntime:'runtime'}[id];x[key]=e.target.value;save();render()}));
$('#projectSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();$('#projectGrid').innerHTML=projectCards(data.projects.filter(x=>(x.name+' '+x.logline+' '+x.synopsis).toLowerCase().includes(q)));bind()});$('#projectSort')?.addEventListener('change',e=>{let arr=[...data.projects];if(e.target.value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));if(e.target.value==='status')arr.sort((a,b)=>(a.status||'').localeCompare(b.status||''));$('#projectGrid').innerHTML=projectCards(arr);bind()});
$$('[data-scene]').forEach(e=>e.onclick=()=>{state.scene=Number(e.dataset.scene);render()});$('#addScene')?.addEventListener('click',addScene);$('#addSceneTop')?.addEventListener('click',addScene);$('#renameScript')?.addEventListener('click',()=>scriptDetails());$('#scriptNotes')?.addEventListener('input',e=>{let s=script();s.notes=e.target.value;save()});$('#writing')?.addEventListener('input',e=>{let s=script(),sc=s.scenes[state.scene];sc.content=e.target.innerText;s.wordCount=s.scenes.reduce((n,a)=>n+countWords(a.content),0);$('#sceneWords').textContent=countWords(sc.content);$('#scriptSave').textContent=`Draft · ${s.wordCount} words · Saved`;clearTimeout(window.writerTimer);window.writerTimer=setTimeout(save,500)});$$('[data-format]').forEach(b=>b.onclick=()=>formatInsert(b.dataset.format));
}
function formatInsert(type){let ed=$('#writing');if(!ed)return;ed.focus();let text={"SCENE HEADING":"INT. ",ACTION:"",CHARACTER:"\n\n",DIALOGUE:"\n",PARENTHETICAL:"\n(",TRANSITION:"\n\nCUT TO:\n"}[type]??'';document.execCommand('insertText',false,text)}
function addScene(){let s=script();s.scenes.push({id:uid(),heading:'UNTITLED SCENE',location:'',content:''});state.scene=s.scenes.length-1;save();render()}
function newProject(){modal(`<h2>New film</h2><p>Start with the information that matters. Everything else can grow inside the project.</p><label class="field">Title</label><input class="input" id="mname" placeholder="Untitled film"><label class="field">Logline</label><input class="input" id="mlog" placeholder="One sentence about the film"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{let x={id:uid(),name:$('#mname').value.trim()||'Untitled film',logline:$('#mlog').value.trim(),synopsis:'',genre:'',runtime:'',notes:'',status:'Development'};data.projects.push(x);save();closeModal();state.project=x.id;state.tab='overview';render()};$('#mname').focus()})}
function storyModal(){modal(`<h2>New storyline</h2><p>Define a thread that carries through the film.</p><label class="field">Title</label><input class="input" id="sname" placeholder="Untitled storyline"><label class="field">Synopsis</label><textarea class="textarea" id="ssyn" placeholder="What is this storyline about?"></textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.storylines.push({id:uid(),name:$('#sname').value.trim()||'Untitled storyline',synopsis:$('#ssyn').value,project:state.project});save();closeModal();render()};$('#sname').focus()})}
function charModal(){modal(`<h2>New character</h2><p>Create a character connected to this film.</p><label class="field">Name</label><input class="input" id="cname" placeholder="Character name"><label class="field">Gender</label><select class="selectField" id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select><label class="field">Bio</label><textarea class="textarea" id="bio" placeholder="Character bio"></textarea><label class="field">Color</label><div class="colors"><button class="color selected" data-color="#111" style="background:#111"></button><button class="color" data-color="#555" style="background:#555"></button><button class="color" data-color="#8b6f47" style="background:#8b6f47"></button><button class="color" data-color="#777" style="background:#777"></button></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Create</button></div>`,()=>{let color='#111';$$('.color').forEach(b=>b.onclick=()=>{$$('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');color=b.dataset.color});$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{data.characters.push({id:uid(),name:$('#cname').value.trim()||'Untitled character',gender:$('#gender').value,bio:$('#bio').value,color,project:state.project});save();closeModal();render()};$('#cname').focus()})}
function scriptDetails(){let s=script(),x=p();modal(`<h2>Screenplay details</h2><p>Keep the draft metadata close without interrupting the writing.</p><label class="field">Draft title</label><input class="input" id="dtitle" value="${esc(s.name||x.name)}"><label class="field">Notes</label><textarea class="textarea" id="dnotes">${esc(s.notes||'')}</textarea><div class="actions"><button class="secondary" id="cancel">Close</button><button class="primary" id="confirm">Save</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{s.name=$('#dtitle').value.trim()||x.name;s.notes=$('#dnotes').value;save();closeModal();render()}})}
function screenplayPage(){let scripts=data.scripts;if(!scripts.length)return `<div class="scroll"><div class="page"><div class="eyebrow">Writing</div><div class="headline">Screenplays</div><div class="intro">Your drafts live inside their film projects.</div><section class="section"><div class="empty">No screenplays yet. Open a project and start writing.</div></section></div></div>`;return `<div class="scroll"><div class="page"><div class="eyebrow">Writing</div><div class="headline">Screenplays</div><div class="intro">Drafts currently in development.</div><section class="section"><div class="grid">${scripts.map(s=>{let x=pById(s.project);return `<article class="film" data-open="${s.project}"><small>${esc(x?.name||'Untitled film')}</small><h3>${esc(s.name||x?.name||'Untitled')}</h3><p>${s.wordCount||0} words · ${s.scenes?.length||0} scenes</p></article>`}).join('')}</div></section></div></div>`}
function pById(id){return data.projects.find(x=>x.id===id)}
function listPage(type){let title=type==='story'?'Storylines':'Characters';let rows=type==='story'?data.storylines:data.characters;return `<div class="scroll"><div class="page"><div class="eyebrow">Development</div><div class="headline">${title}</div><div class="intro">${type==='story'?'Story threads across your films.':'Characters across your film projects.'}</div><section class="section">${rows.length?rows.map(r=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(r.name)}</div><div class="itemsub">${esc(pById(r.project)?.name||'Unassigned')}</div></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</section></div></div>`}
function render(){let html=state.project?projectView():state.view==='dashboard'?dashboard():state.view==='projects'?projectsPage():state.view==='scripts'?screenplayPage():listPage(state.view);$('#main').innerHTML=html;bind()}
render();
</script></body></html>
