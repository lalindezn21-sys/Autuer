<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamscape</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:'DM Serif Display',Georgia,serif}.screen{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;will-change:transform}.white-screen{z-index:1;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(238,238,238,.9),rgba(255,255,255,.98));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.white-screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.7) 42%,transparent 50%,rgba(255,255,255,.25) 75%,transparent 100%);opacity:.9}.red-screen{z-index:2;background:linear-gradient(135deg,#F02D20,#d91e15,#F02D20);transform:translateY(100%);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.dream-wrap{width:100vw;margin-top:10vh;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,4vw,52px);padding:0 28px;position:relative;z-index:2}.rule{height:2px;width:calc(100vw - 56px);background:#111;box-shadow:0 2px 0 rgba(255,255,255,.8),0 4px 10px rgba(0,0,0,.22);flex:none}.dream,.location{color:#050505;font-family:'DM Serif Display',Georgia,serif;position:relative;display:inline-block;text-shadow:1px 1px 0 #fff,-1px -1px 0 rgba(255,255,255,.75),2px 3px 0 rgba(0,0,0,.18),4px 6px 0 rgba(0,0,0,.12),6px 9px 14px rgba(0,0,0,.22)}.dream{width:100%;padding:0;font-size:clamp(40px,11.5vw,172px);font-weight:400;line-height:.72;letter-spacing:-.035em;white-space:nowrap;text-align:center;transform:scaleX(1.08);transform-origin:center;filter:drop-shadow(0 2px 2px rgba(255,255,255,.75))}.dream:after,.location:after{content:"";position:absolute;left:8%;right:8%;top:5%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.16),transparent);filter:blur(2px);opacity:.8;pointer-events:none}.dream .m{display:inline-block;transform:scaleX(.94);transform-origin:center}.location{font-size:clamp(16px,1.6vw,24px);font-weight:400;letter-spacing:.08em;text-align:center;margin-top:-18px;text-shadow:1px 1px 0 #fff,-1px -1px 0 rgba(255,255,255,.75),2px 2px 0 rgba(0,0,0,.16),3px 4px 0 rgba(0,0,0,.1),5px 7px 10px rgba(0,0,0,.2)}.location:after{left:12%;right:12%;height:30%;top:3%}.transitioning{pointer-events:none}</style></head><body><section class="screen white-screen"><main class="dream-wrap"><div class="rule"></div><div class="dream">DREA<span class="m">M</span>SCAPE</div><div class="rule"></div><div class="location">New York</div></main></section><section class="screen red-screen"></section><script>const red=document.querySelector('.red-screen');let progress=0,raf=0;const wheelScale=.11;function render(){red.style.transform=`translateY(${100-progress}%)`;raf=0}function apply(delta){progress=Math.max(0,Math.min(100,progress+delta));if(!raf)raf=requestAnimationFrame(render)}window.addEventListener('wheel',e=>apply(e.deltaY*wheelScale),{passive:true});let sy=0;window.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});window.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;apply((sy-y)*.35);sy=y},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown')apply(8);if(e.key==='ArrowUp')apply(-8);if(e.key==='PageDown')apply(100);if(e.key==='PageUp')apply(-100)});</script></body></html>
