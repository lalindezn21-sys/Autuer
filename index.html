isplay:flex;justify-content:space-between}.studio-tab:hover{background:#151517;color:#fff}.studio-tab.active{background:#19191c;color:#fff}.studio-tab.active span:last-child{color:var(--red)}.canvas{min-width:0;overflow:auto;background:#d2d2cf}.paper{width:min(820px,calc(100% - 70px));min-height:calc(100% - 55px);margin:28px auto 70px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);padding:70px 90px}.paper-head{border-bottom:1px solid #d4d3ce;padding-bottom:18px;margin-bottom:30px}.paper-title{width:100%;border:0;background:transparent;outline:0;text-align:center;color:#777;font:9px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.script-tools{display:flex;justify-content:center;gap:4px;margin-bottom:22px}.tool{border:1px solid #ccc;background:#eee;color:#555;padding:5px 7px;border-radius:3px;font:7px ui-monospace,monospace}.tool:hover{background:#fff;color:#111}.screenplay{width:100%;min-height:950px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:12px/1.75 "Courier Prime",Courier,monospace;white-space:pre-wrap}.screenplay::placeholder{color:#aaa}.side-panel{border-left:1px solid var(--line);background:#0a0a0b;overflow:auto}.inspector-body{padding:15px}.field{margin-bottom:17px}.field label{display:block;color:#5f5f65;font:7px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#111113;color:#ddd;border-radius:5px;padding:9px;font-size:10px;outline:0}.field textarea{min-height:120px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:#555}.meter{height:3px;background:#242428;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--red);width:0}.meta-line{display:flex;justify-content:space-between;color:#555;font:7px ui-monospace,monospace;margin-top:6px}.story-page{height:100%;overflow:auto;padding:50px clamp(24px,5vw,70px)}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:35px}.story-card{background:#111113;padding:25px;min-height:240px}.story-card h3{font:26px Georgia;margin:0 0 12px}.story-card p{color:#707076;font-size:10px;line-height:1.7}.big-input{width:100%;min-height:170px;background:transparent;border:0;color:#ddd;outline:0;resize:vertical;font-size:11px;line-height:1.8}.character-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:30px}.character-row>div{background:#111113;padding:22px}.character-row input{background:transparent;border:0;color:#fff;outline:0;font:24px Georgia;width:100%}.command{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);display:none;place-items:start center;padding-top:14vh;z-index:100}.command.open{display:grid}.command-box{width:min(620px,calc(100% - 28px));background:#141416;border:1px solid #343438;border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.command-input{width:100%;border:0;border-bottom:1px solid var(--line);background:#111113;color:#fff;padding:18px;outline:0;font-size:13px}.command-list{max-height:330px;overflow:auto;padding:7px}.command-item{width:100%;border:0;background:transparent;color:#bbb;padding:12px;text-align:left;border-radius:5px;display:flex;justify-content:space-between;font-size:10px}.command-item:hover{background:#1d1d20;color:#fff}.command-item kbd{color:#555;font:7px ui-monospace,monospace}.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(10px);display:none;place-items:center;z-index:110}.modal.open{display:grid}.modal-box{width:min(520px,calc(100% - 28px));background:#141416;border:1px solid #343438;border-radius:8px;padding:27px;box-shadow:var(--shadow)}.modal-box h2{font:43px Georgia;letter-spacing:-.06em;margin:8px 0 22px}.modal-box h2 span{color:var(--red)}.modal-box input{width:100%;background:#0d0d0f;border:1px solid #38383d;color:#fff;border-radius:5px;padding:13px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.secondary{border:1px solid #343438;background:#1b1b1e;color:#bbb;border-radius:5px;padding:9px 12px;font-size:9px}.toast{position:fixed;right:17px;bottom:17px;z-index:200;background:#f2f1ed;color:#111;border-radius:5px;padding:10px 13px;font:8px ui-monospace,monospace;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}.mobile-only{display:none}@media(max-width:1050px){.studio{grid-template-columns:185px minmax(0,1fr)}.side-panel{display:none}.paper{padding:60px 65px}.app{grid-template-columns:215px minmax(0,1fr)}}@media(max-width:780px){.app{grid-template-columns:58px minmax(0,1fr)}.brand{justify-content:center;padding:0;font-size:0}.brand:before{content:"A";font:900 15px Arial}.side-scroll{padding:12px 7px}.label,.project-section,.side-bottom{display:none}.nav button{height:40px;justify-content:center;font-size:0}.nav-mark{font-size:12px}.nav button.active:before{display:none}.topbar{padding:0 10px}.save{display:none}.new{padding:9px}.crumb{max-width:150px}.page{padding:35px 18px 60px}.project-grid,.story-grid,.character-row{grid-template-columns:1fr}.zero{align-items:flex-start;flex-direction:column}.statbar{grid-template-columns:1fr 1fr}.studio{grid-template-columns:1fr}.studio-nav{display:none}.paper{width:calc(100% - 22px);padding:45px 28px;margin:12px auto 40px}.screenplay{font-size:10px}.mobile-only{display:block}}@media(max-width:460px){.statbar{grid-template-columns:1fr}.hero-title{font-size:21vw}.section-head{align-items:flex-start;gap:15px;flex-direction:column}}

<body>
<div class="app">
<aside class="sidebar"><div class="brand">AUTEUR<i>.</i></div><div class="side-scroll"><div class="label">Workspace</div><div class="nav"><button class="active" data-nav="home"><span class="nav-mark">01</span>Home</button><button data-nav="projects"><span class="nav-mark">02</span>Projects</button><button data-nav="studio"><span class="nav-mark">03</span>Studio</button></div><div class="project-section"><div class="label">Your Projects</div><div class="project-list" id="projectList"></div></div></div><div class="side-bottom">AUTEUR / PRIVATE WORKSPACE<br>LOCAL DATA / NO SAMPLE CONTENT</div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="icon" id="back" title="Back">←</button><div class="crumb" id="crumb">Workspace / <b>Home</b></div></div><div class="top-right"><span class="save" id="saveState">READY</span><button class="icon" id="search" title="Command palette">⌘K</button><button class="new" id="new">NEW PROJECT</button></div></header><div class="viewport" id="viewport"></div></main>
</div>
<div class="modal" id="modal"><div class="modal-box"><div class="eyebrow">New project</div><h2>Start with <span>the title.</span></h2><input id="title" placeholder="Project title" autocomplete="off" spellcheck="false"><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="new" id="create">Create project</button></div></div></div>
<div class="command" id="command"><div class="command-box"><input class="command-input" id="commandInput" placeholder="Search projects or commands…" autocomplete="off"><div class="command-list" id="commandList"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);const KEY='auteur.projects.v3';let projects=JSON.parse(localStorage.getItem(KEY)||'[]');let current=null;let view='home';let saveTimer=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const persist=()=>localStorage.setItem(KEY,JSON.stringify(projects));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),1700)}
function project(){return projects.find(p=>p.id===current)}
function touch(){const p=project();if(!p)return;p.updated=Date.now();persist();$('#saveState').textContent='SAVED '+new Date(p.updated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}).replace(' ','');clearTimeout(saveTimer);saveTimer=setTimeout(()=>$('#saveState').textContent='SAVED',500)}
function renderList(){const el=$('#projectList');el.innerHTML='';projects.forEach(p=>{const b=document.createElement('button');b.className='project-row '+(p.id===current?'active':'');b.innerHTML='<i class="dot"></i><span class="project-name"></span>';b.querySelector('.project-name').textContent=p.title;b.onclick=()=>openProject(p.id);el.appendChild(b)})}
function crumb(){const p=project();$('#crumb').innerHTML='Workspace / <b>'+esc(p&&view==='studio'?p.title:view[0].toUpperCase()+view.slice(1))+'</b>'}
function setNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view))}
function home(){view='home';current=null;renderList();setNav();crumb();$('#viewport').innerHTML=`<section class="page"><div class="eyebrow">AUTEUR / SCREENWRITING SYSTEM</div><h1 class="hero-title">Write the<br><span>film.</span></h1><p class="hero-copy">A private creative environment built around the way a film actually develops. Start with a title. Build the world. Write the page. Keep everything connected.</p><div class="zero"><div><h2>${projects.length?'Workspace ready.':'Your workspace is empty.'}</h2><p>${projects.length?'Open a project and continue building it. Every change is stored locally on this device.':'There are no example projects, demo characters, fake statistics, or synthetic clutter. The first thing here should be yours.'}</p></div><button class="outline-btn" id="homeNew">${projects.length?'CREATE NEW PROJECT':'CREATE YOUR FIRST PROJECT'} ↗</button></div><div class="statbar"><div class="stat"><b>${projects.length}</b><small>PROJECTS</small></div><div class="stat"><b>LOCAL</b><small>STORAGE</small></div><div class="stat"><b>∞</b><small>IDEAS</small></div><div class="stat"><b>⌘K</b><small>COMMAND PALETTE</small></div></div></section>`;$('#homeNew').onclick=openModal}
function projectsPage(){view='projects';current=null;renderList();setNav();crumb();$('#viewport').innerHTML=`<section class="page"><div class="section-head"><div><div class="eyebrow">PROJECT INDEX</div><h1 class="section-title">Your <span>work.</span></h1></div><select class="filter" id="sort"><option value="updated">RECENT</option><option value="created">CREATED</option><option value="title">TITLE</option></select></div><div class="project-grid" id="grid"></div></section>`;drawCards();$('#sort').onchange=drawCards}
function drawCards(){const g=$('#grid');if(!g)return;let arr=[...projects];const s=$('#sort').value;if(s==='title')arr.sort((a,b)=>a.title.localeCompare(b.title));else if(s==='created')arr.sort((a,b)=>b.created-a.created);else arr.sort((a,b)=>b.updated-a.updated);if(!arr.length){g.innerHTML='<div class="empty-grid">NO PROJECTS / CREATE ONE TO BEGIN</div>';return}g.innerHTML='';arr.forEach((p,i)=>{const c=document.createElement('button');c.className='card';c.innerHTML=`<div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><span>${new Date(p.updated).toLocaleDateString()}</span></div><div><h2>${esc(p.title)}</h2><p>${esc(p.logline||'No story statement yet.')}</p></div><div class="card-foot"><span class="pill">${esc(p.status)}</span><span class="arrow">↗</span></div>`;c.onclick=()=>openProject(p.id);g.appendChild(c)})}
function openProject(id){current=id;view='studio';renderList();setNav();crumb();studio('development')}
function studio(tab='development'){const p=project();if(!p){home();return}view='studio';crumb();setNav();renderList();const tabs=[['development','Development'],['story','Story'],['screenplay','Screenplay'],['characters','Characters'],['research','Research'],['notes','Notes']];$('#viewport').innerHTML=`<section class="studio"><aside class="studio-nav"><div class="studio-nav-head">Project</div><div class="studio-tabs">${tabs.map(x=>`<button class="studio-tab ${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]} <span>›</span></button>`).join('')}</div></aside><div id="studioMain"></div><aside class="side-panel"><div class="inspector-head">Project data</div><div class="inspector-body"><div class="field"><label>Title</label><input id="pTitle" value="${esc(p.title)}"></div><div class="field"><label>Status</label><select id="pStatus"><option>Development</option><option>Writing</option><option>Revision</option><option>Complete</option><option>Archived</option></select></div><div class="field"><label>Logline</label><textarea id="pLogline" placeholder="What is the film?">${esc(p.logline)}</textarea></div><div class="field"><label>Progress</label><div class="meter"><i style="width:${Math.min(100,p.progress||0)}%"></i></div><div class="meta-line"><span>${p.progress||0}%</span><span>PROJECT</span></div></div><div class="field"><label>Created</label><div style="color:#666;font:9px ui-monospace,monospace">${new Date(p.created).toLocaleDateString()}</div></div></div></aside></section>`;$('#pStatus').value=p.status;$('#pTitle').oninput=e=>{p.title=e.target.value||'Untitled';touch();renderList();crumb()};$('#pStatus').onchange=e=>{p.status=e.target.value;touch()};$('#pLogline').oninput=e=>{p.logline=e.target.value;touch()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>studio(b.dataset.tab));renderTab(tab)}
function renderTab(tab){const p=project(),m=$('#studioMain');if(!m)return;if(tab==='development')m.innerHTML=`<section class="story-page"><div class="eyebrow">${esc(p.title)} / DEVELOPMENT</div><h1 class="section-title" style="font:500 clamp(50px,7vw,100px)/.82 Georgia;margin:17px 0;letter-spacing:-.07em">Build the <span>film.</span></h1><div class="story-grid"><div class="story-card"><h3>Premise</h3><textarea class="big-input" id="premise" placeholder="What is the film fundamentally about?">${esc(p.premise)}</textarea></div><div class="story-card"><h3>Theme</h3><textarea class="big-input" id="theme" placeholder="What is the film saying?">${esc(p.theme)}</textarea></div><div class="story-card"><h3>Conflict</h3><textarea class="big-input" id="conflict" placeholder="What force makes the story move?">${esc(p.conflict)}</textarea></div><div class="story-card"><h3>World</h3><textarea class="big-input" id="world" placeholder="Where and under what rules does it exist?">${esc(p.world)}</textarea></div></div></section>`;['premise','theme','conflict','world'].forEach(k=>$('#'+k).oninput=e=>{p[k]=e.target.value;touch()})
else if(tab==='story')m.innerHTML=`<section class="story-page"><div class="eyebrow">STORY ARCHITECTURE</div><h1 class="section-title" style="font:500 clamp(50px,7vw,100px)/.82 Georgia;margin:17px 0;letter-spacing:-.07em">Find the <span>shape.</span></h1><div class="story-grid"><div class="story-card"><h3>Beginning</h3><textarea class="big-input" id="beginning" placeholder="The opening movement...">${esc(p.beginning)}</textarea></div><div class="story-card"><h3>Middle</h3><textarea class="big-input" id="middle" placeholder="The pressure system...">${esc(p.middle)}</textarea></div><div class="story-card"><h3>End</h3><textarea class="big-input" id="ending" placeholder="The final movement...">${esc(p.ending)}</textarea></div><div class="story-card"><h3>Three Storylines</h3><textarea class="big-input" id="storylines" placeholder="The three major narrative lines...">${esc(p.storylines)}</textarea></div></div></section>`;['beginning','middle','ending','storylines'].forEach(k=>$('#'+k).oninput=e=>{p[k]=e.target.value;touch()})
else if(tab==='screenplay')m.innerHTML=`<section class="canvas"><div class="paper"><div class="paper-head"><input class="paper-title" value="${esc(p.title)}"><div class="script-tools"><button class="tool" data-insert="INT. ">SCENE</button><button class="tool" data-insert="ACTION\n">ACTION</button><button class="tool" data-insert="\nCHARACTER\n">CHARACTER</button><button class="tool" data-insert="\nDIALOGUE\n">DIALOGUE</button><button class="tool" data-insert="\n(CONT'D)\n">PARENTHETICAL</button></div></div><textarea class="screenplay" id="script" placeholder="Begin writing…">${esc(p.screenplay)}</textarea></div></section>`;$('#script').oninput=e=>{p.screenplay=e.target.value;p.progress=Math.min(100,Math.round(Math.min(1,p.screenplay.length/18000)*100));touch();const meter=document.querySelector('.meter i');if(meter)meter.style.width=p.progress+'%'});document.querySelector('.paper-title').oninput=e=>{p.title=e.target.value||'Untitled';touch();renderList();crumb()};document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insertAtCursor($('#script'),b.dataset.insert))
else if(tab==='characters')m.innerHTML=`<section class="story-page"><div class="eyebrow">CHARACTER INDEX</div><h1 class="section-title" style="font:500 clamp(50px,7vw,100px)/.82 Georgia;margin:17px 0;letter-spacing:-.07em">People in the <span>film.</span></h1><div class="character-row"><div><div class="eyebrow">Name</div><input id="charName" value="${esc(p.characterName)}" placeholder="Character name"></div><div><div class="eyebrow">Function</div><input id="charRole" value="${esc(p.characterRole)}" placeholder="Role in story"></div><div style="grid-column:1/-1"><div class="eyebrow">Character notes</div><textarea class="big-input" id="charNotes" placeholder="Who are they, what do they want, and what changes?">${esc(p.characterNotes)}</textarea></div></div></section>`;['charName','charRole','charNotes'].forEach(k=>$('#'+k).oninput=e=>{p[{charName:'characterName',charRole:'characterRole',charNotes:'characterNotes'}[k]]=e.target.value;touch()})
else if(tab==='research')m.innerHTML=`<section class="story-page"><div class="eyebrow">RESEARCH VAULT</div><h1 class="section-title" style="font:500 clamp(50px,7vw,100px)/.82 Georgia;margin:17px 0;letter-spacing:-.07em">Know the <span>world.</span></h1><div class="story-grid"><div class="story-card" style="grid-column:1/-1"><h3>Research</h3><textarea class="big-input" id="research" placeholder="Sources, facts, images to find, historical details, technical references...">${esc(p.research)}</textarea></div></div></section>`;$('#research').oninput=e=>{p.research=e.target.value;touch()}
else m.innerHTML=`<section class="story-page"><div class="eyebrow">PRIVATE NOTES</div><h1 class="section-title" style="font:500 clamp(50px,7vw,100px)/.82 Georgia;margin:17px 0;letter-spacing:-.07em">Think <span>freely.</span></h1><div class="story-grid"><div class="story-card" style="grid-column:1/-1"><textarea class="big-input" style="min-height:480px" id="notes" placeholder="Anything that belongs to the film but does not belong anywhere else...">${esc(p.notes)}</textarea></div></div></section>`;$('#notes').oninput=e=>{p.notes=e.target.value;touch()}}
function insertAtCursor(el,text){const a=el.selectionStart,b=el.selectionEnd;el.value=el.value.slice(0,a)+text+el.value.slice(b);el.selectionStart=el.selectionEnd=a+text.length;el.dispatchEvent(new Event('input'));el.focus()}
function openModal(){ $('#modal').classList.add('open');$('#title').value='';setTimeout(()=>$('#title').focus(),20)}function closeModal(){ $('#modal').classList.remove('open')}
function createProject(){const title=$('#title').value.trim();if(!title){toast('TITLE REQUIRED');return}const p={id:crypto.randomUUID(),title,status:'Development',logline:'',premise:'',theme:'',conflict:'',world:'',beginning:'',middle:'',ending:'',storylines:'',characterName:'',characterRole:'',characterNotes:'',research:'',notes:'',screenplay:'',progress:0,created:Date.now(),updated:Date.now()};projects.unshift(p);persist();closeModal();openProject(p.id);toast('PROJECT CREATED')}
function commandOpen(){const c=$('#command');c.classList.add('open');const input=$('#commandInput');input.value='';renderCommands('');setTimeout(()=>input.focus(),20)}function commandClose(){ $('#command').classList.remove('open')}
function renderCommands(q){const list=$('#commandList');const base=[['New project','new'],['Home','home'],['Projects','projects'],...projects.map(p=>[p.title,'project:'+p.id])];const rows=base.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).slice(0,14);list.innerHTML=rows.map((x,i)=>`<button class="command-item" data-cmd="${esc(x[1])}"><span>${esc(x[0])}</span><kbd>${i<3?['N','H','P'][i]:''}</kbd></button>`).join('');list.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>runCommand(b.dataset.cmd))}
function runCommand(cmd){commandClose();if(cmd==='new')openModal();else if(cmd==='home')home();else if(cmd==='projects')projectsPage();else if(cmd.startsWith('project:'))openProject(cmd.slice(8))}
$('#new').onclick=openModal;$('#cancel').onclick=closeModal;$('#create').onclick=createProject;$('#back').onclick=()=>view==='studio'?projectsPage():home();$('#search').onclick=commandOpen;$('#commandInput').oninput=e=>renderCommands(e.target.value);$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#command').onclick=e=>{if(e.target===$('#command'))commandClose()};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='home')home();else if(b.dataset.nav==='projects')projectsPage();else if(current)b.dataset.nav==='studio'&&studio();else toast('CREATE OR OPEN A PROJECT FIRST')});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandOpen()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal()}if(e.key==='Escape'){closeModal();commandClose()}});home();
</script>
</body>
</html>
