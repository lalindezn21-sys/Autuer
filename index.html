<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auteur</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.hero{font-size:94px;font-weight:550;letter-spacing:-4px;line-height:1.02;color:#181613;text-align:center;transform:translateY(-145px);white-space:nowrap}
.hero .top,.hero .bottom{display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:.015em .16em .035em;border-radius:999px;background:rgba(24,22,19,.12);color:#181613;min-width:2.15em;will-change:transform,background-color,opacity}
</style>
</head>
<body>
<div class="hero">
  <span class="top">Where idealists and</span>
  <span class="bottom">auteur <span class="pill" id="animatedWord">build</span> together.</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const word = document.getElementById('animatedWord');
const words = [
  {text:'build', color:'#181613'},
  {text:'create', color:'#F97316'},
  {text:'scale', color:'#2563EB'},
  {text:'jam', color:'#7C3AED'}
];
let index = 0;

function cycleWord(){
  const next = words[index = (index + 1) % words.length];

  gsap.timeline()
    .to(word, {
      duration:.6,
      opacity:.08,
      scale:.985,
      ease:'power1.inOut'
    })
    .call(() => {
      word.textContent = next.text;
    })
    .to(word, {
      duration:.8,
      opacity:1,
      scale:1,
      backgroundColor:next.color,
      color:next.color === '#181613' ? '#fff' : '#fff',
      ease:'power1.inOut'
    });
}

gsap.delayedCall(3, function repeat(){
  cycleWord();
  gsap.delayedCall(3, repeat);
});
</script>
</body>
</html>
