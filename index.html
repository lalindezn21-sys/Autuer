<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title>
<style>
:root{--bg:#f4f3f0;--panel:#fff;--panel2:#faf9f7;--line:#e5e2dc;--text:#292825;--muted:#8d8a83;--soft:#f0eee9;--accent:#d96b4c;--accent2:#e9a27e;--blue:#6c91b7;--shadow:0 8px 28px rgba(40,36,30,.09)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:54px 250px 1fr}.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:5px;z-index:20}.logo{width:34px;height:34px;border-radius:10px;background:#262521;color:#fff;display:grid;place-items:center;font:700 19px Georgia,serif;margin-bottom:17px}.rail button{width:38px;height:38px;border-radius:9px;color:#9a978f;font-size:17px}.rail button:hover,.rail button.active{background:#f0eee9;color:#34312d}.rail-bottom{margin-top:auto}.side{background:#fbfaf8;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{height:58px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-weight:650}.sidehead button{margin-left:auto;font-size:21px;color:#777}.search{padding:12px}.searchbox{height:34px;border:1px solid #dfdcd6;background:#fff;border-radius:8px;display:flex;align-items:center;padding:0 9px;color:#aaa}.searchbox input{border:0;outline:0;background:transparent;width:100%;padding-left:7px;font-size:12px}.sidebody{overflow:auto;padding-bottom:12px}.label{padding:14px 13px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#a5a199}.boardrow{display:flex;align-items:center;gap:8px;margin:2px 7px;padding:8px 9px;border-radius:8px;color:#55514b;cursor:pointer}.boardrow:hover,.boardrow.active{background:#eceae5;color:#24221f}.boarddot{width:8px;height:8px;border-radius:3px;background:#c9c5bd}.boardrow .more{margin-left:auto;opacity:0}.boardrow:hover .more{opacity:1}.workspace{position:relative;min-width:0;overflow:hidden;background:var(--bg)}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 17px;z-index:10;position:relative}.title{font-weight:650}.topright{margin-left:auto;display:flex;align-items:center;gap:3px}.top button{padding:7px 9px;border-radius:7px;color:#777;font-size:11px}.top button:hover{background:var(--soft);color:#25231f}.share{background:#2c2a27!important;color:#fff!important;padding:8px 15px!important}.canvas{position:absolute;inset:58px 0 0;overflow:auto}.world{position:relative;width:6000px;height:4500px;background-image:radial-gradient(#d7d4cd 1px,transparent 1px);background-size:24px 24px}.selection{position:absolute;display:none;border:2px solid #c9876c;pointer-events:none;z-index:40}.card{position:absolute;background:#fff;border:1px solid #dedbd5;border-radius:9px;box-shadow:0 3px 14px rgba(40,36,30,.07);min-width:180px;user-select:none}.card.sel{box-shadow:0 0 0 2px #e2a088,0 5px 18px rgba(40,36,30,.12)}.cardhead{display:flex;align-items:center;gap:6px;padding:8px 10px 0;color:#aaa;font-size:10px}.grip{cursor:grab;flex:1;height:14px}.cardtools{display:flex;gap:2px}.cardtools button{width:22px;height:22px;border-radius:5px;color:#aaa}.cardtools button:hover{background:#f0eee9;color:#555}.content{padding:10px 13px 13px}.editable{outline:0}.editable:empty:before{content:attr(data-placeholder);color:#b5b1a9}.note{width:285px}.note .content{padding-top:4px}.note-title{font-size:15px;font-weight:650;min-height:20px}.note-body{margin-top:8px;line-height:1.5;color:#5c5953;min-height:35px}.todo{width:290px}.todo-title{font-size:15px;font-weight:650;min-height:20px}.tasks{margin-top:8px}.task{display:flex;gap:8px;align-items:flex-start;padding:5px 0}.task input{margin-top:2px;accent-color:#555;flex:0 0 auto}.tasktext{flex:1;min-height:18px;line-height:1.35}.addtask{font-size:11px;color:#aaa;margin-top:5px;padding:4px 0}.column{width:315px;background:#efede8}.column>.content{padding:12px}.column-title{font-size:14px;font-weight:650;min-height:20px}.column-body{margin-top:5px}.column .nested{position:relative!important;left:auto!important;top:auto!important;width:100%;margin-top:9px;box-shadow:none}.image{width:310px;overflow:hidden}.image-preview{height:185px;background:#eeece7;display:flex;align-items:center;justify-content:center;color:#aaa;cursor:pointer}.image-preview img{width:100%;height:100%;object-fit:cover}.image-caption{min-height:20px}.link{width:300px}.link-preview{height:80px;background:#f0eee9;border-radius:6px;margin-bottom:9px;display:flex;align-items:center;justify-content:center;color:#aaa}.link-title{font-weight:650}.link-url{margin-top:5px;color:#888;word-break:break-all}.file{width:300px}.filebody{display:flex;gap:10px;align-items:center}.fileicon{width:42px;height:42px;border-radius:8px;background:#efede8;display:grid;place-items:center;font-size:18px}.file-name{font-weight:600}.file-size{font-size:10px;color:#aaa;margin-top:3px}.comment{width:300px}.comment-body{line-height:1.45;color:#555}.comment-input{margin-top:9px;border:1px solid #e1ded8;border-radius:7px;padding:8px;width:100%;resize:none;outline:0}.comment-send{margin-top:6px;background:#2e2b27;color:#fff;border-radius:6px;padding:6px 10px;font-size:10px}.swatch{width:190px;padding:10px}.swatch-color{height:55px;border-radius:6px}.swatch-name{margin-top:8px;font-weight:600}.line-card{height:2px;background:#aaa;transform-origin:0 0}.drop{position:fixed;left:68px;bottom:18px;background:#fff;border:1px solid #ddd9d2;border-radius:11px;box-shadow:var(--shadow);padding:6px;width:210px;z-index:60;display:none}.drop.open{display:block}.drop button{width:100%;text-align:left;padding:9px;border-radius:7px;font-size:12px;color:#4e4a44;display:flex;gap:9px}.drop button:hover{background:#f1efeb}.drop kbd{margin-left:auto;color:#aaa;font-size:9px}.zoom{position:fixed;right:17px;bottom:16px;background:#fff;border:1px solid #ddd9d2;border-radius:9px;box-shadow:0 3px 12px #0000000d;display:flex;align-items:center;z-index:50}.zoom button{width:32px;height:31px;color:#777}.zoom span{width:50px;text-align:center;color:#888;font-size:10px}.status{position:fixed;left:320px;bottom:16px;background:#fff;border:1px solid #ddd9d2;border-radius:9px;padding:7px 10px;color:#aaa;font-size:10px;z-index:50}.modal{position:fixed;inset:0;background:#2b292680;display:none;place-items:center;z-index:100}.modal.open{display:grid}.modalbox{width:400px;background:#fff;border-radius:13px;padding:21px;box-shadow:0 25px 70px #0003}.modalbox h2{margin:0 0 15px;font-size:18px}.modalbox input{width:100%;height:39px;border:1px solid #ddd9d2;border-radius:8px;padding:0 10px;outline:0}.modalactions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.modalactions button{padding:8px 13px;border-radius:7px}.primary{background:#2c2a27;color:#fff}.toast{position:fixed;right:18px;top:70px;background:#2c2a27;color:#fff;padding:8px 11px;border-radius:7px;font-size:10px;opacity:0;transition:.18s;z-index:120}.toast.show{opacity:1}.context{position:fixed;display:none;background:#fff;border:1px solid #ddd9d2;border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:150;width:170px}.context.open{display:block}.context button{display:block;width:100%;text-align:left;padding:8px;border-radius:6px;font-size:11px}.context button:hover{background:#f0eee9}.presentation{position:fixed;inset:0;background:#f4f3f0;z-index:200;display:none;overflow:auto}.presentation.open{display:block}.presentation .presentworld{position:relative;width:100%;height:100%;transform-origin:0 0}.closepresent{position:fixed;right:18px;top:18px;background:#fff;border:1px solid #ddd9d2;border-radius:8px;padding:8px 11px;z-index:210}.hidden{display:none!important}@media(max-width:800px){.app{grid-template-columns:54px 1fr}.side{display:none}.status{left:70px}.topright button:nth-child(-n+3){display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><div class="logo" id="logo">A</div><button class="active" title="Boards">▦</button><button id="searchBtn" title="Search">⌕</button><button id="trashBtn" title="Trash">♧</button><div class="rail-bottom"><button id="helpBtn" title="Help">?</button><button id="settingsBtn" title="Settings">⚙</button></div></aside>
<aside class="side"><div class="sidehead">My boards<button id="newBoard" title="New board">＋</button></div><div class="search"><div class="searchbox">⌕<input id="search" placeholder="Search"></div></div><div class="sidebody"><div class="label">Boards</div><div id="boards"></div></div></aside>
<main class="workspace"><header class="top"><div class="title" id="title"></div><div class="topright"><button id="undo">Undo</button><button id="redo">Redo</button><button id="zoomFit">Fit</button><button id="present">Present</button><button id="export">Export</button><button class="share" id="share">Share</button></div></header><section class="canvas" id="canvas"><div class="world" id="world"></div></section><div class="status" id="status">0 items</div><div class="zoom"><button id="minus">−</button><span id="pct">100%</span><button id="plus">＋</button></div><div class="drop" id="drop"><button data-type="note">Note <kbd>N</kbd></button><button data-type="todo">To-do list <kbd>T</kbd></button><button data-type="column">Column <kbd>C</kbd></button><button data-type="image">Image</button><button data-type="link">Link</button><button data-type="file">File</button><button data-type="comment">Comment</button><button data-type="swatch">Color</button></div></main>
</div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">New board</h2><input id="modalInput"><div class="modalactions"><button id="modalCancel">Cancel</button><button class="primary" id="modalOk">Create</button></div></div></div>
<div class="context" id="context"><button id="duplicate">Duplicate</button><button id="deleteItem">Delete</button></div>
<div class="toast" id="toast"></div>
<div class="presentation" id="presentation"><button class="closepresent" id="closePresent">Exit presentation</button><div class="presentworld" id="presentWorld"></div></div>
<script>
const KEY='autuer-workspace-v4', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const blank={boards:[],active:null,items:[],trash:[],settings:{}};let state=load(),scale=1,history=[],future=[],drag=null,selected=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(blank)}catch{return structuredClone(blank)}}
function persist(){state.items=[...document.querySelectorAll('#world>.card')].map(serialize);localStorage.setItem(KEY,JSON.stringify(state));updateStatus()}
function serialize(e){return{type:e.dataset.type,id:e.dataset.id||crypto.randomUUID(),left:e.style.left,top:e.style.top,html:e.innerHTML,meta:e.dataset.meta||''}}
function snapshot(){history.push(JSON.stringify([...document.querySelectorAll('#world>.card')].map(serialize)));if(history.length>50)history.shift();future=[]}
function restore(items){$('#world').innerHTML='';items.forEach(x=>make(x));bindAll();persist()}
function make(x){let e=document.createElement('div');e.className='card '+x.type;e.dataset.type=x.type;e.dataset.id=x.id||crypto.randomUUID();e.dataset.meta=x.meta||'';e.style.left=x.left;e.style.top=x.top;e.innerHTML=x.html;$('#world').append(e);return e}
function renderBoards(){let q=$('#search').value.toLowerCase();let a=state.boards.filter(x=>x.toLowerCase().includes(q));$('#boards').innerHTML='';a.forEach(n=>{let e=document.createElement('div');e.className='boardrow '+(n===state.active?'active':'');e.innerHTML='<span class="boarddot"></span><span>'+esc(n)+'</span><button class="more">•••</button>';e.onclick=ev=>{if(ev.target.classList.contains('more')){openBoardMenu(n,ev);return}state.active=n;$('#title').textContent=n;renderBoards();persist()};$('#boards').append(e)});$('#title').textContent=state.active||''}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openBoardMenu(n,ev){let r=ev.target.getBoundingClientRect();$('#context').style.left=r.right+'px';$('#context').style.top=r.top+'px';$('#context').classList.add('open');$('#context').dataset.board=n;$('#duplicate').textContent='Rename board';$('#deleteItem').textContent='Delete board';$('#duplicate').onclick=()=>{modal('Rename board',n,v=>{let i=state.boards.indexOf(n);state.boards[i]=v;state.active=v;closeContext();renderBoards();persist()})};$('#deleteItem').onclick=()=>{state.boards=state.boards.filter(x=>x!==n);if(state.active===n)state.active=state.boards[0]||null;closeContext();renderBoards();persist()}}
function closeContext(){$('#context').classList.remove('open')}
function updateStatus(){let n=document.querySelectorAll('#world>.card').length;$('#status').textContent=n+' item'+(n===1?'':'s')}
function bindAll(){ $$('#world>.card').forEach(bindCard);updateStatus() }
function bindCard(e){e.onpointerdown=ev=>{if(ev.button!==0||ev.target.closest('[contenteditable],input,textarea,button,a'))return;select(e);snapshot();drag={e,x:ev.clientX,y:ev.clientY,l:parseFloat(e.style.left)||0,t:parseFloat(e.style.top)||0,m:false};e.setPointerCapture(ev.pointerId);e.addEventListener('pointermove',move);e.addEventListener('pointerup',up,{once:true})};e.oncontextmenu=ev=>{ev.preventDefault();select(e);let x=ev.clientX,y=ev.clientY;$('#context').style.left=x+'px';$('#context').style.top=y+'px';$('#context').classList.add('open');$('#duplicate').textContent='Duplicate';$('#deleteItem').textContent='Delete';$('#duplicate').onclick=()=>{duplicateSelected();closeContext()};$('#deleteItem').onclick=()=>{deleteSelected();closeContext()}};e.querySelectorAll('[contenteditable]').forEach(x=>x.addEventListener('input',persist));e.querySelectorAll('input').forEach(x=>x.addEventListener('change',persist));let img=e.querySelector('.image-preview');if(img)img.onclick=()=>chooseImage(e);let add=e.querySelector('.addtask');if(add)add.onclick=()=>{let d=document.createElement('label');d.className='task';d.innerHTML='<input type="checkbox"><span class="tasktext editable" contenteditable="true"></span>';e.querySelector('.tasks').append(d);bindCard(e);persist()};let send=e.querySelector('.comment-send');if(send)send.onclick=()=>{let inp=e.querySelector('.comment-input');if(inp.value.trim()){let p=document.createElement('div');p.className='comment-body';p.textContent=inp.value.trim();e.querySelector('.content').insertBefore(p,inp);inp.value='';persist()}}}
function move(ev){if(!drag)return;let dx=(ev.clientX-drag.x)/scale,dy=(ev.clientY-drag.y)/scale;if(Math.abs(dx)+Math.abs(dy)>2)drag.m=true;drag.e.style.left=drag.l+dx+'px';drag.e.style.top=drag.t+dy+'px'}
function up(){if(!drag)return;drag.e.removeEventListener('pointermove',move);if(drag.m)persist();drag=null}
function select(e){$$('.card.sel').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');selected=e}
function add(type,x,y){snapshot();let e=document.createElement('div');e.className='card '+type;e.dataset.type=type;e.dataset.id=crypto.randomUUID();e.style.left=x+'px';e.style.top=y+'px';let h='';if(type==='note')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="note-title editable" contenteditable="true" data-placeholder="Title"></div><div class="note-body editable" contenteditable="true" data-placeholder="Write something..."></div></div>';if(type==='todo')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="todo-title editable" contenteditable="true" data-placeholder="To-do list"></div><div class="tasks"><label class="task"><input type="checkbox"><span class="tasktext editable" contenteditable="true"></span></label></div><button class="addtask">＋ Add item</button></div>';if(type==='column')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="column-title editable" contenteditable="true" data-placeholder="Column title"></div><div class="column-body"></div></div>';if(type==='image')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="image-preview">Add image</div><div class="image-caption editable" contenteditable="true" data-placeholder="Caption"></div></div>';if(type==='link')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="link-preview">Link</div><div class="link-title editable" contenteditable="true" data-placeholder="Title"></div><div class="link-url editable" contenteditable="true" data-placeholder="Paste URL"></div></div>';if(type==='file')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="filebody"><div class="fileicon">□</div><div><div class="file-name editable" contenteditable="true" data-placeholder="File name"></div><div class="file-size">Choose a file</div></div></div></div>';if(type==='comment')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><div class="comment-body editable" contenteditable="true" data-placeholder="Comment"></div><textarea class="comment-input" rows="2" placeholder="Reply..."></textarea><button class="comment-send">Send</button></div>';if(type==='swatch')h='<div class="cardhead"><span class="grip"></span><div class="cardtools"><button class="delete">×</button></div></div><div class="content"><input type="color" value="#d96b4c" class="swatch-picker"><div class="swatch-color"></div><div class="swatch-name editable" contenteditable="true" data-placeholder="Color name"></div></div>';e.innerHTML=h;$('#world').append(e);bindCard(e);e.querySelector('.delete')?.addEventListener('click',()=>{snapshot();e.remove();persist()});if(type==='file')e.querySelector('.filebody').onclick=()=>chooseFile(e);if(type==='swatch'){let p=e.querySelector('.swatch-picker'),c=e.querySelector('.swatch-color');c.style.background=p.value;p.oninput=()=>{c.style.background=p.value;persist()}}select(e);persist();e.querySelector('[contenteditable]')?.focus();return e}
function chooseImage(e){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{e.querySelector('.image-preview').innerHTML='<img src="'+r.result+'">';persist()};r.readAsDataURL(f)};i.click()}
function chooseFile(e){let i=document.createElement('input');i.type='file';i.onchange=()=>{let f=i.files[0];if(!f)return;e.querySelector('.file-name').textContent=f.name;e.querySelector('.file-size').textContent=(f.size/1024).toFixed(1)+' KB';persist()};i.click()}
function duplicateSelected(){if(!selected)return;snapshot();let x=serialize(selected);x.id=crypto.randomUUID();x.left=(parseFloat(x.left)||0)+25+'px';x.top=(parseFloat(x.top)||0)+25+'px';make(x);bindAll();persist()}
function deleteSelected(){if(!selected)return;snapshot();state.trash.push(serialize(selected));selected.remove();selected=null;persist();toast('Moved to trash')}
function modal(title,value,cb){$('#modalTitle').textContent=title;$('#modalInput').value=value||'';$('#modal').classList.add('open');$('#modalInput').focus();$('#modalOk').onclick=()=>{let v=$('#modalInput').value.trim();if(v){cb(v);$('#modal').classList.remove('open')}}}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1000)}
function zoom(v){scale=Math.max(.5,Math.min(1.75,v));$('#world').style.transform='scale('+scale+')';$('#world').style.transformOrigin='0 0';$('#pct').textContent=Math.round(scale*100)+'%'}
function openAdd(){let r=$('#logo').getBoundingClientRect();$('#drop').style.left=r.left+65+'px';$('#drop').style.top=r.top+'px';$('#drop').classList.toggle('open')}
function present(){let p=$('#presentation'),w=$('#presentWorld');w.innerHTML='';document.querySelectorAll('#world>.card').forEach(c=>{let n=c.cloneNode(true);n.classList.remove('sel');n.style.transform='scale('+scale+')';w.append(n)});p.classList.add('open')}
$('#logo').onclick=openAdd;$('#newBoard').onclick=()=>modal('New board','',n=>{if(!state.boards.includes(n))state.boards.push(n);state.active=n;renderBoards();persist();toast('Board created')});$('#modalCancel').onclick=()=>$('#modal').classList.remove('open');$('#search').oninput=renderBoards;$('#searchBtn').onclick=()=>$('#search').focus();$$('[data-type]').forEach(b=>b.onclick=()=>{let r=$('#canvas').getBoundingClientRect();add(b.dataset.type,(r.width/2-140+$('#canvas').scrollLeft)/scale,(r.height/2-100+$('#canvas').scrollTop)/scale);$('#drop').classList.remove('open')});$('#plus').onclick=()=>zoom(scale+.1);$('#minus').onclick=()=>zoom(scale-.1);$('#zoomFit').onclick=()=>zoom(1);$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify([...document.querySelectorAll('#world>.card')].map(serialize)));restore(JSON.parse(history.pop()));toast('Undo')};$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify([...document.querySelectorAll('#world>.card')].map(serialize)));restore(JSON.parse(future.pop()));toast('Redo')};$('#present').onclick=present;$('#closePresent').onclick=()=>$('#presentation').classList.remove('open');$('#export').onclick=()=>{let out=[state.active||'Autuer',''];document.querySelectorAll('#world>.card').forEach(c=>out.push(c.innerText));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\n\n')],{type:'text/plain'}));a.download=(state.active||'autuer')+'.txt';a.click()};$('#share').onclick=()=>{navigator.clipboard?.writeText(location.href);toast('Board link copied')};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.drop')&&!e.target.closest('#logo'))$('#drop').classList.remove('open');if(!e.target.closest('.context'))closeContext()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();persist();toast('Saved')}if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();$('#undo').click()}if((e.metaKey||e.ctrlKey)&&e.key==='y'){e.preventDefault();$('#redo').click()}if(e.key==='Escape'){$('#drop').classList.remove('open');closeContext();$('#presentation').classList.remove('open')}});$('#canvas').addEventListener('dragover',e=>e.preventDefault());$('#canvas').addEventListener('drop',e=>{e.preventDefault();let f=e.dataTransfer.files[0];if(f?.type.startsWith('image/')){let r=new FileReader();r.onload=()=>{let x=(e.clientX-$('#canvas').getBoundingClientRect().left+$('#canvas').scrollLeft)/scale,y=(e.clientY-$('#canvas').getBoundingClientRect().top+$('#canvas').scrollTop)/scale,n=add('image',x,y);n.querySelector('.image-preview').innerHTML='<img src="'+r.result+'">';persist()};r.readAsDataURL(f)}});if(state.active===null&&state.boards.length)state.active=state.boards[0];renderBoards();(state.items||[]).forEach(make);bindAll();
</script></body></html>
