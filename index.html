<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autuer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30302e;background:#f6f6f3}button,input,textarea{font:inherit}button{border:0;background:none;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:58px 235px 1fr}.rail,.side,.top{background:#fff;border-color:#e5e5e0}.rail{border-right:1px solid #e5e5e0;display:flex;align-items:center;flex-direction:column;padding:12px 0;gap:7px}.logo{width:34px;height:34px;border-radius:8px;background:#242424;color:#fff;display:grid;place-items:center;font:bold 18px Georgia;margin-bottom:15px}.rail button{width:38px;height:38px;border-radius:7px;color:#888;font-size:17px}.rail button:hover,.rail .on{background:#f0f0ec;color:#222}.bottom{margin-top:auto}.side{border-right:1px solid #e5e5e0;background:#fbfbf9;overflow:auto}.sidehead{height:59px;padding:0 14px;display:flex;align-items:center;font-weight:650;border-bottom:1px solid #e5e5e0}.sidehead button{margin-left:auto;font-size:20px;color:#888}.search{margin:12px}.search input{width:100%;padding:9px;border:1px solid #ddd;border-radius:6px;outline:0;background:#fff}.label{padding:12px 10px 6px;color:#999;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.board{margin:2px 7px;padding:8px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:12px}.board:hover,.board.active{background:#ededE9}.workspace{position:relative;overflow:hidden}.top{height:59px;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;padding:0 17px;position:relative;z-index:5}.title{font-weight:650}.actions{margin-left:auto;display:flex;gap:3px}.actions button{padding:7px 10px;border-radius:6px;color:#777;font-size:11px}.actions button:hover{background:#f1f1ed;color:#222}.share{background:#282828!important;color:white!important}.canvas{position:absolute;inset:59px 0 0;overflow:auto;background:#f7f7f4;background-image:radial-gradient(#d9d9d4 1px,transparent 1px);background-size:24px 24px}.world{position:relative;width:2600px;height:1700px}.hint{position:absolute;top:30px;left:45px;color:#aaa;font-size:11px}.card{position:absolute;background:#fff;border:1px solid #e1e1dc;border-radius:7px;box-shadow:0 2px 12px #0000000c;min-width:170px}.card.sel{outline:2px solid #d2d2cd}.note{width:270px;padding:14px}.head{font-size:15px;font-weight:650;margin-bottom:8px}.body{min-height:35px;outline:0;color:#555;line-height:1.5}.body:empty:before{content:'Write something...';color:#aaa}.column{width:290px;padding:13px;background:#f0f0ec}.column>.head{font-size:12px}.column .note{position:relative;left:auto!important;top:auto!important;width:100%;margin:9px 0;box-shadow:none}.todo{width:275px;padding:14px}.todo .head{font-size:14px}.todo label{display:block;margin:9px 0;font-size:12px}.todo input{accent-color:#333}.menu{position:fixed;left:70px;bottom:16px;width:165px;padding:6px;background:white;border:1px solid #ddd;border-radius:8px;box-shadow:0 10px 35px #0002;display:none;z-index:20}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;padding:9px;border-radius:5px;font-size:12px}.menu button:hover{background:#f0f0ec}.zoom{position:fixed;right:18px;bottom:17px;background:white;border:1px solid #ddd;border-radius:7px;box-shadow:0 2px 10px #0001;display:flex}.zoom button{width:32px;height:31px;color:#777}.zoom span{width:44px;display:grid;place-items:center;font-size:10px;color:#888}.modal{position:fixed;inset:0;background:#0003;display:none;place-items:center;z-index:50}.modal.open{display:grid}.box{width:360px;background:#fff;border-radius:9px;padding:20px;box-shadow:0 20px 60px #0003}.box h2{margin:0 0 14px;font-size:18px}.box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;outline:0}.modalactions{display:flex;justify-content:flex-end;gap:6px;margin-top:15px}.modalactions button{padding:8px 13px;border-radius:6px;font-size:11px}.create{background:#282828;color:#fff}.toast{position:fixed;right:20px;top:70px;background:#292929;color:#fff;padding:8px 11px;border-radius:6px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:750px){.app{grid-template-columns:54px 1fr}.side{display:none}}</style></head><body><div class="app"><aside class="rail"><div class="logo">A</div><button class="on">▦</button><button id="searchBtn">⌕</button><button>◇</button><div class="bottom"><button>⚙</button><button>?</button></div></aside><aside class="side"><div class="sidehead">My boards <button id="new">＋</button></div><div class="search"><input id="find" placeholder="Search boards..."></div><div class="label">Workspace</div><div id="boards"></div><div class="label">Favorites</div><div id="favorites"></div></aside><main class="workspace"><header class="top"><div class="title" id="title">My Movie</div><div class="actions"><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit">Fit</button><button id="export">Export</button><button class="share">Share</button></div></header><section class="canvas" id="canvas"><div class="world" id="world"><div class="hint">Double-click the canvas to add a note</div><div class="card note" style="left:55px;top:85px"><div class="head">My Movie</div><div class="body" contenteditable="true">Collect ideas, characters, research and story in one visual space.</div></div><div class="card column" style="left:365px;top:85px"><div class="head" contenteditable="true">STORY</div><div class="card note"><div class="head" contenteditable="true">Premise</div><div class="body" contenteditable="true">What is the story really about?</div></div><div class="card note"><div class="head" contenteditable="true">Themes</div><div class="body" contenteditable="true">Questions, themes and ideas.</div></div></div><div class="card todo" style="left:700px;top:85px"><div class="head">To-do</div><label><input type="checkbox"> Build characters</label><label><input type="checkbox"> Develop story</label><label><input type="checkbox"> Gather references</label></div></div></section><div class="zoom"><button id="minus">−</button><span id="pct">100%</span><button id="plus">＋</button></div><div class="menu" id="menu"><button data-add="note">▢ Note</button><button data-add="todo">☑ To-do list</button><button data-add="column">▤ Column</button><button data-add="image">▧ Image</button><button data-add="link">↗ Link</button></div></main></div><div class="modal" id="modal"><div class="box"><h2>New board</h2><input id="boardName" placeholder="Board name"><div class="modalactions"><button id="cancel">Cancel</button><button class="create" id="create">Create</button></div></div></div><div class="toast" id="toast">Saved</div><script>const K='autuer-board-v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let st=JSON.parse(localStorage.getItem(K)||'null')||{boards:['My Movie'],active:'My Movie'},scale=1,selected=null,history=[],future=[];function save(){localStorage.setItem(K,JSON.stringify(st));msg('Saved')}function msg(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),800)}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function boards(){let q=$('#find').value.toLowerCase();$('#boards').innerHTML=st.boards.filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="board ${x===st.active?'active':''}">▦ ${esc(x)}</div>`).join('');$('#favorites').innerHTML=st.boards.slice(0,2).map(x=>`<div class="board">★ ${esc(x)}</div>`).join('');$$('#boards .board').forEach((e,i)=>e.onclick=()=>{st.active=st.boards.filter(x=>x.toLowerCase().includes(q))[i];$('#title').textContent=st.active;boards();save()})}$('#find').oninput=boards;$('#searchBtn').onclick=()=>$('#find').focus();$('#new').onclick=()=>{$('#modal').classList.add('open');$('#boardName').focus()};$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#create').onclick=()=>{let n=$('#boardName').value.trim();if(!n)return;st.boards.push(n);st.active=n;$('#title').textContent=n;$('#boardName').value='';$('#modal').classList.remove('open');boards();save()};function snap(){history.push($('#world').innerHTML);future=[]}function drag(e){let down=0,dx=0,dy=0;e.addEventListener('pointerdown',x=>{if(x.target.closest('[contenteditable],input'))return;down=1;selected=e;$$('.card').forEach(c=>c.classList.remove('sel'));e.classList.add('sel');dx=x.clientX-e.offsetLeft*scale;dy=x.clientY-e.offsetTop*scale;e.setPointerCapture(x.pointerId)});e.addEventListener('pointermove',x=>{if(!down)return;e.style.left=((x.clientX-dx)/scale)+'px';e.style.top=((x.clientY-dy)/scale)+'px'});e.addEventListener('pointerup',()=>{if(down){down=0;snap();save()}})}function bind(){ $$('.card').forEach(e=>{drag(e);e.oncontextmenu=x=>{x.preventDefault();if(confirm('Delete this card?')){snap();e.remove();save()}}})}function add(type,x=150,y=150){snap();let e=document.createElement('div');e.className='card '+type;e.style.left=x+'px';e.style.top=y+'px';if(type==='note')e.innerHTML='<div class="head" contenteditable="true">New note</div><div class="body" contenteditable="true"></div>';if(type==='todo')e.innerHTML='<div class="head">To-do</div><label><input type="checkbox"> New task</label><label><input type="checkbox"> Another task</label>';if(type==='column')e.innerHTML='<div class="head" contenteditable="true">New column</div><div class="card note"><div class="head" contenteditable="true">New note</div><div class="body" contenteditable="true"></div></div>';if(type==='image')e.innerHTML='<div style="height:150px;background:#eee;display:grid;place-items:center;color:#aaa">Drop image here</div><div class="body" contenteditable="true" style="padding:10px">Caption</div>';if(type==='link')e.innerHTML='<div class="head">Link</div><div class="body" contenteditable="true">Paste URL...</div>';$('#world').append(e);bind();save();msg('Added')}$('[data-add]')&&$$('[data-add]').forEach(b=>b.onclick=()=>{add(b.dataset.add,($('#canvas').scrollLeft+150)/scale,($('#canvas').scrollTop+130)/scale);$('#menu').classList.remove('open')});$('.logo').onclick=()=>$('#menu').classList.toggle('open');$('#world').ondblclick=e=>{if(e.target!==$('#world'))return;add('note',(e.offsetX)/scale,(e.offsetY)/scale)};$('#plus').onclick=()=>zoom(scale+.1);$('#minus').onclick=()=>zoom(scale-.1);$('#fit').onclick=()=>zoom(1);function zoom(v){scale=Math.max(.5,Math.min(1.6,v));$('#world').style.transform=`scale(${scale})`;$('#world').style.transformOrigin='0 0';$('#pct').textContent=Math.round(scale*100)+'%'}$('#undo').onclick=()=>{if(!history.length)return;future.push($('#world').innerHTML);$('#world').innerHTML=history.pop();bind();msg('Undo')};$('#redo').onclick=()=>{if(!future.length)return;history.push($('#world').innerHTML);$('#world').innerHTML=future.pop();bind();msg('Redo')};$('#export').onclick=()=>{let b=new Blob([$('#world').innerText],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=st.active+'.txt';a.click();msg('Exported')};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save()}});$('#title').textContent=st.active;boards();bind();</script></body></html>
