<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auteur</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #dededb;
    --border-light: #ececea;
    --text: #111111;
    --muted: #777773;
    --hover: #f0f0ed;
    --accent: #111111;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
  }

  /* APP */

  .app {
    display: flex;
    width: 100%;
    height: 100vh;
  }

  /* LEFT SIDEBAR */

  .left-sidebar {
    width: 250px;
    flex: 0 0 250px;
    height: 100%;
    background: #f1f1ee;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .brand {
    height: 68px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    font-family: Georgia, serif;
    font-size: 22px;
    letter-spacing: -0.5px;
    border-bottom: 1px solid var(--border);
  }

  .project {
    padding: 18px 20px 12px;
  }

  .project-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .project-title {
    font-size: 14px;
    font-weight: 600;
  }

  .nav {
    padding: 12px;
  }

  .nav-section {
    margin: 10px 8px 7px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
  }

  .nav-item {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #363633;
    text-align: left;
  }

  .nav-item:hover,
  .nav-item.active {
    background: #e4e4e0;
  }

  .nav-icon {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    color: #555550;
  }

  .sidebar-bottom {
    margin-top: auto;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  .saved {
    height: 36px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #777;
    font-size: 12px;
  }

  .saved-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #65a96b;
  }

  /* MAIN */

  .main {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    height: 68px;
    flex: 0 0 68px;
    background: rgba(255,255,255,.92);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 0 24px;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .document-title {
    font-family: Georgia, serif;
    font-size: 17px;
  }

  .document-status {
    font-size: 11px;
    color: var(--muted);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toolbar-button {
    width: 35px;
    height: 35px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #666;
  }

  .toolbar-button:hover {
    background: var(--hover);
    color: #111;
  }

  .right-toggle {
    margin-left: 5px;
    border-left: 1px solid var(--border);
    padding-left: 10px;
  }

  /* EDITOR */

  .editor-area {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 65px 60px 180px;
  }

  .page {
    width: min(850px, 100%);
    min-height: 100%;
    background: white;
    padding: 70px 95px;
    box-shadow: 0 1px 5px rgba(0,0,0,.045);
    border: 1px solid #e7e7e4;
  }

  .screenplay {
    min-height: 900px;
    outline: none;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    line-height: 1.55;
    color: #111;
    white-space: pre-wrap;
  }

  .screenplay:empty::before {
    content: "Start writing...";
    color: #aaa;
  }

  /* RIGHT RAIL */

  .right-rail {
    width: 0;
    flex: 0 0 0;
    height: 100%;
    overflow: hidden;
    background: #f1f1ee;
    border-left: 0 solid var(--border);
    transition:
      width .24s ease,
      flex-basis .24s ease,
      border-width .24s ease;
    display: flex;
    flex-direction: column;
  }

  .right-rail.open {
    width: 330px;
    flex-basis: 330px;
    border-left-width: 1px;
  }

  .rail-inner {
    width: 330px;
    min-width: 330px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .rail-header {
    height: 68px;
    flex: 0 0 68px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    justify-content: space-between;
  }

  .rail-title {
    font-size: 13px;
    font-weight: 600;
  }

  .rail-close {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    color: #777;
  }

  .rail-close:hover {
    background: #e5e5e1;
    color: #111;
  }

  .tabs {
    height: 48px;
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    gap: 4px;
  }

  .tab {
    flex: 1;
    font-size: 11px;
    color: #858580;
    text-transform: uppercase;
    letter-spacing: .8px;
    position: relative;
  }

  .tab.active {
    color: #111;
    font-weight: 600;
  }

  .tab.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    background: #111;
  }

  .rail-content {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
  }

  .workspace {
    display: none;
  }

  .workspace.active {
    display: block;
  }

  /* ELEMENTS */

  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: #858580;
    margin: 8px 4px 10px;
  }

  .create-button {
    width: 100%;
    height: 38px;
    border: 1px solid #d3d3cf;
    background: white;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    margin-bottom: 18px;
  }

  .create-button:hover {
    background: #fafaf8;
    border-color: #bdbdb8;
  }

  .empty-state {
    text-align: center;
    padding: 34px 15px;
    color: #999994;
    font-size: 12px;
    line-height: 1.6;
  }

  /* STORYLINE CARDS */

  .storyline-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .storyline {
    background: white;
    border: 1px solid #dcdcd8;
    border-radius: 8px;
    overflow: hidden;
  }

  .storyline-header {
    min-height: 44px;
    padding: 0 11px 0 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .storyline-header:hover {
    background: #fafaf8;
  }

  .storyline-chevron {
    width: 13px;
    height: 13px;
    color: #888;
    transition: transform .18s ease;
    flex: 0 0 13px;
  }

  .storyline.open .storyline-chevron {
    transform: rotate(90deg);
  }

  .storyline-name {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .storyline-delete {
    width: 26px;
    height: 26px;
    border-radius: 5px;
    color: #aaa;
    opacity: 0;
    display: grid;
    place-items: center;
  }

  .storyline:hover .storyline-delete {
    opacity: 1;
  }

  .storyline-delete:hover {
    background: #f1e5e5;
    color: #a33;
  }

  .storyline-body {
    display: none;
    padding: 0 13px 14px;
  }

  .storyline.open .storyline-body {
    display: block;
  }

  .synopsis-label {
    font-size: 10px;
    color: #888883;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 7px;
  }

  .synopsis {
    width: 100%;
    min-height: 155px;
    resize: vertical;
    border: 0;
    outline: none;
    background: #f7f7f5;
    border-radius: 6px;
    padding: 11px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    line-height: 1.55;
    color: #111;
  }

  .synopsis:focus {
    background: #f3f3f0;
  }

  .synopsis::placeholder {
    color: #aaa;
  }

  .storyline-title-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 0;
    color: #111;
  }

  /* OTHER ELEMENTS */

  .element-group {
    margin-top: 24px;
  }

  .element-row {
    background: white;
    border: 1px solid #dededb;
    border-radius: 7px;
    min-height: 42px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
  }

  .element-row-icon {
    color: #777;
  }

  .element-row-name {
    flex: 1;
    font-size: 12px;
  }

  .mini-add {
    width: 25px;
    height: 25px;
    border-radius: 5px;
    color: #888;
  }

  .mini-add:hover {
    background: #ededeb;
    color: #111;
  }

  /* STASH */

  .stash-card {
    background: white;
    border: 1px solid #dededb;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 8px;
  }

  .stash-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  .stash-description {
    font-size: 11px;
    line-height: 1.5;
    color: #777;
  }

  .stash-input {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: 1px solid #dededb;
    border-radius: 7px;
    background: white;
    padding: 12px;
    outline: none;
    font-size: 12px;
    line-height: 1.5;
  }

  /* ICONS */

  svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* RESPONSIVE */

  @media (max-width: 900px) {
    .left-sidebar {
      width: 210px;
      flex-basis: 210px;
    }

    .page {
      padding: 50px 55px;
    }

    .editor-area {
      padding-left: 25px;
      padding-right: 25px;
    }

    .right-rail.open {
      width: 300px;
      flex-basis: 300px;
    }

    .rail-inner {
      width: 300px;
      min-width: 300px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <!-- LEFT SIDEBAR -->
  <aside class="left-sidebar">

    <div class="brand">Auteur</div>

    <div class="project">
      <div class="project-label">Project</div>
      <div class="project-title">Untitled Screenplay</div>
    </div>

    <nav class="nav">

      <div class="nav-section">Write</div>

      <button class="nav-item active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h16v16H4z"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
          </svg>
        </span>
        Draft
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h14v14H5z"/>
            <path d="M8 9h8M8 13h6M8 17h4"/>
          </svg>
        </span>
        Outline
      </button>

      <div class="nav-section">Project</div>

      <button class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3"/>
            <path d="M3 19c.7-3.2 2.7-5 6-5s5.3 1.8 6 5"/>
            <circle cx="17" cy="9" r="2"/>
            <path d="M15 15c2.3.2 3.8 1.5 4.5 4"/>
          </svg>
        </span>
        Characters
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 20V8l8-4 8 4v12"/>
            <path d="M8 20v-7h8v7"/>
          </svg>
        </span>
        Locations
      </button>

    </nav>

    <div class="sidebar-bottom">

      <div class="saved">
        <span class="saved-dot"></span>
        <span id="saveStatus">Saved</span>
      </div>

    </div>

  </aside>

  <!-- MAIN EDITOR -->
  <main class="main">

    <header class="topbar">

      <div class="topbar-left">
        <div class="document-title">Untitled Screenplay</div>
        <div class="document-status">Draft</div>
      </div>

      <div class="topbar-right">

        <button class="toolbar-button" title="Undo">
          <svg viewBox="0 0 24 24">
            <path d="M9 7 4 12l5 5"/>
            <path d="M4 12h9a7 7 0 0 1 7 7"/>
          </svg>
        </button>

        <button class="toolbar-button" title="Redo">
          <svg viewBox="0 0 24 24">
            <path d="m15 7 5 5-5 5"/>
            <path d="M20 12h-9a7 7 0 0 0-7 7"/>
          </svg>
        </button>

        <button
          class="toolbar-button right-toggle"
          id="railToggle"
          title="Project Tools"
          aria-label="Toggle project tools"
        >
          <svg viewBox="0 0 24 24">
            <path d="M9 4h11v16H9"/>
            <path d="m15 8 4 4-4 4"/>
            <path d="M19 12H4"/>
          </svg>
        </button>

      </div>

    </header>

    <div class="editor-area">

      <div class="page">

        <div
          class="screenplay"
          id="screenplay"
          contenteditable="true"
          spellcheck="true"
        ></div>

      </div>

    </div>

  </main>

  <!-- RIGHT RAIL -->
  <aside class="right-rail" id="rightRail">

    <div class="rail-inner">

      <header class="rail-header">

        <div class="rail-title">Project</div>

        <button class="rail-close" id="railClose" title="Close">
          <svg viewBox="0 0 24 24">
            <path d="m7 7 10 10M17 7 7 17"/>
          </svg>
        </button>

      </header>

      <div class="tabs">

        <button class="tab active" data-tab="elements">
          Elements
        </button>

        <button class="tab" data-tab="stash">
          Stash
        </button>

      </div>

      <div class="rail-content">

        <!-- ELEMENTS WORKSPACE -->
        <section class="workspace active" id="elementsWorkspace">

          <div class="section-label">Storylines</div>

          <button class="create-button" id="createStoryline">
            <svg viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Create Storyline
          </button>

          <div class="storyline-list" id="storylineList"></div>

          <div class="element-group">

            <div class="section-label">Characters</div>

            <div id="charactersList">
              <div class="empty-state">
                No characters yet.
              </div>
            </div>

            <button class="create-button" id="createCharacter">
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Create Character
            </button>

          </div>

          <div class="element-group">

            <div class="section-label">Locations</div>

            <div id="locationsList">
              <div class="empty-state">
                No locations yet.
              </div>
            </div>

            <button class="create-button" id="createLocation">
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Create Location
            </button>

          </div>

        </section>

        <!-- STASH WORKSPACE -->
        <section class="workspace" id="stashWorkspace">

          <div class="section-label">Stash</div>

          <div class="stash-card">

            <div class="stash-title">
              Scratchpad
            </div>

            <div class="stash-description">
              Keep ideas, fragments, dialogue, or anything else here while you write.
            </div>

          </div>

          <textarea
            class="stash-input"
            id="stashInput"
            placeholder="Write something to stash..."
          ></textarea>

        </section>

      </div>

    </div>

  </aside>

</div>

<script>
  const STORAGE_KEY = "auteur-project-v2";

  const defaultState = {
    screenplay: "",
    storylines: [],
    characters: [],
    locations: [],
    stash: ""
  };

  let state = loadState();

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return structuredClone(defaultState);
      }

      return {
        ...structuredClone(defaultState),
        ...JSON.parse(saved)
      };
    } catch {
      return structuredClone(defaultState);
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    const status = document.getElementById("saveStatus");

    status.textContent = "Saved";

    clearTimeout(window.saveStatusTimer);

    window.saveStatusTimer = setTimeout(() => {
      status.textContent = "Saved";
    }, 500);
  }

  /* --------------------------------------------------
     RAIL
  -------------------------------------------------- */

  const rail = document.getElementById("rightRail");
  const railToggle = document.getElementById("railToggle");
  const railClose = document.getElementById("railClose");

  railToggle.addEventListener("click", () => {
    rail.classList.toggle("open");
  });

  railClose.addEventListener("click", () => {
    rail.classList.remove("open");
  });

  /* --------------------------------------------------
     TABS
  -------------------------------------------------- */

  const tabs = document.querySelectorAll(".tab");
  const workspaces = document.querySelectorAll(".workspace");

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {

      const target = tab.dataset.tab;

      tabs.forEach(t => {
        t.classList.toggle("active", t === tab);
      });

      workspaces.forEach(workspace => {
        workspace.classList.toggle(
          "active",
          workspace.id === `${target}Workspace`
        );
      });

    });
  });

  /* --------------------------------------------------
     SCREENPLAY
  -------------------------------------------------- */

  const screenplay = document.getElementById("screenplay");

  screenplay.innerText = state.screenplay || "";

  screenplay.addEventListener("input", () => {
    state.screenplay = screenplay.innerText;
    saveState();
  });

  /* --------------------------------------------------
     STORYLINES
  -------------------------------------------------- */

  const storylineList = document.getElementById("storylineList");
  const createStorylineButton = document.getElementById("createStoryline");

  function createStoryline() {

    const storyline = {
      id: crypto.randomUUID(),
      title: "Untitled Storyline",
      synopsis: "",
      open: true
    };

    state.storylines.unshift(storyline);

    saveState();
    renderStorylines();

    requestAnimationFrame(() => {

      const card = document.querySelector(
        `[data-storyline-id="${storyline.id}"]`
      );

      if (!card) return;

      const titleInput = card.querySelector(".storyline-title-input");

      titleInput.focus();

      titleInput.select();

    });

  }

  createStorylineButton.addEventListener(
    "click",
    createStoryline
  );

  function renderStorylines() {

    storylineList.innerHTML = "";

    if (!state.storylines.length) {

      storylineList.innerHTML = `
        <div class="empty-state">
          Create a storyline and start shaping the structure of your screenplay.
        </div>
      `;

      return;
    }

    state.storylines.forEach(storyline => {

      const card = document.createElement("article");

      card.className =
        `storyline ${storyline.open ? "open" : ""}`;

      card.dataset.storylineId = storyline.id;

      card.innerHTML = `

        <div class="storyline-header">

          <svg
            class="storyline-chevron"
            viewBox="0 0 24 24"
          >
            <path d="m9 6 6 6-6 6"/>
          </svg>

          <input
            class="storyline-title-input"
            value=""
            aria-label="Storyline title"
          >

          <button
            class="storyline-delete"
            title="Delete storyline"
            aria-label="Delete storyline"
          >
            <svg viewBox="0 0 24 24">
              <path d="m7 7 10 10M17 7 7 17"/>
            </svg>
          </button>

        </div>

        <div class="storyline-body">

          <div class="synopsis-label">
            Synopsis
          </div>

          <textarea
            class="synopsis"
            placeholder="Start writing the synopsis..."
          ></textarea>

        </div>
      `;

      const titleInput =
        card.querySelector(".storyline-title-input");

      const synopsis =
        card.querySelector(".synopsis");

      const header =
        card.querySelector(".storyline-header");

      const deleteButton =
        card.querySelector(".storyline-delete");

      titleInput.value = storyline.title;

      synopsis.value = storyline.synopsis;

      /*
       * Clicking anywhere on the header toggles
       * the storyline open/closed.
       *
       * Inputs and delete buttons stop propagation
       * so typing does not accidentally collapse it.
       */

      header.addEventListener("click", event => {

        if (
          event.target === titleInput ||
          event.target.closest(".storyline-delete")
        ) {
          return;
        }

        storyline.open = !storyline.open;

        saveState();

        renderStorylines();

      });

      titleInput.addEventListener("click", event => {
        event.stopPropagation();
      });

      titleInput.addEventListener("input", event => {

        storyline.title =
          event.target.value || "Untitled Storyline";

        saveState();

      });

      titleInput.addEventListener("blur", () => {

        if (!titleInput.value.trim()) {

          storyline.title = "Untitled Storyline";

          saveState();

          renderStorylines();

        }

      });

      synopsis.addEventListener("click", event => {
        event.stopPropagation();
      });

      synopsis.addEventListener("input", event => {

        storyline.synopsis =
          event.target.value;

        saveState();

      });

      deleteButton.addEventListener("click", event => {

        event.stopPropagation();

        state.storylines =
          state.storylines.filter(
            item => item.id !== storyline.id
          );

        saveState();
        renderStorylines();

      });

      storylineList.appendChild(card);

    });

  }

  /* --------------------------------------------------
     CHARACTERS
  -------------------------------------------------- */

  const charactersList =
    document.getElementById("charactersList");

  document
    .getElementById("createCharacter")
    .addEventListener("click", () => {

      const character = {
        id: crypto.randomUUID(),
        name: "Untitled Character"
      };

      state.characters.push(character);

      saveState();
      renderCharacters();

    });

  function renderCharacters() {

    charactersList.innerHTML = "";

    if (!state.characters.length) {

      charactersList.innerHTML = `
        <div class="empty-state">
          No characters yet.
        </div>
      `;

      return;
    }

    state.characters.forEach(character => {

      const row = document.createElement("div");

      row.className = "element-row";

      row.innerHTML = `

        <span class="element-row-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3"/>
            <path d="M5 20c.8-4 3-6 7-6s6.2 2 7 6"/>
          </svg>
        </span>

        <span class="element-row-name">
          ${escapeHTML(character.name)}
        </span>

        <button
          class="mini-add"
          title="Delete"
        >
          ×
        </button>
      `;

      row
        .querySelector(".mini-add")
        .addEventListener("click", () => {

          state.characters =
            state.characters.filter(
              item => item.id !== character.id
            );

          saveState();
          renderCharacters();

        });

      charactersList.appendChild(row);

    });

  }

  /* --------------------------------------------------
     LOCATIONS
  -------------------------------------------------- */

  const locationsList =
    document.getElementById("locationsList");

  document
    .getElementById("createLocation")
    .addEventListener("click", () => {

      const location = {
        id: crypto.randomUUID(),
        name: "Untitled Location"
      };

      state.locations.push(location);

      saveState();
      renderLocations();

    });

  function renderLocations() {

    locationsList.innerHTML = "";

    if (!state.locations.length) {

      locationsList.innerHTML = `
        <div class="empty-state">
          No locations yet.
        </div>
      `;

      return;
    }

    state.locations.forEach(location => {

      const row = document.createElement("div");

      row.className = "element-row";

      row.innerHTML = `

        <span class="element-row-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 20V8l8-4 8 4v12"/>
            <path d="M8 20v-7h8v7"/>
          </svg>
        </span>

        <span class="element-row-name">
          ${escapeHTML(location.name)}
        </span>

        <button
          class="mini-add"
          title="Delete"
        >
          ×
        </button>
      `;

      row
        .querySelector(".mini-add")
        .addEventListener("click", () => {

          state.locations =
            state.locations.filter(
              item => item.id !== location.id
            );

          saveState();
          renderLocations();

        });

      locationsList.appendChild(row);

    });

  }

  /* --------------------------------------------------
     STASH
  -------------------------------------------------- */

  const stashInput =
    document.getElementById("stashInput");

  stashInput.value = state.stash || "";

  stashInput.addEventListener("input", () => {

    state.stash = stashInput.value;

    saveState();

  });

  /* --------------------------------------------------
     UTILITIES
  -------------------------------------------------- */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

  /* --------------------------------------------------
     INITIAL RENDER
  -------------------------------------------------- */

  renderStorylines();
  renderCharacters();
  renderLocations();

</script>

</body>
</html>
