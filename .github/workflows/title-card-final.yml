name: Finalize compact title card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make title card genuinely compact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'height:132px;flex:0 0 132px;margin:0 auto;padding:38px 20px 0;border:1px solid var(--line);border-top:0;border-radius:0;background:#fff;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.025)'
          new = 'height:82px;flex:0 0 82px;margin:0 auto;padding:25px 20px 0;border:1px solid var(--line);border-top:0;border-radius:0;background:#fff;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.02)'
          if old not in s:
              raise SystemExit('Compact title-card CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary patch workflow and commit
        run: |
          rm .github/workflows/title-card-final.yml
          rm -f .github/workflows/patch-title.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/title-card-final.yml .github/workflows/patch-title.yml
          git commit -m 'Make title card compact and Arc-inspired'
          git push
